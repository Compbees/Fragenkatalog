n finnenhaltigem Wildbret?", "opts": [{"k": "a", "text": "Trichinose", "ok": false}, {"k": "b", "text": "Bandwurmbefall", "ok": true}, {"k": "c", "text": "Hirnhautentzündung", "ok": false}], "label": "216"}, {"num": 217, "type": "mc", "q": "Bei welcher Schalenwildart tritt Moderhinke verstärkt auf?", "opts": [{"k": "a", "text": "Muffelwild", "ok": true}, {"k": "b", "text": "Rehwild", "ok": false}, {"k": "c", "text": "Damwild", "ok": false}], "label": "217"}, {"num": 218, "type": "mc", "q": "Vom „Zerwirken“ spricht man, wenn", "opts": [{"k": "a", "text": "Dem Stück das Haupt entfernt wird", "ok": false}, {"k": "b", "text": "Das Stück in Einzelteile zerlegt wird", "ok": true}, {"k": "c", "text": "Dem Stück die Trophäe entfernt wird", "ok": false}], "label": "218"}, {"num": 219, "type": "mc", "q": "Der Jäger hat ein Reh erlegt. Beim Aufbrechen des Schlosses muss er darauf achten, dass", "opts": [{"k": "a", "text": "Die Lunge nicht verletzt wird", "ok": false}, {"k": "b", "text": "Die Harnblase und der Weiddarm nicht zerstochen werden", "ok": true}, {"k": "c", "text": "Die Leber nicht beschädigt wird", "ok": false}], "label": "219"}, {"num": 220, "type": "mc", "q": "Welche der folgenden Aussagen ist richtig?", "opts": [{"k": "a", "text": "Endoparasiten kommen im Inneren des Körpers vor", "ok": true}, {"k": "b", "text": "Endoparasiten befallen nur Nase, Augen, Ohren und Maul", "ok": false}, {"k": "c", "text": "Zu den Endoparasiten zählen Zecken, Haarlinge und Hirschlausfliegen", "ok": false}], "label": "220"}, {"num": 221, "type": "mc", "q": "Bei welchen dieser Erkrankungen besteht Seuchenverdacht und damit Anzeigepflicht?", "opts": [{"k": "a", "text": "Lungenwurmbefall", "ok": false}, {"k": "b", "text": "Europäischer und Afrikanischer Schweinepest", "ok": true}, {"k": "c", "text": "Rachenbremsenbefall", "ok": false}], "label": "221"}, {"num": 222, "type": "mc", "q": "Wie erfolgt die Übertragung der Europäischen bzw. Afrikanischen Schweinepest?", "opts": [{"k": "a", "text": "Indirekt über den Zwischenwirt Maus", "ok": false}, {"k": "b", "text": "Über direkten Kontakt oder die Nahrung", "ok": true}, {"k": "c", "text": "Nur durch die Übertragung von Kühen auf Schwarzwild", "ok": false}], "label": "222"}, {"num": 223, "type": "mc", "q": "Wer erlässt beim Auftreten einer Wildseuche die notwendigen Anweisungen?", "opts": [{"k": "a", "text": "Der Amtstierarzt", "ok": true}, {"k": "b", "text": "Das Ordnungsamt", "ok": false}, {"k": "c", "text": "Die Untere Jagdbehörde", "ok": false}], "label": "223"}, {"num": 224, "type": "mc", "q": "Darf Wild in der Decke/Schwarte eingefroren werden, wenn es verzehrt werden soll?", "opts": [{"k": "a", "text": "Nein", "ok": true}, {"k": "b", "text": "Ja", "ok": false}, {"k": "c", "text": "Nur nach Absprache mit dem Erleger", "ok": false}], "label": "224"}, {"num": 225, "type": "mc", "q": "Welche Umstände begünstigen die Ausbreitung von Wildseuchen?", "opts": [{"k": "a", "text": "Zu trockenes Wetter", "ok": false}, {"k": "b", "text": "Zu hohe Wilddichte", "ok": true}, {"k": "c", "text": "Zu wenig Kirrungen im Revier", "ok": false}], "label": "225"}, {"num": 226, "type": "mc", "q": "Bei einem Trichinenbefall ist der Wildkörper wie folgt zu beurteilen:", "opts": [{"k": "a", "text": "Nach Abhängen tauglich", "ok": false}, {"k": "b", "text": "Nur der Rücken ist verwertbar", "ok": false}, {"k": "c", "text": "Grundsätzlich untauglich", "ok": true}], "label": "226"}, {"num": 227, "type": "mc", "q": "Welches Wildtier ist in Deutschland der hauptsächliche Verbreiter der Tollwut?", "opts": [{"k": "a", "text": "Fuchs", "ok": true}, {"k": "b", "text": "Rothirsch", "ok": false}, {"k": "c", "text": "Schnecke", "ok": false}], "label": "227"}, {"num": 228, "type": "mc", "q": "Was ist zu tun, wenn man ein tollwutverdächtiges Tier erlegt hat?", "opts": [{"k": "a", "text": "Sofort den Amtstierarzt verständigen", "ok": true}, {"k": "b", "text": "Erst mal die Trophäe sichern", "ok": false}, {"k": "c", "text": "Nichts", "ok": false}], "label": "228"}, {"num": 229, "type": "mc", "q": "Welche Anzeichen am lebenden Tier lassen auf Tollwut schließen?", "opts": [{"k": "a", "text": "Starker Parasitenbefall", "ok": false}, {"k": "b", "text": "Ständiges nässen", "ok": false}, {"k": "c", "text": "Speichelfluss und aggressives Verhalten", "ok": true}], "label": "229"}, {"num": 230, "type": "mc", "q": "Wie werden die Erreger der Tollwut ausgeschieden?", "opts": [{"k": "a", "text": "Mit der Losung", "ok": false}, {"k": "b", "text": "Mit dem Speichel", "ok": true}, {"k": "c", "text": "Durch die Haut", "ok": false}], "label": "230"}, {"num": 231, "type": "mc", "q": "Welche Anzeichen am lebenden Stück deuten auf Europäische bzw. Afrikanische Schweinepest?", "opts": [{"k": "a", "text": "Verlust der Scheu", "ok": true}, {"k": "b", "text": "Haarausfall", "ok": false}, {"k": "c", "text": "Hautekzeme", "ok": false}], "label": "231"}, {"num": 232, "type": "mc", "q": "Wie erfolgt die Infektion mit Myxomatose?", "opts": [{"k": "a", "text": "Über Ameisen", "ok": false}, {"k": "b", "text": "Mit der Äsung", "ok": false}, {"k": "c", "text": "Durch stechende Insekten, wie z.B. Flöhe oder Mücken", "ok": true}], "label": "232"}, {"num": 233, "type": "mc", "q": "Welche Aussage über die Strahlenpilzerkrankung ist richtig?", "opts": [{"k": "a", "text": "Der Erreger ist ein Bakterium", "ok": true}, {"k": "b", "text": "Die Krankheit kommt ausschließlich bei Tauben vor", "ok": false}, {"k": "c", "text": "Die Krankheit kommt ausschließlich bei Enten vor", "ok": false}], "label": "233"}, {"num": 234, "type": "mc", "q": "Welche dieser Wildkrankheiten wird durch Parasiten verursacht?", "opts": [{"k": "a", "text": "Maul- und Klauenseuche", "ok": false}, {"k": "b", "text": "Kokzidiose", "ok": true}, {"k": "c", "text": "Tollwut", "ok": false}], "label": "234"}, {"num": 235, "type": "mc", "q": "Welche dieser Krankheiten zählt zu den Zoonosen?", "opts": [{"k": "a", "text": "Trichinose", "ok": true}, {"k": "b", "text": "Schweinepest", "ok": false}, {"k": "c", "text": "Aujeszkysche Krankheit", "ok": false}], "label": "235"}, {"num": 236, "type": "mc", "q": "Welche Maßnahme sollte unmittelbar nach der Erlegung eines Hasen durchgeführt werden?", "opts": [{"k": "a", "text": "Abschneiden des Kopfes", "ok": false}, {"k": "b", "text": "Aushakeln", "ok": false}, {"k": "c", "text": "Ausdrücken der Harnblase", "ok": true}], "label": "236"}, {"num": 237, "type": "mc", "q": "Welche dieser Wildkrankheiten ist anzeigepflichtig?", "opts": [{"k": "a", "text": "Tollwut", "ok": true}, {"k": "b", "text": "Myxomatose", "ok": false}, {"k": "c", "text": "Strahlenpilzerkrankung", "ok": false}], "label": "237"}, {"num": 238, "type": "mc", "q": "Was sind Trichinen?", "opts": [{"k": "a", "text": "Bakterien", "ok": false}, {"k": "b", "text": "Viren", "ok": false}, {"k": "c", "text": "Parasiten", "ok": true}], "label": "238"}, {"num": 239, "type": "mc", "q": "Welche dieser Wildarten kann Trichinenträger sein?", "opts": [{"k": "a", "text": "Schwarzwild", "ok": true}, {"k": "b", "text": "Rehwild", "ok": false}, {"k": "c", "text": "Tauben", "ok": false}], "label": "239"}, {"num": 240, "type": "mc", "q": "Welche Tiergruppen sind Verursacher des Dassellarvenbefalls?", "opts": [{"k": "a", "text": "Bandwürmer", "ok": false}, {"k": "b", "text": "Lungenwürmer", "ok": false}, {"k": "c", "text": "Fliegen", "ok": true}], "label": "240"}, {"num": 241, "type": "mc", "q": "Wo parasitieren Bandwürmer?", "opts": [{"k": "a", "text": "In der Lunge", "ok": false}, {"k": "b", "text": "In der Leber", "ok": false}, {"k": "c", "text": "Im Darm", "ok": true}], "label": "241"}, {"num": 242, "type": "mc", "q": "Eine typische Krankheit des Fuchses ist die:", "opts": [{"k": "a", "text": "Aktinomykose", "ok": false}, {"k": "b", "text": "Brucellose", "ok": false}, {"k": "c", "text": "Räude", "ok": true}], "label": "242"}, {"num": 243, "type": "mc", "q": "Bei welcher Wildkrankheit kann man sich beim Umgang mit dem erlegten Wild nicht mit dem Erreger infizieren?", "opts": [{"k": "a", "text": "Schweinepest", "ok": true}, {"k": "b", "text": "Brucellose", "ok": false}, {"k": "c", "text": "Tollwut", "ok": false}], "label": "243"}, {"num": 244, "type": "mc", "q": "Für welche Erkrankung des Schwarzwildes sind im Revier belassene Fuchskerne verantwortlich?", "opts": [{"k": "a", "text": "Moderhinke", "ok": false}, {"k": "b", "text": "Tollwut", "ok": false}, {"k": "c", "text": "Trichinose", "ok": true}], "label": "244"}, {"num": 245, "type": "mc", "q": "Wer ist der obligatorische Zwischenwirt des Fuchsbandwurmes?", "opts": [{"k": "a", "text": "Der Fasan", "ok": false}, {"k": "b", "text": "Die Maus", "ok": true}, {"k": "c", "text": "Das Reh", "ok": false}], "label": "245"}, {"num": 246, "type": "mc", "q": "Bei welcher Wildart ist das Verknoten des Schlundes nicht erforderlich?", "opts": [{"k": "a", "text": "Schwarzwild", "ok": true}, {"k": "b", "text": "Rotwild", "ok": false}, {"k": "c", "text": "Rehwild", "ok": false}], "label": "246"}, {"num": 247, "type": "mc", "q": "Welche Erkrankung kann durch den Verzehr von finnenhaltigem Wildbret entstehen?", "opts": [{"k": "a", "text": "Trichinose", "ok": false}, {"k": "b", "text": "Lungenwurmbefall", "ok": false}, {"k": "c", "text": "Bandwurmbefall", "ok": true}], "label": "247"}, {"num": 248, "type": "mc", "q": "Welche Körperteile bzw. Organe werden beim Schwarzwild zur Feststellung eines möglichen Trichinenbefalls untersucht?", "opts": [{"k": "a", "text": "Bauchspeicheldrüse und Milz", "ok": false}, {"k": "b", "text": "Zwerchfellpfeiler und Unterarmmuskulatur", "ok": true}, {"k": "c", "text": "Leber und Lunge", "ok": false}], "label": "248"}, {"num": 249, "type": "mc", "q": "In welchem Parasitenkreislauf fungieren Schnecken als Zwischenwirt?", "opts": [{"k": "a", "text": "Hundebandwurm", "ok": false}, {"k": "b", "text": "Leberegel", "ok": true}, {"k": "c", "text": "Schweinepest", "ok": false}], "label": "249"}, {"num": 250, "type": "mc", "q": "Bei welcher Schalenwildart treten häufig Schalenauswachsungen auf?", "opts": [{"k": "a", "text": "Schwarzwild", "ok": false}, {"k": "b", "text": "Rotwild", "ok": false}, {"k": "c", "text": "Muffelwild", "ok": true}], "label": "250"}, {"num": 251, "type": "mc", "q": "Was versteht der Gesetzgeber unter einer „kleinen Menge“?", "opts": [{"k": "a", "text": "Wenig Rotwild im Revier", "ok": false}, {"k": "b", "text": "Wenig Hasen im Revier", "ok": false}, {"k": "c", "text": "Die Strecke erlegten Wildes eines Jagdtages", "ok": true}], "label": "251"}, {"num": 252, "type": "mc", "q": "Wie transportieren Sie erlegtes Schalenwild zur Kühlzelle?", "opts": [{"k": "a", "text": "Übereinandergestapelt, damit das Wild nicht zusammenfriert", "ok": false}, {"k": "b", "text": "In sauberer, offener Wildwanne, nebeneinander gelegt", "ok": true}, {"k": "c", "text": "Auf dem Bauch liegend", "ok": false}], "label": "252"}, {"num": 253, "type": "mc", "q": "Wann sollte erlegtes Federwild gerupft werden?", "opts": [{"k": "a", "text": "Nach 2 Tagen", "ok": false}, {"k": "b", "text": "Nach 5 Tagen", "ok": false}, {"k": "c", "text": "Je eher, desto besser", "ok": true}], "label": "253"}, {"num": 254, "type": "mc", "q": "Dürfen Sie erlegtes, aber noch nicht versorgtes Wild an einen Nichtjäger abgeben?", "opts": [{"k": "a", "text": "Ja", "ok": false}, {"k": "b", "text": "Nein", "ok": true}, {"k": "c", "text": "Nur Hühnervögel", "ok": false}], "label": "254"}, {"num": 255, "type": "mc", "q": "Was gilt als „Erstversorgung“ bei erlegten Wildtauben?", "opts": [{"k": "a", "text": "Das Rupfen", "ok": false}, {"k": "b", "text": "Das Aushakeln", "ok": false}, {"k": "c", "text": "Das Entfernen des Kropfes", "ok": true}], "label": "255"}, {"num": 256, "type": "mc", "q": "Welche Wildkrankheit kann auch Hunde befallen?", "opts": [{"k": "a", "text": "Schweinepest", "ok": false}, {"k": "b", "text": "Gamsblindheit", "ok": false}, {"k": "c", "text": "Aujeszkysche Krankheit", "ok": true}], "label": "256"}, {"num": 257, "type": "mc", "q": "Das Wildbret welchen Raubwildes wird auch in Deutschland verzehrt?", "opts": [{"k": "a", "text": "Iltis", "ok": false}, {"k": "b", "text": "Dachs", "ok": true}, {"k": "c", "text": "Steinmarder", "ok": false}], "label": "257"}, {"num": 258, "type": "mc", "q": "Zu welchen Krankheitserregern zählen Kokzidien?", "opts": [{"k": "a", "text": "Parasiten", "ok": true}, {"k": "b", "text": "Bakterien", "ok": false}, {"k": "c", "text": "Viren", "ok": false}], "label": "258"}, {"num": 259, "type": "mc", "q": "Zu den Innenparasiten zählen…", "opts": [{"k": "a", "text": "Flöhe", "ok": false}, {"k": "b", "text": "Trichinen", "ok": true}, {"k": "c", "text": "Zecken", "ok": false}], "label": "259"}, {"num": 260, "type": "mc", "q": "Welche Parasiten gehören zu den Insekten?", "opts": [{"k": "a", "text": "Trichinen", "ok": false}, {"k": "b", "text": "Haarlinge", "ok": true}, {"k": "c", "text": "Kokzidien", "ok": false}], "label": "260"}, {"num": 261, "type": "mc", "q": "Bei welcher Wildkrankheit ist der Erreger ein Virus?", "opts": [{"k": "a", "text": "Botulismus", "ok": false}, {"k": "b", "text": "Trichinose", "ok": false}, {"k": "c", "text": "Schweinepest", "ok": true}], "label": "261"}, {"num": 262, "type": "mc", "q": "Ist das Wildbret eines von Lungenwürmern befallenen Rehes genusstauglich?", "opts": [{"k": "a", "text": "Nein", "ok": false}, {"k": "b", "text": "Ja", "ok": true}, {"k": "c", "text": "Nur nach amtlicher Fleischuntersuchung", "ok": false}], "label": "262"}, {"num": 263, "type": "mc", "q": "Mit welchem Organ ist der Schlund verwachsen?", "opts": [{"k": "a", "text": "Mit der Leber", "ok": false}, {"k": "b", "text": "Mit der Lunge", "ok": false}, {"k": "c", "text": "Mit der Drossel", "ok": true}], "label": "263"}, {"num": 264, "type": "mc", "q": "Welche Wildart wird nicht von Leberegeln befallen?", "opts": [{"k": "a", "text": "Fasan", "ok": true}, {"k": "b", "text": "Damwild", "ok": false}, {"k": "c", "text": "Rehwild", "ok": false}], "label": "264"}, {"num": 265, "type": "mc", "q": "Welche Tiere sind keine Zwischenwirte für den Kleinen Fuchsbandwurm?", "opts": [{"k": "a", "text": "Hunde", "ok": false}, {"k": "b", "text": "Katzen", "ok": false}, {"k": "c", "text": "Fasan", "ok": true}], "label": "265"}, {"num": 266, "type": "mc", "q": "Welche Parasiten gehören zur Klasse der Spinnentiere?", "opts": [{"k": "a", "text": "Borrelien", "ok": false}, {"k": "b", "text": "Zecken", "ok": true}, {"k": "c", "text": "Lungenwürmer", "ok": false}], "label": "266"}, {"num": 267, "type": "mc", "q": "Welche Parasiten schmarotzen nicht in den Atemwegen ihrer Wirtstiere?", "opts": [{"k": "a", "text": "Grabmilben", "ok": true}, {"k": "b", "text": "Große Lungenwürmer", "ok": false}, {"k": "c", "text": "Rachenbremsenlarven", "ok": false}], "label": "267"}, {"num": 268, "type": "mc", "q": "Welches Tier kann man als Überträger der Tollwut ausschließen?", "opts": [{"k": "a", "text": "Fuchs", "ok": false}, {"k": "b", "text": "Fledermaus", "ok": false}, {"k": "c", "text": "Stockente", "ok": true}], "label": "268"}, {"num": 269, "type": "mc", "q": "Welche Parasiten haben Regenwürmer als Zwischenwirt?", "opts": [{"k": "a", "text": "Kleiner Fuchsbandwurm", "ok": false}, {"k": "b", "text": "Kleiner Lungenwurm des Schwarzwildes", "ok": true}, {"k": "c", "text": "Großer Leberegel", "ok": false}], "label": "269"}, {"num": 270, "type": "mc", "q": "Wie wird die Aujeszkysche Krankheit noch bezeichnet?", "opts": [{"k": "a", "text": "Raserei", "ok": false}, {"k": "b", "text": "Nagerpest", "ok": false}, {"k": "c", "text": "Pseudowut", "ok": true}], "label": "270"}, {"num": 271, "type": "mc", "q": "Welches Organ befindet sich beim Haarwild hinter dem Zwerchfell?", "opts": [{"k": "a", "text": "Herz", "ok": false}, {"k": "b", "text": "Lunge", "ok": false}, {"k": "c", "text": "Leber", "ok": true}], "label": "271"}, {"num": 272, "type": "mc", "q": "Für welche Jäger besteht eine Registrierungspflicht als Lebensmittelunternehmer?", "opts": [{"k": "a", "text": "Bei ausschließlicher Verwendung des Wildbrets für den Eigenbedarf", "ok": false}, {"k": "b", "text": "Abgabe von Wild, das aus der Decke geschlagen bzw. abgeschwartet ist, oder Abgabe von zerwirktem Wild", "ok": true}, {"k": "c", "text": "Ausschließlich Abgabe von Wild in der Decke/Schwarte an den Einzelhandel", "ok": false}], "label": "272"}, {"num": 273, "type": "mc", "q": "Wo wird die Registrierung der Jäger als Lebensmittelunternehmer vorgenommen?", "opts": [{"k": "a", "text": "Bei der Unteren Jagdbehörde", "ok": false}, {"k": "b", "text": "Beim Ordnungsamt", "ok": false}, {"k": "c", "text": "Beim Veterinäramt (Veterinärbehörde)", "ok": true}], "label": "273"}, {"num": 274, "type": "mc", "q": "Welches Organ ist beim Wiederkäuer mit dem Pansen verwachsen?", "opts": [{"k": "a", "text": "Die Milz", "ok": true}, {"k": "b", "text": "Die Lunge", "ok": false}, {"k": "c", "text": "Die Gallenblase", "ok": false}], "label": "274"}, {"num": 275, "type": "mc", "q": "Welche Parasiten wirken sich auf die Genusstauglichkeit des Wildbrets besonders negativ aus?", "opts": [{"k": "a", "text": "Flöhe", "ok": false}, {"k": "b", "text": "Zecken", "ok": false}, {"k": "c", "text": "Grabmilben", "ok": true}], "label": "275"}, {"num": 276, "type": "mc", "q": "Welche Kombination (Krankheit/Wildart) stimmt überein?", "opts": [{"k": "a", "text": "Strahlenpilz/Fasan", "ok": false}, {"k": "b", "text": "Botulismus/Stockente", "ok": true}, {"k": "c", "text": "Schweinepest/Feldhase", "ok": false}], "label": "276"}, {"num": 277, "type": "mc", "q": "Wie lange muss der Jagdausübungsberechtigte den Wildursprungsschein aufbewahren?", "opts": [{"k": "a", "text": "Zwei Jahre", "ok": true}, {"k": "b", "text": "Vier Jahre", "ok": false}, {"k": "c", "text": "Acht Jahre", "ok": false}], "label": "277"}, {"num": 278, "type": "mc", "q": "Bei welcher Schalenwildart ist die Verwertung des Wildbrets in der Paarungszeit nicht eingeschränkt?", "opts": [{"k": "a", "text": "Damwild", "ok": false}, {"k": "b", "text": "Rehwild", "ok": true}, {"k": "c", "text": "Rotwild", "ok": false}], "label": "278"}, {"num": 279, "type": "mc", "q": "Wie hoch ist der Anteil der inneren Organe am Lebendgewicht eines Rehbockes?", "opts": [{"k": "a", "text": "Etwa ein Drittel", "ok": true}, {"k": "b", "text": "Etwa die Hälfte", "ok": false}, {"k": "c", "text": "Etwa 80 Prozent", "ok": false}], "label": "279"}, {"num": 280, "type": "mc", "q": "Was passiert bei der Fleischreifung?", "opts": [{"k": "a", "text": "Es entsteht Buttersäure", "ok": false}, {"k": "b", "text": "Der pH-Wert verschlechtert sich", "ok": false}, {"k": "c", "text": "Glykogen wird zu Milchsäure abgebaut", "ok": true}], "label": "280"}, {"num": 281, "type": "mc", "q": "Was trennt die Brust- von der Bauchhöhle?", "opts": [{"k": "a", "text": "Die Lappen", "ok": false}, {"k": "b", "text": "Das Zwerchfell", "ok": true}, {"k": "c", "text": "Das Netz", "ok": false}], "label": "281"}, {"num": 282, "type": "mc", "q": "Welches Wildbret ist generell nicht genusstauglich?", "opts": [{"k": "a", "text": "Vom Raubwild", "ok": false}, {"k": "b", "text": "Von Rabenvögel", "ok": false}, {"k": "c", "text": "Vom Unfallwild", "ok": true}], "label": "282"}, {"num": 283, "type": "mc", "q": "In welchem Funktionsbereich übernimmt das Zwerchfell eine entscheidende Aufgabe?", "opts": [{"k": "a", "text": "Bei der Verdauung", "ok": false}, {"k": "b", "text": "Bei der Atmung", "ok": true}, {"k": "c", "text": "Im Hormonhaushalt", "ok": false}], "label": "283"}, {"num": 284, "type": "mc", "q": "Wann beginnt die stickige Reifung bei nicht aufgebrochenem Wild?", "opts": [{"k": "a", "text": "Nach ca. 1 Stunde", "ok": true}, {"k": "b", "text": "Nach ca. 5 Stunden", "ok": false}, {"k": "c", "text": "Nach ca. 24 Stunden", "ok": false}], "label": "284"}, {"num": 285, "type": "mc", "q": "Stickige Reifung des Wildbrets bedeutet…", "opts": [{"k": "a", "text": "Die erwünschte Fleischreifung geschieht in einem kürzeren Zeitraum", "ok": false}, {"k": "b", "text": "Die Konsistenz des Wildbrets wird teigig–mürbe, der Geruch stechend und die Farbe in der Tiefe kupferrot", "ok": true}, {"k": "c", "text": "Das Wildbret bekommt den erwünschten zarten und typischen Geschmack", "ok": false}], "label": "285"}, {"num": 286, "type": "mc", "q": "Erlegtes Wild ist das…", "opts": [{"k": "a", "text": "Durch äußere gewaltsame Einwirkung getötete Wild", "ok": false}, {"k": "b", "text": "Nach einer Jagd bei der Nachsuche zufällig gefundene Wild", "ok": false}, {"k": "c", "text": "Nach jagdrechtlichen Vorschriften getötete Wild", "ok": true}], "label": "286"}, {"num": 287, "type": "mc", "q": "Wildbret ist nach dem Fleischhygienerecht verwertbar, wenn…", "opts": [{"k": "a", "text": "Es nach jagdrechtlichen Vorschriften getötet worden ist", "ok": false}, {"k": "b", "text": "Mit gutem Schuss gestreckt, aufgebrochen und zerwirkt worden ist", "ok": false}, {"k": "c", "text": "Keine gesundheitlich bedenklichen Merkmale vorliegen.", "ok": true}], "label": "287"}, {"num": 288, "type": "mc", "q": "Die amtliche Fleischuntersuchung kann unterbleiben, wenn…", "opts": [{"k": "a", "text": "Keine gesundheitlich bedenklichen Merkmale festgestellt wurden", "ok": true}, {"k": "b", "text": "Das Wild an eine Gaststätte abgegeben werden soll", "ok": false}, {"k": "c", "text": "Das Wild alsbald in eine vorschriftsmäßige Kühlzelle gebracht wird", "ok": false}], "label": "288"}, {"num": 289, "type": "mc", "q": "Was ist eine ekelerregende Beeinträchtigung im Hinblick auf die Genusstauglichkeit von Wildbret?", "opts": [{"k": "a", "text": "Am Träger eines erlegten Rehes finden sich zwei vollgesogene Zecken", "ok": false}, {"k": "b", "text": "Ein Jagdhund frisst sich an der Keule des soeben aufgebrochenen Frischlings satt", "ok": true}, {"k": "c", "text": "Beim Aufbrechen findet der Jäger Lungenwürmer in der Lunge", "ok": false}], "label": "289"}, {"num": 290, "type": "mc", "q": "Welche Vorschrift gilt für die Behandlung von seuchenverdächtigem Wild?", "opts": [{"k": "a", "text": "Seuchenverdächtiges Wild soll am Fund- bzw. Erlegungsort verbleiben", "ok": false}, {"k": "b", "text": "Der Transport von seuchenverdächtigem Wild erfolgt zusammen mit anderen erlegten Stücken auf dem Wildwagen", "ok": false}, {"k": "c", "text": "Bei Seuchenverdacht muss das Veterinäramt (Amtstierarzt) informiert werden", "ok": true}], "label": "290"}, {"num": 291, "type": "mc", "q": "Darf die Leber eines erlegten Wildschweins gleich nach der Jagd verschenkt werden?", "opts": [{"k": "a", "text": "Am Ende einer Gesellschaftsjagd kann die Leber einem Treiber als Dank überlassen werden", "ok": false}, {"k": "b", "text": "Die Leber kann einem Jagdhelfer überlassen werden, wenn sie keinen Befall mit Leberegeln aufweist", "ok": false}, {"k": "c", "text": "Die Leber darf erst dann verschenkt werden, wenn bei der amtlichen Trichinenuntersuchung des Wildschweins keine Trichinen gefunden wurden.", "ok": true}], "label": "291"}, {"num": 292, "type": "mc", "q": "Gesundheitsschädliche Lebensmittel in Verkehr zu bringen…", "opts": [{"k": "a", "text": "Wird mit Geldstrafe geahndet", "ok": false}, {"k": "b", "text": "Wird mit Freiheitsstrafe bis zu 3 Jahren oder mit Geldstrafe geahndet", "ok": true}, {"k": "c", "text": "Wird mit Freiheitsstrafe bis zu 10 Jahren geahndet", "ok": false}], "label": "292"}, {"num": 293, "type": "mc", "q": "Was versteht der Gesetzgeber unter der „Strecke eines Jagdtages“ örtlich betrachtet?", "opts": [{"k": "a", "text": "Das erlegte Wild an einem Jagdtag im Landkreis", "ok": false}, {"k": "b", "text": "Das erlegte Wild an einem Jagdtag im Gebiet einer Hegegemeinschaft", "ok": false}, {"k": "c", "text": "Das erlegte Wild an einem Jagdtag im Jagdgebiet eines Jagdausübungsberechtigten", "ok": true}], "label": "293"}, {"num": 294, "type": "mc", "q": "Örtliche Betriebe des Einzelhandels, an die geringe Mengen von erlegtem Wild abgegeben werden dürfen, sind…", "opts": [{"k": "a", "text": "Einzelhandelsbetriebe, die nicht mehr als 100 km vom Wohnort des Jägers oder dem Erlegungsort des Wildes entfernt liegen", "ok": true}, {"k": "b", "text": "Einzelhandelsbetriebe, die nicht mehr als 50 km vom Wohnort des Jägers entfernt liegen", "ok": false}, {"k": "c", "text": "Einzelhandelsbetriebe, die nicht mehr als 20 km vom Erlegungsort des Wildes entfernt liegen", "ok": false}], "label": "294"}, {"num": 295, "type": "mc", "q": "Welche Pflichten hat der Jäger, wenn er das Wild nicht zur amtlichen Fleisch- oder Trichinenuntersuchung angemeldet hat, sondern das Wild an einen Einzelhandelsbetrieb abgibt?", "opts": [{"k": "a", "text": "Der Jäger muss darauf achten, dass er das Wild zeitnah abgibt", "ok": false}, {"k": "b", "text": "Keine", "ok": false}, {"k": "c", "text": "Der Jäger muss vor der Übergabe darauf achten, dass der Wildursprungsschein vollständig ausgefüllt ist, dass keine bedenklichen Merkmale festgestellt wurden und dass die Übernahme der Trichinenuntersuchung durch Unterschrift erklärt wurde", "ok": true}], "label": "295"}, {"num": 296, "type": "mc", "q": "Welche Organe liegen zwischen Hals und Zwerchfell (im Brustbereich)?", "opts": [{"k": "a", "text": "Lunge und Herz", "ok": true}, {"k": "b", "text": "Lunge und Leber", "ok": false}, {"k": "c", "text": "Leber und Nieren", "ok": false}], "label": "296"}, {"num": 297, "type": "mc", "q": "Wann ist eine amtliche Fleischuntersuchung bei einem erlegten Reh nicht notwendig?", "opts": [{"k": "a", "text": "Das Reh verhielt sich vor dem Schuss natürlich und es wurden beim Aufbrechen keine bedenklichen Merkmale festgestellt.", "ok": true}, {"k": "b", "text": "Die Bewegungen des Rehes waren unharmonisch, nach dem Erlegen wurde festgestellt, dass das Reh eine noch nicht verheilte Laufverletzung hat.", "ok": false}, {"k": "c", "text": "Das Verhalten des Rehes vor dem Schuss war normal, beim Aufbrechen wurden aber Verwachsungen und Verklebungen der Lunge festgestellt", "ok": false}], "label": "297"}, {"num": 298, "type": "mc", "q": "Wozu braucht der Jäger einen Behälter mit Trinkwasser für die Wildbrethygiene auf der Jagd?", "opts": [{"k": "a", "text": "Nach dem Aufbrechen wäscht man sich gerne die Hände", "ok": false}, {"k": "b", "text": "Mit Trinkwasser reinigt man Wildbret, dass durch Weidwundschuss verunreinigt ist", "ok": true}, {"k": "c", "text": "Mit dem Wasser sind Schweißflecken am Auto zu entfernen, um dem Verdacht einer kriminellen Handlung vorzubeugen", "ok": false}], "label": "298"}, {"num": 299, "type": "mc", "q": "Was ist notwendig, wenn beim Erlegen und Aufbrechen keine Kundige Person anwesend ist und das Wild über zugelassene Betriebe vermarktet werden soll?", "opts": [{"k": "a", "text": "Neben dem Zwerchfell müssen für jedes Stück alle Organe mitgeliefert werden, auch Haupt und Gescheide", "ok": true}, {"k": "b", "text": "Der Jagdherr gibt eine Ehrenerklärung ab, dass alles Wildbret genusstauglich ist", "ok": false}, {"k": "c", "text": "Der zugelassene Betrieb darf das Wild nur im örtlichen Bereich vermarkten", "ok": false}], "label": "299"}, {"num": 300, "type": "mc", "q": "Wie lautet ein Grundsatz für die Gewinnung von Wildbret?", "opts": [{"k": "a", "text": "Je mehr Wild auf einmal erlegt werden kann, desto besser für den Jäger", "ok": false}, {"k": "b", "text": "Wild weidgerecht erlegen, schnell und sauber aufbrechen", "ok": true}, {"k": "c", "text": "Wild muss mit Kopfschuss oder Weidwundschuss getötet werden", "ok": false}], "label": "300"}, {"num": 301, "type": "mc", "q": "Welcher Grundsatz trifft für die Tierkörperbeseitigung zu?", "opts": [{"k": "a", "text": "Gewässer, Boden und Futtermittel dürfen nicht verunreinigt werden", "ok": true}, {"k": "b", "text": "Der Jäger kann nach Gutdünken verfahren", "ok": false}, {"k": "c", "text": "Zur unschädlichen Beseitigung soll in jedem Revier ein Luderplatz vorhanden sein", "ok": false}], "label": "301"}]}, {"id": "5", "kurz": "Jagd-, Tierschutz- & Naturschutzrecht", "titel": "Tierschutzrecht; Jagd- und Forstrecht; Naturschutz- und Landschaftspflegerecht; ergänzt durch Sicherheits- und andere in Bezug auf die Jagdpraxis einschlägige Vorschriften", "items": [{"num": 1, "type": "open", "q": "Nennen Sie die gesetzlichen Ziele der Hege.", "a": "Die Hege hat zum Ziel die Erhaltung eines den landschaftlichen und landeskulturellen Verhältnissen angepassten, artenreichen und gesunden Wildbestandes sowie die Pflege und Sicherung seiner Lebensgrundlagen.", "label": "1"}, {"num": 2, "type": "open", "q": "Welche allgemein anerkannten Grundsätze sind bei der Ausübung der Jagd zu beachten? Erläutern Sie diese!", "a": "Bei der Ausübung der Jagd sind die allgemein anerkannten Grundsätze deutscher Weidgerechtigkeit, wie jagdethisches und tierschutzgerechtes Verhalten gegenüber dem Wild zu beachten.", "label": "2"}, {"num": 3, "type": "open", "q": "Welche vier Tätigkeiten umfasst die Jagdausübung?", "a": "Die Jagdausübung erstreckt sich auf das Aufsuchen, Nachstellen, Erlegen und Fangen von Wild.", "label": "3"}, {"num": 4, "type": "open", "q": "Was darf sich der Jagdausübungsberechtigte üblicherweise in seinem Jagdbezirk aneignen?", "a": "Wild, Abwurfstangen, Fallwild, Eier vom Federwild", "label": "4"}, {"num": 5, "type": "open", "q": "Wem gehört das lebende Wild und welchen gesetzlichen Status hat freilebendes Wild?", "a": "Niemandem, freilebendes Wild ist herrenlos.", "label": "5"}, {"num": 6, "type": "open", "q": "Welche Tiere bezeichnet man als Wild?", "a": "Wildlebende Tiere, die dem Jagdrecht unterliegen.", "label": "6"}, {"num": 7, "type": "open", "q": "Welche Tierarten gehören zum Schalenwild?", "a": "Wisent, Elch-, Rot-, Dam-, Sika-, Reh-, Gams-, Stein-, Muffel- und Schwarzwild", "label": "7"}, {"num": 8, "type": "open", "q": "Welche Tierarten gehören zum Hochwild?", "a": "Schalenwild außer Rehwild, ferner Auerwild, Steinadler und Seeadler", "label": "8"}, {"num": 9, "type": "open", "q": "Unterliegen Rabenvögel dem Jagdrecht in M-V und wenn ja, welche?", "a": "Ja, Kolkrabe, Rabenkrähe, Nebelkrähe, Elster.", "label": "9"}, {"num": 10, "type": "open", "q": "Wer ist Inhaber des Jagdrechts?", "a": "Das Jagdrecht steht dem Eigentümer auf seinem Grund und Boden zu.", "label": "10"}, {"num": 11, "type": "open", "q": "Innerhalb welcher Bezirke darf das Jagdrecht ausgeübt werden?", "a": "Das Jagdrecht darf nur in Eigenjagdbezirken oder gemeinschaftlichen Jagdbezirken ausgeübt werden.", "label": "11"}, {"num": 12, "type": "open", "q": "Wem steht in einem Jagdbezirk das Jagdausübungsrecht zu?", "a": "Dem Jagdausübungsberechtigten. Das sind z.B. der Jagdpächter oder der Eigenjagdbesitzer, wenn dieser die Jagd in seinem Jagdbezirk selber ausübt.", "label": "12"}, {"num": 13, "type": "open", "q": "Welchem Jagdsystem unterliegt Deutschland und welche Arten von Jagdbezirken kennen Sie?", "a": "Deutschland unterliegt dem Revierjagdsystem. Es gibt Eigenjagdbezirke und gemeinschaftliche Jagdbezirke.", "label": "13"}, {"num": 14, "type": "open", "q": "Welche Grundflächen bilden einen Eigenjagdbezirk?", "a": "Zusammenhängende Grundflächen mit einer land-, forst- oder fischereiwirtschaftlich nutzbaren Fläche von 75 Hektar an, die im Eigentum ein und derselben Person oder Personengemeinschaft stehen.", "label": "14"}, {"num": 15, "type": "open", "q": "Welche Flächen bilden einen gemeinschaftlichen Jagdbezirk?", "a": "Alle Grundflächen einer Gemeinde oder abgesonderten Gemarkung, die nicht zu einem Eigenjagdbezirk gehören, wenn sie im Zusammenhang mindestens 150 Hektar umfassen.", "label": "15"}, {"num": 16, "type": "open", "q": "Welche Flächen trennen oder verbinden Jagdbezirke nicht?", "a": "Natürliche oder künstliche Wasserläufe, Wege, Triften, Eisenbahnkörper und ähnliche Flächen trennen oder verbinden Jagdbezirke nicht, sofern sie nach Umfang und Gestalt für sich allein eine ordnungsgemäße Jagdausübung nicht gestatten.", "label": "16"}, {"num": 17, "type": "open", "q": "Nennen Sie acht Grundstücke, bei denen es sich um gesetzlich befriedete Bezirke handelt.", "a": "Umfriedete Grundstücke um eine Behausung wie z.B. Hofräume oder Hausgärten. (Wald-)Friedhöfe, öffentliche Parkanlagen, Reit- und Turnierplätze, Flug-, Sport-, Spiel- und Golfplätze, Kleingärten, Autobahnen, Kraftfahrstraßen, Eisenbahnanlagen, umzäunte landwirtschaftliche Betriebsstätten + Campingplätze + Energiegewinnungsanlagen, Tiergehege.", "label": "17"}, {"num": 18, "type": "open", "q": "Welcher Personenkreis bildet eine Jagdgenossenschaft?", "a": "Die Eigentümer der bejagbaren Grundflächen, die zu einem gemeinschaftlichen Jagdbezirk gehören, bilden eine Jagdgenossenschaft.", "label": "18"}, {"num": 19, "type": "open", "q": "Mit welcher Mehrheit fasst eine Jagdgenossenschaft ihre Beschlüsse? Erläutern Sie diese Mehrheit.", "a": "Mit der sog. doppelten Mehrheit. Beschlüsse der Jagdgenossenschaft bedürfen sowohl der Mehrheit der anwesenden oder vertretenen Jagdgenossen als auch der Mehrheit der bei der Beschlussfassung vertretenen Grundfläche.", "label": "19"}, {"num": 20, "type": "open", "q": "Benennen Sie die Organe der Jagdgenossenschaft.", "a": "Mitgliederversammlung und der von der Mitgliederversammlung gewählte Jagdvorstand", "label": "20"}, {"num": 21, "type": "open", "q": "Nennen Sie die Möglichkeiten, wie eine Jagdgenossenschaft ihr Jagdausübungsrecht nutzen kann.", "a": "Durch Verpachtung (Regelfall), durch einen angestellten Jäger oder durch das Ruhenlassen der Jagd mit Zustimmung der unteren Jagdbehörde.", "label": "21"}, {"num": 22, "type": "open", "q": "Nennen Sie vier wesentliche Inhalte eines Jagdpachtvertrages.", "a": "Vertragspartner, Vertragsdauer, Pachtzahlungen, Pachtfläche, Revierkarte, Flurstücksliste, Regelungen zum Wildschaden, Regelungen zu jagdlichen Einrichtungen, Jagderlaubnisscheine, Kündigungsgründe", "label": "22"}, {"num": 23, "type": "open", "q": "In welcher Form muss ein Jagdpachtvertrag abgeschlossen werden, welche sind die Vertragspartner?", "a": "Ein Jagdpachtvertrag ist schriftlich zwischen dem Verpächter und dem Jagdpächter abzuschließen.\nVerpächter ist eine Jagdgenossenschaft oder ein Eigenjagdbesitzer.", "label": "23"}, {"num": 24, "type": "open", "q": "Welcher Personenkreis kann eine Hegegemeinschaft bilden und für welche Wildarten werden diese in M-V i.d.R. gebildet?", "a": "Die Jagdausübungsberechtigten mehrerer zusammenhängender Jagdbezirke können zum Zwecke der Hege des Wildes eine Hegegemeinschaft bilden. Hegegemeinschaften werden in M-V i.d.R. für Rot-, Dam- und Schwarzwild gebildet.", "label": "24"}, {"num": 25, "type": "open", "q": "Nennen Sie vier Aufgaben einer Hegegemeinschaft.", "a": "Umsetzung der Wildbewirtschaftungsrichtlinie, Anpassung der Wildbestände an ihren Lebensraum unter Beachtung der land-, forst- und fischereiwirtschaftlichen sowie naturschutzrechtlichen Erfordernisse (insbes. Schutz gegen Wildschäden), Abschusskontrolle, Abstimmung von Hegemaßnahmen; Erstellung des Gesamtabschussplan-vorschlages, untersetzt nach Gruppen- und Einzelabschussplanvorschlägen, Vorbeugung von Tierseuchen, Satzung erarbeiten und anzeigen", "label": "25"}, {"num": 26, "type": "open", "q": "Nennen Sie Beginn und Ende des Jagdjahres.", "a": "Beginn: 01.04., Ende: 31.03. eines jeden Jahres", "label": "26"}, {"num": 27, "type": "open", "q": "Welche Voraussetzungen muss ein Jäger erfüllen, um jagdpachtfähig zu sein?", "a": "Jagdpächter darf nur sein, wer einen Jahresjagdschein besitzt und schon vorher einen solchen während dreier Jahre in Deutschland besessen hat. Der Jugendjagdschein wird hier nicht mitgerechnet.", "label": "27"}, {"num": 28, "type": "open", "q": "Bis zu wie viel Jagdfläche darf ein einzelner Jäger pachten und wie wird die Fläche dokumentiert?", "a": "Maximal 1000 Hektar Pachtfläche. Die Fläche wird durch die untere Jagdbehörde in den Jagdschein eingetragen.", "label": "28"}, {"num": 29, "type": "open", "q": "Wie viele Jahre beträgt die Mindestpachtzeit in M-V und welche Regelung gilt bei einer Verlängerung des Jagdpachtvertrages?", "a": "Die Mindestpachtzeit beträgt für alle Jagdbezirke 9 Jahre. Die Verlängerung des Jagdpachtvertrages ist frei verhandelbar, muss jedoch bei der unteren Jagdbehörde angezeigt werden.", "label": "29"}, {"num": 30, "type": "open", "q": "Wie groß muss jeder Teil mindestens sein, wenn ein Eigenjagdbezirk oder ein gemeinschaftlicher Jagdbezirk in Teilen verpachtet werden soll?", "a": "Bei einem Eigenjagdbezirk muss jeder Teil die gesetzliche Mindestgröße haben, also jeweils 75 Hektar. Bei einem gemeinschaftlichen Jagdbezirk muss jeder verpachtete Teil mindestens 150 Hektar groß sein.", "label": "30"}, {"num": 31, "type": "open", "q": "Dürfen auch juristische Personen einen Jagdbezirk pachten? Nennen Sie vier Beispiele für juristische Personen.", "a": "Nein. Jagdbezirke dürfen nur natürliche Personen pachten. Juristische Personen sind z.B. Bund, Länder, Gemeinden, Kirchen, Stiftungen, Unternehmen.", "label": "31"}, {"num": 32, "type": "open", "q": "Was muss nach Abschluss eines Jagdpachtvertrages erfolgen und warum?", "a": "Der Verpächter muss der unteren Jagdbehörde den Jagdpachtvertrag innerhalb von vier Wochen den Vertragsabschluss anzeigen. Andernfalls ist der Jagdpachtvertrag nichtig.", "label": "32"}, {"num": 33, "type": "open", "q": "Wie lange darf ein Jagdpächter die Jagd nicht ausüben, nachdem er einen Jagdpachtvertrag neu abgeschlossen hat? Gibt es Ausnahmen von der Regelung?", "a": "Vor Ablauf von drei Wochen nach Anzeige des Vertrages bei der unteren Jagdbehörde darf der Pächter die Jagd nicht ausüben, sofern nicht die Behörde die Jagdausübung zu einem früheren Zeitpunkt gestattet.", "label": "33"}, {"num": 34, "type": "open", "q": "Nennen Sie vier Sachverhalte, die zum vorzeitigen Erlöschen eines Jagdpachtvertrages führen.", "a": "Der Jagdpachtvertrag erlischt, wenn dem Jagdpächter der Jagdschein unanfechtbar entzogen worden ist oder die Behörde die Erteilung eines Jagdscheins unanfechtbar ablehnt. Der Jagdpachtvertrag erlischt auch, wenn die Gültigkeit des Jagdscheins abgelaufen ist und der Jagdpächter keinen neuen Jagdschein beantragt hat. Ferner erlischt der Jagdpachtvertrag auch aufgrund einer wirksamen Kündigung.", "label": "34"}, {"num": 35, "type": "open", "q": "Welcher Personenkreis darf Jagderlaubnisscheine ausstellen? Ist jeder Jagderlaubnisschein bei der Jagdbehörde anzeigepflichtig?", "a": "Jagdausübungsberechtigte können Jagdgästen eine Jagderlaubnis erteilen. Entgeltliche Jagderlaubnisscheine müssen innerhalb von vier Wochen nach Erteilung bei der unteren Jagdbehörde angezeigt werden. Andernfalls sind sie nichtig.", "label": "35"}, {"num": 36, "type": "open", "q": "Unter welchen rechtlichen Voraussetzungen dürfen Jagdgäste die Jagd ausüben, wenn sich zur selben Zeit kein Jagdausübungsberechtigter im Revier aufhält?", "a": "Jagdgäste dürfen die Jagd nur ausüben, wenn sie einen gültigen Jagderlaubnisschein mit sich führen, der von allen Jagdausübungsberechtigten des Reviers unterschrieben ist oder ein Jagdausübungsberechtigter ohne Schwierigkeiten erreichbar ist.", "label": "36"}, {"num": 37, "type": "open", "q": "Welche Arten von Jagderlaubnisscheinen unterscheidet man?", "a": "Man unterscheidet zwischen entgeltlichen und unentgeltlichen Jagderlaubnisscheinen.", "label": "37"}, {"num": 38, "type": "open", "q": "Welche Personen müssen einen Jagderlaubnisschein unterschrieben haben, damit dieser Gültigkeit erlangt?", "a": "Er muss von allen Jagdausübungsberechtigten des Jagdbezirks unterschrieben sein. Je nach Pachtvertrag muss auch der Verpächter (Jagdgenossenschaft/Eigenjagdbesitzer) zustimmen.", "label": "38"}, {"num": 39, "type": "open", "q": "Welche Arten von Jagdscheinen unterscheidet man?", "a": "Es gibt den Jahres-Jagdschein und den Tages-Jagdschein, den Jahres-Jugendjagdschein und den Tages-Jugendjagdschein, den Ausländer-Tagesjagdschein und den Ausländer-Jahresjagdschein sowie den Falknerjagdschein und den Falknerjugendjagdschein.", "label": "39"}, {"num": 40, "type": "open", "q": "Welchen Beschränkungen unterliegt der Jugendjagdschein?", "a": "Ausübung der Jagd nur in Begleitung des Erziehungsberechtigten oder einer vom Erziehungsberechtigten schriftlich beauftragten Aufsichtsperson. Die Begleitperson muss jagdlich erfahren sein; keine Teilnahme an Gesellschaftsjagden als Schütze (Ausn. Gemeinschaftsansitz); keine Nutzung von Kurzwaffen", "label": "40"}, {"num": 41, "type": "open", "q": "Welche Behörde stellt Ihnen den Jagdschein aus, wenn Sie Ihren Wohnsitz in M-V haben?", "a": "Der Jagdschein wird von der für den Wohnsitz des Antragstellers zuständigen unteren Jagdbehörde des Landkreises oder der kreisfreien Stadt erteilt.", "label": "41"}, {"num": 42, "type": "open", "q": "Wovon ist die erste Erteilung eines Jagdscheins abhängig?", "a": "Die erste Erteilung eines Jagdscheins ist davon abhängig, dass der Antragsteller im Geltungsbereich des Bundesjagdgesetzes eine Jägerprüfung bestanden hat; Antrag gestellt wurde, Identitätsnachweis erbracht, Mindestalter 16 Jahre (Jugendjagdschein) bzw. 18 Jahre, Zuverlässigkeit, körperliche und geistige Eignung, abgeschlossene und ausreichende Jagdhaftpflichtversicherung für den Zeitraum der beantragten Jagdscheinerteilung", "label": "42"}, {"num": 43, "type": "open", "q": "Nennen Sie vier Gründe, bei deren Vorliegen der Jagdschein versagt werden muss.", "a": "Bei:\n- Personen, die noch nicht 16 Jahre (Jugendjagdschein) bzw. 18 Jahre alt sind\n- Personen ohne erforderliche Zuverlässigkeit oder geistige/ körperliche Eignung\n- Personen, denen der Jagdschein entzogen worden ist, während der Dauer der Einziehung\n- Personen, die keine ausreichende Jagdhaftpflichtversicherung nachweisen", "label": "43"}, {"num": 44, "type": "open", "q": "Nennen Sie die Mindestdeckungssumme einer Jagdhaftpflichtversicherung, die zum Lösen eines Jagdscheins vorgeschrieben ist.", "a": "Die Mindestdeckungssumme richtet sich nach den Bestimmungen des Bundesjagdgesetzes in der gültigen Fassung. Zurzeit beträgt diese 500.000 € für Personenschäden und 50.000 € für Sachschäden.", "label": "44"}, {"num": 45, "type": "open", "q": "Mit welchen Geschossen darf nicht auf Schalenwild und Seehunde geschossen werden?", "a": "Verboten ist, mit Schrot, Posten, gehacktem Blei, Bolzen und Pfeilen auf Schalenwild und Seehunde zu schießen.", "label": "45"}, {"num": 46, "type": "open", "q": "Welche Bedingung muss eine Büchsenpatrone mindestens erfüllen, wenn Sie damit Rehwild bejagen wollen?", "a": "Die Auftreffenergie des Geschosses auf 100 Meter muss mindestens 1000 Joule betragen.", "label": "46"}, {"num": 47, "type": "open", "q": "Welche Bedingungen muss eine Büchsenpatrone mindestens erfüllen, wenn Sie damit alles Schalenwild bejagen wollen?", "a": "Die Auftreffenergie des Geschosses auf 100 Meter muss mindestens 2000 Joule betragen, das Kaliber muss mindestens 6,5 mm betragen.", "label": "47"}, {"num": 48, "type": "open", "q": "Bei welchen Jagdarten dürfen Kurzwaffen im Jagdbetrieb eingesetzt werden? Benennen Sie die Mindestmündungsenergie.", "a": "Kurzwaffen dürfen im Falle der Bau- und Fallenjagd verwendet werden sowie zur Abgabe von Fangschüssen, wenn die Mündungsenergie der Geschosse mindestens 200 Joule beträgt.", "label": "48"}, {"num": 49, "type": "open", "q": "Welche Wildarten dürfen in M-V zur Nachtzeit bejagt werden?", "a": "Schwarzwild, Raubwild, Möwen, Waldschnepfen, Auer-, Birk- und Rackelwild, Nutria, Rot- und Damwild in der Zeit vom 1. Oktober bis zum 31. Januar", "label": "49"}, {"num": 50, "type": "open", "q": "Welche Zeit gilt als Nachtzeit nach dem Bundesjagdgesetz?", "a": "Als Nachtzeit gilt die Zeit von eineinhalb Stunden nach Sonnenuntergang bis eineinhalb Stunden vor Sonnenaufgang.", "label": "50"}, {"num": 51, "type": "open", "q": "Welche technischen Zielhilfen sind im Jagdbetrieb ohne besondere Genehmigung verboten?", "a": "Vorrichtungen zum Anstrahlen oder Beleuchten des Zieles, die fest mit der Schusswaffe verbunden sind sowie Nachtzielgeräte mit Montageeinrichtung, die ein eigenes Absehen haben", "label": "51"}, {"num": 52, "type": "open", "q": "Unter welchen Umständen dürfen Totschlagfallen in M-V eingesetzt werden?", "a": "Nur mit Genehmigung der unteren Jagdbehörde zum Bodenbrüterschutz, wenn die Fangjagd nur auf diese Weise effektiv und tierschutzgerecht durchgeführt werden kann.", "label": "52"}, {"num": 53, "type": "open", "q": "Welche Arten von Fanggeräten sind in M-V grundsätzlich verboten?", "a": "Alle Fanggeräte, die nicht unversehrt fangen oder die sofort töten.", "label": "53"}, {"num": 54, "type": "open", "q": "Welche Personen dürfen aus Kraftfahrzeugen heraus jagen?", "a": "Nur Körperbehinderte mit Erlaubnis der zuständigen unteren Jagdbehörde.", "label": "54"}, {"num": 55, "type": "open", "q": "Was versteht man unter Hetzjagd? Ist diese in Deutschland erlaubt?", "a": "Unter Hetzjagd versteht man das Verfolgen von gesundem Wild bis es sich aus völliger Erschöpfung stellt. Die Hetzjagd ist in Deutschland verboten.", "label": "55"}, {"num": 56, "type": "open", "q": "Beim Vorliegen welcher Voraussetzungen ist die Fütterung des Schalenwildes zulässig?", "a": "Grundsätzlich ist das Füttern von Schalenwild in M-V verboten. Die untere Jagdbehörde des betreffenden Landkreises legt für das Schalenwild den Zeitraum der Notzeit fest. Dann ist der Jagdausübungsberechtigte verpflichtet, für angemessene und artgerechte Wildfütterung zu sorgen.", "label": "56"}, {"num": 57, "type": "open", "q": "Unter welchen Voraussetzungen ist die Fangjagd mit Lebendfallen zulässig?", "a": "Die Bauart der Fallen muss einen unversehrten Fang gewährleisten. Die Zeit zwischen Fang und Erlegung ist so kurz wie möglich zu halten. Die Fallen sind mindestens einmal täglich zu kontrollieren.", "label": "57"}, {"num": 58, "type": "open", "q": "Welche jagdrechtlichen Vorschriften gelten in M-V für Kirrungen?", "a": "Pro angefangene 75 ha Jagdfläche ist eine Kirrung zulässig. Eine Kirrung darf nur gelegentlich mit nicht mehr als drei Kilogramm Mais, Getreide oder Baumfrüchten beschickt werden.", "label": "58"}, {"num": 59, "type": "open", "q": "Welche Wildarten dürfen in M-V nur auf Grund eines Abschussplanes erlegt werden und bis zu welchem Tag ist dieser der Jagdbehörde vorzulegen?", "a": "Schalenwild, mit Ausnahme von Rehwild. Der Abschussplan ist der Jagdbehörde bis zum 28. Februar vorzulegen (jährlich: Schwarzwild; alle drei Jahre: Rot-, Dam-, Muffelwild)", "label": "59"}, {"num": 60, "type": "open", "q": "Welche Person hat in einem verpachteten Jagdbezirk einen Abschussplan aufzustellen?", "a": "Der Jagdpächter im Einvernehmen mit dem Verpächter (Jagdgenossenschaft/Eigenjagdbesitzer).", "label": "60"}, {"num": 61, "type": "open", "q": "Wer bestätigt einen Abschussplan für Rot-, Dam- und Muffelwild?", "a": "Die für den Jagdbezirk zuständige untere Jagdbehörde im Einvernehmen mit dem Jagdbeirat.", "label": "61"}, {"num": 62, "type": "open", "q": "Wozu dient eine Wildnachweisung und bis wann ist diese der unteren Jagdbehörde durch wen vorzulegen?", "a": "Sie dient der Auswertung des Jagdjahres für die Jagdstrecke des betreffenden Jagdbezirks. Der Jagdausübungsberechtigte hat bis zum 10. April jeden Jahres der Jagdbehörde die Strecke des vergangenen Jagdjahres auf einem vorgeschriebenen Formblatt oder digital anzuzeigen.", "label": "62"}, {"num": 63, "type": "open", "q": "Was ist eine Streckenliste, wozu dient sie und wer hat eine solche wie zu führen?", "a": "Jagdausübungsberechtigte haben für ihren jeweiligen Jagdbezirk eine Streckenliste zu führen. In die Streckenliste ist jeder Abschuss des Wildes, auch das Fallwild, innerhalb einer Woche einzutragen. Sie dient somit der Abschusskontrolle und ist der Jagdbehörde auf Verlangen vorzulegen.", "label": "63"}, {"num": 64, "type": "open", "q": "Welche jagdlichen Verbote gelten in welchem Umkreis von Wildquerungshilfen (Wildbrücken)?", "a": "Im Umkreis von 250 Metern (gemessen von der Mitte der Querungshilfe) ist es verboten, Ansitzeinrichtungen aufzustellen oder die Einzeljagd auszuüben. Ausgenommen ist die Nachsuche.", "label": "64"}, {"num": 65, "type": "open", "q": "Darf Wild, für das keine Jagdzeit festgesetzt ist, bejagt werden? Nennen Sie vier Beispiele für Wildarten ohne eine Jagdzeit.", "a": "Nein. Diese Wildarten genießen eine ganzjährige Schonzeit. Das gilt z.B. für Fischotter, Seehunde, Graureiher, Greife, Falken, Wisent, Elch, Wolf, Rebhuhn, Luchs, Wildkatze und Mauswiesel.", "label": "65"}, {"num": 66, "type": "open", "q": "Es gibt Wildarten, die in M-V ganzjährig bejagt werden dürfen. Nennen Sie vier Beispiele. Welche die Bejagung einschränkende Regelung muss in jedem Fall beachtet werden?", "a": "Schwarzwild, Dachs, Fuchs, Waschbär, Marderhund, Wildkaninchen, Nutria, Steinmarder, Mink\nAusnahme: Die zur Aufzucht notwendigen Elterntiere sind bis zum Selbstständigwerden oder vollständigen Verlust ihrer Jungtiere von der Bejagung ausgeschlossen.", "label": "66"}, {"num": 67, "type": "open", "q": "Auf welche Weise ist nach dem Bundesjagdgesetz der Schutz von Elterntieren geregelt?", "a": "In den Setz- und Brutzeiten dürfen bis zum Selbstständigwerden der Jungtiere die für die Aufzucht notwendigen Elterntiere, auch von Wild ohne Schonzeit, nicht bejagt werden.", "label": "67"}, {"num": 68, "type": "open", "q": "Was verstehen Sie unter einer Wildfolge und wie wird sie geregelt?", "a": "Die Verfolgung krankgeschossenen oder schwerkranken Wildes ins Nachbarrevier. Die Wildfolge ist gesetzlich geregelt. Zwischen den benachbarten Jagdausübungsberechtigten können individuelle Vereinbarungen nach Maßgabe des Gesetzes abgeschlossen werden.", "label": "68"}, {"num": 69, "type": "open", "q": "Muss schwerkrankes Wild im eigenen Revier erlegt werden? Begründen Sie Ihre Aussage.", "a": "Ja. Um krankgeschossenes oder schwerkrankes Wild von vermeidbaren Schmerzen oder Leiden zu bewahren, ist dieses unverzüglich zu erlegen.", "label": "69"}, {"num": 70, "type": "open", "q": "Nennen Sie die Jagdzeit für folgende Wildarten: a) ………………………………… b)………………………………..", "a": "a) Vom………………. bis zum……………… b) Vom………………. bis zum………………….", "label": "70"}, {"num": 71, "type": "open", "q": "Welche Aufgaben umfasst der Jagdschutz?", "a": "Der Jagdschutz umfasst den Schutz des Wildes, insbesondere vor Wilderern, Futternot, Wildseuchen sowie vor wildernden Hunden und Katzen. Er umfasst zudem die Sorge für die\nEinhaltung der zum Schutz des Wildes und der Jagd erlassenen Vorschriften.", "label": "71"}, {"num": 72, "type": "open", "q": "Was hat der Jagdausübungsberechtigte zu veranlassen, wenn eine Wildseuche auftritt?", "a": "Tritt eine Wildseuche auf oder liegt eine begründeter Seuchenverdacht vor, muss der Jagdausübungsberechtigte dies unverzüglich der zuständigen Behörde anzuzeigen.", "label": "72"}, {"num": 73, "type": "open", "q": "Welchen Personen obliegt in einem Revier der Jagdschutz?", "a": "Den zuständigen öffentlichen Stellen (Polizeivollzugsbeamte, Jagdbehörden, Forstbeamte), dem Jagdausübungsberechtigten, sofern dieser Inhaber eines gültigen Jagdscheines ist und den von der zuständigen Behörde bestätigten Jagdaufsehern.", "label": "73"}, {"num": 74, "type": "open", "q": "Wozu sind Jagdschutzberechtigte in ihrem Jagdbezirk befugt? Nennen Sie vier Befugnisse!", "a": "- Personen, die dort unberechtigt jagen, anzuhalten und ihre Identität festzustellen sowie ihnen Waffen, Jagd- und Fanggeräte, erlegtes Wild, Frettchen und Hunde abzunehmen.\n- Hunde, die Wild außerhalb der Einwirkung ihres Führers verfolgen, nicht von ihrem Berechtigten zum Dienst verwendet werden und als Hirten-, Jagd-, Blinden-, Polizei-, Zoll-, Bundeswehr- und Suchhunde erkennbar sind, zu erlegen\n- Katzen, die weiter als 200 Meter vom nächsten Haus angetroffen werden, zu erlegen\n- Erlegung von Hunden/Katzen in Lebendfallen (im Jagdbezirk)", "label": "74"}, {"num": 75, "type": "open", "q": "Welche Hunde dürfen nicht getötet werden?", "a": "Hirten-, Jagd-, Blinden-, Polizei-, Zoll-, Bundeswehr- und Suchhunde dürfen auch außerhalb des Einwirkungsbereiches ihres Führers grundsätzlich nicht getötet werden, sofern sie als derartige Diensthunde kenntlich sind und vom Berechtigten zu ihrem Dienst verwandt werden.", "label": "75"}, {"num": 76, "type": "open", "q": "Wer muss wem ein im Straßenverkehr angefahrenes oder übergefahrenes Stück Schalenwild melden?", "a": "Der Führer eines Kraftfahrzeuges, welcher Schalenwild angefahren oder überfahren hat, muss dies dem Jagdausübungsberechtigten oder der Polizei unverzüglich anzeigen.", "label": "76"}, {"num": 77, "type": "open", "q": "Was ist Notwehr?", "a": "Notwehr ist die Verteidigung die erforderlich ist, um einen gegenwärtigen, rechtswidrigen Angriff von sich oder einem anderen abzuwenden.", "label": "77"}, {"num": 78, "type": "open", "q": "Was ist Jagdwilderei und wie wird sie in nicht besonders schweren Fällen bestraft?", "a": "Verletzung fremden Jagd- oder Jagdausübungsrechts. Wer unter Verletzung fremden Jagd- oder Jagdausübungsrechts dem Wilde nachstellt, es fängt oder erlegt, oder eine Sache die dem Jagdrecht unterliegt sich zueignet, beschädigt oder zerstört, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft.", "label": "78"}, {"num": 79, "type": "open", "q": "Was ist der Jagdbeirat und wer gehört dem Jagdbeirat der unteren Jagdbehörde an?", "a": "Fachliche Berater der Jagdbehörden. Kreisjägermeister (Vorsitz), jeweils eine Vertretung der Wildschadensausgleichskasse, der Landwirtschaft, der Forstwirtschaft, der Jagdgenossenschaften, der Fischerei, des Naturschutzes, der Landesjägerschaft und des Veterinärwesens.", "label": "79"}, {"num": 80, "type": "open", "q": "Welche heimischen Wildarten dürfen nicht ausgesetzt werden?", "a": "Das Aussetzen von Schwarzwild und Wildkaninchen ist verboten.", "label": "80"}, {"num": 81, "type": "open", "q": "Welche Personen dürfen zu Schaden gehendes Wild von Grundstücken fernhalten? Was müssen diese Personen dabei beachten?", "a": "Der Jagdausübungsberechtigte sowie der Eigentümer oder Nutzungsberechtigte eines Grundstücks sind berechtigt, zur Verhütung von Wildschäden das Wild von dem Grundstück abzuhalten oder zu verscheuchen. Das Grundstück darf durch den Jagdausübungsberechtigten nicht beschädigt werden. Eigentümer oder Nutzungsberechtigte dürfen das Wild weder gefährden noch verletzen.", "label": "81"}, {"num": 82, "type": "open", "q": "Welchen Schaden bezeichnet man als Jagdschaden und wer haftet gegenüber wem?", "a": "Einen Schaden, der aus missbräuchlicher Jagdausübung entstanden ist. Der Jagdausübungsberechtigte haftet dem Grundstückseigentümer oder Nutzer für jeden aus missbräuchlicher Jagdausübung entstandenen Schaden.", "label": "82"}, {"num": 83, "type": "open", "q": "Welche Verpflichtung obliegt dem Jagdausübungsberechtigten, dessen Hauptwohnsitz sich nicht in der Gemeinde seines Jagdbezirkes in M-V befindet?", "a": "Sofern für seinen Jagdbezirk kein dort wohnhafter bestätigter Jagdaufseher bestellt wurde, hat der Jagdausübungsberechtigte der unteren Jagdbehörde eine erreichbare Person am Ort zu benennen. Sie muss Inhaber eines gültigen Jagdscheines sein und unaufschiebbare Maßnahmen zur Verhinderung von Schmerzen und Leiden des Wildes durchführen können.", "label": "83"}, {"num": 84, "type": "open", "q": "An wen ist nach dem Bundesjagdgesetz in gemeinschaftlichen Jagdbezirken ein Wildschadensersatzanspruch zu richten? Sind darüber hinaus andere Regelungen möglich?", "a": "An die Jagdgenossenschaft. Im Jagdpachtvertrag kann dem Jagdpächter der Ersatz des eingetretenen Wildschadens auferlegt werden.", "label": "84"}, {"num": 85, "type": "open", "q": "Welche Wildarten können ersatzpflichtige Wildschäden verursachen?", "a": "Schalenwild, Wildkaninchen und Fasane.", "label": "85"}, {"num": 86, "type": "open", "q": "Welche form- und fristgerecht angezeigten Wildschäden sind ersatzpflichtig? Benennen Sie Ausnahmen.", "a": "Schäden an bejagbaren Grundstücken und an deren noch nicht eingeernteten Bodenerzeugnissen, die durch Schalenwild, Wildkaninchen und Fasane verursacht wurden. Von dieser Ersatzpflicht sind Sonderkulturen ausgenommen.", "label": "86"}, {"num": 87, "type": "open", "q": "Wo sind Jagd- und Wildschäden anzumelden und innerhalb welcher Frist?", "a": "Der Berechtigte hat den Schaden innerhalb einer Woche nach Kenntnisnahme bei der zuständigen Behörde (Ordnungsamt der Stadt oder Gemeinde) anzumelden.", "label": "87"}, {"num": 88, "type": "open", "q": "Wie sind die Anmeldefristen bei Wildschäden im Wald geregelt?", "a": "Schäden an forstwirtschaftlich genutzten Grundstücken sind jeweils zum 01.05. und zum 01.10. bei der zuständigen Behörde (Ordnungsamt der Stadt oder Gemeinde) anzumelden.", "label": "88"}, {"num": 89, "type": "open", "q": "Welcher Personenkreis ist durch die zuständige Behörde zum Wildschaden-Ortstermin zu laden?", "a": "Der Geschädigte, der gesetzlich zum Ersatz Verpflichtete, der Jagdausübungsberechtigte (falls er zum Ersatz verpflichtet ist, ein Wildschadensschätzer und ein Vertreter der Wildschadensausgleichskasse, ggf. ein Vertreter des Nationalparkamtes", "label": "89"}, {"num": 90, "type": "open", "q": "Welche Aufgaben hat die Wildschadensausgleichskasse in M-V?", "a": "Wildschäden verhindern; Ausgleich der von Rot-, Dam- und Schwarzwild verursachten Wildschäden", "label": "90"}, {"num": 91, "type": "open", "q": "Welcher Personenkreis ist Pflichtmitglied der Wildschadensausgleichskasse?", "a": "Jagdgenossenschaften, Eigenjagdbesitzer, Jagdpächter sowie Landwirte, wenn diese mindestens 75 ha bewirtschaften.", "label": "91"}, {"num": 92, "type": "open", "q": "Bis zu wie viel Prozent des Wildschadensersatzes kann die Wildschadensausgleichskasse höchstens gewähren und unter welchen Voraussetzungen?", "a": "Bis zu 90 %, wenn sie der Einigung zugestimmt hat.", "label": "92"}, {"num": 93, "type": "open", "q": "Nennen Sie zwei Straftaten aus dem Bundesjagdgesetz.", "a": "Wild zu bejagen, für das keine Jagdzeit festgesetzt ist. Bejagung von Elterntieren, die zur Aufzucht von Jungtieren notwendig sind. Verstoß gegen behördliches Bejagungsverbot bedrohter Wildarten.", "label": "93"}, {"num": 94, "type": "open", "q": "Unter welchen Voraussetzungen kann ein Jägernotweg festgelegt werden?", "a": "Kann ein Jagdausübungsberechtigter seinen Jagdbezirk nur auf einem nicht zumutbaren Umweg erreichen, so dürfen er und seine Jagdgäste den privaten Weg/Pfad/Schneise in Jagdausrüstung benutzen, der mit dem Grundstückseigentümer schriftlich zu vereinbaren ist.", "label": "94"}, {"num": 95, "type": "open", "q": "Welche jagdrechtlichen Vorschriften muss ein Jagdausübungsberechtigter vor der Errichtung von Jagdeinrichtungen beachten?", "a": "Errichtung auf land- und forstwirtschaftlich genutzten Grundstücken, wenn dies zuvor dem Grundeigentümer angezeigt wurde und sich die Anzahl auf ein angemessenes Maß beschränkt. Der Grundeigentümer darf den Errichtungen widersprechen, wenn eine Duldung unzumutbar ist.", "label": "95"}, {"num": 96, "type": "open", "q": "Wie hat sich ein Schütze zu verhalten, wenn krankgeschossenes Wild seinen Jagdbezirk verlassen hat und im benachbarten Jagdbezirk in Sichtweite (max. 100 m) verweilt?", "a": "Sofern keine anderslautende Wildfolgevereinbarung abgeschlossen wurde, darf ein Fangschuss von dem Jagdbezirk aus, in dem es beschossen wurde, angetragen werden. Zum Zwecke dieses Fang-schusses darf die Jagdbezirksgrenze unter Mitführung und Einsatz der Schusswaffe überschritten werden. Das Wild ist an Ort und Stelle aufzubrechen und zu versorgen. Mit Zustimmung des benachbarten Jagdausübungsberechtigten darf es fortgeschafft werden.", "label": "96"}, {"num": 97, "type": "open", "q": "Was hat mit baufälligen Jagdeinrichtungen zu geschehen?", "a": "Diese sind abzubauen und aus dem Revier zu entfernen oder instand zu setzen.", "label": "97"}, {"num": 98, "type": "open", "q": "Bei welchen Jagdarten sind zwingend brauchbare Jagdhunde mitzuführen und zu verwenden?", "a": "Bei jeder Such-, Drück- oder Treibjagd, bei jeder Jagd auf Schnepfen und Wasserwild sowie bei jeder Nachsuche auf Wild sind brauchbare Jagdhunde in genügender Zahl mitzuführen.", "label": "98"}, {"num": 99, "type": "open", "q": "Welche Stelle bestätigt in M-V die Brauchbarkeit von Jagdhunden? Wie wird das dokumentiert?", "a": "Die Landesjägerschaft (Landesjagdverband M-V e.V.). Diese stellt einen Brauchbarkeitspass aus.", "label": "99"}, {"num": 100, "type": "open", "q": "Welche Funktion hat ein Kreisjägermeister und wo ist seine Position angesiedelt?", "a": "Zur sachverständigen Beratung der unteren Jagdbehörde wird ein Kreisjägermeister bestellt.", "label": "100"}, {"num": 101, "type": "open", "q": "Welche Aufgaben haben Jagdbeiräte?", "a": "Beratung und Unterstützung der unteren sowie der obersten Jagdbehörde in Angelegenheiten der jagdlichen Verwaltung werden Jagdbeiräte gebildet.", "label": "101"}, {"num": 102, "type": "open", "q": "Wann kann eine Vereinigung der Jäger durch die oberste Jagdbehörde als Landesjägerschaft anerkannt werden und welche Vereinigung ist das in M-V?", "a": "Als Landesjägerschaft wird die Vereinigung von Jägern anerkannt, der mehr als die Hälfte der Jagdscheininhaber im Land M-V angehört. Der Landesjagdverband Mecklenburg-Vorpommern e.V. wurde durch die oberste Jagdbehörde als Landesjägerschaft anerkannt.", "label": "102"}, {"num": 103, "type": "open", "q": "Welche Vorschriften müssen Tierhalter bezüglich der Tierhaltung beachten?", "a": "Wer ein Tier hält, muss das Tier seiner Art entsprechend angemessen ernähren, pflegen und unterbringen. Er darf die Möglichkeiten zur artgemäßen Bewegung nicht so einschränken, dass dem Tier Schmerzen, Leiden oder Schäden zugefügt werden.", "label": "103"}, {"num": 104, "type": "open", "q": "Nennen Sie die Mindestgrößen für Hundezwinger.", "a": "6 m² für einen kleinen; 8 m² für einen mittelgroßen; 10 m² für einen großen Hund, jeweils zuzüglich Hundehütte.", "label": "104"}, {"num": 105, "type": "open", "q": "Ist das Einarbeiten von Jagdhunden im Schwarzwildübungsgatter oder in einer Schliefenanlage zulässig? Begründen Sie Ihre Aussage.", "a": "Ja, beides ist zulässig, da das Wesen des jungen Jagdhundes in Bezug auf seine Eignung für die Schwarz- oder Raubwildjagd überprüft wird. Ein direkter Kontakt zum Schliefenfuchs oder zum Schwarzwild wird ausgeschlossen bzw. kontrolliert eingeschränkt.", "label": "105"}, {"num": 106, "type": "open", "q": "Unter welchen Voraussetzungen darf ein Tier auf ein anderes lebendes Tier gehetzt werden? Nennen Sie ein Beispiel.", "a": "Es ist nur dann erlaubt, ein Tier auf ein anderes lebendes Tier zu hetzen, wenn es die Grundsätze weidgerechter Jagdausübung erfordern, z.B. im Rahmen einer Nachsuche.", "label": "106"}, {"num": 107, "type": "open", "q": "In welchem Fall darf ein Wirbeltier ohne Betäubung getötet werden und durch wen?", "a": "Im Rahmen weidgerechter Jagdausübung durch eine dazu befähigte Person.", "label": "107"}, {"num": 108, "type": "open", "q": "Benennen Sie sechs Sonderkulturen.", "a": "Weinberge, Gärten, Obstgärten, Baumschulen, Alleen, einzelnstehende Bäume, andere als der im Jagdbezirk vorkommende Hauptholzarten und dadurch gefährdete Forstkulturen, Freilandpflanzungen von Garten- oder hochwertigen Handelsgewächsen.", "label": "108"}, {"num": 109, "type": "open", "q": "Welche Funktionen hat der Wald?", "a": "Der Wald hat Nutz-, Schutz- und Erholungsfunktion.", "label": "109"}, {"num": 110, "type": "open", "q": "Welche Flächen gehören zum Wald im Sinne des Waldgesetzes?", "a": "Jede mit Waldgehölzen bestockte Fläche, sowie Kahlschläge, Waldblößen, Leitungsschneisen, Wildäsungsflächen, Pflanzgärten, Teiche.", "label": "110"}, {"num": 111, "type": "open", "q": "Welche Waldbesitzformen unterscheidet man?", "a": "Staatswald, Körperschaftswald und Privatwald.", "label": "111"}, {"num": 112, "type": "open", "q": "Was beinhaltet die Schutz- und Erholungsfunktion des Waldes?", "a": "Insbesondere die dauernde Funktionsfähigkeit des Naturhaushaltes, das Klima, den Wasserhaushalt, die Reinhaltung der Luft, die Biodiversität, die Bodenfruchtbarkeit, das Landschaftsbild, Erholung der Bevölkerung, Rückzugsgebiet für Wild.", "label": "112"}, {"num": 113, "type": "open", "q": "Dürfen Waldflächen grundsätzlich durch jedermann betreten werden und zu welchem Zweck? Nennen Sie vier Ausnahmen.", "a": "Ja. Jedermann darf den Wald zu jeder Zeit zum Zwecke der Erholung betreten. Vom freien Betretungsrecht ausgenommen sind u.a. Forstkulturen und Jungwüchse bis zu einer Höhe von 4 Metern, Pflanzgärten und Wildäcker, Waldflächen, auf denen Holz eingeschlagen wird, jagdliche Einrichtungen.", "label": "113"}, {"num": 114, "type": "open", "q": "Was passiert mit den jagdlichen Einrichtungen bei einer Neuverpachtung?", "a": "Bei einem Wechsel des Jagdausübungsberechtigten hat der bisherige Jagdausübungsberechtigte unverzüglich, spätestens innerhalb von sechs Monaten nach Pachtende, alle jagdlichen Einrichtungen zu entfernen. Bei Übernahme der jagdlichen Einrichtungen durch den neuen Jagdausübungsberechtigten ist dies nicht notwendig.", "label": "114"}, {"num": 115, "type": "open", "q": "Durch welche Personengruppen darf der Wald außerhalb öffentlicher Wege mit Kraftfahrzeugen auf Grundlage des Waldgesetzes befahren werden?", "a": "Das Fahren mit Kraftfahrzeugen ist nur dem Waldbesitzer, seinen Beauftragten, den Jagdaus-übungsberechtigten und ihren Beauftragten sowie den dazu befugten Behörden gestattet.", "label": "115"}, {"num": 116, "type": "open", "q": "Dürfen Haustiere in den Wald mitgenommen werden? Gibt es Ausnahmen nach dem Landeswaldgesetz?", "a": "Nein. Das Mitnehmen von Haustieren, mit Ausnahme angeleinter Hunde ist unzulässig.", "label": "116"}, {"num": 117, "type": "open", "q": "Dürfen Waldfrüchte im Wald gesammelt werden und wie viele etwa?", "a": "Ja. Jedermann ist berechtigt, Waldfrüchte in geringen Mengen für den eigenen Bedarf zu sammeln.", "label": "117"}, {"num": 118, "type": "open", "q": "Nennen Sie vier Ziele des Naturschutzes und der Landschaftspflege.", "a": "Nachhaltige Sicherung, Schutz und Erhalt von Boden, Wasser, Luft und Klima, Pflanzen- und Tierwelt, einschließlich ihrer Lebensräume, die Nutzungsfähigkeit der Naturgüter, die Vielfalt, Eigenart, und Schönheit von Natur und Landschaft", "label": "118"}, {"num": 119, "type": "open", "q": "Nennen Sie vier Schutzgebiete!", "a": "Nationalparke, Naturschutzgebiete, Landschaftsschutzgebiete, Naturparke, Biosphärenreservate", "label": "119"}, {"num": 120, "type": "open", "q": "Erläutern Sie den Begriff „Naturdenkmal“.", "a": "Naturdenkmale sind Einzelschöpfungen der Natur, die aus wissenschaftlichen, naturgeschichtlichen oder landeskundlichen Gründen oder wegen ihrer Seltenheit, Einzigartigkeit oder Schönheit oder repräsentativen Bedeutung in einem Landschaftsraum besonders schützenswert sind.", "label": "120"}, {"num": 121, "type": "open", "q": "Nennen Sie sechs gesetzlich geschützte Biotope, die nicht ohne weiteres verändert werden dürfen.", "a": "Moore, Sölle, Röhrichte, seggen-/binsenreiche Nasswiesen, natürliche/naturnahe Bachläufe und deren Ufer, Feldhecken, Heiden, Trocken-/ Magerrasen, Dünen, Alleen, Ginster-/Wacholderheiden", "label": "121"}, {"num": 122, "type": "open", "q": "Welche Schutzvorschriften gelten für besonders geschützte Arten (Tiere/Pflanzen)?", "a": "Es ist verboten, wildlebenden Tieren nachzustellen, sie zu fangen, zu verletzen, zu töten, ihre Entwicklungsformen der Natur zu entnehmen, sie zu beschädigen oder zu zerstören. Es ist verboten, besonders geschützte Pflanzen oder ihre Entwicklungsformen in Besitz zu nehmen, mit ihnen zu handeln und ihre Lebensräume zu zerstören.", "label": "122"}, {"num": 123, "type": "open", "q": "Nennen Sie sechs besonders geschützte Tierarten.", "a": "alle europäischen Reptilien und Amphibien, heimische Libellen, Steinkrebs, Igel, Bilche, Fleder-mäuse, Singvögel, rote Waldameise, Hirschkäfer, Schwalbenschwanz", "label": "123"}, {"num": 124, "type": "open", "q": "Nennen Sie sechs besonders geschützte Pflanzenarten.", "a": "Frauenschuh, Knabenkraut, Trollblume, Adonisröschen, Edelweiß, Enzian, Silberdistel, Fingerhut Leberblümchen, Maiglöckchen, Schlüsselblume", "label": "124"}, {"num": 125, "type": "open", "q": "Welche Verbote gelten im Land M-V für die Horstschutzzonen beim Seeadler?", "a": "Es ist verboten, im Umkreis von 100 Metern um den Horststandort Bestockungen zu entfernen oder den Gebietscharakter zu verändern und im Umkreis von 300 Metern in der Zeit vom 01.01. bis zum 31.07. die Jagd auszuüben und stationäre jagdliche Einrichtungen zu errichten.", "label": "125"}, {"num": 126, "type": "open", "q": "Nennen Sie sechs Vogelarten für die Horstschutzzonen gesetzlich festgelegt wurden.", "a": "Für Adler, Wander- und Baumfalke, Weihen, Schwarzstorch, Kranich.", "label": "126"}, {"num": 127, "type": "open", "q": "Nennen Sie Besonderheiten, die bei der Jagdausübung in Schutzgebieten zu beachten sind.", "a": "Jagdzeiten können abweichend geregelt sein, Einschränkungen im Betretungsrecht, Jagdausübung nur Beachtung des Schutzzwecks, Bau/ Errichtung jagdlicher Einrichtungen genehmigungspflichtig", "label": "127"}, {"num": 128, "type": "open", "q": "Wo finden Sie die Schutzvorschriften für ein Schutzgebiet?", "a": "In der jeweiligen Schutzgebietsverordnung. Diese ist bei der unteren Naturschutzbehörde oder im Internet erhältlich.", "label": "128"}, {"num": 129, "type": "open", "q": "Welche Institution gibt die Unfallverhütungsvorschrift Jagd (VSG 4.4) heraus und welche Aufgabe hat sie?", "a": "Die Sozialversicherung für Landwirtschaft, Forsten und Gartenbau als gesetzlicher Unfallversicherungsträger. Sie übernimmt Unfallschäden an Personen, die während der Jagd-ausübung einen körperlichen Schaden erlitten habe.", "label": "129"}, {"num": 130, "type": "open", "q": "Was sagt die Unfallverhütungsvorschrift Jagd (VSG 4.4) über die Verwendung von Waffen und Munition?", "a": "Schusswaffen müssen den Bestimmungen des Waffengesetzes entsprechen und nach dem Jagdgesetz zugelassen sein. Waffen müssen funktionssicher sein und dürfen nur bestimmungs-gemäß verwendet werden.", "label": "130"}, {"num": 131, "type": "open", "q": "Nennen Sie vier Beispiele für einen sicheren Umgang mit der Waffe!", "a": "Die Laufmündung ist stets in eine Richtung zu halten, in der niemand gefährdet wird.\nBesteigen von Fahrzeugen, Fahrten, auf- und abbaumen, überwinden von Hindernissen nur mit entladener Waffe. Nur zugelassene, einwandfreie Munition verwenden. Kugelfang beachten. Sicheres Ansprechen vor der Schussabgabe. Bestimmungsgemäße Verwendung der Waffe.", "label": "131"}, {"num": 132, "type": "open", "q": "Darf eine Schusswaffe im Fahrzeug geladen sein? Wie lautet die Vorschrift zur Sicherheit?", "a": "Nein. Beim Besteigen von Fahrzeugen und während der Fahrt muss eine Schusswaffe entladen sein. Die Vorschrift heißt „Unfallverhütungsvorschrift Jagd (VSG 4.4).", "label": "132"}, {"num": 133, "type": "open", "q": "Wie verhalten Sie sich bezüglich der Schusswaffe beim Überwinden von Hindernissen und beim Besteigen von Hochsitzen?", "a": "Beim Besteigen oder Verlassen von Hochsitzen und beim Überwinden von Hindernissen müssen die Läufe (Patronenlager) entladen sein.", "label": "133"}, {"num": 134, "type": "open", "q": "Wie stellen Sie nach Genehmigung ein Fangeisen auf, ohne eine Person dadurch zu gefährden?", "a": "Fangeisen dürfen in verschlossenen Fangbunkern, Fallenkästen oder Fangburgen aufgestellt werden. Diese müssen gekennzeichnet sein. Beim unberechtigten Öffnen der Fangbunker muss es einen Selbstauslöser geben. Fangeisen dürfen nicht an viel befahrenen oder belaufenen Wegen gestellt werden.", "label": "134"}, {"num": 135, "type": "open", "q": "Was verstehen Sie unter einer Gesellschaftsjagd?", "a": "Gesellschaftsjagden sind Formen gemeinschaftlichen Jagens, die von vier Personen mit Waffe, die einen gültigen Jagdschein innehaben, ausgeübt werden und bei denen die Jagdausübung aufeinander abgestimmt ist und in einem räumlichen Zusammenhang steht.", "label": "135"}, {"num": 136, "type": "open", "q": "Wie verhalten Sie sich gegenüber Weisungen des Jagdleiters und warum?", "a": "Die Anordnungen des Jagdleiters sind zu befolgen, weil diese Anordnungen für den sicheren Ablauf einer Gesellschaftsjagd zwingend notwendig sind.", "label": "136"}, {"num": 137, "type": "open", "q": "Nennen Sie vier Pflichten des Jagdleiters.", "a": "Schützen und Treibern die erforderlichen Anordnungen für den gefahrlosen Ablauf der Jagd, belehren, Signale bekanntgeben\nKontrolle der Jagdscheine und Brauchbarkeitspässe\nZuweisung Stände, Bezeichnung Schusssektor und Sicherheitsbereich, Kugelfang\nBelehrung Verwendung von Geschossen\nOrganisatorisch: Beginn/Ende der Jagd, Wildfreigabe, -bergung und -versorgung", "label": "137"}, {"num": 138, "type": "open", "q": "Wann darf bei einer Gesellschaftsjagd die Waffe geladen sein, ausgenommen Streife und Kesseltreiben? Wann ist die Waffe zu entladen?", "a": "Sofern der Jagdleiter nichts anderes anordnet, ist die Waffe erst auf dem Stand zu laden und nach Beendigung des Treibens sofort zu entladen.", "label": "138"}, {"num": 139, "type": "open", "q": "Was haben die Schützen nach dem Einnehmen ihrer Drückjagdstände zu tun?", "a": "Nach Einnehmen der Stände haben sich die Schützen mit den jeweiligen Nachbarn zu verständigen. Bei fehlender Sichtverbindung hat der Jagdleiter die Verständigung sicherzustellen.", "label": "139"}, {"num": 140, "type": "open", "q": "Darf ein Schütze seinen Stand vor Beendigung des Treibens oder der Gesellschaftsjagd verlassen?", "a": "Gibt es Ausnahmen?\nNein. Der Stand darf vor Beendigung des Treibens weder verändert noch verlassen werden. Verlässt oder verändert ein Schütze seinen Stand, dann hat er sich zuvor mit seinen Nachbarn zu verständigen. Beispiel: Hilfeleistung in Notfällen und besonderen Gefahrenlagen.", "label": "140"}, {"num": 141, "type": "open", "q": "Was bezeichnet man als „Durchziehen durch die Schützen- und Treiberkette“? Ist das Durchziehen mit der Schusswaffe durch die Schützen- und Treiberkette erlaubt?", "a": "Als Durchziehen wird das Zielen und Mitziehen auf flüchtiges Wild durch die Schützen- und Treiberkette mit angeschlagener und schussbereiter Waffe bezeichnet. Ein Durchziehen mit der Schusswaffe durch die Schützen- und Treiberkette ist unzulässig.", "label": "141"}, {"num": 142, "type": "open", "q": "Darf mit Büchsen- oder Flintenlaufgeschossen ins Treiben geschossen werden? Gibt es Ausnahmen von der Regelung?", "a": "Mit Büchsen- und Flintenlaufgeschossen darf nicht in das Treiben hineingeschossen werden. Ausnahmen kann der Jagdleiter zulassen.", "label": "142"}, {"num": 143, "type": "open", "q": "Wie verhalten Sie sich als Schütze nach dem Signal „Treiber in den Kessel“?", "a": "Nach dem Signal „Treiber rein“ darf nicht mehr in den Kessel geschossen werden, sondern nur noch nach außen.", "label": "143"}, {"num": 144, "type": "open", "q": "In welchem Zustand ist die Waffe außerhalb des Treibens grundsätzlich zu führen?", "a": "Die Waffe ist außerhalb des Treibens stets ungeladen, mit geöffnetem Verschluss und mit der Mündung nach oben oder abgeknickt, zu tragen.", "label": "144"}, {"num": 145, "type": "open", "q": "Dürfen Jagdhelfer bei Drückjagden während des Treibens fertig geladene Waffen führen? Gibt es Ausnahmen?", "a": "Während des Treibens dürfen nur entladene oder unterladene Schusswaffen mitgeführt werden. Dieses gilt nicht für Feldstreifen und Kesseltreiben (Treibjagd) sowie für das Anbringen von Fangschüssen auf krankes Wild oder auf Wild, das dem Jagdhund oder dem Menschen körperliche Schäden zufügt.", "label": "145"}, {"num": 146, "type": "open", "q": "Was schreibt die Unfallverhütungsvorschrift zur farblichen Kennzeichnung aller Beteiligten bei Gesellschaftsjagden vor?", "a": "Bei Gesellschaftsjagden müssen sich alle an der Jagd unmittelbar Beteiligten deutlich farblich von der Umgebung abheben. Beispiel: Hutband und Warnweste.", "label": "146"}, {"num": 147, "type": "open", "q": "Welche Person ist bei einer Nachsuche Jagdleiter? Welche grundsätzliche Aufgabe obliegt ihm?", "a": "Der Hundeführer. Er hat damit das Weisungsrecht bei der Nachsuche.", "label": "147"}, {"num": 148, "type": "open", "q": "Dürfen Kinder und Jugendliche an Nachsuchen teilnehmen? Gibt es Ausnahmen von der Regelung?", "a": "Nein. Kinder und Jugendliche dürfen nicht an der Nachsuche teilnehmen (Ausnahme: Inhaber eines gültigen Jugendjagdscheins).", "label": "148"}, {"num": 149, "type": "open", "q": "Wann bzw. wie oft sind Hochsitze auf ihre Sicherheit hin zu überprüfen?", "a": "Hochsitze sind vor jeder Benutzung, mindestens jedoch einmal jährlich auf ihre Sicherheit hin zu überprüfen.", "label": "149"}, {"num": 150, "type": "open", "q": "Was schreibt die Unfallverhütungsvorschrift (VSG 4.4) für den Bau von Jagdleitern vor?", "a": "Aufgenagelte Sprossen sind nur an geneigt stehenden Leitern zulässig. Sie sind mit den Leiterholmen fest zu verbinden und auf diesen nach unten hin abzustützen.", "label": "150"}, {"num": 151, "type": "open", "q": "Welche Regelungen gelten für die Durchführung von Erntejagden in M-V?", "a": "Jagdausübung nur von erhöhten jagdlichen Einrichtung (Ansitzleitern, Ansitzkanzeln) oder von Kraftfahrzeugen und auf ihnen fest verankerten Aufbauten aus. Die Kraftfahrzeuge müssen halten, die Motoren abgestellt sein und es dürfen sich keine Personen im Fahrzeuginneren mehr befinden.", "label": "151"}, {"num": 152, "type": "open", "q": "Unter welcher gesetzlichen Voraussetzung darf der Jagdscheininhaber an einer Bewegungsjagd in M-V teilnehmen?", "a": "Er muss den Nachweis über seine Übung der Schießfertigkeit, die er innerhalb der vergangenen zwölf Monate unternommen hat, erbringen.", "label": "152"}, {"num": 153, "type": "open", "q": "Wie können Jagdbezirksgrenzen gestaltet werden? Nennen Sie zwei Beispiele.", "a": "Jagdbezirke können abgerundet werden\n- von Amts wegen; auf Antrag der beteiligten Jagdbezirksinhaber durch die Jagdbehörde, durch\nVertrag der Jagdausübungsberechtigten, durch Vertrag der Jagdbezirksinhaber", "label": "153"}, {"num": 154, "type": "open", "q": "Welche Rechtsform hat a.) der Landesjagdverband M-V und b.) die Jagdgenossenschaft?", "a": "a.) Der Landesjagdverband ist ein eingetragener, gemeinnütziger Verein.\nb.) Die Jagdgenossenschaft eine Körperschaft des öffentlichen Rechts.", "label": "154"}, {"num": 155, "type": "open", "q": "Welche Maßnahmen werden aus Mitteln der Jagdabgabe gefördert? Nennen Sie vier.", "a": "Maßnahmen zur Erhaltung und Verbesserung der Lebensgrundlagen des Wildes; Biotopgestaltung zur Erhaltung und Wiederherstellung einheimischer Artenvielfalt; Erforschung Lebens- und Umweltbedingungen der Wildarten; Erforschung Verhütung Wildschäden in Land-, Forst-, Fischereiwirtschaft; Aus- und Weiterbildung der Jäger; Errichtung Lehrrevier; Öffentlichkeitsarbeit Jagdwesen, Jagdhundewesen, Falknerei, Maßnahmen zur Verbesserung der Fleischhygiene", "label": "155"}, {"num": 156, "type": "open", "q": "Nennen Sie vier gesetzliche Aufgaben der Landesjägerschaft in M-V.", "a": "Durchführung der Brauchbarkeitsprüfung, Erteilung Brauchbarkeitspässe, Mitwirkung Jagdbeiräte, Mitwirkung Festlegung Grenzen Hegegemeinschaft (Rot-, Dam-, Schwarzwild), Mitwirkung Verwendung Jagdabgabe, Anerkennung Schweißhundeführer, Durchführung Förderverfahren (Jagdabgabe)", "label": "156"}, {"num": 157, "type": "open", "q": "Erläutern Sie den Unterschied zwischen Hegering und Hegegemeinschaft.", "a": "Hegering: Kleinste Struktureinheit des Landesjagdverbandes auf Grundlage der Verbandssatzung. Mitglieder können alle Jäger im betreffenden Bereich sein.\nHegegemeinschaft: freiwilliger Zusammenschluss von benachbarten Jagdausübungsberechtigten im Gebiet eines festgelegten Wildlebensraumes.", "label": "157"}, {"num": 158, "type": "open", "q": "Nennen Sie zwei Beispiele für einen Körperschaftswald.", "a": "Wald im Eigentum von Gemeinden, Landkreisen oder Zweckverbänden.", "label": "158"}, {"num": 159, "type": "open", "q": "Nennen Sie zwei Beispiels für einen Staatswald.", "a": "Wald, der im Alleineigentum der BRD oder eines Landes steht; Wald einer Anstalt oder Stift
