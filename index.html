s": [{"num": 1, "type": "open", "q": "Welche wesentlichen Rechtsvorschriften muss der Jäger auf den Gebieten der Wildkrankheiten und Wildbrethygiene im Sinne der EU- und nationalen Verordnungen beachten? Nennen Sie vier.", "a": "AHL (EU-Tiergesundheitsrecht), Tiergesundheitsgesetz, Verordnung über anzeigepflichtige Tierseuchen, Bundesjagdgesetz, EU-Hygienepaket und nationale Vorschriften, wie Lebensmittel-und Futtermittelgesetzbuch, Lebensmittelhygiene-Verordnung LMHV, Tierische Lebensmittelhygiene-Verordnung Tier-LMHV, Tierische Lebensmittel-Überwachungsverordnung Tier-LMÜV, Produkthaftungsgesetz, Infektionsschutzgesetz, Tierische Nebenprodukte-Beseitigungsgesetz TierNebG", "label": "1"}, {"num": 2, "type": "open", "q": "Die Wildbrethygiene beginnt mit dem Ansprechen des Wildes. Worauf ist hierbei zu achten? Nennen Sie sechs Faktoren.", "a": "-Ernährungszustand (z.B. Abmagerung)\n-Beschaffenheit des Haar- bzw. Federkleides\n-Unzeitgemäßes Verfärben\n-Artuntypisches Verhalten (z.B. Verlust der Scheu, zielloses Umherirren, Drehbewegung\n-Kopfschütteln, übersteigerte Aggressivität, selbstzerstörerisches Verhalten)\n-Art der Fortbewegung (z.B. Schonen eines Laufes, schwankender Gang)\n-Unnatürliche Körperhaltung\n-Unnatürliche Lautäußerungen (z.B. Husten, Rasselgeräusche, heisere Lautäußerungen, Klagen)\n-Verschmutzte/ veränderte Körperöffnungen, z.B. bei Augenentzündungen, Durchfall\n-Verletzungen jedweder Art, die nicht mit der Erlegung in Verbindung stehen\n-Umfangsvermehrungen der Gelenke, Brunftkugeln u.a. Körperteile\n-Sonstige von der Norm abweichende Veränderungen", "label": "2"}, {"num": 3, "type": "open", "q": "Welche Faktoren haben bei der Erlegung einen Einfluss auf die Qualität des Wildbrets? Nennen Sie vier Faktoren!", "a": "-Sitz des Geschosses (Kammer-, Weidwund-, Wildbretschuss)\n-Umfang der Wildbret- und Organzerstörung\n-Zeitpunkt des Verendens (im Schuss, Flucht, Nachsuche)\n-Art des Geschosses (Bleifrei-, Blei-, Mantel-, Voll- oder Massivgeschoss, Zerlegungsgeschoss)\n-Jagdart (Einzelansitz oder Drückjagd)", "label": "3"}, {"num": 4, "type": "open", "q": "Was bezeichnet man als erlegtes Wild? Was ist Fallwild? Was ist Unfallwild?", "a": "Erlegtes Wild ist Wild, das nach jagdrechtlichen Vorschriften getötet wurde.\nAls Fallwild bezeichnet man Wild, das durch Alter, Krankheit, Hunger oder Kälte zu Tode gekommen ist (also nicht durch Schuss oder eine andere äußere Gewalteinwirkung).\nUnfallwild gilt nicht als erlegt, sondern als Unfallopfer (KFZ oder Bahn). Muss ein Fangschuss gesetzt werden, geschieht das aus Tierschutzgründen.", "label": "4"}, {"num": 5, "type": "open", "q": "Was ist ein Weidwundschuss und wie wirkt sich dieser auf die Wildbretqualität aus?", "a": "Ein Weidwundschuss bedeutet das Antragen des Schusses auf die Gescheidekammer des Wildes. Hierbei wird das Gescheide verletzt, sodass Gescheideinhalt mit den darin enthaltenen Bakterien des Verdauungstrakts das Wildbret massiv verunreinigt. Als Folge setzt unmittelbar Fäulnis als Prozess des Verderbs unter optimalen Lebens- und Vermehrungsbedingungen für die Bakterien ein, es kommt rasch zu Tiefenfäulnis und damit zur vollständigen Entwertung des Wildbrets für den menschlichen Verzehr.", "label": "5"}, {"num": 6, "type": "open", "q": "Beschreiben Sie das Aufbrechen eines Stück Rehwildes!", "a": "Träger vom Unterkiefer bis zum Brustbein aufschärfen – Drossel oberhalb des Kehlkopfes abschärfen – Verknoten der Speiseröhre – (beim Rehbock Pinsel umschärfen und nach hinten wegziehen, nicht abschärfen) – zwischen den Keulen auftrennen und Schloss öffnen – Bauch- und Brusthöhle komplett öffnen, dabei Messer zwischen den Fingern führen und sämtliche Innereien herausnehmen – Pinsel abschärfen – Brandadern öffnen und das Stück so bald wie möglich zum Ausschweißen aufhängen.", "label": "6"}, {"num": 7, "type": "open", "q": "Welche Faktoren sind unbedingt zu beachten, wenn Sie ein Stück Wild aufbrechen? Nennen Sie vier.", "a": "-Unverzüglich\n-Sauberer Untergrund, Haupt ggf. höher gelagert oder im Hängen aufbrechen\n-Sehr gute Lichtverhältnisse\n-Arbeitsgeräte: ausreichende Anzahl, intakt, sauber, einfach zu reinigen und zu desinfizieren\n-Hygienisch gelagert vor und während des Aufbrechens\n-Wasser in Trinkwasserqualität verwenden\n-Grundsätzlich auf Arbeitssicherheit achten\n-Großzügiges Ausschärfen von Ein- und Ausschuss sowie verunreinigter Muskelpartien,\n-Innenliegendes Fett und Flomen (Feist und Weißes) sollten grundsätzlich entfernt werden", "label": "7"}, {"num": 8, "type": "open", "q": "Was ist nach Erlegung eines Hasen zu tun?", "a": "Ausdrücken der Harnblase, danach ausweiden.", "label": "8"}, {"num": 9, "type": "open", "q": "In welchem Zeitraum soll man ein Stück Schalenwild nach der Erlegung aufbrechen und warum?", "a": "Sobald wie möglich ohne schuldhafte Verzögerung nach der Erlegung, spätestens innerhalb von max. 2 Stunden auch in Abhängigkeit von den Umgebungsverhältnissen (Licht, Außentemperatur, Witterung) weil dann die Magen-Darm-Schranke bricht und das Wildbret mit Bakterien aus dem Gescheide überschwemmt wird. Ab diesem Zeitpunkt beginnt der Verderb durch Fäulnis", "label": "9"}, {"num": 10, "type": "open", "q": "An welchem Organ und an welcher Stelle ist die Gallenblase zu finden und welche Wildarten des jagdbaren Wildes haben keine Gallenblase?", "a": "Die Gallenblase liegt an der Unterseite der Leber.\nKeine Gallenblase besitzen Cerviden (Geweihträger) und Tauben.", "label": "10"}, {"num": 11, "type": "open", "q": "Was versteht man unter dem Begriff „Zerwirken“?", "a": "Das Zerlegen des Wildkörpers in seine Einzelteile.", "label": "11"}, {"num": 12, "type": "open", "q": "Was sind die Brandadern? Wo verlaufen sie? Was ist nach dem Aufbrechen zu beachten, damit das Stück gut ausschweißen kann?", "a": "Große Blutgefäße, die von der Unterseite des Rückens zu den Keulen verlaufen. Sie müssen längs aufgeschärft werden, damit das Stück gut ausschweißen kann.", "label": "12"}, {"num": 13, "type": "open", "q": "Was verstehen Sie unter einem Kammerschuss?", "a": "Schuss in den Brustraum. Der Kammerschuss wird auch Blattschuss genannt. Erreicht wird die Zerstörung von Lunge und Herz und somit ein schnelles Ausschweißen sowie ein weid- und tierschutzgerechtes Töten des Wildes.", "label": "13"}, {"num": 14, "type": "open", "q": "Welche Organe bezeichnet der Jäger als „Kleines Gescheide“, welche als „Großes Gescheide“?", "a": "Wie bezeichnet man das große Gescheide für die Wildart Schwarzwild in der Weidmannssprache?\nKleines Gescheide: Dick- und Dünndarm\nGroßes Gescheide: der Magen/die Mägen\nDas große Gescheide des Schwarzwildes bezeichnet man als Weidsack", "label": "14"}, {"num": 15, "type": "open", "q": "Welche Teile des Aufbruchs des Schalenwildes gehören zum „kleinen Jägerrecht“? Wem steht dieses zu?", "a": "Alle essbaren inneren Organe (Lecker, Lunge, Herz, Leber, Milz und Nieren).\nDemjenigen, der das Stück aufgebrochen hat.", "label": "15"}, {"num": 16, "type": "open", "q": "Erklären Sie kurz das große Gescheide bei den Wildwiederkäuern in der anatomisch richtigen Reihenfolge. Welche funktionellen Besonderheiten finden sich bei den Wildwiederkäuern?", "a": "Das große Gescheide der Wildwiederkäuer besteht aus drei Vormägen – Pansen, Netzmagen und Blättermagen – sowie dem Labmagen. In den Vormägen findet eine mikrobielle Verdauung der Äsung überwiegend durch Bakterien statt. Des Weiteren wird unzureichend zerkleinerte Äsung zum Wiederkauen zurück in den Äser befördert.", "label": "16"}, {"num": 17, "type": "open", "q": "Was verstehen Sie unter Lüften und wozu dient es?", "a": "Aufschärfen der Bauchdecke und ggf. Auslagern der inneren Organe, wenn kurzfristig Zeit zum Aufbrechen fehlt, z.B. während einer „Aufbrechpause“ bei einer Drückjagd, oder Einschärfen zwischen den Schulterblättern und dem Brustkorb. Dient dem besseren und schnelleren Auskühlen des Wildkörpers. Zu beachten ist, dass beim Lüften der Blätter durch das Durchtrennen der Schwarte/der Decke Schmutz von außen an das Wildbret gelangt.", "label": "17"}, {"num": 18, "type": "open", "q": "Die inneren Organe des Schalenwildes sind durch das Zwerchfell getrennt. Welche Organe befinden sich in der Kammer (Brusthöhle) vor dem Zwerchfell?", "a": "Herz und Lunge", "label": "18"}, {"num": 19, "type": "open", "q": "Besitzt das Federwild ein Zwerchfell? Welche Funktion erfüllt das Zwerchfell?", "a": "Nein, ein Zwerchfell gibt es nur beim Haarwild.\nDas Zwerchfell unterstützt die Atmung (größter Atemmuskel).", "label": "19"}, {"num": 20, "type": "open", "q": "Weshalb wird erlegtes Wild auf dem Wildwagen nebeneinandergelegt oder aufgehängt und nicht übereinandergelegt?", "a": "Damit die Stücke schneller auskühlen und nicht verhitzen. Des Weiteren wird einer Verschmutzung der eröffneten Wildkörper vorgebeugt.", "label": "20"}, {"num": 21, "type": "open", "q": "Welche Organe gehören zum Geräusch?", "a": "Lunge, Herz, Nieren, Leber", "label": "21"}, {"num": 22, "type": "open", "q": "Wie tötet man noch nicht verendetes Flugwild weidgerecht?", "a": "Durch einen Schlag auf den Kopf zum Betäuben und sofort im Anschluss Genickbruch oder Durchtrennen des Halses mit den dort verlaufenden großen Blutgefäßen.", "label": "22"}, {"num": 23, "type": "open", "q": "Was versteht man unter der Lebendbeschau und unter der Totbeschau? Wann macht der Jäger diese?", "a": "Unter der Lebend- und der Totbeschau versteht man die Untersuchung des Wildes auf bedenkliche Merkmale/sinnfällige Veränderungen. Sie wird vom Jäger als kundige Person bei jedem Teilschritt der Gewinnung von Wildbret durchgeführt.\nDie Lebendbeschau auf äußere bedenkliche Merkmale wird beim Ansprechen des Wildes vor dem Schuss durchgeführt.\nDie Totbeschau wird am erlegten Stück zunächst auf äußere und, mit dem Aufbrechen (Versorgen), auf innere bedenkliche Merkmale des Wildkörpers und des gesamten Aufbruchs/der Organe (Nachversorgen) durchgeführt.\nAuch beim Abschwarten/aus der Decke Schlagen und Zerwirken ist stets auf bedenkliche Merkmale zu achten.", "label": "23"}, {"num": 24, "type": "open", "q": "Wie trägt man Haarniederwild?", "a": "An den Hinterläufen, luftig außen am Rucksack oder an der Jagdtasche.", "label": "24"}, {"num": 25, "type": "open", "q": "Wie wird Federwild getragen?", "a": "Hängend, am Kopf oder am Hühnergalgen.", "label": "25"}, {"num": 26, "type": "open", "q": "Was versteht man unter „Aufbruch“?", "a": "Alle inneren Organe eines Stückes.", "label": "26"}, {"num": 27, "type": "open", "q": "Was versteht man unter „bedenklichen Merkmalen“? Wie werden sie eingeteilt?", "a": "Alle erkennbaren krankhaften Veränderungen an einem Stück Wild. Es gibt sowohl äußere als auch innere bedenkliche Merkmale.", "label": "27"}, {"num": 28, "type": "open", "q": "Nennen Sie sechs äußerlich erkennbare bedenkliche Merkmale!", "a": "-Ganganomalien\n-Orientierungslosigkeit, Blindheit\n-Verklebte Körperöffnungen wie z.B. bei Augenentzündungen, vermehrtem Speichelfluss oder Durchfall\n-Abmagerung\n-Unnatürliche Lautäußerungen, z.B. Klagen, Röcheln/Atemnot, Husten, heisere Lautäußerungen\n-Unnatürliches Verhalten wie z.B. Verlust der natürlichen Scheu, Teilnahmslosigkeit, Appetitlosigkeit, vermehrtes Schöpfen oder Scheu vor Wasser, Übererregbarkeit, gesteigerte Aggressivität, selbstzerstörerisches Verhalten usw.\n-Alle Verletzungen, die nicht direkt mit der Erlegung in Zusammenhang stehen, z.B. offene Knochenbrüche\n-Unnatürliche Körperhaltung/Körperproportionen\n-Veränderungen an Haar- bzw. Federkleid\n-Umfangsvermehrungen der Gelenke und der Brunftkugeln\n-Sonstige erhebliche sinnfällige Veränderungen außer Schussverletzungen", "label": "28"}, {"num": 29, "type": "open", "q": "Nennen Sie sechs innerlich erkennbare, bedenkliche Merkmale!", "a": "-Abweichung der Organe und der Muskulatur in Farbe, Form, Konsistenz, Größe, Oberfläche und Geruch\n-Hodenvereiterung, Hodenschwellung\n-Stickige Reifung (verhitztes Wild) oder Fäulnis des Wildbrets bzw. der Organe\n-Erhebliche Gasbildung mit Verfärbung der inneren Organe\n-Graugelbe Herde in Organen, andere Zubildungen/Geschwülste/Wucherungen\n-Finnen\n-(Ein-)Blutungen (Organe, Bauch- und Brustfell, Körperhöhlen, Schleimhäute)\n-Veränderte (geschwollene, eitrige, blutige, verfärbte) Lymphknoten\n-Schwellungen von Gelenken\n-Eiter-frei oder in Abszessen\n-Fremdkörper\n-Verklebungen und/oder Verwachsungen von Organen\n-Freie Flüssigkeit in Körperhöhlen\n-Sonstige erhebliche sinnfällige Veränderungen außer Schussverletzungen", "label": "29"}, {"num": 30, "type": "open", "q": "Was muss beim Auftreten von bedenklichen Merkmalen geschehen?", "a": "Das Stück (mit Haupt und Aufbruch) muss, sofern es als Lebensmittel verwertet werden soll, zur amtlichen Fleischuntersuchung beim zuständigen amtlichen Tierarzt angemeldet werden. Ansonsten sachgerechte Entsorgung über die Tierkörperbeseitigungsanlage. Bei Verdacht auf eine anzeigepflichtige Wildseuche ist unverzüglich das Veterinäramt zu verständigen und entscheidet über das weitere Vorgehen.", "label": "30"}, {"num": 31, "type": "open", "q": "Welche Möglichkeiten hat der Jäger, Wildkörper/Aufbrüche rechtlich einwandfrei unschädlich zu beseitigen? Erläutern Sie diese kurz.", "a": "-Eingraben im Revier: mit mindestens 50 cm Erde überdecken zum Schutz vor Ausgraben durch Raubwild mit Löschkalk o.ä. bestreuen, zur Desinfektion und zum Vergrämen von Raubwild\n-Nicht im Wasserschutzgebiet, Trinkwassereinzugsgebiet oder unter Beeinträchtigung des Grundwassers\n-Nicht an öffentlichen Wegen und Plätzen\n-Nicht dort, wo allgemein durch das Eingraben der Abfälle die öffentliche Sicherheit und Ordnung gefährdet werden kann\n-Abgabe in der Tierkörperbeseitigungsanlage, ist seuchenhygienisch die beste Möglichkeit", "label": "31"}, {"num": 32, "type": "open", "q": "Was versteht man unter „Verhitzen“ und welches sind die erkennbaren sensorischen Veränderungen/Merkmale?", "a": "Einen ungewollten Zersetzungsprozess des Fleisches meist im noch warmen Wildkörper. Aus den Zuckern, die als Energievorrat in der Muskulatur vorhanden sind, entstehen durch mangelhafte Auskühlung des Wildkörpers Buttersäure und weitere Zersetzungsprodukte. Das Wildbret wird brüchig und teigig, kupferrot verfärbt, erhält eine schmierige Oberfläche und riecht übel-stechend.", "label": "32"}, {"num": 33, "type": "open", "q": "Wodurch wird die stickige Reifung hervorgerufen und ist verhitztes Wild genusstauglich?", "a": "Durch mangelndes Auskühlen des Wildkörpers. Verhitztes Wildbret ist nicht genusstauglich.", "label": "33"}, {"num": 34, "type": "open", "q": "Welche Wildart verhitzt besonders schnell und weshalb?", "a": "Schwarzwild, weil die Wärmeisolation der Feistschicht das Auskühlen verlangsamt.", "label": "34"}, {"num": 35, "type": "open", "q": "In welche Teile wird Schalenwild zerwirkt?", "a": "Blätter, Keulen, Rücken, Rippen mit Bauchlappen, Träger (Nacken)", "label": "35"}, {"num": 36, "type": "open", "q": "Was ist eine Wildmarke und wo wird sie angebracht?", "a": "Eine Kennzeichnung (Plastikmarke) des Wildkörpers. Die Marke ist ein Herkunfts- und Identitätsnachweis und wird bei verwertbaren Stücken am Rippenbogen, bei nicht verwertbaren Stücken am Ohr (Teller/Lauscher) angebracht.", "label": "36"}, {"num": 37, "type": "open", "q": "Für welche Wildarten wird in Mecklenburg-Vorpommern eine Wildmarke verwendet?", "a": "Für alle Schalenwildarten. Sofern eine amtliche Untersuchung (amtliche Fleischuntersuchung und/oder amtliche Trichinenuntersuchung bei Dachs und Waschbär, wenn sie für den menschlichen Verzehr vorgesehen sind) erforderlich ist, ist nach nationalem Lebensmittelrecht jedes betreffende Stück mit einer Wildmarke zu kennzeichnen.", "label": "37"}, {"num": 38, "type": "open", "q": "Beschreiben Sie einen Wildursprungsschein!", "a": "Ein Dokument, auf dem wichtige Angaben zum erlegten Wild vermerkt werden (Herkunft, Erlegungsdatum, geschätztes Alter, Geschlecht, Gewicht, Erleger, beobachtete gesundheitlich bedenkliche Merkmale und Umweltkontaminanten, Wildbretgüteklasse, Nachsuche, ggf. Anmeldung zur Trichinenuntersuchung und Ergebnis der Trichinenuntersuchung).", "label": "38"}, {"num": 39, "type": "open", "q": "Was versteht der Gesetzgeber unter Großwild und Kleinwild?", "a": "Großwild sind alle Landsäugetiere, die nicht zum Kleinwild zählen. Kleinwild sind Hasentiere und Federwild.", "label": "39"}, {"num": 40, "type": "open", "q": "Auf jeweils welche Temperatur müssen Großwild, Kleinwild und Aufbruch/Innereien gekühlt werden und warum?", "a": "Großwild auf max. +7°C, Wachstum der meisten Bakterien gehemmt.\nKleinwild auf max. +4°C, Schrotschuss schafft viele kleine tiefe Wunden im Wildbret, damit erhöhte Verderbanfälligkeit durch Fäulnis.\nAufbruch/Innereien +3°C, da durch ihre Struktur sehr verderbanfällig, Hemmung spezieller kältetoleranter Bakterien.", "label": "40"}, {"num": 41, "type": "open", "q": "Warum soll mit Schrot geschossenes Wild nicht länger als 24 Stunden abhängen?", "a": "Weil durch die vielen eingedrungenen Schrote Schmutz (mit Bakterien) von außen ins Stück transportiert wurde, und es dadurch zum früheren Verderben neigt (deshalb auch niedrigere Temperaturen beim Abhängen notwendig).", "label": "41"}, {"num": 42, "type": "open", "q": "Womit muss eine Wildkammer ausgestattet sein und wozu dient sie?", "a": "Mit fließend warmem und kaltem Wasser, Abfluss, abwaschbaren Oberflächen (Wände, Decke, Fußboden), Aufhängevorrichtungen inklusive Winde, mit Waage, sehr gute Beleuchtung, Schutz vor Ungeziefer, Kühlmöglichkeit für berührungsloses Hängen der Wildkörper (Kühlzelle bzw. Wildkühlschrank) sowie rostfreien Tischen und Geräten. Sie dient zur Be- und Verarbeitung des Wildes.", "label": "42"}, {"num": 43, "type": "open", "q": "Wie muss eine Kühlzelle ausgestattet sein und wozu dient sie?", "a": "Mit Kühlaggregat, abwaschbaren Oberflächen (Wände, Decke und Fußboden) und Aufhängevorrichtungen. Sie dient zur Aufbewahrung (abhängen lassen) und zum Auskühlen des Wildes.", "label": "43"}, {"num": 44, "type": "open", "q": "Woran erkennt der Jäger, dass die Totenstarre bei einem erlegten Stück eingesetzt hat und an welchem Körperteil äußerlich feststellbar beginnt sie?", "a": "Der Tierkörper wird komplett steif beginnend am Haupt.", "label": "44"}, {"num": 45, "type": "open", "q": "Welches sind die Ziele/Vorteile einer vollständig abgeschlossenen Fleischreifung? Nennen Sie Vorteile.", "a": "Ein artspezifischer Geschmack, zartes und saftiges Wildbret, Schutz vor Verderb durch Absenken des pH-Wertes damit längere Haltbarkeit.", "label": "45"}, {"num": 46, "type": "open", "q": "Wie lange lässt man Schalenwild abhängen und wovon ist dies abhängig?", "a": "Zwei bis fünf Tage, je nach Gewicht und Alter der Stücke, starke Stücke z.B. Rotwild bei sachgemäßer Handhabung bis zu zehn Tage.", "label": "46"}, {"num": 47, "type": "open", "q": "Wie macht man Schwarten, Decken und Bälge haltbar, bis sie zum Gerben gebracht werden?", "a": "Möglichst Einfrieren oder: Bälge kann man auf ein Spannbrett ziehen und trocknen, Schwarten werden eingesalzen, Decken werden gespannt und getrocknet.", "label": "47"}, {"num": 48, "type": "open", "q": "Was versteht man beim Wild unter einem „Primärerzeugnis“?", "a": "Erlegtes Wild in Decke, Schwarte oder Federkleid aufgebrochen bzw. ausgeweidet.", "label": "48"}, {"num": 49, "type": "open", "q": "Welche rechtliche Stellung hat der Jäger nach dem Lebensmittelrecht?", "a": "Der Jäger ist Lebensmittelunternehmer und somit für das Lebensmittel, welches er in den Verkehr bringt, haftbar.", "label": "49"}, {"num": 50, "type": "open", "q": "Wer führt die Lebendbeschau und die Totbeschau am Wild durch?", "a": "Der Jäger als kundige oder auch geschulte Person.", "label": "50"}, {"num": 51, "type": "open", "q": "Darf man Wild im Haar- oder Federkleid einfrieren, wenn es für den menschlichen Genuss vorgesehen ist? Begründen Sie.", "a": "Nein, da dies unhygienisch ist. Ahndung als Ordnungswidrigkeit nach nationalem Lebensmittelrecht.", "label": "51"}, {"num": 52, "type": "open", "q": "Ist das Aushakeln des Federwildes noch erlaubt? Begründen Sie!", "a": "Nein, wegen unhygienischer Folgen für das Wildbret (es führt zum Austritt von Darminhalt, weil der Darm vom Magen abreißt).", "label": "52"}, {"num": 53, "type": "open", "q": "Welche Wildarten müssen, sofern sie vom Menschen verzehrt werden sollen, einer amtlichen Trichinenuntersuchung zugeführt werden?", "a": "Gemäß geltendem Lebensmittelrecht Schwarzwild und andere Tiere, die Träger von Trichinen sein können.\nDies sind alle Wildarten, welche Fleisch- oder Allesfresser sind (z.B. Schwarzwild, Dachse, Waschbären, Krähenvögel, auch Exoten wie Bären, Meeressäuger und Reptilien).", "label": "53"}, {"num": 54, "type": "open", "q": "Unter welchen Umständen schreibt der Gesetzgeber eine amtliche Fleischuntersuchung bei Wild vor?", "a": "Sobald ein gesundheitlich bedenkliches Merkmal vorliegt und das Stück dem menschlichen Verzehr zugeführt werden soll.", "label": "54"}, {"num": 55, "type": "open", "q": "Worauf muss beim Öffnen des Schlosses (Beckenknochen) geachtet werden?", "a": "Dass die darunter liegende Harnblase und der Weiddarm nicht verletzt werden.", "label": "55"}, {"num": 56, "type": "open", "q": "Was muss bei der Lagerung und Beförderung von unverpacktem und verpacktem Wildbret sowie Wild in der Decke bzw. im Federkleid beachtet werden?", "a": "Unverpacktes Wildbret muss getrennt von Wild in der Decke bzw. im Federkleid und von verpacktem Wildbret gelagert und befördert werden.", "label": "56"}, {"num": 57, "type": "open", "q": "Ein Reh kam mit Weidwundschuss zu Strecke. Panseninhalt ist in die Bauchhöhle ausgetreten. Muss das Reh zur amtlichen Fleischuntersuchung angemeldet werden?", "a": "Prinzipiell nein, wenn das Versorgen sobald wie möglich nach dem Erlegen erfolgt, verschmutzte Partien des Wildkörpers (Ein- bzw. Ausschuß) sauber und vollständig weiträumig ausgeschärft wurden und ggf. die Bauchhöhle mit Trinkwasser ausgespült wurde. Liegen aber bereits Verfärbungen des Bauchfells, Geruchsabweichungen und/oder andere bedenkliche Merkmale vor, muss die amtliche Fleischuntersuchung eingeleitet werden.", "label": "57"}, {"num": 58, "type": "open", "q": "Ein Hirschkalb wird im letzten Büchsenlicht krank geschossen. Die Nachsuche am nächsten Morgen ergibt einen Blattschuss. Das Kalb ist lediglich 30 Meter geflüchtet und liegt stark aufgebläht im Gebüsch. Beim Aufbrechen des Stückes stellen Sie Verfärbungen der Leber und der Milz fest. Müssen Sie es bei geplanter Verwendung als Lebensmittel der amtlichen Fleischuntersuchung zuführen? Erläutern Sie.", "a": "Ja, weil mit der erheblichen Gasbildung in Verbindung mit Verfärbungen der inneren Organe ein gesundheitlich bedenkliches Merkmal vorliegt. Bei der langen Zeit, die das Stück unversorgt und ungekühlt gelegen hat, ist überdies von der Möglichkeit des Verderbs durch Verhitzen und fortgeschrittene Fäulnis des Wildkörpers auszugehen.", "label": "58"}, {"num": 59, "type": "open", "q": "Sie erlegen einen Frischling, der einen vereiterten Gebrechschuss aufweist. Was ist zu tun bei der geplanten Verwendung als Lebensmittel?", "a": "Anmeldung zur amtl. Fleischuntersuchung, es ist ein bedenkliches Merkmal.", "label": "59"}, {"num": 60, "type": "open", "q": "Was ist die Fleischreifung? Welche Prozesse laufen dabei ab?", "a": "Die Fleischreifung ist ein natürlicher und erwünschter Zersetzungsprozess der Skelettmuskulatur und beginnt äußerlich erkennbar mit dem Eintritt der Totenstarre. Dabei führt zunächst der Abbau von Glykogen (Zucker, Energievorrat in den Muskelzellen) zu Milchsäure zu einer Säuerung, pH- Wert Senkung. Diese hemmt einerseits eine bakterielle Besiedelung und damit den Verderb durch Fäulnis und führt zum Eintritt der Totenstarre. Andererseits werden durch das saure Milieu Eiweiß auflösende Enzyme in den Zellen aktiviert, die für die Lösung der Totenstarre, zunehmende Zartheit des Fleisches und Aromabildung ausschlaggebend sind.", "label": "60"}, {"num": 61, "type": "open", "q": "Wo muss erlegtes Wild, das bedenkliche Merkmale aufweist und verwertet werden soll, zur amtlichen Fleischuntersuchung angemeldet werden?", "a": "Beim zuständigen amtlichen Tierarzt.", "label": "61"}, {"num": 62, "type": "open", "q": "Beschreiben Sie das Ausdrücken der Harnblase bei Kaninchen/Hasen!", "a": "Dem Kaninchen/Hasen wird mit der Hand auf der Bauchseite in Richtung Keulen mit leichtem Druck entlanggefahren und dabei die Harnblase entleert.", "label": "62"}, {"num": 63, "type": "open", "q": "Welche Teile des Wildes müssen bei der amtlichen Fleischuntersuchung vorgestellt werden?", "a": "Der Tierkörper inkl. Haupt und alle inneren Organe.", "label": "63"}, {"num": 64, "type": "open", "q": "Auf wessen Veranlassung muss die Untersuchung auf Trichinen durchgeführt werden? Ist die Verpflichtung der Veranlassung der Untersuchung übertragbar und wenn ja, auf wen?", "a": "Verantwortlich ist der Jagdausübungsberechtigte; es sei denn, der Abnehmer (Betrieb des Einzelhandels oder ein anderer Jäger) hat die Verpflichtung zur Veranlassung der Trichinenuntersuchung mit Unterschrift auf dem Wildursprungsschein übernommen.", "label": "64"}, {"num": 65, "type": "open", "q": "Darf ein Jäger einem Treiber (der keine kundige Person ist) ein unaufgebrochenes Stück Wild überlassen? Begründen Sie! Wie kann eine vorsätzliche Zuwiderhandlung geahndet werden?", "a": "Nein, da der Treiber keine Kenntnisse über gesundheitlich bedenkliche Merkmale besitzt. Der Vorgang wird als Straftat geahndet. Anders verhält es sich, wenn der Treiber auch Jäger und kundige Person ist.", "label": "65"}, {"num": 66, "type": "open", "q": "Welche Proben sind für die Trichinenuntersuchung vom Jäger zu entnehmen?", "a": "Gesamt 2 Proben von je. Mindestens 10 g (wallnussgroß) vom Zwerchfellpfeiler (Nierenzapfen) und von der Muskulatur des Vorderlaufes („Unterarm“), ersatzweise aus der Muskulatur des Zungengrundes, Nachprobe bei positivem Untersuchungsergebnis auf Trichinen 50 g.", "label": "66"}, {"num": 67, "type": "open", "q": "Was ist eine Kundige Person? Welche Vermarktungswege neben dem Eigenverzehr kann sie verfolgen?", "a": "Ein Jäger, der nach den Vorgaben des EU-Hygienepaketes aus dem Jahre 2004 im Rahmen der Ausbildung geschult wurde, erwirbt diese Qualifikation durch das Bestehen der Jagdprüfung. Ältere Jäger erwerben diese durch eine Nachschulung. Eine kundige Person erkennt bedenkliche Merkmale des Wildes vor und nach dem Schuss. Der Jäger ist berechtigt, neben dem Eigenbedarf Wild oder Wildfleisch in kleinen Mengen (Strecke eines Jagdtages) an Endverbraucher oder an örtliche Betriebe des Einzelhandels (z.B. Gastronomie) oder an Wildbearbeitungsbetriebe abzugeben.", "label": "67"}, {"num": 68, "type": "open", "q": "Was versteht man beim Wildhandel unter dem Begriff „örtliche Betriebe des Einzelhandels“?", "a": "Betriebe des Einzelhandels, die im Umkreis von nicht mehr als 100 Kilometern vom Wohnort des Jägers oder dem Erlegungsort des Wildes gelegen sind (z.B. Gaststätten, Restaurants, Fleischereien)", "label": "68"}, {"num": 69, "type": "open", "q": "Wann ist laut Gesetz das Zerlegen von Wild ausnahmsweise am Erlegungsort zulässig?", "a": "Das ist nur dann zulässig, wenn der Transport sonst nicht möglich ist (z.B. im Hochgebirge).", "label": "69"}, {"num": 70, "type": "open", "q": "Bei welchen Wildarten weist das Wildbret der männlichen Stücke in der Paarungszeit starken, artspezifischen Geschlechtsgeruch auf?", "a": "Rotwild, Damwild, Schwarzwild", "label": "70"}, {"num": 71, "type": "open", "q": "Wie wird Federwild nach dem Erlegen versorgt?", "a": "Fachgerechte Entfernung des Kropfes unmittelbar nach dem Erlegen und Entnahme der inneren Organe (nicht Aushakeln!) beginnend mit dem Umschärfen der Kloake.", "label": "71"}, {"num": 72, "type": "open", "q": "Darf ein Wildhandelsbetrieb, der Haarwild ganz oder zerwirkt an Gaststätten oder andere Betriebe liefert, dies ohne vorherige amtliche Fleischuntersuchung tun?", "a": "Nein, nur nach vorheriger amtlicher Fleischuntersuchung.", "label": "72"}, {"num": 73, "type": "open", "q": "Beschreiben Sie das Untersuchen einer Leber!", "a": "Besichtigung der Oberfläche (z.B. Verfärbungen, Schwellungen, Einschlüsse, herdförmige Veränderungen), dann Durchtasten des Organs (z. B. auf Knoten, verdickte Gallengänge), zuletzt Organ einschneiden/aufschärfen (ermöglicht die Sicht auf die Gallengänge, Leberegel?)", "label": "73"}, {"num": 74, "type": "open", "q": "Was darf mit dem Wild geschehen, solange das Ergebnis der amtlichen Fleischuntersuchung dem Antragsteller noch nicht bekannt ist? Wie wird eine Zuwiderhandlung geahndet?", "a": "Das Wild muss kühl und luftig aufbewahrt werden. Vor der Weiterbearbeitung muss das Untersuchungsergebnis vorliegen. Eine Zuwiderhandlung ist eine Straftat.", "label": "74"}, {"num": 75, "type": "open", "q": "Wie untersucht man die Lunge?", "a": "Besichtigung der Oberfläche auf Verfärbungen, entzündliche Veränderungen, dann Durchtasten der Lunge (z.B. auf Knoten), anschließend Eröffnen der Luftröhre und der großen Bronchien (u. a. Lungenwürmer, Fremdkörper wie Bestandteile der Äsung).", "label": "75"}, {"num": 76, "type": "open", "q": "Die Nachsuche auf ein Stück Rehwild war erst am nächsten Morgen möglich. In der Nacht hatte Raubwild das Stück bereits angeschnitten. Wie ist das Wildbret zu beurteilen?", "a": "Das Wildbret ist genussuntauglich.", "label": "76"}, {"num": 77, "type": "open", "q": "Darf ein Stück Schwarzwild abgeschwartet werden, sobald es in der Wildkammer hängt? Begründen Sie. Wie wird eine Zuwiderhandlung geahndet?", "a": "Nein, es muss erst das Ergebnis der Trichinenuntersuchung vorliegen. Bei Zuwiderhandlung ist es eine Straftat.", "label": "77"}, {"num": 78, "type": "open", "q": "Was ist beim Aufbrechen des Schwarzwildes bei der Entnahme der Leber zu beachten? Warum?", "a": "Schwarzwild hat eine Gallenblase. Es besteht die Gefahr, dass diese bei der Entnahme beschädigt wird und die extrem bitter schmeckende Gallenflüssigkeit Wildbret Partien kontaminiert. Betroffene Teile des Wildbrets sind genussuntauglich.", "label": "78"}, {"num": 79, "type": "open", "q": "Wie untersucht man das Gescheide beim Aufbrechen?", "a": "Besichtigung der Oberflächen (z.B. auf Veränderungen und Blutungen). Besonders intensiv müssen die Lymphknoten des Darmes angesehen werden (Vergrößerung, Blutungen). Gekröse und Netz sind auf Bandwurmfinnen anzusehen.", "label": "79"}, {"num": 80, "type": "open", "q": "Bei welcher zuständigen Stelle erfährt der Jäger, wo der nächste amtliche Tierarzt praktiziert?", "a": "Beim zuständigen Veterinäramt.", "label": "80"}, {"num": 81, "type": "open", "q": "Nennen Sie vier Gründe, warum Kenntnisse über Wildkrankheiten für den Jäger erforderlich sind!", "a": "Erhaltung gesunder Wildbestände, Schutz des Wildes vor Krankheiten, Schutz der Haustiere vor vom Wild ausgehenden Krankheiten, Erkennung und Bekämpfung von Zoonosen, Selbstschutz, Schutz der Endverbraucher", "label": "81"}, {"num": 82, "type": "open", "q": "Was haben Sie beim Herrichten der Trophäe eines Muffelwidders in Bezug auf dessen „Haltbarmachung“ besonders zu beachten?", "a": "Nach dem Abkochen ist die gallertartige Masse aus den Schläuchen zu entfernen und das obere Drittel der Stirnzapfen ist abzusägen.", "label": "82"}, {"num": 83, "type": "open", "q": "Nennen Sie fünf Erregergruppen von Wildtierkrankheiten.", "a": "Bakterien, Viren, Parasiten, Pilze, Prionen.", "label": "83"}, {"num": 84, "type": "open", "q": "Wie erkennt man den Befall mit Magen- und Darmwürmern am lebenden Stück?", "a": "Die befallenen Stücke haben meistens Durchfall und sind oft abgemagert.", "label": "84"}, {"num": 85, "type": "open", "q": "Nennen Sie vier Maßnahmen, mit denen der Jäger die Bekämpfung von Wildkrankheiten im Revier unterstützen kann (z.T. werden diese Maßnahmen behördlich angeordnet).", "a": "-Gewinnung von Untersuchungsmaterial (Organe, Blut),\n-Impfköder auslegen (z.B. Tollwut, Schweinepest),\n-Parasitenbekämpfung (über Fütterung),\n-Gezielter Abschuss kranker Stücke, zu hohe Wilddichten minimieren,\n-Meldung seuchenverdächtigen Wildes,\n-Keine Gesellschaftsjagden in Sperrbezirken (z.B. Schweinepest),\n-Jagdhunde impfen (z.B. gegen Tollwut)", "label": "85"}, {"num": 86, "type": "open", "q": "Was verstehen Sie unter einer Wildseuche und nennen Sie Beispiele!", "a": "Eine sich schnell ausbreitende Infektionskrankheit, die massenhaft beim Wild auftreten und wirtschaftliche, gesellschaftliche und/oder gesundheitliche Krisen hervorrufen kann, z. B. Europäische Schweinepest (ESP), Afrikanische Schweinepest (ASP), Vogelgrippe/Geflügelpest.", "label": "86"}, {"num": 87, "type": "open", "q": "Was verstehen Sie unter einer Zoonose?", "a": "Krankheiten bzw. Parasiten, die vom Tier auf den Menschen übertragen werden bzw. umgekehrt.", "label": "87"}, {"num": 88, "type": "open", "q": "Nennen Sie vier Beispiele für Zoonosen!", "a": "Tollwut, Geflügelpest, FSME, Hepatitis E, Newcastle Disease, Pseudotuberkulose/Nagerseuche, Tularämie/Nagerpest, Brucellose, Botulismus, Salmonellose, Tuberkulose, Borreliose, Milzbrand, Ornithose, Listeriose, Q-Fieber, Rotlauf, Pasteurellose, Leptospirose, Staphylokokkose, Kleiner Fuchsbandwurm, Trichinellen, Duncker’scher Muskelegel, einige Sarcosporidien, verschiedene Band- und Rundwürmer, Hautpilze, systemische Pilzkrankheiten", "label": "88"}, {"num": 89, "type": "open", "q": "Welche Möglichkeiten der Ansteckung gibt es für den Menschen beim Umgang mit Wild? Nennen Sie vier Möglichkeiten!", "a": "Durch Berührung, Biss, Kratzer, Kot (Bandwürmer), durch Einatmen, beim Aufbrechen und Zerwirken, bei der Zubereitung und dem Verzehr von Wildbret, beim Präparieren", "label": "89"}, {"num": 90, "type": "open", "q": "Nennen Sie vier Wildkrankheiten die anzeigepflichtig sind!", "a": "Tollwut, Europäische Schweinepest, Afrikanische Schweinepest, Vogelgrippe/Geflügelpest, Blauzungenkrankheit, Maul- und Klauenseuche (MKS), Aujeszkysche Krankheit (Pseudowut), Brucellose, Milzbrand, Tuberkulose, Chronische Auszehrkrankheit der Hirsche", "label": "90"}, {"num": 91, "type": "open", "q": "Was verstehen Sie unter der Inkubationszeit?", "a": "Die Zeit zwischen der Ansteckung und ersten Krankheitserscheinungen.", "label": "91"}, {"num": 92, "type": "open", "q": "Nennen Sie vier Parasiten des Schalenwildes!", "a": "Trichinellen, Duncker‘scher Muskelegel, Sarcosporidien, Leberegel, Milben, Lungenwürmer, Magen- und Darmwürmer, Bandwürmer/Finnen, Zecken, Flöhe, Hirschlausfliegen, Stechmücken, Rachenbremsen- und Dassellarven", "label": "92"}, {"num": 93, "type": "open", "q": "Nennen Sie vier häufige, durch Viren hervorgerufene Krankheiten sowie die Wildarten, bei denen sie häufig vorkommen!", "a": "Tollwut (Raubwild, Schalenwild), Europäische Schweinepest und Afrikanische Schweinepest (Wildschwein), Myxomatose (Kaninchen), EBHS (Feldhase), RHD (Kaninchen), Geflügelpest (Federwild), Maul- und Klauenseuche (Schalenwild), Aujeszkysche Krankheit (Schwarzwild), Blauzungenkrankheit (Wildwiederkäuer)", "label": "93"}, {"num": 94, "type": "open", "q": "Nennen Sie vier häufige, durch Bakterien hervorgerufene Krankheiten sowie die Wildarten, bei denen sie vorkommen!", "a": "Strahlenpilzerkrankung (Rehwild, andere Cerviden), Moderhinke (Muffelwild), Pseudotuberkulose/Nagerseuche (Hasenartige), Tularämie/Nagerpest (Hasenartige), Staphylokokkose (Hasenartige), Brucellose (Schwarzwild und Hasen), Botulismus (Wasserflugwild), andere Clostridiosen (bes. Wildwiederkäuer), Borreliose (Wildsäuger), Salmonellose (Federwild (Tauben!), Schwarzwild, alle), Gamsblindheit (Gamswild u.a. Wildwiederkäuer), Tuberkulose (Rotwild), Pasteurellose/ Wild- und Rinderseuche (Damwild u.a.), Ornithose (Federwild), Leptospirose (Hasenartige, Bisam u.a. Nager, Federwild, Schalenwild, Raubwild, Hund!), Listeriose (Muffel-, Rehwild u.a.), Paratuberkulose (Wildwiederkäuer), Rotlauf (Hasenartige, Füchse, Reh-, Schwarz-, Federwild (Tauben!) u.a.)", "label": "94"}, {"num": 95, "type": "open", "q": "Nennen Sie vier häufige Ektoparasiten!", "a": "Zecken, Grabmilben, Haarlinge, Federlinge, Läuse, Flöhe, Hirschlausfliegen, Hautdassellarven, Rachenbremsenlarven", "label": "95"}, {"num": 96, "type": "open", "q": "Welcher Erreger verursacht die Tollwut und welche Wildarten können sich mit diesem Erreger infizieren?", "a": "Das Tollwutvirus. Damit können sich alle Säugetiere, so auch der Mensch infizieren sowie Fledermäuse und im Einzelfall auch Vögel.", "label": "96"}, {"num": 97, "type": "open", "q": "Nennen Sie vier häufige Endoparasiten!", "a": "Große Lungenwürmer, Kleine Lungenwürmer, Trichinellen, Magen- und Darmwürmer, Bandwürmer, Kokzidien, Sarcosporidien, Großer Leberegel, Kleiner Leberegel, Duncker’scher Muskelegel, Kleiner Fuchsbandwurm, Rachendassellarven", "label": "97"}, {"num": 98, "type": "open", "q": "Welche Symptome zeigen sich bei Tollwut am lebenden Tier?", "a": "Tiere werden zutraulich oder aggressiv, Verlust der Scheu, Bewegungsstörungen, Lähmung der Kopf- und Atemmuskulatur, veränderte Stimme, Speichelfluss, Schluckbeschwerden, Wasserscheu, Beißwut, selbstzerstörerisches Verhalten wie Rehwild: Aufschlagen seines Hauptes, Fuchs: Aufnahme von Unrat, Tod durch Atemstillstand.", "label": "98"}, {"num": 99, "type": "open", "q": "Welche Maßnahmen ergreifen Sie bei Tollwutverdacht? Nennen Sie vier Maßnahmen!", "a": "Lebendes Wild erlegen, bei totem Wild (Fallwild) auf Kopf- und Hautverletzungen, sowie Speichelfluss achten. In beiden Fällen: Sicherstellung (Fernhalten von Menschen und Tieren), Veterinäramt informieren, Einwegschutzhandschuhe und auslaufsichere Verpackungen verwenden, um das Stück nach Anweisung des Veterinäramtes im Ganzen als Probe zur Untersuchung auf die Wildseuche einzusenden.", "label": "99"}, {"num": 100, "type": "open", "q": "Dürfen die Trophäen von seuchenverdächtigen Tieren vor Abschluss der Laboruntersuchung entfernt werden? Wo verbleiben diese?", "a": "Nein, die Trophäe muss am Stück verbleiben.", "label": "100"}, {"num": 101, "type": "open", "q": "Welche Erreger verursachen die Afrikanische und die Europäische Schweinepest und welche Wildart wird davon betroffen?", "a": "Beides sind Viren, betroffen sind Wildschweine (und Hausschweine).", "label": "101"}, {"num": 102, "type": "open", "q": "Nennen Sie vier Symptome, die sich bei Europäischer bzw. Afrikanischer Schweinepest am lebenden Stück zeigen!", "a": "Verlust der Scheu, Absonderung von der Rotte, Durchfall, Abgeschlagenheit, unkoordinierte Bewegungen, Nachhandschwäche (Hinterläufe), Fieber und Durst (verenden oft in oder am Wasser), Husten und Atemnot", "label": "102"}, {"num": 103, "type": "open", "q": "Welche typischen Anzeichen kann man bei Europäischer bzw. Afrikanischer Schweinepest am verendeten Stück finden?", "a": "Punktförmige Blutungen an Kehldeckel (Drosselknopf), in Nieren, Harnblasenschleimhaut, Magen- und Darmschleimhaut, Brust- und Bauchfell, massive Blutaustritte an der Milz, geschwollene, blutige Lymphknoten, Schaum in der Drossel (Lungenödem)", "label": "103"}, {"num": 104, "type": "open", "q": "Nennen Sie vier Maßnahmen der Bekämpfung der Europäischen und der Afrikanische Schweinepest!", "a": "Bekämpfung erfolgt ausschließlich nach Anweisung der zuständigen Behörde (Veterinäramt), z.B.:\nVerstärkter Abschuss (bes. Frischlinge), Auslage von Impfködern (nur bei Europäischer Schweinepest), unschädliche Fallwildbeseitigung, Reinigung und Desinfektion von Mensch, Hund, Kleidung und Ausrüstung nach Kontakt, kein Betreten von Hausschweinbeständen für mindestens 72 Stunden nach Kontakt, Auflagen bezüglich der Vermarktung von Schwarzwild und Schwarzwildprodukten beachten, keine Jagdreisen in betroffene Gebiete unternehmen, Untersuchung von erlegtem, Fall- und Unfallwild auf ASP und KSP nach Anweisung der Behörde in zuständigem Landeslabor.", "label": "104"}, {"num": 105, "type": "open", "q": "Nennen Sie typische Symptome der Myxomatose!", "a": "Schwellungen im Bereich der Seher (Löwenkopf), Löffel, Lippen und Geschlechtsorgane sowie Gesäuge, Entzündung der Seher, Fieber, Teilnahmslosigkeit, Inappetenz", "label": "105"}, {"num": 106, "type": "open", "q": "Welcher Erreger verursacht die Aujeszkysche Krankheit (Pseudowut) und bei welchen Wildarten kommt die Erkrankung vor?", "a": "Viruserkrankung bei Haus- und Wildschweinen, Raubwild, gelegentlich wiederkäuendes Schalenwild.", "label": "106"}, {"num": 107, "type": "open", "q": "Wie kann sich der Jäger vor einer Infektion mit dem Kleinen Fuchsbandwurm schützen? Nennen Sie vier Maßnahmen!", "a": "-Erlegte Füchse nur mit Schutzkleidung anfassen und transportieren (Handschuhe)\n-Beim Balgen Mund- und Nasenschutz verwenden\n-Noch sicherer ist das vorherige Tauchen der noch nicht abgebalgten Tiere in Wasser\n-Den Balg aufspannen und trocknen lassen (Eier des Fuchsbandwurmes vertragen Trockenheit schlecht)\n-Den Hund mindestens 4-mal pro Jahr mit Antiparasitikum vom Tierarzt entwurmen\n-Beeren, Pilze u.a. vor Verzehr waschen, noch sicherer ist Erhitzen\n-Einfrieren tötet die Eier des Kleinen Fuchsbandwurmes nicht ab", "label": "107"}, {"num": 108, "type": "open", "q": "Bei welchen Vogelarten tritt Botulismus hauptsächlich auf und zu welcher Jahreszeit?", "a": "Häufig bei Wasservögeln (z.B. Entenarten, Schwäne), im Sommer", "label": "108"}, {"num": 109, "type": "open", "q": "Mit welchen Krankheiten kann sich ein Hund insbesondere infizieren, wenn er rohes Fleisch oder Aufbruch von Schwarzwild oder Hausschweinen frisst?", "a": "Es besteht Ansteckungsgefahr mit der Aujeszkyschen Krankheit (Pseudowut) und Trichinellen.", "label": "109"}, {"num": 110, "type": "open", "q": "Nennen Sie durch Zecken auf den Menschen übertragbare Krankheiten", "a": "FSME/Frühsommer-Meningoenzephalitis (Gehirn- und Gehirnhautentzündung), Borreliose", "label": "110"}, {"num": 111, "type": "open", "q": "Wie kann sich ein Jäger vor einem Zeckenbefall schützen?", "a": "Geschlossene, lange Kleidung tragen, abweisende Chemikalien einsetzen, Absuchen des eigenen Körpers und ggf. des Jagdhundes", "label": "111"}, {"num": 112, "type": "open", "q": "Wo parasitieren Bandwürmer und wie schädigen sie ihren Wirt?", "a": "Im Darm, Nahrungsentzug, Darmwandschädigung, ggf. Darmverschluss", "label": "112"}, {"num": 113, "type": "open", "q": "Nennen Sie die Zwischenwirte des Kleinen Leberegels sowie des Großen Leberegels", "a": "Kleiner Leberegel: landlebende Gehäuseschnecken und Ameisen, Großer Leberegel: Zwergschlammschnecke", "label": "113"}, {"num": 114, "type": "open", "q": "Beschreiben Sie den Kreislauf des Kleinen Fuchsbandwurmes (Echinococcus multilocularis)!", "a": "Endwirte sind Füchse, Marderhunde, Hunde, seltener Katzen. Erwachsene Fuchsbandwürmer leben im Dünndarm des Raubwildes. Ausscheidung der mikroskopisch kleinen Eier mit dem abgeschnürten Endglied des Bandwurmes über den Kot dieser Tiere. Aufreißen der Hülle des Endglieds durch Eintrocknen, Verteilung der Eier durch Umwelteinflüsse (Witterung, Insekten etc.) in der Umgebung. Aufnahme der Eier durch Kleinsäuger (z.B. Mäuse) als Zwischenwirte. Im Darm der Kleinsäuger schlüpfen Larven, die über das Blut in die Leber gelangen und dort Finnen bilden. Dadurch Vergrößerung und tumoröse Zerstörung der Leber. Erkrankte und dadurch geschwächte Kleinsäuger werden von Endwirten gefressen, in deren Darmtrakt sich wieder Bandwürmer entwickeln.", "label": "114"}, {"num": 115, "type": "open", "q": "Was wissen Sie über die Strahlenpilzerkrankung?", "a": "Erreger: Bakterien; Wildart: Rehwild; Entstehung: meist Einzeltiererkrankung, Eindringen der Bakterien in Wunden im Äser, (Zahnwechsel, Verletzungen durch spitze Äsung); bedenkliche Merkmale: i.d.R. Unterkieferknochen porös aufgetrieben, später Äsung erheblich erschwert bis unmöglich, daher Abmagerung, Ausgang tödlich, Verlauf über Monate/Jahre, Genusstauglichkeit: im früheren Krankheitsstadium gegeben, wenn keine anderen bedenklichen Merkmale (z.B. Abmagerung) vorliegen.", "label": "115"}, {"num": 116, "type": "open", "q": "In welchem Monat ist ein Befall mit Rachenbremsenlarven zu hören und bei welchen Wildarten tritt diese Erkrankung häufig auf?", "a": "Im Mai, beim Rehwild und Rotwild.", "label": "116"}, {"num": 117, "type": "open", "q": "Bei welchen Wildarten ist Brucellose von Bedeutung und welche Symptome kann man am erlegten/verendeten Tier finden?", "a": "Schwarzwild und Feldhasen, vergrößerte und eitrige Hoden, Abszesse an den weiblichen inneren Geschlechtsorganen", "label": "117"}, {"num": 118, "type": "open", "q": "Nennen Sie vier bei Feldhasen und/oder bei Wildkaninchen auftretende Erkrankungen!", "a": "Welche davon sind Zoonosen?\nKokzidiose, Myxomatose, EBHS/RHD;\nZoonosen: Brucellose, Pasteurellose/Hasenseuche, Pseudotuberkulose/Nagerseuche, Tularämie/Nagerpest, Staphylokokkose", "label": "118"}, {"num": 119, "type": "open", "q": "Wie erfolgt der Befall mit Rachenbremsenlarven?", "a": "In den Sommermonaten legt die hummelähnliche Fliege im Flug Larven in den Windfang – lebendgebärendes Insekt. Die Larven wandern sofort in die Nasennebenhöhlen und dann auch in den Rachenraum mit dem Ziel, dort geschützt zu überwintern und zu reifen.", "label": "119"}, {"num": 120, "type": "open", "q": "Welche Wildkrankheiten dezimieren regelmäßig die Fuchs- und Marderhundvorkommen?", "a": "Räude (Grabmilbe) und Staupe (Virus)", "label": "120"}, {"num": 121, "type": "open", "q": "Bei welcher Wildart tritt die Moderhinke bevorzugt auf und welche bedenklichen Merkmale zeigen sich bei dieser Erkrankung?", "a": "Wildart: Muffelwild; bedenkliche Merkmale: Erkrankung der Schalen, Lahmheiten, Äsen auf Vorderfußwurzelgelenken oder in Brust-Bauch-Lage, Schalen deformieren, werden weich, brüchig, fauliger Geruch, Abmagerung", "label": "121"}, {"num": 122, "type": "open", "q": "Wie erfolgt der Befall mit Hautdassellarven? Beurteilen Sie befallenes Wild hinsichtlich der Genusstauglichkeit.", "a": "Dasselfliegen legen Eier an den Haaren oder auf der Haut von Schalenwild im Bereich der Flanken oder der Hinterläufe ab (Mai bis August). Aus den Eiern schlüpfen nach ca. 4 Tagen Larven. Diese bohren sich durch die Haut, wandern in der Unterhaut bis in die Rückenregion, bohren ein Atemloch und bleiben dort bis zum nächsten Frühjahr. Genusstauglichkeit: wenige oder noch sehr kleine Larven, nur Decke betroffen –\nWildkörper tauglich. Bei hochgradigem Befall bzw. tiefere Gewebeschichten betroffen – amtliche Fleischuntersuchung bzw. Untauglichkeit.", "label": "122"}, {"num": 123, "type": "open", "q": "Nennen Sie vier mögliche Ursachen für Durchfall (verschmutzte Spiegel) bei den Wildarten!", "a": "Befall mit Magen-Darm-Würmern, Kokzidiose, Salmonellose, Rapsvergiftung beim Rehwild, Pansenazidose, Aufnahme verdorbener Äsung, Dysbakterie, Paratuberkulose, Schweinepest", "label": "123"}, {"num": 124, "type": "open", "q": "Wie äußert sich die Kokzidiose beim Hasen, um welchen Erreger handelt es sich und wann tritt die Erkrankung bevorzugt auf?", "a": "Kokzidien sind einzellige Parasiten (Endoparasiten), die überwiegend den Darm befallen. Feuchte Witterung fördert das Auftreten. Die befallenen Tiere magern ab, haben Durchfall und aufgeblähte Bäuche. Hauptsächlich verenden Jungtiere. Am erlegten Hasen fallen am Darm dicke gelbe Knoten auf.", "label": "124"}, {"num": 125, "type": "open", "q": "Wie hat sich der Jäger beim Auftreten anzeigepflichtiger Wildkrankheiten zu verhalten? Nennen Sie vier wesentliche Aspekte und Maßnahmen.", "a": "-Unverzügliche Anzeige des Verdachts beim Veterinäramt\n-Sicherstellung von Fallwild, erlegtem Wild, Aufbruch, und Untersuchungsmaterial nach Anweisung der zuständigen Behörde (Veterinäramt)\n-Dabei Einwegschutzhandschuhe sowie ggf. weitere Schutzausrüstung und auslaufsicheres Verpackungsmaterial verwenden\n-Jäger verfügt nicht über den Wildkörper – keine Entnahme von Trophäen o.ä.\n-Ggf. Fernhalten von Menschen und Tieren\n-Verschleppung vermeiden: gründliche Desinfektion und Reinigung aller kontaminierter Gegenstände, Wechsel von Schuhwerk und Kleidung, Duschen, auf keinen Fall Haustierbestände betreten oder bei leicht übertragbaren Seuchen Jagdreisen unternehmen\n-Weitere Anweisungen der Behörde befolgen (z. B. Allgemeinverfügungen hinsichtlich Jagdausübung, Vermarktung von Wild etc.) bzw. Mitwirkung bei Bekämpfung", "label": "125"}, {"num": 126, "type": "open", "q": "Welcher Innenparasit des Schwarzwildes ist für den Menschen besonders gefährlich und warum?", "a": "Die Trichine. Es ist eine Zoonose (Trichinellose).", "label": "126"}, {"num": 127, "type": "open", "q": "Was sind Trichinen und wie erfolgt die Ansteckung z.B. des Menschen?", "a": "Es sind Parasiten (Rundwürmer). Über die Nahrungsaufnahme trichinösen Fleisches von infizierten Haus-oder Wildschwein gelangen Larven in den menschlichen Darmtrakt, wo sie sich zu geschlechtsreifen Würmern entwickeln, die neue Larven produzieren (Darmphase), welche sich über Blut und Lymphbahnen im Körper verteilen und in die Skelettmuskulatur gelangen (Muskelphase).", "label": "127"}, {"num": 128, "type": "open", "q": "Welche Untersuchung muss bei Schwarzwild, Raubwild und Bären geschehen, bevor diese als Nahrungsmittel verwendet werden dürfen?", "a": "Die Stücke müssen vom amtlichen Tierarzt mit negativem Ergebnis auf Trichinen untersucht werden („trichinenfrei“).", "label": "128"}, {"num": 129, "type": "open", "q": "Was ist beim Umgang mit seuchenverdächtigem Wild zu beachten? Nennen Sie vier Maßnahmen!", "a": "Unverzügliche Anzeige beim Veterinäramt. Tierkörper bzw. das vom Amtstierarzt verlangte Untersuchungsmaterial so sicherstellen, dass keine Tiere und unbefugten Personen herankommen können. Wild nur mit Einweghandschuhen anfassen und auslaufsicher verpacken. Nach Kontakt gründliche Reinigung und Desinfektion von Kleidung und Gegenständen, um Verschleppung zu vermeiden.", "label": "129"}, {"num": 130, "type": "open", "q": "Sie sehen im Mai ein Stück Rehwild, das häufig hustet, niest und das Haupt schüttelt. Welche Erkrankung liegt höchstwahrscheinlich vor und ist dies ein Grund für einen Hegeabschuß?", "a": "Offensichtlich ein Befall mit Rachenbremsenlarven. Nein, es ist kein Grund.", "label": "130"}, {"num": 131, "type": "open", "q": "Was muss grundsätzlich beachtet werden, wenn Untersuchungsmaterial beim Veterinäramt/Landesuntersuchungsamt abgegeben wird?", "a": "Stabile, auslaufsichere Verpackung verwenden, gut lesbare Anschrift (Untersuchungsstelle), deutliche Aufschrift (z.B. „Untersuchungsmaterial“), Erleger und Telefonnummer (für Rückfragen), Erlegungs-\n/Fundort, Erlegungs-/Funddatum, Untersuchungsgrund (z.B. Verdacht auf Tollwut), beobachtete Krankheitserscheinungen auf Begleitschreiben beifügen.", "label": "131"}, {"num": 132, "type": "open", "q": "Wie infiziert sich das Wild mit Magen- und Darmwürmern?", "a": "Über die Aufnahme der Wurmeier mit der Äsung.", "label": "132"}, {"num": 133, "type": "open", "q": "Nennen Sie Gründe bzw. Ursachen, welche die Ausbreitung von Wildseuchen und Wildkrankheiten fördern und begünstigen!", "a": "Fallwild oder Aufbruch nicht oder nicht ordnungsgemäß entsorgt; Gesellschaftsjagd im Schweinepestsperrbezirk, zu hohe Wilddichten, ungünstige Witterung, unsachgemäße Kirrungen", "label": "133"}, {"num": 134, "type": "open", "q": "An welcher Körperstelle und in welchem Zeitfenster hat die Kennzeichnung des erlegten Wildes mit der Wildmarke zu erfolgen?", "a": "Am Rippenbogen, wenn zum Verzehr bestimmt; noch im Revier, am Teller oder Lauscher bei Verbringung in die Tierkörperbeseitigungsanstalt (untauglich)", "label": "134"}, {"num": 135, "type": "open", "q": "Nennen Sie vier Straftatbestände der Tier-LMHV (Tierische Lebensmittel-Hygieneverordnung) hinsichtlich des Gewinnens, der Be- oder Verarbeitung, des Transportes oder des Inverkehrbringens von Wild!", "a": "-Wild unaufgebrochen an Verbraucher abzugeben\n-Fallwild an Verbraucher abzugeben\n-Unfallwild an Verbraucher abzugeben\n-Wild vor Abschluss der amtlichen Fleischuntersuchung oder der amtlichen Trichinenuntersuchung zu be-oder verarbeiten\n-Wildbret von hunde- oder katzenartigen als Lebensmittel in den Verkehr zu bringen", "label": "135"}, {"num": 136, "type": "open", "q": "Wie definiert der Gesetzgeber in der Tierischen Lebensmittelhygieneverordnung die Begriffe a) „kleine Menge erlegten Wildes“ und b) „Hasentiere“?", "a": "a) Strecke eines Jagdtages b) Hasen und Kaninchen", "label": "136"}, {"num": 137, "type": "open", "q": "Nennen Sie wesentliche Funktionen der Leber!", "a": "Gallenbildung, Speicher- und Stoffwechselorgan, Schadstofffilter", "label": "137"}, {"num": 138, "type": "open", "q": "Nennen Sie wesentliche Funktionen der Nieren!", "a": "Ausscheidungsorgan, Bildung des Harns, Regulation des Wasser- sowie des Säuren-Basenhaushaltes", "label": "138"}, {"num": 139, "type": "open", "q": "Nennen Sie wesentliche Funktionen der Milz!", "a": "Blutspeicherorgan, Immunabwehr", "label": "139"}, {"num": 140, "type": "open", "q": "Nennen Sie Ursachen für eine Verfärbung des Wildbrets oder der Organe!", "a": "Verhitzen, Weidwundschuss, austretende Gallenflüssigkeit, Krankheiten, Verwesung, Fäulnis", "label": "140"}, {"num": 141, "type": "open", "q": "Wo ist das Vergraben von Wildtierkörpern oder deren Teilen verboten?", "a": "In Trinkwasserschutz- und Einzugsgebieten und an öffentlichen Wegen und Plätzen.", "label": "141"}, {"num": 142, "type": "open", "q": "Wie kann der Jäger beim Auftreten der Europäischen bzw. der Afrikanischen Schweinepest die Seuche im Revier durch die Jagdausübung eindämmen und bekämpfen? Nennen Sie vier Maßnahmen!", "a": "- Alle Tätigkeiten in Sperrbezirken nur nach Anweisung der zuständigen Behörde (Veterinäramt)\n- Probenahme nach amtlicher Vorgabe\n- Keine Gesellschaftsjagden durchführen\n- Kirrungen beschicken, um Schwarzwild im Revier zu halten\n- Impfköder ausbringen (nur bei Europäischer Schweinepest möglich)\n- Fallwild entsorgen\n- Sichtbar kranke Stücke erlegen\n- Desinfektion und Reinigung von Kleidung, Ausrüstung, Auto, Jagdhund sowie eigener Person\n- Keine Hausschweinbestände betreten", "label": "142"}, {"num": 143, "type": "open", "q": "Nennen Sie Faktoren, die Einfluss auf die stickige Reifung (Verhitzen) haben!", "a": "Außentemperatur (warm, schwül), Zeit bis zum Aufbrechen, Lage und Umfang der Schussverletzung, Größe des Stückes, Temperatur der Kühleinrichtung. Verhitzen auch im Winter möglich (Winterdecke, Feist) beim Schwarzwild", "label": "143"}, {"num": 144, "type": "open", "q": "Nennen Sie vier Utensilien, die mit Bezug zur Wildbrethygiene in einen Jagdrucksack/zur Jagdausrüstung gehören!", "a": "Einweghandschuhe, Jagdmesser, Taschenlampe, Plastiktüten, Wildmarke, Bergehilfe, Trinkwasser", "label": "144"}, {"num": 145, "type": "open", "q": "Was ist beim Transport von Wild zu beachten? Nennen Sie vier erforderliche Maßnahmen.", "a": "Wild nicht übereinander stapeln, saubere Unterlage (Wildwanne), Wild nicht luftdicht abdecken, optimal ist der Transport der Wildkörper hängend und kontaktfrei/luftig, Schutz gegen Verschmutzung und direkte Sonneneinstrahlung", "label": "145"}, {"num": 146, "type": "open", "q": "Unter welchen Umständen bzw. Zuständen ist Wildbret als genussuntauglich zu beurteilen? Nennen Sie vier Umstände/Sachverhalte.", "a": "Wildbret von Fallwild und Unfallwild, Wildbret mit wesentlichen Veränderungen, Wildbret von Tieren mit Tierseuchen oder Trichinenbefall, verhitztes Wildbret, angeschnittenes Wild, starker Geschlechtsgeruch bzw.-geschmack", "label": "146"}, {"num": 147, "type": "open", "q": "Beschreiben Sie das Aussehen und die Farbe einer gesunden Leber eines Stückes Schwarzwild!", "a": "Die Leber ist rotbraun gefärbt, scharfrandig, hat eine glatte Oberfläche, eine Gallenblase auf der Unterseite und besteht aus vier Lappen.", "label": "147"}, {"num": 148, "type": "open", "q": "Welche persönliche Schutzausrüstung sollte man beim Streifen von Raubwild verwenden?", "a": "Einweghandschuhe und Mund-Nasenschutz tragen.", "label": "148"}, {"num": 149, "type": "open", "q": "Nennen Sie mögliche Gründe für eine Geruchsabweichung des Wildbrets!", "a": "Verhitztes Wild, Fäulnis, starker Geschlechtsgeruch (z.B. rauschiger Keiler oder brunftiger Hirsch), Verwesung, Weidwundschuss, Eiter, Kontamination, Krankheiten", "label": "149"}, {"num": 150, "type": "open", "q": "Ab welcher Be- bzw. Verarbeitungsstufe des Wildes besteht für den Jäger eine Registrierungspflicht bei dem zuständigen Veterinäramt hinsichtlich der Abgabe an Dritte?", "a": "Ab der Stufe 3, d.h. Abgabe des Wildes aus der Decke/Schwarte geschlagen ggf. zerwirkt an den Endverbraucher oder Betriebe des Einzelhandels sowie Abgabe an Wildhändler/Wildbearbeitungsbetriebe.", "label": "150"}, {"num": 151, "type": "open", "q": "Nennen Sie wichtige Bekämpfungsmaßnahmen gegen die Tollwut!", "a": "Intensive Fuchsbejagung, Impfköder ausbringen, Beseitigung von Fallwild, Beprobung seuchenverdächtiger Stücke, Impfung der Jagdhunde", "label": "151"}, {"num": 152, "type": "open", "q": "Was wissen Sie über Tularämie (Nagerpest/Hasenpest)?", "a": "Die Krankheit wird durch Bakterien hervorgerufen. Infizierte Nagetiere sind als Reservoir anzusehen. Es erkranken vor allem Hasen und Wildkaninchen. Die Infektion erfolgt i. R. über infizierte Äsung und durch Kontakt. Anfangs fallen kleine weißliche Herde in der Leber auf. Im weiteren Verlauf bilden sich in allen Organen bis walnussgroße Abszesse, Leber und Milz sind geschwollen. Erkrankte Tiere sind geschwächt und meistens abgemagert. Die Tularämie ist eine Zoonose.\nBekämpfung: Abschuss erkrankter Hasenartiger, unschädliche Beseitigung der Tierkörper (Einweghandschuhe, auslaufsichere Verpackung!). Das Wildbret ist genussuntauglich.", "label": "152"}, {"num": 153, "type": "open", "q": "Was wissen Sie über Afrikanische Schweinepest?", "a": "Die Afrikanische Schweinepest (ASP) ist eine anzeigepflichtige Tierseuche, von der Haus- und Wildschweine betroffen sind. In Mitteleuropa erfolgt eine Übertragung durch direkten Kontakt mit infizierten Tieren (Sekrete, Blut, Sperma), die Aufnahme von Speiseabfällen oder Schweinefleischerzeugnissen bzw. - zubereitungen sowie andere indirekte Übertragungswege (Fahrzeuge, kontaminierte Ausrüstungsgegenstände einschl. Jagdausrüstung, landwirtschaftlich genutzte Geräte und Maschinen, Kleidung). Nach einer Infektion entwickeln die Tiere sehr schwere, aber unspezifische Allgemeinsymptome. Ein Impfstoff steht noch nicht zur Verfügung.", "label": "153"}, {"num": 154, "type": "open", "q": "Was ist (erworbene) Immunität?", "a": "Als erworbene Immunität bezeichnet man die erlernte Widerstandsfähigkeit des Körpers gegenüber artfremden Stoffen. Dabei sind Infektionserreger von besonderer Bedeutung. Ausgelöst durch eine Infektion bildet der Körper Schutzstoffe (Antikörper), die vor einer erneuten Erkrankung mit dem gleichen Erreger schützen. Diese Fähigkeit nutzt man bei Schutzimpfungen (Impfköder gegen Tollwut, Europäische Schweinepest).", "label": "154"}, {"num": 155, "type": "open", "q": "Nennen Sie vier belebte bzw. unbelebte Ursachen bzw. Faktoren von Wildtierkrankheiten!", "a": "-Infektionen mit Viren, Bakterien, Pilze, Parasiten; Prionen - belebte Ursachen\n-Verletzungen (Rangkämpfe, Verkehr, Jagd, Landwirtschaft, Raubwild)\n-Umweltkontaminationen/Vergiftungen (Radioaktivität, Blei, Pflanzenschutz-, Dünge- und Schädlingsbekämpfungsmittel)\n-Erbkrankheiten, Tumore und Missbildungen\n-Mangelerkrankungen\n-Klimatische Veränderungen (Kälte, Hitze, Trockenheit, Überflutungen, Staunässe, Brände)", "label": "155"}, {"num": 156, "type": "open", "q": "Was wissen Sie über die Blauzungenkrankheit?", "a": "Die Blauzungenkrankheit ist eine durch Viren verursachte Tierseuche der Wiederkäuer (Wild und Nutztier), die durch Gnitzen übertragen wird. Sie führt zu Entzündungen an Maul (Äser), Zunge (Lecker) und Geschlechtsorganen sowie zu Blasen an Zunge (Lecker), Maul (Äser) und Klauen (Schalen). Typisch ist die blaurote Färbung der Zunge. Das Wildbret ist genussuntauglich. Es besteht Anzeigepflicht.", "label": "156"}, {"num": 157, "type": "open", "q": "Nennen Sie vier auf Haus- und Nutztiere übertragbare Wildkrankheiten!", "a": "Brucellose, Botulismus, Leptospirose, Salmonellose, Tuberkulose, Europäische und Afrikanische Schweinepest, Vogelgrippe/ Geflügelpest, Aujeszkysche Krankheit, Myxomatose, RHD, Maul- und Klauenseuche, Tollwut, Befall mit Fuchsbandwurm, Magen-Darm-Würmern, Bandwürmern, Räude, Trichinellen u.v.m.", "label": "157"}, {"num": 158, "type": "mc", "q": "Wann beginnt die Wildbrethygiene?", "opts": [{"k": "a", "text": "Vor dem Schuss", "ok": true}, {"k": "b", "text": "Nach dem Schuss", "ok": false}, {"k": "c", "text": "Mit Ansetzen des ersten Schnittes", "ok": false}], "label": "158"}, {"num": 159, "type": "mc", "q": "Wie transportieren Sie erlegtes Schalenwild zur Kühlzelle?", "opts": [{"k": "a", "text": "Auf dem offenen Wildträger, der an der Anhängerkupplung des Jagdwagens befestigt ist", "ok": false}, {"k": "b", "text": "In offener, sauberer Wildwanne (Unterlage), nicht übereinandergestapelt, nicht abgedeckt, offene Fahrzeuge sollten mit Plane ausgerüstet sein", "ok": true}, {"k": "c", "text": "Es gibt keine Vorschriften", "ok": false}], "label": "159"}, {"num": 160, "type": "mc", "q": "Zur Verminderung der Restblutmenge sollen die Brandadern aufgeschärft werden. Sie verlaufen:", "opts": [{"k": "a", "text": "Am Brustbein", "ok": false}, {"k": "b", "text": "Im Trägerbereich", "ok": false}, {"k": "c", "text": "Vom Rücken in die Keulen", "ok": true}], "label": "160"}, {"num": 161, "type": "mc", "q": "Kommen Finnen auch im Muskelfleisch vor?", "opts": [{"k": "a", "text": "Nein", "ok": false}, {"k": "b", "text": "Ja", "ok": true}, {"k": "c", "text": "Nur bei Allesfressern", "ok": false}], "label": "161a"}, {"num": 161, "type": "mc", "q": "Wann ist der Reifeprozess des Wildbrets beendet?", "opts": [{"k": "a", "text": "Nach 2 bis 3 Stunden", "ok": false}, {"k": "b", "text": "Unverzüglich", "ok": false}, {"k": "c", "text": "Nach Lösen der Totenstarre", "ok": true}], "label": "161b"}, {"num": 162, "type": "mc", "q": "Worauf ist beim Aufbrechen des Schlosses zu achten?", "opts": [{"k": "a", "text": "Dass die Nieren nicht verletzt werden", "ok": false}, {"k": "b", "text": "Dass die Blase und der Weiddarm nicht verletzt werden", "ok": true}, {"k": "c", "text": "Dass die Milz nicht verletzt wird", "ok": false}], "label": "162"}, {"num": 163, "type": "mc", "q": "Bei welcher Temperatur wird Wildfleisch eingefroren?", "opts": [{"k": "a", "text": "+7° C", "ok": false}, {"k": "b", "text": "–6° C", "ok": false}, {"k": "c", "text": "–18° C", "ok": true}], "label": "163"}, {"num": 164, "type": "mc", "q": "Welche amtliche Untersuchung hat bei Schwarzwild generell zu erfolgen?", "opts": [{"k": "a", "text": "Untersuchung auf Trichinen und Schweinepest (ESP/ASP Monitoring)", "ok": true}, {"k": "b", "text": "Untersuchung auf Tollwut", "ok": false}, {"k": "c", "text": "Untersuchung auf Myxomatose", "ok": false}], "label": "164"}, {"num": 165, "type": "mc", "q": "Welchen Einfluss haben Hetze und anderer Stress auf die Wildbretqualität?", "opts": [{"k": "a", "text": "Keine Bedeutung", "ok": false}, {"k": "b", "text": "Verbesserung der Wildbretqualität", "ok": false}, {"k": "c", "text": "Die Wildbretqualität verschlechtert sich", "ok": true}], "label": "165"}, {"num": 166, "type": "mc", "q": "Was versteht man unter „Verhitzen“?", "opts": [{"k": "a", "text": "Das Nichtaufnehmen einer Hündin nach dem Deckakt", "ok": false}, {"k": "b", "text": "Durch mangelhafte Auskühlung verursachte Zersetzung des Wildbrets", "ok": true}, {"k": "c", "text": "Wesensmangel eines Vorstehhundes", "ok": false}], "label": "166"}, {"num": 167, "type": "mc", "q": "Wie sieht das Wildbret (Muskelfleisch) eines verhitzten Stück Wildes aus?", "opts": [{"k": "a", "text": "Weißgraue Färbung", "ok": false}, {"k": "b", "text": "Grünlich-bläuliche Färbung", "ok": false}, {"k": "c", "text": "Kupferrote Färbung", "ok": true}], "label": "167"}, {"num": 168, "type": "mc", "q": "Womit ist die mit Panseninhalt verschmutzte Bauchhöhle zu reinigen?", "opts": [{"k": "a", "text": "Mit Moos", "ok": false}, {"k": "b", "text": "Mit sauberem Trinkwasser", "ok": true}, {"k": "c", "text": "Mit Gras", "ok": false}], "label": "168"}, {"num": 169, "type": "mc", "q": "Welches Wild ist in Mecklenburg-Vorpommern nach dem Erlegen mit einer Wildmarke zu kennzeichnen?", "opts": [{"k": "a", "text": "Schalenwild", "ok": true}, {"k": "b", "text": "Federwild", "ok": false}, {"k": "c", "text": "Raubwild", "ok": false}], "label": "169"}, {"num": 170, "type": "mc", "q": "Wie lange sollte erlegtes Schalenwild in der Kühlzelle maximal abhängen?", "opts": [{"k": "a", "text": "6 Stunden", "ok": false}, {"k": "b", "text": "1 Stunde", "ok": false}, {"k": "c", "text": "5 Tage", "ok": true}], "label": "170"}, {"num": 171, "type": "mc", "q": "Welche Wildarten gehören zum Kleinwild?", "opts": [{"k": "a", "text": "Hasen, Kaninchen und Federwild", "ok": true}, {"k": "b", "text": "Fasan und Dachs", "ok": false}, {"k": "c", "text": "Mauswiesel und Federwild", "ok": false}], "label": "171"}, {"num": 172, "type": "mc", "q": "Welche Maßnahme sollte beim Feldhasen gleich nach dem Erlegen erfolgen?", "opts": [{"k": "a", "text": "Lüften", "ok": false}, {"k": "b", "text": "Ausdrücken der Blase", "ok": true}, {"k": "c", "text": "Aushakeln", "ok": false}], "label": "172"}, {"num": 173, "type": "mc", "q": "Welche Organe können beim herkömmlichen Aufbrechen eines Rehbockes erst nach dem Auftrennen des Schlosses entfernt werden?", "opts": [{"k": "a", "text": "Weiddarm und Blase", "ok": true}, {"k": "b", "text": "Weiddarm und Pansen", "ok": false}, {"k": "c", "text": "Nieren und Blase", "ok": false}], "label": "173"}, {"num": 174, "type": "mc", "q": "Welchen Einfluss hat der Frost auf den Beginn des Aufbrechens bei erlegtem Schalenwild?", "opts": [{"k": "a", "text": "Keinen, es ist in jedem Fall baldmöglichst mit dem Aufbrechen zu beginnen", "ok": true}, {"k": "b", "text": "Bei Frösten ab –5° C hat man mindestens einen halben Tag Zeit, bevor man mit dem Aufbrechen beginnt", "ok": false}, {"k": "c", "text": "Man kann sich mit dem Aufbrechen mehrere Stunden Zeit lassen. Nur Stücke mit Weidwundschüssen sind sofort zu versorgen", "ok": false}], "label": "174"}, {"num": 175, "type": "mc", "q": "Welcher Schnitt wird beim Aufbrechen des Schalenwildes zweckmäßig zuerst ausgeführt?", "opts": [{"k": "a", "text": "Schnitt an den Hinterläufen", "ok": false}, {"k": "b", "text": "Schnitt am Träger", "ok": true}, {"k": "c", "text": "Schnitt innen an den Keulen", "ok": false}], "label": "175"}, {"num": 176, "type": "mc", "q": "Wodurch kann Wildbret von stark rauschigen Keilern für den menschlichen Genuss tauglich gemacht werden?", "opts": [{"k": "a", "text": "Durch ausgiebiges Abhängen im Kühlraum", "ok": false}, {"k": "b", "text": "Durch Tiefgefrieren über 6 Monate", "ok": false}, {"k": "c", "text": "Das Wildbret bleibt genussuntauglich", "ok": true}], "label": "176"}, {"num": 177, "type": "mc", "q": "Bei welchem Schuss gelangen Magen- und Darmbakterien in das Wildbret?", "opts": [{"k": "a", "text": "Kammerschuss", "ok": false}, {"k": "b", "text": "Laufschuss", "ok": false}, {"k": "c", "text": "Weidwundschuss", "ok": true}], "label": "177"}, {"num": 178, "type": "mc", "q": "Bei welcher Fleischtemperatur wird das Wachstum der meisten Bakterien gehemmt?", "opts": [{"k": "a", "text": "+7° C", "ok": true}, {"k": "b", "text": "+20° C", "ok": false}, {"k": "c", "text": "+25° C", "ok": false}], "label": "178"}, {"num": 179, "type": "mc", "q": "Darf man einen Dachs ohne Einschränkung verzehren?", "opts": [{"k": "a", "text": "Ja", "ok": false}, {"k": "b", "text": "Ja, aber nur nach erfolgter Trichinenuntersuchung", "ok": true}, {"k": "c", "text": "Nein, da das Wildbret ungenießbar ist", "ok": false}], "label": "179"}, {"num": 180, "type": "mc", "q": "Was wird bei einer amtlichen Fleischuntersuchung untersucht?", "opts": [{"k": "a", "text": "Die inneren Organe", "ok": false}, {"k": "b", "text": "Der Wildtierkörper, wie er zum Verkauf angeboten wird", "ok": false}, {"k": "c", "text": "Der komplette Wildtierkörper mit Haupt und allen inneren Organen", "ok": true}], "label": "180"}, {"num": 181, "type": "mc", "q": "Welche Faktoren begünstigen das Verhitzen des Wildkörpers?", "opts": [{"k": "a", "text": "Zu schnelles Auskühlen", "ok": false}, {"k": "b", "text": "Aufbrechen des noch warmen Tierkörpers", "ok": false}, {"k": "c", "text": "Zu spätes Aufbrechen", "ok": true}], "label": "181"}, {"num": 182, "type": "mc", "q": "Welche Kühltemperatur muss Schalenwild in der Kühlzelle so schnell wie möglich erreichen?", "opts": [{"k": "a", "text": "0° C", "ok": false}, {"k": "b", "text": "+7° C", "ok": true}, {"k": "c", "text": "–18° C", "ok": false}], "label": "182"}, {"num": 183, "type": "mc", "q": "Sie brechen ein Stück Schalenwild auf und stellen bedenkliche Merkmale fest. Muss das Stück zur amtlichen Fleischuntersuchung angemeldet werden?", "opts": [{"k": "a", "text": "Ja, jedoch nur dann, wenn es verkauft werden soll", "ok": false}, {"k": "b", "text": "Ja, immer wenn es zum menschlichen Verzehr bestimmt ist", "ok": true}, {"k": "c", "text": "Nein, da Sie die bedenklichen Merkmale erkannt haben.", "ok": false}], "label": "183"}, {"num": 184, "type": "mc", "q": "Was müssen Sie während des Zerwirkens des Schalenwildes beachten?", "opts": [{"k": "a", "text": "Das Zerwirken darf nur in einem dafür geeigneten Kühlraum erfolgen", "ok": false}, {"k": "b", "text": "Das Stück darf nur von einem Fleischer zerwirkt werden", "ok": false}, {"k": "c", "text": "Während des Zerwirkens ist ständig auf Merkmale zu achten, die das Fleisch als gesundheitlich bedenklich erscheinen lassen", "ok": true}], "label": "184"}, {"num": 185, "type": "mc", "q": "Wann soll man bei einem erlegten Stück Schalenwild mit dem Aufbrechen beginnen?", "opts": [{"k": "a", "text": "Sobald wie möglich", "ok": true}, {"k": "b", "text": "Nach einer Stunde", "ok": false}, {"k": "c", "text": "Nach zwei Stunden", "ok": false}], "label": "185"}, {"num": 186, "type": "mc", "q": "Wie werden die Blätter gelüftet?", "opts": [{"k": "a", "text": "Man führt einen Schnitt zwischen der Innenseite der Vorderläufe und dem Brustkorb", "ok": true}, {"k": "b", "text": "Man legt das Stück so auf den Rücken, dass beide Blätter frei liegen und der Luftzirkulation ausgesetzt sind", "ok": false}, {"k": "c", "text": "Man bewegt mehrmals beide Vorderläufe so, dass evtl. entstandene Luftblasen aus dem Raum zwischen Brustkorb und Blatt herausgedrückt werden", "ok": false}], "label": "186"}, {"num": 187, "type": "mc", "q": "Wer ist für das ordnungsgemäße Aufbrechen des Wildes verantwortlich?", "opts": [{"k": "a", "text": "Der zuständige Amtstierarzt", "ok": false}, {"k": "b", "text": "Die Treiber", "ok": false}, {"k": "c", "text": "Der Erleger", "ok": true}], "label": "187"}, {"num": 188, "type": "mc", "q": "Darf ein beim Verkehrsunfall getötetes Reh dem betroffenen Autofahrer vom örtlich zuständigen Jagdpächter überlassen werden?", "opts": [{"k": "a", "text": "Das ist eine freundliche Geste und zu empfehlen", "ok": false}, {"k": "b", "text": "Das ist nur erlaubt, wenn das Stück noch in der Küche zu verwerten ist", "ok": false}, {"k": "c", "text": "Nein, weil das Wild nicht nach jagdrechtlichen Vorschriften getötet worden ist; die vorgeschriebene Lebendbeschau durch eine kundige Person hat nicht stattgefunden", "ok": true}], "label": "188"}, {"num": 189, "type": "mc", "q": "Ein Schmalreh hat an der Keule eine wahrscheinlich von einem Streifschuss verursachte fingerlange, eiternde Wunde. Muss das erlegte Stück zur amtlichen Fleischuntersuchung angemeldet werden, wenn es zum menschlichen Verzehr gelangen soll?", "opts": [{"k": "a", "text": "Nein, es genügt, wenn die Wundränder großzügig ausgeschärft werden", "ok": false}, {"k": "b", "text": "Ja, es handelt sich um eine Wunde, die nicht mit der Erlegung im Zusammenhang steht; die Verletzung kann zur Ausbreitung von Bakterien im gesamten Körper geführt haben", "ok": true}, {"k": "c", "text": "Nein, es muss nur die betroffene Keule entfernt werden", "ok": false}], "label": "189"}, {"num": 190, "type": "mc", "q": "Ein Jagdgast hat auf einer Gesellschaftsjagd ein Stück Rotwild erlegt und aufgebrochen. Er meldet das seinem Anstellschützen, als ihn dieser wieder von seinem Stand abholt. Worüber muss sich der Anstellschütze bzw. der Revierinhaber unbedingt beim Erleger informieren, bevor er den Wildursprungsschein ausfüllt?", "opts": [{"k": "a", "text": "Wie viele Stück Rotwild der Gast gezählt hat", "ok": false}, {"k": "b", "text": "Ob der Gast vor dem Erlegen bzw. beim Aufbrechen bedenkliche Merkmale festgestellt hat", "ok": true}, {"k": "c", "text": "Ob der Gast beobachtet hat, dass die Nachbarschützen auch Erfolg hatten", "ok": false}], "label": "190"}, {"num": 191, "type": "mc", "q": "Wo befinden sich beim Schalenwild die Filets?", "opts": [{"k": "a", "text": "Innen, rechts und links der Lendenwirbelsäule", "ok": true}, {"k": "b", "text": "Innen, rechts und links der Brustwirbelsäule", "ok": false}, {"k": "c", "text": "Innen, rechts und links neben dem Brustbein", "ok": false}], "label": "191"}, {"num": 192, "type": "mc", "q": "Warum muss man beim Aufbrechen das Schloss öffnen?", "opts": [{"k": "a", "text": "Damit das Stück besser auskühlen kann", "ok": false}, {"k": "b", "text": "Damit man den Weiddarm und die Harnblase herauslösen kann", "ok": true}, {"k": "c", "text": "Damit die Brandadern entfernt werden können", "ok": false}], "label": "192"}, {"num": 193, "type": "mc", "q": "Bei welcher der genannten Wildarten müssen Sie den Schlund verknoten um zu verhindern, dass Panseninhalt ausläuft?", "opts": [{"k": "a", "text": "Damwild", "ok": true}, {"k": "b", "text": "Schwarzwild", "ok": false}, {"k": "c", "text": "Hasen/Wildkaninchen", "ok": false}], "label": "193"}, {"num": 194, "type": "mc", "q": "Welche Viruserkrankung ist auf den Menschen übertragbar?", "opts": [{"k": "a", "text": "Tollwut", "ok": true}, {"k": "b", "text": "Myxomatose", "ok": false}, {"k": "c", "text": "Schweinepest", "ok": false}], "label": "194"}, {"num": 195, "type": "mc", "q": "Welches Anzeichen deutet beim Rehwild auf Tollwut hin?", "opts": [{"k": "a", "text": "Verschmutzter Spiegel", "ok": false}, {"k": "b", "text": "Häufiges Nässen", "ok": false}, {"k": "c", "text": "Speichelfluss und Scheuerstellen am Haupt", "ok": true}], "label": "195"}, {"num": 196, "type": "mc", "q": "Bei welcher Wildart kommt der Leberegel vor?", "opts": [{"k": "a", "text": "Rehwild", "ok": true}, {"k": "b", "text": "Fasan", "ok": false}, {"k": "c", "text": "Ringeltaube", "ok": false}], "label": "196"}, {"num": 197, "type": "mc", "q": "Durch welche Parasiten wird die Räude verursacht?", "opts": [{"k": "a", "text": "Milben", "ok": true}, {"k": "b", "text": "Flöhe", "ok": false}, {"k": "c", "text": "Läuse", "ok": false}], "label": "197"}, {"num": 198, "type": "mc", "q": "Durch welche Erreger wird die Myxomatose hervorgerufen?", "opts": [{"k": "a", "text": "Parasiten", "ok": false}, {"k": "b", "text": "Viren", "ok": true}, {"k": "c", "text": "Bakterien", "ok": false}], "label": "198"}, {"num": 199, "type": "mc", "q": "Welche Erkrankung kann durch Zecken übertragen werden?", "opts": [{"k": "a", "text": "Moderhinke", "ok": false}, {"k": "b", "text": "Frühsommer-Meningoenzephalitis (FSME)", "ok": true}, {"k": "c", "text": "Strahlenpilzerkrankung", "ok": false}], "label": "199"}, {"num": 200, "type": "mc", "q": "Ist der Befall mit Rachenbremsenlarven ein Abschussgrund?", "opts": [{"k": "a", "text": "Nein", "ok": true}, {"k": "b", "text": "Ja", "ok": false}, {"k": "c", "text": "Nur im April", "ok": false}], "label": "200"}, {"num": 201, "type": "mc", "q": "Ist der Befall mit Rachenbremsenlarven ein Abschussgrund?", "opts": [{"k": "a", "text": "Nein", "ok": true}, {"k": "b", "text": "Ja", "ok": false}, {"k": "c", "text": "Nur im April", "ok": false}], "label": "201", "dup": true}, {"num": 202, "type": "mc", "q": "Welche Hauptkennzeichen zeigt Schwarzwild bei der Schweinepest?", "opts": [{"k": "a", "text": "Aggressivität", "ok": false}, {"k": "b", "text": "Auffällige Schwäche und ein schwankender Gang", "ok": true}, {"k": "c", "text": "Die Borsten fallen aus", "ok": false}], "label": "202"}, {"num": 203, "type": "mc", "q": "Welche Erkrankung kann durch Zecken übertragen werden?", "opts": [{"k": "a", "text": "Tollwut", "ok": false}, {"k": "b", "text": "Borreliose", "ok": true}, {"k": "c", "text": "Maul- und Klauenseuche", "ok": false}], "label": "203"}, {"num": 204, "type": "mc", "q": "Woran ist die Myxomatose beim Kaninchen zu erkennen?", "opts": [{"k": "a", "text": "Schwellungen um Seher, Äser, Geschlechtsorganen", "ok": true}, {"k": "b", "text": "An dem aufgeblähten Bauch", "ok": false}, {"k": "c", "text": "An blutigem Nasenausfluss", "ok": false}], "label": "204"}, {"num": 205, "type": "mc", "q": "In welchem Monat kann man einen Rachenbremsenlarvenbefall hören?", "opts": [{"k": "a", "text": "Im Dezember", "ok": false}, {"k": "b", "text": "Im Mai", "ok": true}, {"k": "c", "text": "Im Oktober", "ok": false}], "label": "205"}, {"num": 206, "type": "mc", "q": "Worauf ist ein Perückengehörn zurückzuführen?", "opts": [{"k": "a", "text": "Auf eine Laufverletzung", "ok": false}, {"k": "b", "text": "Auf einen zu hohen Wildbestand", "ok": false}, {"k": "c", "text": "Auf eine Hormonstörung", "ok": true}], "label": "206"}, {"num": 207, "type": "mc", "q": "Bei welcher Wildart siedeln sich die Trichinen bevorzugt an?", "opts": [{"k": "a", "text": "Bei Hasen", "ok": false}, {"k": "b", "text": "Beim Schwarzwild", "ok": true}, {"k": "c", "text": "Bei Tauben", "ok": false}], "label": "207"}, {"num": 208, "type": "mc", "q": "Auf welche Krankheit können vergrößerte Hoden des Feldhasen oder des Schwarzwildes hinweisen?", "opts": [{"k": "a", "text": "Tollwut", "ok": false}, {"k": "b", "text": "Brucellose", "ok": true}, {"k": "c", "text": "Vogelgrippe", "ok": false}], "label": "208"}, {"num": 209, "type": "mc", "q": "Welche der folgenden Erkrankungen werden durch Viren verursacht?", "opts": [{"k": "a", "text": "Brucellose, Botulismus", "ok": false}, {"k": "b", "text": "Schweinepest, Tollwut", "ok": true}, {"k": "c", "text": "Trichinen, Leberegel", "ok": false}], "label": "209"}, {"num": 210, "type": "mc", "q": "Welche der folgenden Erkrankungen werden durch Bakterien verursacht?", "opts": [{"k": "a", "text": "Borreliose", "ok": true}, {"k": "b", "text": "Tollwut", "ok": false}, {"k": "c", "text": "Räude", "ok": false}], "label": "210"}, {"num": 211, "type": "mc", "q": "Was hat mit Fallwild zu geschehen?", "opts": [{"k": "a", "text": "Ein Tierarzt muss die Genusstauglichkeit prüfen", "ok": false}, {"k": "b", "text": "Das Stück muss dem Ordnungsamt gemeldet werden", "ok": false}, {"k": "c", "text": "Das Stück ist genussuntauglich und unschädlich zu beseitigen", "ok": true}], "label": "211"}, {"num": 212, "type": "mc", "q": "Welche Krankheit kann auf den Menschen übertragen werden (Zoonose)?", "opts": [{"k": "a", "text": "Kokzidiose", "ok": false}, {"k": "b", "text": "Myxomatose", "ok": false}, {"k": "c", "text": "Tollwut", "ok": true}], "label": "212"}, {"num": 213, "type": "mc", "q": "Welche Wildart hat eine Gallenblase?", "opts": [{"k": "a", "text": "Schwarzwild", "ok": true}, {"k": "b", "text": "Rehwild", "ok": false}, {"k": "c", "text": "Rotwild", "ok": false}], "label": "213"}, {"num": 214, "type": "mc", "q": "Zu welcher Gruppe von Parasiten gehören Leberegel?", "opts": [{"k": "a", "text": "Zu den Bandwürmern", "ok": false}, {"k": "b", "text": "Zu den Saugwürmern", "ok": true}, {"k": "c", "text": "Zu den Rundwürmern", "ok": false}], "label": "214"}, {"num": 215, "type": "mc", "q": "Worauf ist die Strahlenpilzerkrankung zurückzuführen?", "opts": [{"k": "a", "text": "Auf ein Bakterium", "ok": true}, {"k": "b", "text": "Auf einen Pilz", "ok": false}, {"k": "c", "text": "Auf ein Virus", "ok": false}], "label": "215"}, {"num": 216, "type": "mc", "q": "Welche Erkrankung entsteht durch den Verzehr vo
