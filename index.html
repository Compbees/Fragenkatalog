/* ---------- Menü ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,24,16,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(214,173,79,.45);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.topbar-in{max-width:1040px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;color:var(--gold);font-weight:700;letter-spacing:.04em;font-size:1.02rem;white-space:nowrap;text-decoration:none}
.brand svg{width:26px;height:26px;fill:var(--leaf)}
.brand small{display:block;font-weight:400;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#bcd0a8}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center}
nav button{font-family:var(--sans);font-size:.88rem;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#e8f0dc;padding:6px 13px;border-radius:999px;transition:.15s}
nav button:hover{background:rgba(134,173,95,.28)}
nav button.active{background:var(--leaf);color:#0b1f17;border-color:var(--leaf);font-weight:700}
nav button.sim{border-color:var(--gold);color:var(--gold)}
nav button.sim.active{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
nav .sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 4px}
.search{font-family:var(--sans);font-size:.88rem;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.28);color:#fff;border-radius:999px;padding:6px 14px;width:200px;max-width:100%}
.search::placeholder{color:#a9bd98}
.search:focus{outline:2px solid var(--leaf);outline-offset:1px}

/* ---------- Layout ---------- */
main{max-width:940px;margin:0 auto;padding:22px 14px 90px}
.hero{background:linear-gradient(135deg,rgba(11,31,23,.88),rgba(31,77,54,.82));color:#eef3e2;border:1px solid rgba(214,173,79,.5);border-radius:16px;padding:20px 24px;margin-bottom:18px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.hero h1{margin:0 0 4px;font-size:1.55rem;color:var(--gold);letter-spacing:.02em}
.hero p{margin:4px 0 0;color:#cfe0bd;font-size:.95rem}
.hero .fachtitle{font-size:.9rem;color:#b9cfa4;margin-top:8px}
.toolbar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-top:14px;font-family:var(--sans);font-size:.86rem}
.chip{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#eaf2dd;padding:5px 12px;border-radius:999px}
.chip.on{background:var(--gold);color:#2a1d05;border-color:var(--gold);font-weight:700}
.toolbar label{display:flex;align-items:center;gap:6px;color:#dbe8c9;cursor:pointer}
.toolbar input[type=number]{width:84px;padding:5px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);color:#fff;font:inherit}
.toolbar .ghost{border:1px solid rgba(255,255,255,.3);background:transparent;color:#eaf2dd;padding:5px 11px;border-radius:8px}
.toolbar .ghost:hover{background:rgba(255,255,255,.12)}
.stats{margin-left:auto;color:#cfe0bd}

.card{background:var(--parch);border-radius:12px;padding:16px 20px 18px;margin:0 0 14px;border-left:6px solid var(--moss);box-shadow:0 3px 12px rgba(0,0,0,.28);scroll-margin-top:84px;position:relative}
.card.mc{border-left-color:var(--gold2)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-family:var(--sans);font-size:.78rem}
.num{background:var(--pine2);color:var(--gold);font-weight:700;padding:2px 10px;border-radius:999px;letter-spacing:.04em}
.tag{color:var(--ink2);text-transform:uppercase;letter-spacing:.1em;font-size:.7rem}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;font-size:1.25rem;line-height:1;color:#9a8a5a;padding:0 4px}.bm.on{color:#c9971c}.bm:hover{transform:scale(1.15)}.bm+.fbadge{margin-left:6px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(8,24,16,.94);color:#eef3e2;border:1px solid rgba(214,173,79,.6);border-radius:10px;padding:9px 16px;font-family:var(--sans);font-size:.9rem;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.fbadge{margin-left:auto;background:var(--moss);color:#fff;border-radius:6px;padding:1px 8px;font-size:.72rem}
.q{margin:2px 0 10px;font-size:1.08rem;font-weight:700;line-height:1.4;color:#1a2316}
.ans{background:var(--parch2);border:1px solid var(--parch3);border-radius:9px;padding:10px 14px}
.ans .lbl{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);font-weight:700;margin-bottom:3px}
.ans .txt{white-space:pre-line}
.reveal{font-family:var(--sans);border:1px dashed var(--moss);background:transparent;color:var(--moss);padding:7px 14px;border-radius:8px;font-weight:600}
.reveal:hover{background:rgba(79,122,69,.12)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--parch2);border:1.5px solid var(--parch3);border-radius:10px;padding:9px 13px;color:var(--ink);transition:.12s;font-family:var(--serif);font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--moss);background:#e3ebcf;transform:translateX(2px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pine2);color:var(--gold);display:grid;place-items:center;font-family:var(--sans);font-weight:700;font-size:.85rem;text-transform:lowercase}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.sel{background:#dfe9c4;border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss)}
.opt.sel .k{background:var(--moss);color:#fff}
.fb{margin-top:10px;font-family:var(--sans);font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb .good{color:var(--ok);font-weight:700}
.fb .bad{color:var(--bad);font-weight:700}
.fb .again{border:1px solid var(--ink2);background:transparent;border-radius:7px;padding:2px 10px;color:var(--ink2);font-size:.8rem}
.empty{background:rgba(245,238,219,.93);border-radius:12px;padding:22px;text-align:center}

.totop{position:fixed;right:16px;bottom:16px;z-index:40;border:none;background:var(--gold);color:#2a1d05;width:44px;height:44px;border-radius:50%;font-size:1.3rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.45);display:none}
.totop.show{display:block}

/* ---------- Simulation ---------- */
.panel{background:var(--parch);border-radius:14px;padding:20px 24px;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.3);border-top:5px solid var(--gold2)}
.panel h2{margin:0 0 8px;color:var(--pine2);font-size:1.3rem}
.panel h3{margin:14px 0 6px;color:var(--pine2);font-size:1.05rem}
.panel p{margin:6px 0}
.panel ul{margin:6px 0 6px 20px;padding:0}
.panel li{margin:3px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
table.t{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:.88rem}
table.t th,table.t td{padding:6px 9px;border-bottom:1px solid var(--parch3);text-align:left}
table.t th{background:var(--parch2);color:var(--pine2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
table.t td.r,table.t th.r{text-align:right}
.btn{font-family:var(--sans);border:none;background:var(--pine2);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.95rem;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn:hover{background:var(--moss)}
.btn.gold{background:var(--gold);color:#2a1d05}
.btn.gold:hover{background:#e6c06a}
.btn.red{background:var(--bad)}
.btn.line{background:transparent;color:var(--pine2);border:1.5px solid var(--pine2);box-shadow:none}
.opts-row{display:flex;gap:18px 26px;flex-wrap:wrap;align-items:center;margin:12px 0;font-family:var(--sans);font-size:.92rem}
.opts-row select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--parch3);background:#fff}
.note{font-family:var(--sans);font-size:.8rem;color:var(--ink2);background:var(--parch2);border-radius:8px;padding:8px 12px;margin-top:10px}
details.d{margin:10px 0;font-family:var(--sans);font-size:.9rem}
details.d summary{cursor:pointer;font-weight:700;color:var(--pine2)}
.runbar{position:sticky;top:57px;z-index:30;background:rgba(8,24,16,.94);color:#eef3e2;border:1px solid rgba(214,173,79,.5);border-radius:12px;padding:8px 14px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--sans);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.timer{font-size:1.45rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{color:#ff8f7e;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.runbar .grow{flex:1;min-width:140px}
.bar{height:7px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);width:0}
.secthead{background:linear-gradient(135deg,rgba(11,31,23,.9),rgba(31,77,54,.85));color:#eef3e2;border-radius:12px;padding:12px 18px;margin:22px 0 12px;border:1px solid rgba(214,173,79,.45)}
.secthead h2{margin:0;font-size:1.15rem;color:var(--gold)}
.secthead p{margin:2px 0 0;font-size:.85rem;color:#cfe0bd;font-family:var(--sans)}
.subhead{font-family:var(--sans);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#d6e6c3;margin:14px 2px 8px;font-weight:700}
textarea.own{width:100%;min-height:92px;resize:vertical;font:inherit;font-size:1rem;padding:10px 12px;border-radius:9px;border:1.5px solid var(--parch3);background:#fffdf4;color:var(--ink)}
textarea.own:focus{outline:2px solid var(--leaf);border-color:var(--moss)}
.res-big{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.verdict{font-family:var(--sans);font-weight:800;font-size:1.25rem;padding:8px 18px;border-radius:10px}
.verdict.pass{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.verdict.fail{background:var(--badbg);color:var(--bad);border:2px solid var(--bad)}
.reasons{font-family:var(--sans);font-size:.9rem;margin:4px 0 0 18px;color:var(--bad)}
.grade{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-family:var(--sans);font-size:.86rem;align-items:center}
.grade button{border:1.5px solid var(--parch3);background:var(--parch2);border-radius:8px;padding:5px 12px;color:var(--ink)}
.grade button.on0{background:var(--badbg);border-color:var(--bad);font-weight:700}
.grade button.on1{background:#f6e8bd;border-color:var(--gold2);font-weight:700}
.grade button.on2{background:var(--okbg);border-color:var(--ok);font-weight:700}
.mine{background:#fffdf4;border:1px solid var(--parch3);border-radius:9px;padding:9px 13px;margin-bottom:8px;white-space:pre-wrap}
.mine .lbl,.ans .lbl{display:block}
.chipst{font-family:var(--sans);font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:99px}
.chipst.ok{background:var(--okbg);color:var(--ok)} .chipst.no{background:var(--badbg);color:var(--bad)} .chipst.na{background:var(--parch3);color:var(--ink2)}
footer{max-width:940px;margin:0 auto;padding:0 14px 40px;color:#b4c8a2;font-family:var(--sans);font-size:.78rem;text-align:center}
@media(max-width:620px){body{font-size:16px}.hero{padding:16px}.card{padding:14px 14px 16px}.stats{margin-left:0;width:100%}.search{width:100%}}
