dverband anerkannten Leistungszucht stammt?", "opts": [{"k": "a", "text": "Am Sperlingshund", "ok": true}, {"k": "b", "text": "Am Stempel des VDH und FCI", "ok": false}, {"k": "c", "text": "An der Unterschrift und dem Stempel des Vereines", "ok": false}], "label": "295"}, {"num": 296, "type": "mc", "q": "Was bedeutet der Begriff \"Führigkeit\" bei Jagdhunden?", "opts": [{"k": "a", "text": "Angewölfte Eigenschaft zur Zusammenarbeit mit dem Hundeführer", "ok": true}, {"k": "b", "text": "Das willige Gehen des unangeleinten Hundes während der Jagdausübung", "ok": false}, {"k": "c", "text": "Das willige Gehen des angeleinten Hundes, ohne zu ziehen", "ok": false}], "label": "296"}, {"num": 297, "type": "mc", "q": "Welches Ziel verfolgt der Jagdgebrauchshundverband (JGHV)?", "opts": [{"k": "a", "text": "Schönheitszucht", "ok": false}, {"k": "b", "text": "Leistungszucht", "ok": true}, {"k": "c", "text": "Massenzucht", "ok": false}], "label": "297"}, {"num": 298, "type": "mc", "q": "Welcher Verband ist die Dachorganisation des Jagdgebrauchshundwesens in Deutschland?", "opts": [{"k": "a", "text": "Jagdgebrauchshundverband e.V. (JGHV)", "ok": true}, {"k": "b", "text": "Fédération Cynologique Internationale (FCI)", "ok": false}, {"k": "c", "text": "Verband für das Deutsche Hundewesen (VDH)", "ok": false}], "label": "298"}, {"num": 299, "type": "mc", "q": "Wie werden die Welpen der Jagdhunde gewölft?", "opts": [{"k": "a", "text": "Blind", "ok": true}, {"k": "b", "text": "Unbehaart", "ok": false}, {"k": "c", "text": "Sehend", "ok": false}], "label": "299"}, {"num": 300, "type": "mc", "q": "Ab welchem Tag der Läufigkeit kann es sein, dass sich die Hündin vom Rüden decken lässt?", "opts": [{"k": "a", "text": "Ab dem 5. Tag", "ok": false}, {"k": "b", "text": "Ab dem 14. Tag", "ok": false}, {"k": "c", "text": "Ab dem 9. Tag", "ok": true}], "label": "300"}, {"num": 301, "type": "mc", "q": "Welche der genannten Wildart nimmt Sulzen/Salzlecken an?", "opts": [{"k": "a", "text": "Rehwild", "ok": true}, {"k": "b", "text": "Marder", "ok": false}, {"k": "c", "text": "Fasanen", "ok": false}], "label": "301"}, {"num": 302, "type": "mc", "q": "In welchem Zustand sollte sich ein gesunder Jagdhund befinden?", "opts": [{"k": "a", "text": "Wohlgenährt, ohne sichtbares absetzen einzelner Knochen", "ok": false}, {"k": "b", "text": "Rippen und Wirbelsäule sollten sichtbar sein", "ok": false}, {"k": "c", "text": "Rippen sollten fühlbar sein", "ok": true}], "label": "302"}, {"num": 303, "type": "mc", "q": "Welche Maßnahme hilft, den Verlust an Rehkitzen durch Ausmähen zu verringern?", "opts": [{"k": "a", "text": "Das Mähen in den frühen Abendstunden", "ok": false}, {"k": "b", "text": "Drohneneinsatz", "ok": true}, {"k": "c", "text": "Das Mähen von „Außen“ nach „Innen“", "ok": false}], "label": "303"}, {"num": 304, "type": "mc", "q": "Bei welcher Arbeit soll der Jagdhund mit tiefer Nase arbeiten?", "opts": [{"k": "a", "text": "Verlorensuche von Haarwild", "ok": true}, {"k": "b", "text": "Buschieren", "ok": false}, {"k": "c", "text": "Feldsuche", "ok": false}], "label": "304"}, {"num": 305, "type": "mc", "q": "Welche Verhaltensweisen des Vorstehhundes bei der Feldarbeit sind nicht erwünscht?", "opts": [{"k": "a", "text": "Vorzuliegen, statt vorzustehen", "ok": false}, {"k": "b", "text": "Einspringen, um das Wild zum Aufstehen zu bringen", "ok": true}, {"k": "c", "text": "Nachziehen", "ok": false}], "label": "305"}, {"num": 306, "type": "mc", "q": "Warum „kreist“ der Jäger?", "opts": [{"k": "a", "text": "Um die Reviergrenzen zu kontrollieren", "ok": false}, {"k": "b", "text": "Um eine Wildart im Einstand zu bestätigen", "ok": true}, {"k": "c", "text": "Auslaufen der Jäger bei der Drückjagd", "ok": false}], "label": "306"}, {"num": 307, "type": "mc", "q": "Welche Laute ahmt der Jäger in der Blattzeit nach?", "opts": [{"k": "a", "text": "Fiepton von Ricke oder Kitz", "ok": true}, {"k": "b", "text": "Schrecken des Bockes", "ok": false}, {"k": "c", "text": "Schrecken der Ricke", "ok": false}], "label": "307"}, {"num": 308, "type": "mc", "q": "Zu welchem Zweck dienen Schwarzwild-Übungsgatter?", "opts": [{"k": "a", "text": "Im Schwarzwildgatter soll der Jagdhund die Hetze lernen", "ok": false}, {"k": "b", "text": "Jagdhunde lernen im Schwarzwildgatter den Umgang mit Sauen", "ok": true}, {"k": "c", "text": "Hundemeuten können im Schwarzwildgatter die Zusammenarbeit lernen und üben", "ok": false}], "label": "308"}, {"num": 309, "type": "mc", "q": "Bei welcher Jagdart liegt der Jagdhund vor und gibt Laut?", "opts": [{"k": "a", "text": "Feldsuche", "ok": false}, {"k": "b", "text": "Baujagd", "ok": true}, {"k": "c", "text": "Stöbern", "ok": false}], "label": "309"}]}, {"id": "3", "kurz": "Waffen, Waffenrecht & Munition", "titel": "Waffenrecht; Waffentechnik; Handhabung, Führung und Aufbewahrung von Jagd- und Faustfeuerwaffen; Munition", "items": [{"num": 1, "type": "open", "q": "Was sind Schusswaffen im Sinne des Waffengesetzes?", "a": "Schusswaffen sind tragbare Gegenstände, die für Jagd-, Sport-, Spiel-, Angriff- oder\nVerteidigungszwecke, Distanzinjektion oder Markierung bestimmt sind und bei denen ein Geschoss durch einen Lauf getrieben wird.", "label": "1"}, {"num": 2, "type": "open", "q": "Nennen sie die vier wesentlichen Teile einer Langwaffe.", "a": "Lauf, Gehäuse, Verschluss, Patronenlager", "label": "2"}, {"num": 3, "type": "open", "q": "Nennen Sie Unterschiede zwischen Lang- und Kurzwaffen.", "a": "Gesamtlänge der Schusswaffe, Länge des Laufes", "label": "3"}, {"num": 4, "type": "open", "q": "Zu welchen Zwecken dürfen Sie Schreckschusswaffen im Jagdbetrieb einsetzen?", "a": "Jagdhundeausbildung und Wildschadensverhütung", "label": "4"}, {"num": 5, "type": "open", "q": "Wer besitzt eine Waffe laut Waffengesetz?", "a": "Derjenige, der die tatsächliche Gewalt über die Waffe ausübt.", "label": "5"}, {"num": 6, "type": "open", "q": "Wer erwirbt eine Waffe laut Waffengesetz?", "a": "Derjenige, der die tatsächliche Gewalt über die Waffe erlangt.", "label": "6"}, {"num": 7, "type": "open", "q": "Wer übt die tatsächliche Gewalt über eine Waffe aus?", "a": "Derjenige, der nach eigenem Willen über die Waffe verfügen kann. Derjenige der sie berechtigt oder unberechtigt entgegengenommen, geliehen, gefunden oder gestohlen hat oder sie in seiner Wohnung usw. aufbewahrt.", "label": "7"}, {"num": 8, "type": "open", "q": "Wer führt eine Waffe laut Waffengesetz?", "a": "Derjenige, der die tatsächliche Gewalt über die Waffe außerhalb der eigenen Wohnung, seiner Geschäftsräume, des eigenen befriedeten Besitztums oder einer Schießstätte ausübt.", "label": "8"}, {"num": 9, "type": "open", "q": "Zu welchen Zwecken dürfen Jäger Waffen führen?", "a": "Jäger dürfen Waffen zur befugten Jagdausübung, bei der Jagdhundeausbildung, im Jagdschutz, Kontrollschuss und im Zusammenhang damit führen.", "label": "9"}, {"num": 10, "type": "open", "q": "Wer transportiert eine Waffe laut Waffengesetz?", "a": "Derjenige, der eine Waffe nicht zugriffsbereit und entladen, von einem erlaubnisfreien Ort zum anderen verbringt. Der Transport setzt ein Bedürfnis voraus.", "label": "10"}, {"num": 11, "type": "open", "q": "Welche Dokumente muss ich beim erlaubnisfreien Transport einer Waffe mitführen?", "a": "Den Personalausweis (oder Reisepass) und eine Erwerbsberechtigung (gültiger Jagdschein oder Waffenbesitzkarte).", "label": "11"}, {"num": 12, "type": "open", "q": "Auf welche vier Gegenstände findet das Waffengesetz Anwendung?", "a": "Schusswaffen, Munition, Hieb- und Stichwaffen", "label": "12"}, {"num": 13, "type": "open", "q": "Welche sechs Voraussetzungen müssen Personen für die voll umfängliche Nutzung von Waffen und Munition erfüllen?", "a": "Volljährigkeit, Zuverlässigkeit, Sachkunde, Bedürfnis, persönliche Eignung, Haftpflichtversicherung", "label": "13"}, {"num": 14, "type": "open", "q": "In welchem Dokument finde ich die Angaben der registrierten Waffe und welche 6 Einträge sind in dem Dokument enthalten?", "a": "Die Waffenbesitzkarte, in der die Einträge: Munitionsbezeichnung/Kaliber, Hersteller/Modellbezeichnung, Waffennummer/Seriennummer, ggf. Erwerbsberechtigung und Munitionserwerb, Überlasser, Überlassungsdatum und Behördensiegel enthalten sind.", "label": "14"}, {"num": 15, "type": "open", "q": "Für wie lange darf der Inhaber eines gültigen Jagdscheins Waffen ausleihen?", "a": "Einen Monat ohne Eintrag in die WBK, mit Eintrag unbegrenzt.", "label": "15"}, {"num": 16, "type": "open", "q": "An welche Personen dürfen Waffen abgegeben werden?", "a": "Nur an Erwerbsberechtigte, z.B. Sportschützen und Jäger.", "label": "16"}, {"num": 17, "type": "open", "q": "Wie viele Langwaffen dürfen Jagdscheininhaber besitzen und welche Grundtypen kennen Sie?", "a": "Die Zahl der Langwaffen ist nicht begrenzt. Flinten, Büchsen, kombinierte Waffen.", "label": "17"}, {"num": 18, "type": "open", "q": "Wie viele Kurzwaffen dürfen Jagdscheininhaber besitzen?", "a": "Zwei, ohne ein besonderes Bedürfnis.", "label": "18"}, {"num": 19, "type": "open", "q": "Was muss der Jagdscheininhaber vor dem Erwerb einer Kurzwaffe veranlassen?", "a": "Er muss einen entsprechenden Voreintrag in seine Waffenbesitzkarte (WBK) haben. Sofern er noch keine WBK hat, muss er sie vorher beantragen.", "label": "19"}, {"num": 20, "type": "open", "q": "Innerhalb welcher Frist sind erworbene Schusswaffen zur Eintragung in die WBK anzumelden und bei welcher Behörde hat das zu geschehen?", "a": "Innerhalb von zwei Wochen bei der Waffenbehörde des Landkreises, in dem der Waffenbesitzer mit seinem ersten Wohnsitz gemeldet ist.", "label": "20"}, {"num": 21, "type": "open", "q": "Dürfen Jugendjagdscheininhaber Schusswaffen führen?", "a": "Ja, nur Langwaffen in Begleitung eines Erziehungsberechtigten oder einer jagdlich erfahrenen\nPerson, die durch den Erziehungsberechtigten schriftlich beauftragt wurde.", "label": "21"}, {"num": 22, "type": "open", "q": "Welche Dokumente muss ein Jäger bei der Jagdausübung mit der Schusswaffe mit sich führen?", "a": "Jagdschein, Waffenbesitzkarte, Personalausweis. Darüber hinaus muss ein Jagdgast, der ohne Begleitung des Jagdausübungsberechtigten die Jagd ausübt, einen Jagderlaubnisschein mit sich führen.", "label": "22"}, {"num": 23, "type": "open", "q": "Darf die Behörde den Waffenbesitz und die Waffenaufbewahrung kontrollieren?", "a": "Ja, sie darf unangemeldete Kontrollen durchführen.", "label": "23"}, {"num": 24, "type": "open", "q": "Wie muss ein Jäger ohne besonderes Bedürfnis seine Waffen verwahren?", "a": "Bei einem Waffenschrank mit dem Widerstandsgrad 0, unter 200 kg, max. 5 Kurzwaffen, Langwaffen in einem Waffenschrank mit mindestens Widerstandsgrad 0.\nEine Trennung von Lang- und Kurzwaffen in einem Waffenschrank mit dem Widerstandsgrad 0 ist nicht notwendig.", "label": "24"}, {"num": 25, "type": "open", "q": "Nennen Sie vier Gegenstände, die nach dem Waffengesetz verboten sind.", "a": "Kriegswaffen, Vorderschaftrepetierer ohne Hinterschaft, Stockflinten, Magazine für Langwaffen, die mehr als 10 Patronen fassen", "label": "25"}, {"num": 26, "type": "open", "q": "Nennen Sie vier blanke Waffen.", "a": "Nicker, Weidblatt, Hirschfänger und Saufeder", "label": "26"}, {"num": 27, "type": "open", "q": "Woher stammt der Begriff „Nicker“?", "a": "Vom Abnicken, dem Töten des Wildes durch einen Stich ins Genick (ohne Erfahrung und Sachkunde nicht weidgerecht).", "label": "27"}, {"num": 28, "type": "open", "q": "Welche Arten von Kurzwaffen unterscheidet man grundsätzlich nach ihrer Bauart?", "a": "Pistolen und Revolver", "label": "28"}, {"num": 29, "type": "open", "q": "Wie muss Munition in einem Waffenschrank mit dem Widerstandsgrad 0 verwahrt werden?", "a": "Waffen müssen entladen sein. Die Munition darf mit den Waffen im selben Schrank gelagert werden.", "label": "29"}, {"num": 30, "type": "open", "q": "Wie unterscheiden sich Lang- und Kurzwaffen nach dem Waffengesetz?", "a": "Langwaffen sind Schusswaffen, deren Lauf und Verschluss in geschlossener Stellung insgesamt länger als 30 cm sind und deren kürzeste bestimmungsgemäß verwendbare Gesamtlänge 60 cm überschreitet; Kurzwaffen sind alle anderen Schusswaffen.", "label": "30"}, {"num": 31, "type": "open", "q": "Worauf weist die Bezeichnung Kipplaufwaffe hin?", "a": "Auf Waffen, bei denen die Läufe abgeknickt werden, um sie zu laden oder zu entladen.", "label": "31"}, {"num": 32, "type": "open", "q": "Welche Waffentypen bezeichnet man als kombinierte Waffen?", "a": "Waffen mit mindestens je einem Büchsen- und einem Flintenlauf.", "label": "32"}, {"num": 33, "type": "open", "q": "Welchen Waffentyp bezeichnet man als Flinte?", "a": "Eine Langwaffe mit glattem Lauf, aus dem Schrote und Flintenlaufgeschosse verschossen werden.", "label": "33"}, {"num": 34, "type": "open", "q": "Was bewirkt ein Schrotschuss und welches Wild wird beschossen?", "a": "Schrote sind viele kleine Einzelgeschosse, die beim getroffenen Niederwild einen Schocktod hervorrufen, der Schrotschuss auf Schalenwild ist verboten.", "label": "34"}, {"num": 35, "type": "open", "q": "Welchen Waffentyp bezeichnet man als Büchse?", "a": "Waffen mit gezogenen Läufen die Züge und Felder besitzen.", "label": "35"}, {"num": 36, "type": "open", "q": "Was soll mit einem Kugelschuss bewirkt werden?", "a": "Die Zerstörung von lebenswichtigen Organen (möglichst Lunge und Herz) durch hohe\nEnergieabgabe auf den Wildkörper (Kammerschuss).", "label": "36"}, {"num": 37, "type": "open", "q": "Welche Möglichkeiten gibt es, den Schaft einer Waffe dem Schützen anzupassen?", "a": "Anpassen der Senkung, Schränkung und der Schaftlänge.", "label": "37"}, {"num": 38, "type": "open", "q": "Was versteht man unter Senkung?", "a": "Die Absenkung des Hinterschaftes von der gedachten rückwärtigen Verlängerung der Laufschiene.", "label": "38"}, {"num": 39, "type": "open", "q": "Was versteht man unter Schränkung?", "a": "Die seitliche Ausbiegung des Hinterschaftes aus der gedachten rückwärtigen Verlängerung der Laufschiene.", "label": "39"}, {"num": 40, "type": "open", "q": "Was versteht man unter einem „Pitch“?", "a": "Der Winkel des Schaftendes zu den Läufen, der eine volle Auflage an der Schulter des Schützen gewährleisten soll.", "label": "40"}, {"num": 41, "type": "open", "q": "Bei welcher Waffe ist die Schaftlänge besonders wichtig?", "a": "Besonders bei Flinten, wenn der Schaft zu lang oder zu kurz ist, kann man nicht richtig treffen („Der Lauf schießt, aber der Schaft trifft!“).", "label": "41"}, {"num": 42, "type": "open", "q": "Welche Schussentfernung sollte beim Schrotschuss nicht überschritten werden und warum?", "a": "35 Meter. Die Streuung, die Energie und die Schockwirkung der Schrote sind bei weiteren Schüssen für eine tödliche Wirkung meist unzureichend.", "label": "42"}, {"num": 43, "type": "open", "q": "Welche Schussentfernung ist für einen sicheren Kugelschuss noch vertretbar und warum?", "a": "100-150 Meter. Die Zielgenauigkeit nimmt ab, und die Streuung des Schützen nimmt bei weiteren Schüssen stark zu.", "label": "43"}, {"num": 44, "type": "open", "q": "Welches ist der oberste Grundsatz beim Umgang mit Waffen?", "a": "Sicherheit! Waffen immer so behandeln, als ob sie geladen wären! Niemals Waffen in Richtung von Menschen, Hunden, Haus- und Weidetieren oder Gegenständen etc. richten!", "label": "44"}, {"num": 45, "type": "open", "q": "Wodurch wird das Überschlagen des Geschosses beim Kugelschuss während des Fluges verhindert?", "a": "Durch die wendelförmige Drehung des Lauf-Innenprofils mit Erhebungen (Felder) und Vertiefungen (Züge) bekommt das Geschoss den sogenannten Drall.", "label": "45"}, {"num": 46, "type": "open", "q": "Was versteht man unter Dralllänge?", "a": "Die Strecke, die das Geschoss für eine Umdrehung im Lauf benötigt.", "label": "46"}, {"num": 47, "type": "open", "q": "Welche Aufgaben hat die Choke- oder Würgebohrung (Mündungsverengung) bei Flinten?", "a": "Sie bewirkt, dass auch bei unterschiedlichen Schussentfernungen eine ausreichende Deckung vorhanden ist (besseres Zusammenhalten der Schrotgarbe).", "label": "47"}, {"num": 48, "type": "open", "q": "Was bezeichnet man in Bezug auf den Schrotschuss als „Deckung“?", "a": "Das gleichmäßige Auftreffen einer bestimmten Menge von Schroten auf eine bestimmte Fläche (zu ermitteln durch Beschießen der 16-Felder-Scheibe).", "label": "48"}, {"num": 49, "type": "open", "q": "Warum ist eine ausreichende Deckung der Schrote beim Schrotschuss wichtig?", "a": "Hervorrufen des Schocktodes beim beschossenen Stück (andernfalls krankgeschossen).", "label": "49"}, {"num": 50, "type": "open", "q": "Warum hat eine doppelläufige Flinte meist unterschiedliche Chokebohrungen?", "a": "Damit das Wild auch auf unterschiedlichen Entfernungen wirkungsvoll beschossen werden kann.", "label": "50"}, {"num": 51, "type": "open", "q": "Können auch Einzelgeschosse aus Flinten verschossen werden?", "a": "Ja, sogenannte Flintenlaufgeschosse (FLG) für den Schuss auf Schalenwild.", "label": "51"}, {"num": 52, "type": "open", "q": "Nennen Sie die maximale weidgerechte Schussentfernung für den Schuss mit Flintenlaufgeschossen. Aus welchem Grund unterlässt man den weiteren Schuss?", "a": "Maximal 40 Meter. Da eine Flinte keinen gezogenen Lauf hat, nimmt die Treffergenauigkeit ab.", "label": "52"}, {"num": 53, "type": "open", "q": "Wodurch unterscheidet sich die Doppelflinte von der Bockflinte ihrer Bauart nach?", "a": "Doppelflinte: zwei nebeneinanderliegende glatte Läufe,\nBockflinte: zwei übereinanderliegende glatte Läufe (aufgebockt).", "label": "53"}, {"num": 54, "type": "open", "q": "Beschreiben Sie die Laufanordnung eines Standarddrillings.", "a": "Er besteht aus zwei oben liegenden Flintenläufen, mittig darunter liegt ein Büchsenlauf.", "label": "54"}, {"num": 55, "type": "open", "q": "Beschreiben Sie die Laufanordnung eines Bergstutzens.", "a": "Der Bergstutzen besitzt einen kleinkalibrigen, und einen großkalibrigen Büchsenlauf. Die Läufe liegen übereinander.", "label": "55"}, {"num": 56, "type": "open", "q": "Beschreiben Sie die Laufanordnung einer Bockbüchsflinte.", "a": "Sie besteht aus übereinander liegendem Flinten- und Büchsenlauf.", "label": "56"}, {"num": 57, "type": "open", "q": "Welche technische Funktion hat ein Stecher bei einer Jagdwaffe?", "a": "Die Verringerung des Abzugsgewichts, um einen präzisen Kugelschuss abgeben zu können.", "label": "57"}, {"num": 58, "type": "open", "q": "Welche Stecherarten unterscheidet man?", "a": "Den Deutschen Stecher (Doppelzüngelstecher) und den französischen Stecher (Rückstecher).", "label": "58"}, {"num": 59, "type": "open", "q": "Wann wird eine Waffe eingestochen?", "a": "Im Anschlag als letzten Vorgang vor der Schussabgabe, (wenn Wild breit vor dem Schützen steht).", "label": "59"}, {"num": 60, "type": "open", "q": "Nennen Sie Sicherungsarten und jeweils ein Beispiel an welchem Waffentyp diese Sicherung zu finden ist.", "a": "Flügelsicherung: Repetierbüchse, Schiebesicherung: Bockflinte, Druckknopfsicherung: Halbautomatische Langwaffe", "label": "60"}, {"num": 61, "type": "open", "q": "Wann wird eine Waffe entsichert?", "a": "Im Anschlag unmittelbar vor dem Schuss (aber vor dem Einstechen).", "label": "61"}, {"num": 62, "type": "open", "q": "Nennen Sie sechs Kipplaufwaffen die zur Jagd verwendet werden.", "a": "Doppelflinte, Bockflinte, Bockbüchsflinte, Drilling, Kipplaufbüchse, Bergstutzen", "label": "62"}, {"num": 63, "type": "open", "q": "Welche Kipplaufwaffen haben keine Sicherungen?", "a": "Hahnflinten und sog. Handspanner, diese werden durch einen Schieber auf dem Kolbenhals gespannt.", "label": "63"}, {"num": 64, "type": "open", "q": "Aus welchen vier Teilen besteht eine Langwaffe?", "a": "Lauf mit Patronenlager, Verschluss, Schloss, Schaft", "label": "64"}, {"num": 65, "type": "open", "q": "Was bezeichnet man als Basküle?", "a": "Der Systemkasten bei Kipplaufwaffen, enthält Verschluss und Schlossteile.", "label": "65"}, {"num": 66, "type": "open", "q": "Welchen Geschossdurchmesser hat die Büchsenpatrone im Kaliber .22 Hornet?", "a": "5,6 mm oder 0,22 Zoll", "label": "66"}, {"num": 67, "type": "open", "q": "Wie weit gefährdet ein Schrotschuss das Hintergelände?", "a": "Schrotstärke x 100 (z.B. 3,5 mm x 100 = 350 Meter)", "label": "67"}, {"num": 68, "type": "open", "q": "Wie weit kann ein Büchsengeschoss das Hintergelände gefährden?", "a": "ca. 5.000 Meter und weiter bei einem Abgangswinkel von 30°", "label": "68"}, {"num": 69, "type": "open", "q": "Wie weit kann ein Flintenlaufgeschoss das Hintergelände gefährden?", "a": "ca. 1.500 Meter bei einem Abgangswinkel von 30°", "label": "69"}, {"num": 70, "type": "open", "q": "Wie weit kann ein Kleinkalibergeschoss das Hintergelände gefährden?", "a": "ca. 1.500 Meter bei einem Abgangswinkel von 30°", "label": "70"}, {"num": 71, "type": "open", "q": "Nennen Sie gängige Schlosskonstruktionen bei Kipplaufwaffen!", "a": "Blitz-, Kasten- und Seitenschlosse", "label": "71"}, {"num": 72, "type": "open", "q": "Worauf muss geachtet werden bevor eine Waffe geladen wird?", "a": "Ob die Läufe frei sind und das Kaliber der Waffe und die Munition identisch sind.", "label": "72"}, {"num": 73, "type": "open", "q": "Wann darf man die Waffe im Revier laden?", "a": "Vor Beginn der Jagdausübung, bei Gesellschaftsjagden, sobald der Stand eingenommen ist.", "label": "73"}, {"num": 74, "type": "open", "q": "Was ist beim Schießen auf Wasser oder Eis zu beachten?", "a": "Verminderte Eindringtiefe, erhöhte Gefahr durch Abpraller (Prellschrote) und Querschläger.", "label": "74"}, {"num": 75, "type": "open", "q": "Nennen Sie vier unterschiedliche Verschlussarten bei Kipplaufwaffen?", "a": "Laufhakenverschluss, Greener-, Doppelgreener-, Purdey-, Flanken,- Keilverschluss.", "label": "75"}, {"num": 76, "type": "open", "q": "Welche gesetzliche Einschränkung gibt es bezüglich der Anzahl der Patronen bei halbautomatischen Langwaffen?", "a": "Die Waffe darf bei der Jagdausübung mit max. 3 Patronen geladen sein.", "label": "76"}, {"num": 77, "type": "open", "q": "Was ist ein Ejektor?", "a": "Ein Patronenauswerfer, der mit Federkraft beim Abknicken der Läufe die abgeschossenen Patronenhülsen auswirft (schnelleres Nachladen möglich).", "label": "77"}, {"num": 78, "type": "open", "q": "Was ist ein Patronenauszieher?", "a": "Eine Kralle am Verschluss einer Repetierbüchse, die in eine Rille an der Patronenhülse greift und diese aus dem Patronenlager hervorzieht, bzw. die Patronen bei Kipplaufwaffen aus dem Patronenlager herauszieht.", "label": "78"}, {"num": 79, "type": "open", "q": "Was zeigen die Signalstifte bei Langwaffen an?", "a": "Sie zeigen an, ob die Schlosse gespannt sind oder nicht.", "label": "79"}, {"num": 80, "type": "open", "q": "Welche Funktion haben Magazine bei Jagdwaffen?", "a": "Sie sind Sammelbehältnisse für Patronen, aus denen nach der Schussabgabe eine neue Patrone zugeführt werden kann.", "label": "80"}, {"num": 81, "type": "open", "q": "Nennen Sie vier Magazinarten und jeweils ein Beispiel an welchem Waffentyp dieses Magazin zu finden ist.", "a": "Röhrenmagazin: Halbautomatische Langwaffe, Zickzackmagazin: Repetierbüchse, Reihenmagazin: Pistole, Trommelmagazin: Repetierbüchse", "label": "81"}, {"num": 82, "type": "open", "q": "Nennen Sie wesentliche Teile an einer Waffe mit feststehenden Läufen und bei Kipplaufwaffen.", "a": "Lauf mit Patronenlager und Verschluss bei Waffen mit feststehenden Läufen,\nLauf mit Patronenlager und Basküle bei Kipplaufwaffen.", "label": "82"}, {"num": 83, "type": "open", "q": "Nennen Sie vier Kontrollaufgaben die ein staatliches Beschussamt an einer Waffe durchführt.", "a": "Überprüfung der Haltbarkeit, Funktionssicherheit, Maßhaltigkeit, richtige Kennzeichnung der Waffe", "label": "83"}, {"num": 84, "type": "open", "q": "Nennen Sie vier Standorte an denen es Beschussämter in Deutschland gibt oder gab!", "a": "Köln, München, Suhl, Hannover, Ulm, Kiel, Berlin, Mellrichstadt", "label": "84"}, {"num": 85, "type": "open", "q": "Nennen sie sechs Beschusszeichen die sich auf einer Waffe befinden.", "a": "Waffennummer, Kaliber, Beschussstempel N = „Nitro“ (oder SP = Schwarzpulver), Beschussjahr, Ortszeichen des Prüfamtes, Herkunftsland, Hersteller.", "label": "85"}, {"num": 86, "type": "open", "q": "Was bedeutet die Bezeichnung “Kaliber” für a) Büchsenläufe, b) Flintenläufe?", "a": "a) Kombination aus Geschossdurchmesser und Hülsenlänge, bei Zollkalibern wird nur der Geschossdurchmesser angegeben.\nb) Nach altem englischen Pfund bemessen (z.B. Kaliber 12 = 12 Rundkugeln, die zusammen ein englisches Pfund= 453,6g ergeben, entspricht dem Laufdurchmesser einer dieser Kugeln).", "label": "86"}, {"num": 87, "type": "open", "q": "Welche gängigen Flintenkaliber gibt es?", "a": "Kaliber 12, 16 und 20", "label": "87"}, {"num": 88, "type": "open", "q": "Nennen Sie vier Angaben, die sich auf einer Schrotpatrone befinden können.", "a": "Das Kaliber, die Hülsenlänge, die Schrotstärke, Magnumbeschuss, Stahlschrot", "label": "88"}, {"num": 89, "type": "open", "q": "In welchem Zustand wird die Hülsenlänge gemessen?", "a": "Bei Flintenmunition im abgeschossenem (offenen) Zustand.\nBei Büchsenmunition vom Hülsenboden bis zum Hülsenmund.", "label": "89"}, {"num": 90, "type": "open", "q": "Nennen Sie sechs Bestandteile, aus denen eine Schrotpatrone besteht.", "a": "Hülse, Zündhütchen, Bodenkappe, Treibladung, Schrotbecher oder Zwischenmittel, Schrote", "label": "90"}, {"num": 91, "type": "open", "q": "Welche vier gängigen Hülsenlängen gibt es bei Flintenpatronen?", "a": "65 mm, 67,5 mm, 70 mm, 76 mm, 89mm", "label": "91"}, {"num": 92, "type": "open", "q": "Darf man aus einem Flintenlauf mit der Kaliberangabe 12/70 Patronen mit der Bezeichnung 12/76 verschießen? Begründen Sie Ihre Antwort.", "a": "Nein! Bei der Abgabe des Schusses bördelt oder faltet sich die Patronenhülse auf. Die aufgefaltete Hülse würde sich in den Übergangskonus legen und es würde so zu einer erhöhten Gasdruckbildung kommen. Eine Laufsprengung wäre nicht ausgeschlossen.", "label": "92"}, {"num": 93, "type": "open", "q": "Welche Schrotstärke sollte auf a) Gans b) Fuchs c) Hase und d) Kaninchen verschossen werden?", "a": "a) Gans ca. 4 mm, b) Fuchs ca. 3,5 mm, c) Hase ca. 3 mm, d) Kaninchen ca. 2,5 mm.", "label": "93"}, {"num": 94, "type": "open", "q": "Was sind Posten und auf welche Wildarten dürfen Posten nicht verwendet werden?", "a": "Schrote über 4 mm Durchmesser. Auf Schalenwild ist der Schuss mit Posten nicht erlaubt.", "label": "94"}, {"num": 95, "type": "open", "q": "Was sind Streupatronen, wofür werden sie verwendet?", "a": "Schrotpatronen mit Streukreuz, welches dafür sorgt, dass sich die Schrotgarbe sofort nach Verlassen des Laufes verteilt und so zum Schuss auf nahe Entfernungen (10-15 m) eingesetzt werden kann.", "label": "95"}, {"num": 96, "type": "open", "q": "Nennen Sie vier Elemente einer Büchsenpatrone!", "a": "Hülse, Zündhütchen, Pulverladung, Geschoss", "label": "96"}, {"num": 97, "type": "open", "q": "Aus welchem Büchsentyp werden i.d.R. Büchsenpatronen mit Rand verschossen?", "a": "Aus Kipplaufwaffen („R“ auf dem Hülsenboden).", "label": "97"}, {"num": 98, "type": "open", "q": "Für welchen Waffentyp ist eine Büchsenpatrone mit Rille bestimmt?", "a": "Für eine Repetierbüchse oder eine halbautomatische Büchse.", "label": "98"}, {"num": 99, "type": "open", "q": "Welche Besonderheit hat eine Gürtelhülse?", "a": "Die Hülse hat einen umlaufenden Ring im unteren Bereich. Dieser dient zur Einhaltung des Verschlussabstandes. Häufige bei Büchsenpatronen mit hohem Gasdruck (.300 Win Mag.).", "label": "99"}, {"num": 100, "type": "open", "q": "Was bedeutet die Angabe 7 x 64 RWS auf dem Hülsenboden einer Büchsenpatrone?", "a": "7 mm = Geschossdurchmesser, 64 mm = Hülsenlänge\nRWS = Hersteller (z.B. auch HP, S&B, Norma, etc. möglich)", "label": "100"}, {"num": 101, "type": "open", "q": "Was bedeutet die Angabe 8 x 57 IRS auf dem Hülsenboden?", "a": "8 mm Geschossdurchmesser, 57 mm Hülsenlänge I = Infanterie, R = Rand, S = „stark“.", "label": "101"}, {"num": 102, "type": "open", "q": "Was ist bei Verwendung von „S“- Kalibern in Bezug auf die Sicherheit unbedingt zu beachten (z.B. 8 x 57 IS)?", "a": "Der Geschossdurchmesser ist um 0,1 mm stärker, also ca. 8,1 mm. Die Patronen dürfen nur aus den entsprechend gekennzeichneten Waffen verschossen werden!", "label": "102"}, {"num": 103, "type": "open", "q": "Wie sind „S“- Kaliber - Patronen deutscher Hersteller gekennzeichnet?", "a": "Mit einem schwarz (oder rot) gefärbten Zündhütchen, einem „S“ auf dem Hülsenboden, einer Rändelung am Geschoss und einer entsprechenden Angabe auf der Verpackung.", "label": "103"}, {"num": 104, "type": "open", "q": "Erläutern Sie die Bedeutung der Angabe .30-06 auf dem Hülsenboden?", "a": ".30 ist eine Zollangabe (0,30 Zoll); Umrechnungsfaktor = 25,4 mm (also 0,30 Zoll x 25,4 = 7,62 mm Geschossdurchmesser), 06 ist das Konstruktionsjahr 1906, die Hülsenlänge wird nicht angegeben.", "label": "104"}, {"num": 105, "type": "open", "q": "Nennen Sie sechs Büchsengeschosse.", "a": "H-Mantelgeschosse, Kegelspitzgeschosse, TIG & TUG, Vollmantelgeschosse, sowie Teilmantel-Rundkopfgeschosse und Teilmantel-Spitzgeschosse, bleifreie Geschosse", "label": "105"}, {"num": 106, "type": "open", "q": "Welche Läufe bezeichnet man als S-Läufe?", "a": "Büchsenläufe, die sich zum Verschießen von 8 mm S-Munition eignen.", "label": "106"}, {"num": 107, "type": "open", "q": "Wozu benutzt man Vollmantelgeschosse?", "a": "Zur Jagd auf Großwild, in Deutschland nicht auf Schalenwild, zur Bejagung des Raubwildes (balgschonend).", "label": "107"}, {"num": 108, "type": "open", "q": "Wie und womit wird ein Fangschuss angebracht?", "a": "Aus dichter Entfernung auf den Träger/Haupt, ansonsten auf die Kammer, zweckmäßigerweise mit einer Langwaffe (bei Kurzwaffen muss die Mündungsenergie mindestens 200 Joule betragen).", "label": "108"}, {"num": 109, "type": "open", "q": "Wie hoch sind die Abzugswiderstände bei Flinten mit zwei Abzügen?", "a": "Vorderer Abzug ca. 18 Newton (1,8kg), hinterer Abzug ca. 22 Newton (2,2 kg).", "label": "109"}, {"num": 110, "type": "open", "q": "Was versteht man unter halbautomatischen Waffen?", "a": "Waffen, die nach dem Schuss automatisch (durch Gasdruck oder Rückstoß) die leere Hülse auswerfen und eine neue Patrone laden. Bei einer halbautomatischen Waffe ist jeder Schuss über den Abzug separat auszulösen (keine „Maschinengewehrfunktion“).", "label": "110"}, {"num": 111, "type": "open", "q": "Welche halbautomatischen Waffen dürfen im Jagdbetrieb verwendet werden?", "a": "Büchsen, Flinten, Pistolen", "label": "111"}, {"num": 112, "type": "open", "q": "Wodurch wird der Repetiervorgang bei halbautomatischen Waffen nach der Schussabgabe ausgelöst?", "a": "Durch Rückstoß oder Gasdruck", "label": "112"}, {"num": 113, "type": "open", "q": "Was sind Schonzeitpatronen?", "a": "Kleinkalibrige Patronen, die in der Schonzeit des Schalenwildes zum Schuss auf Raubwild eingesetzt werden (Schussknall nicht so laut).", "label": "113"}, {"num": 114, "type": "open", "q": "Nennen Sie vier Schonzeitkaliber und begründen Sie, warum der Februar der wichtigste Monat ist, in dem diese Kaliber verwendet werden.", "a": ".22 lfb; .22 Magnum; .22 Hornet., 17 Hornet.", "label": "114"}, {"num": 115, "type": "open", "q": "Warum sollte der Jäger immer einen größeren Vorrat Büchsenpatronen für seine Waffe einkaufen?", "a": "Weil Patronen aus einer Fertigungsserie gleichbleibend gute Schussleistungen und Treffpunktlagen ergeben, bei neuen Fertigungsserien kann es zu geringen Treffpunktabweichungen kommen.", "label": "115"}, {"num": 116, "type": "open", "q": "Was kann passieren, wenn aus einer kombinierten Waffe mehrere Büchsenschüsse rasch hintereinander abgegeben werden?", "a": "Eine Veränderung der Treffpunktlage, meist nach oben (Schüsse “klettern”, d.h. warmer Lauf dehnt sich in Richtung des kalten Laufes aus).", "label": "116"}, {"num": 117, "type": "open", "q": "Was versteht man unter dem Begriff Ballistik?", "a": "Die Lehre vom Schuss, bei der der Einfluss physikalischer Eigenschaften von Bedeutung ist.", "label": "117"}, {"num": 118, "type": "open", "q": "Wodurch wird die Flugbahn des Geschosses beeinflusst?", "a": "Erdanziehung, Geschossgewicht, Luftwiderstand, Temperatur, Witterung, Wind, Hindernisse", "label": "118"}, {"num": 119, "type": "open", "q": "Nennen Sie vier Ballistik Arten!", "a": "Innenballistik, Mündungsballistik, Außenballistik, Zielballistik", "label": "119"}, {"num": 120, "type": "open", "q": "Was bezeichnet man als die “günstigste Einschussentfernung (GEE)”?", "a": "Die Stelle, an der das Geschoss zum zweiten Mal die Visierlinie schneidet, um eine möglichst gestreckte Flugbahn zu erreichen.", "label": "120"}, {"num": 121, "type": "open", "q": "Warum wird eine Waffe auf die GEE eingeschossen?", "a": "Um eine gestreckte Flugbahn zu erhalten, so dass auch bei unterschiedlichsten Entfernungen keine Haltepunktveränderung vorgenommen werden muss.", "label": "121"}, {"num": 122, "type": "open", "q": "Nennen Sie vier Angaben die in einer Schusstafel, auf einer Munitionspackung zu finden sind.", "a": "Geschossgewicht, Geschossenergie, Geschossart, GEE, Gasdruck", "label": "122"}, {"num": 123, "type": "open", "q": "Was misst man in Joule?", "a": "Die Energie des Geschosses.", "label": "123"}, {"num": 124, "type": "open", "q": "Was versteht man unter E 100?", "a": "Die Energie des Geschosses auf 100 Meter Entfernung.", "label": "124"}, {"num": 125, "type": "open", "q": "Was versteht man unter E 0?", "a": "Die Energie eines Geschosses, gemessen an der Mündung der Waffe (Mündungsenergie).", "label": "125"}, {"num": 126, "type": "open", "q": "Was versteht man unter V 0?", "a": "Die Geschwindigkeit eines Geschosses, gemessen an der Mündung der Waffe (Mündungsgeschwindigkeit).", "label": "126"}, {"num": 127, "type": "open", "q": "Was bezeichnet man als “offene Visierung“?", "a": "Kimme (Visier) und Korn, bzw. Laufschiene und Korn", "label": "127"}, {"num": 128, "type": "open", "q": "Wann nutzt man im jagdlichen Einsatz den Schuss über Kimme und Korn?", "a": "Nachsuche, Drückjagd, Abgabe von Fangschüssen auf kurze Entfernung, Kurzwaffeneinsatz", "label": "128"}, {"num": 129, "type": "open", "q": "Nennen Sie sechs wesentliche Teile eines Zielfernrohres!", "a": "Objektiv, Okular, Sehschärfenverstellung, Umkehrsystem, Absehen, Absehenverstellung", "label": "129"}, {"num": 130, "type": "open", "q": "Was bezeichnet man als Absehen?", "a": "Das Fadenkreuz im Zielfernrohr zur Zielerfassung.", "label": "130"}, {"num": 131, "type": "open", "q": "Wie werden gängige Absehen bezeichnet?", "a": "Absehen Nr. 1, Nr. 4, auch Absehen mit Leuchtpunkt.", "label": "131"}, {"num": 132, "type": "open", "q": "Wie wird das Absehen im Zielfernrohr verstellt?", "a": "Mit Hilfe der Höhen- und Seitenverstellung am Zielfernrohr.", "label": "132"}, {"num": 133, "type": "open", "q": "Welche Wirkung erzielt man beim Drehen der Seitenverstellung am Zielfernrohr?", "a": "Die Treffpunktlage der Waffe wandert nach rechts oder links.", "label": "133"}, {"num": 134, "type": "open", "q": "Aus welchem Grund muss das Absehen im Zielfernrohr verstellt werden?", "a": "Um eine neue Waffe einzuschießen, oder weil sich die Treffpunktlage verändert hat. (Die Waffe ist umgefallen, oder ein anderes Geschoss, Geschosstyp oder Geschossgewicht soll verwendet werden).", "label": "134"}, {"num": 135, "type": "open", "q": "Was bedeutet der Ausdruck “zentriertes Absehen” beim Zielfernrohr?", "a": "Die Mittellage des Absehens wird optisch nicht verändert. (Das Fadenkreuz bleibt in der Mitte, obwohl das Absehen verstellt wird).", "label": "135"}, {"num": 136, "type": "open", "q": "Ist das Entfernungsschätzen auch mit einem variablen Zielfernrohr möglich?", "a": "Ja, aber nur bei Zielfernrohren mit dem Absehen in der Objektivbildebene (Absehen wird bei Vergrößerungswechsel mit vergrößert dargestellt).", "label": "136"}, {"num": 137, "type": "open", "q": "Wovon müssen Sie sich vor dem Schuss übers Zielfernrohr vergewissern?", "a": "Mögliche Gefährdung des Hintergeländes und dass sich kein Hindernis zwischen Laufmündung und Ziel befindet, dieses kann leicht übersehen werden.", "label": "137"}, {"num": 138, "type": "open", "q": "Was bedeutet der Begriff “Parallaxe”?", "a": "Die scheinbare Bildverschiebung des Absehens auf dem Ziel, wenn die Stellung des Auges zum Okular nicht optimal ist (kein gerader Einblick). Man sieht Schatten im Zielfernrohr.", "label": "138"}, {"num": 139, "type": "open", "q": "Wie groß ist der optimale Augenabstand zum Okular vom Zielfernrohr und warum sollte er eingehalten werden?", "a": "Ca. 8- 12 cm. Um Schatten (Parallaxe) beim Blick durch das Zielfernrohr zu vermeiden und eine Treffpunktverlagerung zu verhindern.", "label": "139"}, {"num": 140, "type": "open", "q": "Was versteht man unter einem Spektiv?", "a": "Ein monokulares, d.h. zum einäugigen Sehen bestimmtes Fernrohr mit hoher Vergrößerungsleistung.", "label": "140"}, {"num": 141, "type": "open", "q": "Wofür verwendet man ein Spektiv im jagdlichen Einsatz?", "a": "Um Wild auf weite Entfernung ansprechen zu können.", "label": "141"}, {"num": 142, "type": "open", "q": "Wozu dient eine Zielfernrohrmontage?", "a": "Verbindung zwischen Zielfernrohr und Waffe.", "label": "142"}, {"num": 143, "type": "open", "q": "Nennen Sie vier gängige Zielfernrohrmontagen.", "a": "Fest-, Schwenk-, Einhak-, Sattel- und Aufschubmontage.", "label": "143"}, {"num": 144, "type": "open", "q": "Benennen Sie acht Bauteile eines Revolvers.", "a": "Lauf, Korn, Visier, Trommel, Hahn, Rahmen, Patronenausstoßer, Sperrschieber, Griffstück, Griffschalen, Abzug", "label": "144"}, {"num": 145, "type": "open", "q": "Benennen Sie acht Bauteile einer Pistole.", "a": "Lauf, Korn, Visier, Schlitten, Hahn, Magazin, Signalstift, Sicherung, Griffstück, Griffschalen, Abzug", "label": "145"}, {"num": 146, "type": "open", "q": "Wie heißt die Aufnahmevorrichtung für Munition bei a) Pistole und b) Revolver?", "a": "a) Magazin b) Trommel", "label": "146"}, {"num": 147, "type": "open", "q": "Was bedeutet: a) Single action b) Double action?", "a": "a) Hahn muss vor dem Schuss eigens von Hand gespannt werden, b) bei Betätigung des Abzuges wird der Hahn für die Schussabgabe gespannt.", "label": "147"}, {"num": 148, "type": "open", "q": "Nennen Sie vier klassische Revolverkaliber.", "a": ".38 Spezial, .357 Magnum, .44 Magnum, .22 LfB", "label": "148"}, {"num": 149, "type": "open", "q": "Nennen Sie vier klassische Pistolenkaliber.", "a": "7,65 mm, 9 mm Luger, .45 Auto, .22 LfB", "label": "149"}, {"num": 150, "type": "open", "q": "Nennen Sie Möglichkeiten für den Einsatz einer Kurzwaffe im Jagdbetrieb.", "a": "Fangschuss auf Wild, Tötung von Raubwild in Fallen, Schuss auf Raubwild bei der Baujagd", "label": "150"}, {"num": 151, "type": "mc", "q": "Sie wollen für ihre Langwaffe Munition kaufen. Als Jagdscheininhaber benötigen Sie dafür:", "opts": [{"k": "a", "text": "Den Jagdschein", "ok": true}, {"k": "b", "text": "Die Waffenbesitzkarte", "ok": false}, {"k": "c", "text": "Den Munitionserwerbsschein", "ok": false}], "label": "151"}, {"num": 152, "type": "mc", "q": "Wie viele Langwaffen darf ein Jagdscheininhaber erwerben?", "opts": [{"k": "a", "text": "Eine Langwaffe", "ok": false}, {"k": "b", "text": "Zwei Langwaffen", "ok": false}, {"k": "c", "text": "Ohne Begrenzung", "ok": true}], "label": "152"}, {"num": 153, "type": "mc", "q": "Wie viele Kurzwaffen darf ein Jagdscheininhaber erwerben?", "opts": [{"k": "a", "text": "Ohne Begrenzung", "ok": false}, {"k": "b", "text": "Eine Kurzwaffe", "ok": false}, {"k": "c", "text": "Zwei Kurzwaffen ohne besonderes Bedürfnis", "ok": true}], "label": "153"}, {"num": 154, "type": "mc", "q": "Welches Dokument muss ich zum Erwerb einer Kurzwaffe vorlegen?", "opts": [{"k": "a", "text": "Den Jagdschein", "ok": false}, {"k": "b", "text": "Die Waffenbesitzkarte mit gültiger Erwerbsberechtigung", "ok": true}, {"k": "c", "text": "Den Munitionserwerbsschein", "ok": false}], "label": "154"}, {"num": 155, "type": "mc", "q": "Welche Kurzwaffenmunition kann ein Jäger kaufen?", "opts": [{"k": "a", "text": "Nur Kurzwaffenmunition, dessen Kaliber in der Waffenbesitzkarte des Jägers eingetragen ist", "ok": true}, {"k": "b", "text": "Kurzwaffenmunition in jedem Kaliber", "ok": false}, {"k": "c", "text": "Kurzwaffenmunition, bei der das Haltbarkeitsdatum noch nicht abgelaufen ist", "ok": false}], "label": "155"}, {"num": 156, "type": "mc", "q": "Welche Langwaffenmunition kann ein Jäger kaufen?", "opts": [{"k": "a", "text": "Langwaffenmunition, dessen Kaliber in der Waffenbesitzkarte des Jägers eingetragen ist", "ok": false}, {"k": "b", "text": "Langwaffenmunition in jedem Langwaffenkaliber", "ok": true}, {"k": "c", "text": "Langwaffenmunition, bei der das Haltbarkeitsdatum noch nicht abgelaufen ist", "ok": false}], "label": "156"}, {"num": 157, "type": "mc", "q": "Welche Waffen dürfen sich Jagdscheininhaber grundsätzlich untereinander ausleihen?", "opts": [{"k": "a", "text": "nur Kurzwaffen", "ok": false}, {"k": "b", "text": "nur Flinten", "ok": false}, {"k": "c", "text": "Langwaffen und Kurzwaffen", "ok": true}], "label": "157"}, {"num": 158, "type": "mc", "q": "Bei welcher zuständigen Behörde bekommt der Jäger eine Waffenbesitzkarte?", "opts": [{"k": "a", "text": "Bei der Gemeinde", "ok": false}, {"k": "b", "text": "Beim Ordnungsamt des Landkreises oder der kreisfreien Stadt (in M-V)", "ok": true}, {"k": "c", "text": "Beim Kreisforstamt/Stadtforstamt", "ok": false}], "label": "158"}, {"num": 159, "type": "mc", "q": "Innerhalb welcher Frist muss die von einem Jagdscheininhaber geliehene Langwaffe dem Eigentümer zurückgegeben werden?", "opts": [{"k": "a", "text": "Innerhalb von zwei Wochen", "ok": false}, {"k": "b", "text": "Innerhalb von einem Monat", "ok": true}, {"k": "c", "text": "Innerhalb von zwei Monaten", "ok": false}], "label": "159"}, {"num": 160, "type": "mc", "q": "Innerhalb welcher Frist muss ein Jäger den Erwerb einer Kurz- oder Langwaffe seiner zuständigen Behörde anzeigen?", "opts": [{"k": "a", "text": "Eine Woche", "ok": false}, {"k": "b", "text": "Zwei Wochen", "ok": true}, {"k": "c", "text": "Vier Wochen", "ok": false}], "label": "160"}, {"num": 161, "type": "mc", "q": "Wie muss sich der Jäger verhalten, wenn er seine Jagdwaffe verliert (kein Diebstahl)?", "opts": [{"k": "a", "text": "Bei der Gemeinde melden", "ok": false}, {"k": "b", "text": "Bei der Feuerwehr melden", "ok": false}, {"k": "c", "text": "Unverzüglich beim Ordnungsamt des Landkreises (Waffenbehörde) melden", "ok": true}], "label": "161"}, {"num": 162, "type": "mc", "q": "Wo bewahrt der Jäger seine Waffen auf?", "opts": [{"k": "a", "text": "In einem entsprechend klassifizierten Waffenschrank", "ok": true}, {"k": "b", "text": "In einem abgeschlossenen Holzschrank", "ok": false}, {"k": "c", "text": "in einem stabilen Stahlschrank ohne Klassifizierung", "ok": false}], "label": "162"}, {"num": 163, "type": "mc", "q": "Welche Sicherheitsstufe muss der Waffenschrank mindestens zur Aufbewahrung von Langwaffen besitzen?", "opts": [{"k": "a", "text": "Sicherheitsstufe A", "ok": false}, {"k": "b", "text": "Sicherheitsstufe B", "ok": false}, {"k": "c", "text": "Widerstandsgrad 0", "ok": true}], "label": "163"}, {"num": 164, "type": "mc", "q": "Welche Sicherheitsstufe muss der Waffenschrank zur Aufbewahrung von Kurzwaffen mindestens besitzen?", "opts": [{"k": "a", "text": "Sicherheitsstufe A", "ok": false}, {"k": "b", "text": "Widerstandsgrad 0", "ok": true}, {"k": "c", "text": "Sicherheitsstufe B", "ok": false}], "label": "164"}, {"num": 165, "type": "mc", "q": "Wie ist die Aufbewahrung von Munition geregelt?", "opts": [{"k": "a", "text": "In einem Stahlblechbehälter oder Stahlblechschrank mit Schwenkriegelschloss", "ok": true}, {"k": "b", "text": "In einem abgeschlossenen Holzschrank", "ok": false}, {"k": "c", "text": "In einem Plastikbehälter mit Schloss", "ok": false}], "label": "165"}, {"num": 166, "type": "mc", "q": "Wo sollte der Jäger seinen Waffenschrank aufstellen?", "opts": [{"k": "a", "text": "In seinem Büro im Industriegebiet", "ok": false}, {"k": "b", "text": "In der Wohnung, in der er ständig wohnt", "ok": true}, {"k": "c", "text": "In seiner PKW-Garage abseits der Wohnung", "ok": false}], "label": "166"}, {"num": 167, "type": "mc", "q": "Welche Voraussetzungen muss ein Jungjäger vor dem Kauf einer Waffe bezüglich der Waffenaufbewahrung schaffen?", "opts": [{"k": "a", "text": "Er muss sich einen Jagdhund kaufen", "ok": false}, {"k": "b", "text": "Ein Waffenschrank muss vorhanden sein (mindestens Widerstandsgrad 0)", "ok": true}, {"k": "c", "text": "Er muss ein Jagdrevier pachten", "ok": false}], "label": "167"}, {"num": 168, "type": "mc", "q": "Wie führt ein Jäger erlaubnisfrei seine Waffe ins Revier?", "opts": [{"k": "a", "text": "Unterladen auf dem Beifahrersitz", "ok": false}, {"k": "b", "text": "Unterladen, im Futteral, Futteral abgeschlossen", "ok": false}, {"k": "c", "text": "Waffe entladen und getrennt von der Munition", "ok": true}], "label": "168"}, {"num": 169, "type": "mc", "q": "In welcher Form kann ein Jäger seine Waffe erlaubnisfrei zum Büchsenmacher transportieren?", "opts": [{"k": "a", "text": "Geladene Waffe offen auf dem Rücksitz", "ok": false}, {"k": "b", "text": "Mit dem Fahrrad und unverschlossenem Futteral", "ok": false}, {"k": "c", "text": "Waffe im verschlossenen Futteral und getrennt von der Munition", "ok": true}], "label": "169"}, {"num": 170, "type": "mc", "q": "Darf der Jäger während des erlaubnisfreien Transports seiner Waffe sein Fahrzeug verlassen, um seinen PKW an der Tankstelle aufzutanken?", "opts": [{"k": "a", "text": "Ja, sofern die Zugriffsmöglichkeit für nicht Berechtigte verhindert wird", "ok": true}, {"k": "b", "text": "In keinem Fall", "ok": false}, {"k": "c", "text": "Nur wenn er den Tankwart über die Waffe vor dem Tanken informiert", "ok": false}], "label": "170"}, {"num": 171, "type": "mc", "q": "Darf der Jäger eine Waffe in der Bahn, Bus, U-Bahn, Straßenbahn, Flugzeug, erlaubnisfrei transportieren?", "opts": [{"k": "a", "text": "Ja, auf eigene Gefahr", "ok": false}, {"k": "b", "text": "In keinem Fall", "ok": false}, {"k": "c", "text": "Nur nach Anmeldung der Waffe beim Verkehrsbetrieb", "ok": true}], "label": "171"}, {"num": 172, "type": "mc", "q": "Wohin darf ein Jäger seine Waffe erlaubnisfrei führen?", "opts": [{"k": "a", "text": "Von seiner Wohnung ins Revier", "ok": true}, {"k": "b", "text": "Vom Schießstand zum Volksfest", "ok": false}, {"k": "c", "text": "Vom Büchsenmacher zu einer Bank", "ok": false}], "label": "172"}, {"num": 173, "type": "mc", "q": "Was versteht man unter „kombinierten Waffen“?", "opts": [{"k": "a", "text": "Mehrläufige Langwaffen mit Schrot- und Büchsenläufen", "ok": true}, {"k": "b", "text": "Waffen mit mehreren Schrotläufen", "ok": false}, {"k": "c", "text": "Waffen mit mehreren Büchsenläufen", "ok": false}], "label": "173"}, {"num": 174, "type": "mc", "q": "Beschreiben Sie die Anordnung der Läufe eines Standartdrillings.", "opts": [{"k": "a", "text": "Zwei nebeneinanderliegende Flintenläufe, darunter mittig ein Büchsenlauf", "ok": true}, {"k": "b", "text": "Zwei Büchsenläufe übereinanderliegend", "ok": false}, {"k": "c", "text": "Zwei Flintenläufe nebeneinanderliegend, zwei Büchsenläufe darunter angebracht", "ok": false}], "label": "174"}, {"num": 175, "type": "mc", "q": "Darf man mit Schrot Schalenwild erlegen?", "opts": [{"k": "a", "text": "Ja, bis 35 Meter", "ok": false}, {"k": "b", "text": "Nein, (einzige Ausnahme sind zwingende Gründe des Tierschutzes)", "ok": true}, {"k": "c", "text": "Nur mit 4 mm Schrotstärke", "ok": false}], "label": "175"}, {"num": 176, "type": "mc", "q": "Wie hoch ist die Auftreffenergie in 100 m Entfernung, die für die Verwendung von Büchsenpatronen zum Schuss auf Rehwild vorgeschrieben ist?", "opts": [{"k": "a", "text": "1.000 Joule", "ok": true}, {"k": "b", "text": "2.000 Joule", "ok": false}, {"k": "c", "text": "3.000 Joule", "ok": false}], "label": "176"}, {"num": 177, "type": "mc", "q": "Welcher Mindestgeschossdurchmesser ist für die Verwendung von Büchsenpatronen zum Schuss auf alles Schalenwild vorgeschrieben?", "opts": [{"k": "a", "text": "5,6 mm", "ok": false}, {"k": "b", "text": "6,5 mm", "ok": true}, {"k": "c", "text": "7 mm", "ok": false}], "label": "177"}, {"num": 178, "type": "mc", "q": "Mit welchen Patronen darf der Jäger aus einer Flinte Schalenwild beschießen?", "opts": [{"k": "a", "text": "Mit Schrot", "ok": false}, {"k": "b", "text": "Mit Posten", "ok": false}, {"k": "c", "text": "Mit Flintenlaufgeschossen", "ok": true}], "label": "178"}, {"num": 179, "type": "mc", "q": "Wie viele Patronen darf das Magazin einer halbautomatischen Langwaffe höchstens aufnehmen können, wenn der Jäger diese zum sportlichen Schießen nutzen möchte?", "opts": [{"k": "a", "text": "Maximal 10 Patronen", "ok": true}, {"k": "b", "text": "Maximal 2 Patronen", "ok": false}, {"k": "c", "text": "Unbegrenzt", "ok": false}], "label": "179"}, {"num": 180, "type": "mc", "q": "Wie viele Patronen darf das Magazin einer halbautomatischen Kurzwaffe höchstens aufnehmen können, wenn der Jäger diese für den Fangschuss nutzen möchte?", "opts": [{"k": "a", "text": "Unbegrenzt", "ok": false}, {"k": "b", "text": "Maximal 20 Patronen", "ok": true}, {"k": "c", "text": "Maximal 3 Patronen", "ok": false}], "label": "180"}, {"num": 181, "type": "mc", "q": "Auf welche Entfernung jagt man maximal mit einem üblichen Flintenlaufgeschoss?", "opts": [{"k": "a", "text": "Bis 120 Meter", "ok": false}, {"k": "b", "text": "Mindestens 80 Meter", "ok": false}, {"k": "c", "text": "Maximal 40 Meter", "ok": true}], "label": "181"}, {"num": 182, "type": "mc", "q": "Welchen Nachteil haben Flintenlaufgeschosse bei der Bejagung von schwerem Schalenwild?", "opts": [{"k": "a", "text": "Keinen", "ok": false}, {"k": "b", "text": "Häufig keinen Ausschuss aufgrund der geringen Auftreffenergie", "ok": true}, {"k": "c", "text": "Große Wildbret-Zerstörung aufgrund der hohen Energieabgabe an den Wildkörper", "ok": false}], "label": "182"}, {"num": 183, "type": "mc", "q": "Wie nennt man den Verschluss bei Repetierbüchsen?", "opts": [{"k": "a", "text": "Zylinderverschluss", "ok": true}, {"k": "b", "text": "Selbstladeverschluss", "ok": false}, {"k": "c", "text": "Kipplaufverschluss", "ok": false}], "label": "183"}, {"num": 184, "type": "mc", "q": "Was beeinflusst die Streuung der Schrotgabe nach der Schussabgabe?", "opts": [{"k": "a", "text": "Die Wahl der Chokeeinsätze", "ok": true}, {"k": "b", "text": "Das Gewicht der Schrotgabe", "ok": false}, {"k": "c", "text": "Die Schrotstärke", "ok": false}], "label": "184"}, {"num": 185, "type": "mc", "q": "Kann man Flintenlaufgeschosse aus einem Flintenlauf mit Vollchoke verschießen?", "opts": [{"k": "a", "text": "Ja, da sich das Flintenlaufgeschoss dem Choke anpasst, ohne ihn zu beschädigen", "ok": true}, {"k": "b", "text": "In keinem Fall", "ok": false}, {"k": "c", "text": "Nur aus Flintenläufen mit Halbchoke", "ok": false}], "label": "185"}, {"num": 186, "type": "mc", "q": "Was bewirkt der Schrotschuss aus einem Flintenlauf mit Skeetchoke?", "opts": [{"k": "a", "text": "Große Ausdehnung der Schrotgabe, geeignet für den Schuss auf nahe Entfernung", "ok": true}, {"k": "b", "text": "Eine gute Deckung der Schrotgabe auf weite Entfernung", "ok": false}, {"k": "c", "text": "Ideale Chokebohrung für das Trapschießen auf einem Schießstand", "ok": false}], "label": "186"}, {"num": 187, "type": "mc", "q": "Auf welche Entfernung verwendet man einen Skeetchoke?", "opts": [{"k": "a", "text": "Für den Schrotschuss auf 30m-35m", "ok": false}, {"k": "b", "text": "Für den Schrotschuss auf 20m-25m", "ok": false}, {"k": "c", "text": "Für den Schrotschuss auf 10m-15m", "ok": true}], "label": "187"}, {"num": 188, "type": "mc", "q": "Was versteht man unter dem Begriff \"Deckung\" beim Schrotschuss?", "opts": [{"k": "a", "text": "Die Menge der Schrote auf dem Flug zum Ziel", "ok": false}, {"k": "b", "text": "Die Menge der Schrote, die sich in einer Schrotpatrone befinden", "ok": false}, {"k": "c", "text": "Die Menge der Schrote, die im selben Moment gleichmäßig das Ziel treffen", "ok": true}], "label": "188"}, {"num": 189, "type": "mc", "q": "Wie erziele ich eine ausreichende Deckung von Schroten auf dem Wildkörper?", "opts": [{"k": "a", "text": "Durch die Verwendung unterschiedlicher Chokebohrungen in einer Bock- oder Doppelflinte und durch die Verwendung hochwertiger Schrotpatronen", "ok": true}, {"k": "b", "text": "Durch die Verwendung von einem Skeetchoke", "ok": false}, {"k": "c", "text": "Durch die Verwendung von einem Halbchoke in beiden Flintenläufen", "ok": false}], "label": "189"}, {"num": 190, "type": "mc", "q": "Wie kontrollieren Sie am sichersten, ob sich Patronen in einem Drilling befinden?", "opts": [{"k": "a", "text": "Durch Kontrollieren der Signalstifte", "ok": false}, {"k": "b", "text": "Durch Sichern und anschließendem Öffnen der Waffe", "ok": true}, {"k": "c", "text": "Durch Kontrollieren der Stellung der Abzüge", "ok": false}], "label": "190"}, {"num": 191, "type": "mc", "q": "Welche Funktion hat die Sicherung an einer Waffe?", "opts": [{"k": "a", "text": "Sie verhindert die illegale Aneignung der Waffe", "ok": false}, {"k": "b", "text": "Sie verhindert die ungewollte Schussabgabe der Waffe", "ok": true}, {"k": "c", "text": "Sie verhindert die Herausnahme des Magazins", "ok": false}], "label": "191"}, {"num": 192, "type": "mc", "q": "Was bedeutet es aus waffenrechtlicher Sicht, wenn der Jäger eine Waffe führt?", "opts": [{"k": "a", "text": "Er hat die Waffe ungeladen im verschlossenen Kofferraum seines Fahrzeugs dabei", "ok": false}, {"k": "b", "text": "Wenn er eine Waffe außerhalb seiner Wohnung, Geschäftsräume oder seines befriedeten Besitzes bei sich trägt.", "ok": true}, {"k": "c", "text": "Die Waffe befindet sich im Futteral, getrennt von der Munition", "ok": false}], "label": "192"}, {"num": 193, "type": "mc", "q": "Was sichert die Flügelsicherung bei der Repetierbüchse Mauser K 98?", "opts": [{"k": "a", "text": "Den Abzug", "ok": false}, {"k": "b", "text": "Das Schlagstück", "ok": false}, {"k": "c", "text": "Den Schlagbolzen", "ok": true}], "label": "193"}, {"num": 194, "type": "mc", "q": "Was ist ein Bergstutzen?", "opts": [{"k": "a", "text": "Eine zweiläufige Kipplaufwaffe", "ok": true}, {"k": "b", "text": "Eine von Peter Berg konstruierte Büchse für die Disziplin laufender Keiler", "ok": false}, {"k": "c", "text": "Eine vollgeschäftete Repetierbüchse für die Gebirgsjagd auf Murmel", "ok": false}], "label": "194"}, {"num": 195, "type": "mc", "q": "Was sind blanke Waffen?", "opts": [{"k": "a", "text": "Nicht brünierte Allwetterwaffen aus rostfreiem Stahl", "ok": false}, {"k": "b", "text": "Büchsen ohne Kimme und Korn, die nur mit Zielfernrohr ausgerüstet sind", "ok": false}, {"k": "c", "text": "Hieb und Stichwaffen, die der Jäger überwiegend zum Abfangen von Wild nutzt", "ok": true}], "label": "195"}, {"num": 196, "type": "mc", "q": "Wozu verwendet man eine Saufeder?", "opts": [{"k": "a", "text": "Zum Abfangen von Schwarzwild, das von Hunden gestellt wird, weil ein Fangschuss mit der Feuerwaffe die Hunde verletzen oder töten würde", "ok": true}, {"k": "b", "text": "Zum Malen von Bildern", "ok": false}, {"k": "c", "text": "Zum Zerwirken von Wild", "ok": false}], "label": "196"}, {"num": 197, "type": "mc", "q": "Was bedeutet die Angabe 7 x 42 bei einem Fernglas?", "opts": [{"k": "a", "text": "7 cm Objektivdurchmesser und 42-fache Vergrößerung", "ok": false}, {"k": "b", "text": "7-fache Vergrößerung und 42 mm Objektivdurchmesser", "ok": true}, {"k": "c", "text": "7-fache Vergrößerung und 42 mm Okulardurchmesser", "ok": false}], "label": "197"}, {"num": 198, "type": "mc", "q": "Welches Fernglas eignet sich am besten zur Jagd bei Mondlicht auf Schwarzwild?", "opts": [{"k": "a", "text": "Das Fernglas mit den Angaben 8 x 56", "ok": true}, {"k": "b", "text": "Das Fernglas mit den Angaben 7 x 42", "ok": false}, {"k": "c", "text": "Das Fernglas mit den Angaben 8 x 20", "ok": false}], "label": "198"}, {"num": 199, "type": "mc", "q": "Welches ist die geeignetste Zielfernrohrvergrößerung zur Verwendung bei Drückjagden?", "opts": [{"k": "a", "text": "12-fache Vergrößerung", "ok": false}, {"k": "b", "text": "8-fache Vergrößerung", "ok": false}, {"k": "c", "text": "1,25-4-fache Vergrößerung", "ok": true}], "label": "199"}, {"num": 200, "type": "mc", "q": "Welches der aufgeführten Zielfernrohre hat das größte Sehfeld?", "opts": [{"k": "a", "text": "1,5-6 x 42", "ok": true}, {"k": "b", "text": "6 x 42", "ok": false}, {"k": "c", "text": "10 x 56", "ok": false}], "label": "200"}, {"num": 201, "type": "mc", "q": "Was versteht man unter Vergütung von Linsen am Zielfernrohr oder Fernglas?", "opts": [{"k": "a", "text": "Schutzschicht, die das Eindringen von Staub und Feuchtigkeit verhindern soll", "ok": false}, {"k": "b", "text": "Linsen, auf die eine Metallschicht aufgetragen wurde, um die Abbildungsqualität zu steigern", "ok": true}, {"k": "c", "text": "Linsen mit starker Vergrößerung", "ok": false}], "label": "201"}, {"num": 202, "type": "mc", "q": "Wofür verwendet man einen Leuchtpunkt im Absehen eines Zielfernrohres?", "opts": [{"k": "a", "text": "Als Orientierungshilfe bei der Nachtjagd oder zur Drückjagd", "ok": true}, {"k": "b", "text": "Um das Wild besser sehen zu können", "ok": false}, {"k": "c", "text": "Damit sich das Zielfernrohr besser einschießen lässt", "ok": false}], "label": "202"}, {"num": 203, "type": "mc", "q": "In welcher Reihenfolge sind folgende Bauteile an einem Zielfernrohr angeordnet?", "opts": [{"k": "a", "text": "Okular, Sehschärfeneinstellung, Umkehrsystem, Absehenverstellung, Objektiv", "ok": true}, {"k": "b", "text": "Sehschärfeneinstellung, Umkehrsystem, Okular, Absehenverstellung, Objektiv", "ok": false}, {"k": "c", "text": "Okular, Objektiv, Sehschärfeneinstellung, Umkehrsystem, Absehenverstellung", "ok": false}], "label": "203"}, {"num": 204, "type": "mc", "q": "Wofür sind Höhen- und Seitenverstellung an einem Zielfernrohr vorgesehen?", "opts": [{"k": "a", "text": "Zur Einstellung der Sehschärfe", "ok": false}, {"k": "b", "text": "Zur Einstellung der Vergrößerung am Zielfernrohr", "ok": false}, {"k": "c", "text": "Um das Zielfernrohr auf die Treffpunktlage der Läufe einzustellen", "ok": true}], "label": "204"}, {"num": 205, "type": "mc", "q": "Was bedeutet der Begriff \"Anschießen einer Waffe\"?", "opts": [{"k": "a", "text": "Krankschießen von einem Stück Wild", "ok": false}, {"k": "b", "text": "Kontrollschuss mit einer Waffe", "ok": true}, {"k": "c", "text": "Testen von unterschiedlicher Munition auf dem Schießstand", "ok": false}], "label": "205"}, {"num": 206, "type": "mc", "q": "Was versteht der Jäger unter dem Einschießen einer Waffe?", "opts": [{"k": "a", "text": "Beliebig viele Schüsse zum Einstellen des Zielfernrohres", "ok": true}, {"k": "b", "text": "Das Beschießen eines Stücks Wild", "ok": false}, {"k": "c", "text": "Das Warmschießen des Schützen vor einem jagdlichen Schießwettkampf", "ok": false}], "label": "206"}, {"num": 207, "type": "mc", "q": "Wie verhält sich ein weidgerechter Jäger, wenn ihm während der Jagd die Waffe umfällt?", "opts": [{"k": "a", "text": "Die Jagd fortsetzen und gegebenenfalls auf Wild schießen", "ok": false}, {"k": "b", "text": "Die Waffe nicht mehr verwenden und möglichst bald die Treffpunktlage kontrollieren", "ok": true}, {"k": "c", "text": "Die Waffe auf neue Munition einschießen", "ok": false}], "label": "207"}, {"num": 208, "type": "mc", "q": "Was versteht man unter Innenballistik?", "opts": [{"k": "a", "text": "Wirkung des Geschosses im Wildkörper", "ok": false}, {"k": "b", "text": "Schussentwicklung im Lauf", "ok": true}, {"k": "c", "text": "Flugbahn und ihre Beeinflussung", "ok": false}], "label": "208"}, {"num": 209, "type": "mc", "q": "Welche Büchsengeschoss-Eigenschaften sind bei der Zielballistik von Bedeutung?", "opts": [{"k": "a", "text": "Hindernisse, Witterung, Präzision", "ok": false}, {"k": "b", "text": "Wirkung des Geschosses im Wildkörper, Ausschussgröße, Pirschzeichen", "ok": true}, {"k": "c", "text": "Freiflug, Dralllänge, Lauflänge", "ok": false}], "label": "209"}, {"num": 210, "type": "mc", "q": "Warum soll der Jäger von seiner Büchsenmunition immer einen gewissen Vorrat einkaufen?", "opts": [{"k": "a", "text": "Um sicher zu stellen, dass die Munition gut abgelagert ist", "ok": false}, {"k": "b", "text": "Um gleichbleibende Ergebnisse aus der Waffe zu erzielen", "ok": true}, {"k": "c", "text": "Um Rabatte in Anspruch nehmen zu können", "ok": false}], "label": "210"}, {"num": 211, "type": "mc", "q": "Warum ist es nicht sinnvoll, dass sich Jäger Büchsenmunition mit derselben Kaliberbezeichnung gegenseitig ausleihen?", "opts": [{"k": "a", "text": "Weil das Geschossgewicht und die Pulverladung unterschiedlich sein können", "ok": true}, {"k": "b", "text": "Weil die Hülsenlänge unterschiedlich sein kann", "ok": false}, {"k": "c", "text": "Weil das gesetzlich verboten ist", "ok": false}], "label": "211"}, {"num": 212, "type": "mc", "q": "Womit wird in erster Linie die stabile Flugbahn eines Büchsengeschosses erreicht?", "opts": [{"k": "a", "text": "Durch die Drehbewegung des Geschosses um seine Längsachse", "ok": true}, {"k": "b", "text": "Durch die Verwendung gehämmerter Büchsenläufe", "ok": false}, {"k": "c", "text": "Durch einen möglichst weichen Geschossmantel", "ok": false}], "label": "212"}, {"num": 213, "type": "mc", "q": "Was sind Randfeuerpatronen?", "opts": [{"k": "a", "text": "Patronen aus einer auslaufenden Serie", "ok": false}, {"k": "b", "text": "Patronen, bei denen die Zündladung im Rand der Hülse untergebracht ist", "ok": true}, {"k": "c", "text": "Patronen mit Rand, z.B. 7 x 57 R", "ok": false}], "label": "213"}, {"num": 214, "type": "mc", "q": "Was bezeichnet man als Zentralfeuerpatronen?", "opts": [{"k": "a", "text": "Patronen die über ein Zündhütchen im Hülsenboden gezündet werden", "ok": true}, {"k": "b", "text": "Patronen mit zentraler Lage im Patronenlager", "ok": false}, {"k": "c", "text": "Patronen bei denen das Geschoss zentral in der Hülse sitzt", "ok": false}], "label": "214"}, {"num": 215, "type": "mc", "q": "Darf man aus jeder Flinte bedenkenlos statt Bleischroten auch Stahlschrote verschießen?", "opts": [{"k": "a", "text": "Nein, die Flinte benötigt einen Stahlschrotbeschuss", "ok": true}, {"k": "b", "text": "Ja, weil aus jeder Flinte Stahlschrote verschossen werden können", "ok": false}, {"k": "c", "text": "Ja, weil der Gasdruck von Stahlschrotpatronen niedriger ist", "ok": false}], "label": "215"}, {"num": 216, "type": "mc", "q": "Dürfen aus Flinten Magnum-Schrotpatronen verschossen werden?", "opts": [{"k": "a", "text": "Nur, wenn die Würgebohrung speziell dafür bearbeitet ist", "ok": false}, {"k": "b", "text": "Nur, wenn die Flinte mehr als 70 cm lange Läufe hat", "ok": false}, {"k": "c", "text": "Nur, wenn die Flinte einem verstärkten Beschuss unterzogen worden ist", "ok": true}], "label": "216"}, {"num": 217, "type": "mc", "q": "Wie verhalten Sie sich bei einem Versager?", "opts": [{"k": "a", "text": "Mit der Waffe im Anschlag bleiben und nach 10 Sekunden öffnen", "ok": true}, {"k": "b", "text": "Sofort den Verschluss öffnen", "ok": false}, {"k": "c", "text": "Die Waffe, ohne sie zu öffnen, dem Büchsenmacher bringen", "ok": false}], "label": "217"}, {"num": 218, "type": "mc", "q": "Woran erkenne ich, ob meine Flinte einen Stahlschrotbeschuss besitzt?", "opts": [{"k": "a", "text": "An der „Lilie“", "ok": true}, {"k": "b", "text": "An der „Tulpe“", "ok": false}, {"k": "c", "text": "An der „Rose“", "ok": false}], "label": "218"}, {"num": 219, "type": "mc", "q": "Was sind Beschusszeichen?", "opts": [{"k": "a", "text": "Zeichen des Wildes nach dem Schuss", "ok": false}, {"k": "b", "text": "Markierung der Anschussstelle", "ok": false}, {"k": "c", "text": "Beschussstempel des staatlichen Beschussamtes auf einer Waffe", "ok": true}], "label": "219"}, {"num": 220, "type": "mc", "q": "Wie nennt man die durch das Beschussamt zu erfassende Nummer auf der Waffe?", "opts": [{"k": "a", "text": "Fertigungsnummer", "ok": false}, {"k": "b", "text": "Waffennummer", "ok": true}, {"k": "c", "text": "Artikelnummer", "ok": false}], "label": "220"}, {"num": 221, "type": "mc", "q": "Wo findet man die Beschusszeichen an einer Kipplaufwaffe?", "opts": [{"k": "a", "text": "Unterhalb vom Patronenlager, links und rechts von den Laufhaken", "ok": true}, {"k": "b", "text": "Am Abzugsbügel", "ok": false}, {"k": "c", "text": "Am Hinterschaft", "ok": false}], "label": "221"}, {"num": 222, "type": "mc", "q": "Wo findet man die Beschusszeichen an einer Repetierbüchse?", "opts": [{"k": "a", "text": "An der Mündung des Laufes", "ok": false}, {"k": "b", "text": "Auf dem Patronenlager oder Laufansatz", "ok": true}, {"k": "c", "text": "Am Lauf zwischen Kimme und Korn", "ok": false}], "label": "222"}, {"num": 223, "type": "mc", "q": "Muss jede Waffe, die in Deutschland legal erworben wird, zuvor in einem Beschussamt beschossen worden sein?", "opts": [{"k": "a", "text": "Ja, ein Einzelbeschuss ist vorgeschrieben", "ok": true}, {"k": "b", "text": "Nein, es ist kein Beschuss notwendig", "ok": false}, {"k": "c", "text": "Ein Serienbeschuss reicht aus", "ok": false}], "label": "223"}, {"num": 224, "type": "mc", "q": "Wie bezeichnet man Büchsenpatronen, bei denen auf dem Hülsenboden ein Zündhütchen sichtbar ist?", "opts": [{"k": "a", "text": "Patronen mit Randfeuerzündung", "ok": false}, {"k": "b", "text": "Patronen mit Zentralfeuerzündung", "ok": true}, {"k": "c", "text": "Patronen mit Schnellzündung", "ok": false}], "label": "224"}, {"num": 225, "type": "mc", "q": "Was passiert nach der schnell aufeinanderfolgenden Abgabe mehrerer Schüsse aus einer Bockbüchsflinte mit fest verbundenen Läufen und unten liegendem Kugellauf?", "opts": [{"k": "a", "text": "Bleibende Beeinträchtigung der Schusspräzision", "ok": false}, {"k": "b", "text": "Klettern der Schüsse", "ok": true}, {"k": "c", "text": "Die Lötverbindungen lösen sich", "ok": false}], "label": "225"}, {"num": 226, "type": "mc", "q": "Welche Voraussetzung muss bei einer Flinte für ein treffsicheres Schießen gegeben sein?", "opts": [{"k": "a", "text": "Die Läufe müssen mindestens 80 cm lang sein", "ok": false}, {"k": "b", "text": "Die Flinte muss mindestens 3,2 kg wiegen", "ok": false}, {"k": "c", "text": "Die Schäftung muss dem Schützen angepasst sein", "ok": true}], "label": "226"}, {"num": 227, "type": "mc", "q": "Welche Maße kann der Büchsenmacher an einem Flintenschaft für das treffsichere Schießen verändern?", "opts": [{"k": "a", "text": "Schaftlänge, Senkung, Schränkung, Pitch", "ok": true}, {"k": "b", "text": "Schaftlänge, Beugung, Verschiebung, Pitch", "ok": false}, {"k": "c", "text": "Schaftkürze, Krümmung, Schränkung, Pitch", "ok": false}], "label": "227"}, {"num": 228, "type": "mc", "q": "Was sind Signalstifte?", "opts": [{"k": "a", "text": "Vorrichtungen die anzeigen, ob eine Waffe gestochen ist", "ok": false}, {"k": "b", "text": "Vorrichtungen die anzeigen, ob eine Waffe gespannt oder geladen ist", "ok": true}, {"k": "c", "text": "Berufsjägerlehrlinge, die das Jagdhornblasen erlernen", "ok": false}], "label": "228"}, {"num": 229, "type": "mc", "q": "Welche Waffen haben grundsätzlich keine Signalstifte?", "opts": [{"k": "a", "text": "Revolver", "ok": true}, {"k": "b", "text": "Drillinge", "ok": false}, {"k": "c", "text": "Pistolen", "ok": false}], "label": "229"}, {"num": 230, "type": "mc", "q": "Wie zeigen Signalstifte an, das die Schlosse einer Waffe gespannt sind?", "opts": [{"k": "a", "text": "Sie stehen heraus", "ok": true}, {"k": "b", "text": "Sie schließen bündig mit den anderen Waffenteilen ab", "ok": false}, {"k": "c", "text": "Durch einen leisen Ton", "ok": false}], "label": "230"}, {"num": 231, "type": "mc", "q": "Wann spannen sich die Schlosse bei einer Kipplaufwaffe ohne Handspanner?", "opts": [{"k": "a", "text": "Beim Öffnen der Waffe", "ok": true}, {"k": "b", "text": "Beim Laden der Waffe", "ok": false}, {"k": "c", "text": "Beim Schließen der Waffe", "ok": false}], "label": "231"}, {"num": 232, "type": "mc", "q": "Wann spannt sich das Schloss einer Repetierbüchse mit Kammer- oder Zylinderverschluss (ausgenommen bei Waffen mit Handspannschlossen)?", "opts": [{"k": "a", "text": "Beim Öffnen und Schließen der Waffe", "ok": true}, {"k": "b", "text": "Beim Laden der Waffe", "ok": false}, {"k": "c", "text": "Nur beim Schließen der Waffe", "ok": false}], "label": "232"}, {"num": 233, "type": "mc", "q": "Was sind Laufhaken?", "opts": [{"k": "a", "text": "Vorrichtung zum Aufhängen der Waffe", "ok": false}, {"k": "b", "text": "Die Vorderfüße einer Zielfernrohrmontage", "ok": false}, {"k": "c", "text": "Verschlusselemente bei Kipplaufwaffen", "ok": true}], "label": "233"}, {"num": 234, "type": "mc", "q": "Wo befinden sich die Laufhaken an einer Kipplaufwaffe?", "opts": [{"k": "a", "text": "Auf dem Lauf", "ok": false}, {"k": "b", "text": "Am Vorder- und Hinterschaft", "ok": false}, {"k": "c", "text": "Unter dem Patronenlager des Laufbündels", "ok": true}], "label": "234"}, {"num": 235, "type": "mc", "q": "Wie verhalten Sie sich während der Jagd, wenn Sie feststellen, dass Ihr Flintenlauf stark verunreinigt ist?", "opts": [{"k": "a", "text": "Verunreinigung durch einen Schuss entfernen", "ok": false}, {"k": "b", "text": "Keinen Schuss mehr abgeben und später reinigen", "ok": true}, {"k": "c", "text": "Verunreinigung mit einem abgebrochenen Ast entfernen", "ok": false}], "label": "235"}, {"num": 236, "type": "mc", "q": "Wofür werden Einsteckläufe meistens verwendet?", "opts": [{"k": "a", "text": "Zur balgschonenden Bejagung von Raubwild", "ok": true}, {"k": "b", "text": "Zur Großwildjagd in Afrika", "ok": false}, {"k": "c", "text": "Für den Schrotschuss", "ok": false}], "label": "236"}, {"num": 237, "type": "mc", "q": "Wie verhalten Sie sich, wenn Sie von einem Jäger eine Waffe übernommen haben, die so verrostet ist, dass starke Laufdellen erkennbar sind?", "opts": [{"k": "a", "text": "Vom Büchsenmacher unbrauchbar machen lassen", "ok": true}, {"k": "b", "text": "Weiter schießen", "ok": false}, {"k": "c", "text": "Schweißen lassen", "ok": false}], "label": "237"}, {"num": 238, "type": "mc", "q": "Wenn Sie bei Ihrer Büchse den Patronenhersteller wechseln, müssen Sie die Treffpunktlage des Geschosses…", "opts": [{"k": "a", "text": "Durch Kontrollschüsse ermitteln", "ok": true}, {"k": "b", "text": "Der Schusstafel des Munitionsherstellers entnehmen", "ok": false}, {"k": "c", "text": "Einschätzen können", "ok": false}], "label": "238"}, {"num": 239, "type": "mc", "q": "Was versteht man unter „Doppeln“?", "opts": [{"k": "a", "text": "Das Treffen von zwei Füchsen mit einem Schuss", "ok": false}, {"k": "b", "text": "Schnell aufeinanderfolgendes Betätigen beider Abzüge einer Flinte", "ok": false}, {"k": "c", "text": "Das gleichzeitige Lösen von zwei Schüssen, wenn bei einer mehrläufigen Waffe nur ein Abzug betätigt wird", "ok": true}], "label": "239"}, {"num": 240, "type": "mc", "q": "Warum wird bei einem Drilling der Einstecklauf meist in den rechten Schrotlauf eingebaut?", "opts": [{"k": "a", "text": "Weil der rechte Schrotlauf vom vorderen Abzug mit Stecherfunktion bedient wird", "ok": true}, {"k": "b", "text": "Die Haltbarkeit des rechten Schrotlaufes ist vom Beschussamt besonders geprüft", "ok": false}, {"k": "c", "text": "Beim linken Lauf würde das Geschoss sonst die enge Würgebohrung berühren", "ok": false}], "label": "240"}, {"num": 241, "type": "mc", "q": "Welches Kennzeichen muss sich auf einem Einstecklauf befinden?", "opts": [{"k": "a", "text": "Die Lauflänge", "ok": false}, {"k": "b", "text": "Beschusszeichen", "ok": true}, {"k": "c", "text": "Die Länge des Patronenlagers", "ok": false}], "label": "241"}, {"num": 242, "type": "mc", "q": "Was bedeutet bei ballistischen Angaben in der Schusstafel der Ausdruck „Joule“?", "opts": [{"k": "a", "text": "Gewicht des Geschosses", "ok": false}, {"k": "b", "text": "Auftreffenergie des Geschosses", "ok": true}, {"k": "c", "text": "Umfang des Geschosses", "ok": false}], "label": "242"}, {"num": 243, "type": "mc", "q": "Welches sind die gebräuchlichsten Schrotkaliber in Deutschland?", "opts": [{"k": "a", "text": "Kaliber 12/16/20", "ok": true}, {"k": "b", "text": "Kaliber 8/10/12", "ok": false}, {"k": "c", "text": "Kaliber 16/18/20", "ok": false}], "label": "243"}, {"num": 244, "type": "mc", "q": "Worauf bezieht sich die Längenangabe einer Schrotpatrone?", "opts": [{"k": "a", "text": "Auf die abgeschossene Hülse", "ok": true}, {"k": "b", "text": "Auf die nicht abgeschossene Hülse", "ok": false}, {"k": "c", "text": "Auf die Höhe der Bodenkappe", "ok": false}], "label": "244"}, {"num": 245, "type": "mc", "q": "Warum wird die Hülsenlänge einer Schrotpatrone im abgeschossenen Zustand gemessen?", "opts": [{"k": "a", "text": "Weil die geöffnete Schrotpatrone nicht länger sein darf als das Patronenlager", "ok": true}, {"k": "b", "text": "Weil sonst der Gasdruck entweicht", "ok": false}, {"k": "c", "text": "Weil die Auftreffenergie vermindert wird", "ok": false}], "label": "245"}, {"num": 246, "type": "mc", "q": "Nennen Sie die gebräuchlichsten Kurzwaffen.", "opts": [{"k": "a", "text": "Drilling, Bockbüchsflinte", "ok": false}, {"k": "b", "text": "Repetierbüchse, Kipplaufbüchse", "ok": false}, {"k": "c", "text": "Pistole, Revolver", "ok": true}], "label": "246"}, {"num": 247, "type": "mc", "q": "Für welchen Einsatz verwendet man Kurzwaffen im Jagdbetrieb?", "opts": [{"k": "a", "text": "Zur Tötung des altersschwachen Jagdhundes", "ok": false}, {"k": "b", "text": "Zur Bau- und Fallenjagd sowie für den Fangschuss auf Wild", "ok": true}, {"k": "c", "text": "Zur Schalenwildbejagung vom Ansitz und zur Drückjagd", "ok": false}], "label": "247"}, {"num": 248, "type": "mc", "q": "Welche Kurzwaffe hat gewöhnlich einen Schlitten?", "opts": [{"k": "a", "text": "Der Revolver", "ok": false}, {"k": "b", "text": ssamt", "ok": true}, {"k": "c", "text": "Bei der unteren Jagdbehörde", "ok": false}], "label": "284"}, {"num": 285, "type": "mc", "q": "Aus welchem Land stammende Waffen müssen in Deutschland nicht erneut beschossen werden?", "opts": [{"k": "a", "text": "Spanien", "ok": true}, {"k": "b", "text": "USA", "ok": false}, {"k": "c", "text": "Brasilien", "ok": false}], "label": "285"}, {"num": 286, "type": "mc", "q": "Wie werden Langwaffen auf einem Schießstand abgestellt?", "opts": [{"k": "a", "text": "Geschlossen und ohne Riemen", "ok": false}, {"k": "b", "text": "Geladen und ohne Riemen", "ok": false}, {"k": "c", "text": "Geöffnet und ohne Riemen", "ok": true}], "label": "286"}, {"num": 287, "type": "mc", "q": "Welche Regeln gelten auf einem jagdlich genutzten Schießstand?", "opts": [{"k": "a", "text": "Die Schießstandordnung und die Schießvorschrift des Deutschen Jagdverbandes", "ok": true}, {"k": "b", "text": "Das Jagdrecht", "ok": false}, {"k": "c", "text": "Keine", "ok": false}], "label": "287"}, {"num": 288, "type": "mc", "q": "Welche Sicherung gilt als die zuverlässigste?", "opts": [{"k": "a", "text": "Abzugssicherung", "ok": false}, {"k": "b", "text": "Stangensicherung", "ok": false}, {"k": "c", "text": "Schlagstücksicherung/Schlagbolzensicherung", "ok": true}], "label": "288"}, {"num": 289, "type": "mc", "q": "Wie weit schießt man mit einer Kurzwaffe i.d.R. maximal gezielt?", "opts": [{"k": "a", "text": "25 Meter", "ok": true}, {"k": "b", "text": "50 Meter", "ok": false}, {"k": "c", "text": "100 Meter", "ok": false}], "label": "289"}, {"num": 290, "type": "mc", "q": "Wo verwendet man die Begriffe „Züge“ und „Felder“?", "opts": [{"k": "a", "text": "Bei Flintenläufen", "ok": false}, {"k": "b", "text": "Bei Büchsenläufen", "ok": true}, {"k": "c", "text": "Bei der Baujagd", "ok": false}], "label": "290"}, {"num": 291, "type": "mc", "q": "Wie viele Abzüge hat ein Standarddrilling?", "opts": [{"k": "a", "text": "Einen", "ok": false}, {"k": "b", "text": "Zwei", "ok": true}, {"k": "c", "text": "Drei", "ok": false}], "label": "291"}, {"num": 292, "type": "mc", "q": "Für welche Jagdart eignet sich bevorzugt eine Bockbüchse?", "opts": [{"k": "a", "text": "Für die Jagd auf den Rehbock", "ok": false}, {"k": "b", "text": "Für die Drückjagd", "ok": true}, {"k": "c", "text": "Für die Jagd von einem Ansitzbock aus", "ok": false}], "label": "292"}, {"num": 293, "type": "mc", "q": "Welche Waffe bezeichnet man als „Sicherheitsdrilling“?", "opts": [{"k": "a", "text": "Einen Drilling mit Spannschieber auf dem Kolbenhals", "ok": true}, {"k": "b", "text": "Einen komplett entladenen Drilling", "ok": false}, {"k": "c", "text": "Einen Drilling, der mit sicheren Arbeitsmaschinen hergestellt wurde", "ok": false}], "label": "293"}, {"num": 294, "type": "mc", "q": "Wie weit kann der Schuss mit einem Flintenlaufgeschoss das Hintergelände gefährden?", "opts": [{"k": "a", "text": "Ca. 500 Meter", "ok": false}, {"k": "b", "text": "Ca. 1500 Meter", "ok": true}, {"k": "c", "text": "Ca. 5000 Meter", "ok": false}], "label": "294"}, {"num": 295, "type": "mc", "q": "Wann stechen Sie ein?", "opts": [{"k": "a", "text": "Beim Beginn eines Pirschgangs", "ok": false}, {"k": "b", "text": "Vor dem Entsichern einer Waffe", "ok": false}, {"k": "c", "text": "Unmittelbar vor der Schussabgabe", "ok": true}], "label": "295"}, {"num": 296, "type": "mc", "q": "Welche Funktion hat das Schloss einer Waffe?", "opts": [{"k": "a", "text": "Das Schloss verbindet Vorderschaft und Hinterschaft miteinander.", "ok": false}, {"k": "b", "text": "Die Mechanik des Schlosses löst den Schuss aus", "ok": true}, {"k": "c", "text": "Das Schloss sichert die Waffe", "ok": false}], "label": "296"}, {"num": 297, "type": "mc", "q": "Die Schlosse welcher Waffe lassen sich schonend nur mit Hilfe von Pufferpatronen entspannen?", "opts": [{"k": "a", "text": "Bockbüchsflinte mit Handspannung", "ok": false}, {"k": "b", "text": "Doppelflinte mit automatischer Sicherung", "ok": true}, {"k": "c", "text": "Repetierbüchse Modell 98", "ok": false}], "label": "297"}, {"num": 298, "type": "mc", "q": "Wozu dienen Pufferpatronen?", "opts": [{"k": "a", "text": "Zum Entspannen der Schlosse", "ok": true}, {"k": "b", "text": "Zum Reinigen der Läufe", "ok": false}, {"k": "c", "text": "Zum Verschießen von Leuchtspurmunition", "ok": false}], "label": "298"}, {"num": 299, "type": "mc", "q": "Warum sollten Waffen im entspannten Zustand aufbewahrt werden?", "opts": [{"k": "a", "text": "Aus Sicherheitsgründen im Haus", "ok": false}, {"k": "b", "text": "Damit die Schlagfedern geschont werden", "ok": true}, {"k": "c", "text": "Weil das Waffengesetz das vorschreibt", "ok": false}], "label": "299"}, {"num": 300, "type": "mc", "q": "Sie wollen eine Langwaffe mit Selbstspannsystem entspannen. Wie gehen Sie richtig vor?", "opts": [{"k": "a", "text": "Abzüge betätigen, Waffe öffnen", "ok": false}, {"k": "b", "text": "Waffe öffnen, Abzüge betätigen, Waffe schließen", "ok": false}, {"k": "c", "text": "Waffe öffnen, entsichern, Abzüge durchziehen und dabei die Waffe schließen", "ok": true}], "label": "300"}]}, {"id": "4", "kurz": "Wildkrankheiten & Wildbrethygiene", "titel": "Lebensmittelrecht, insbesondere Anforderungen an die kundige Person im Sinne des Anhangs III, Abschnitt IV, Kapitel I Nummer 2 der Verordnung (EG) Nr. 853/2004 des Europäischen Parlaments und des Rates vom 29. April 2004 mit spezifischen Hygienevorschriften für Lebensmittel tierischen Ursprungs (ABl. L 139 vom 30.4.2004, S. 55), die zuletzt durch die Delegierte Verordnung (EU) 2023/166 der Kommission vom 26. Oktober 2022 (ABl. L24 vom 26.01.2023, S. 1) geändert worden ist, insbesondere Anatomie, Physiologie und Verhaltensweisen des Wildes, Untersuchung des Wildes vor und nach dem Schuss, Kennzeichnung und Behandlung des erlegten Wildes, Hygiene- und Verfahrensvorschriften für den Umgang mit Wildkörpern, Rechts- und Verwaltungsvorschriften für das Inverkehrbringen von Wildbret, Trichinenprobenahme und Wildtierkrankheiten", "item
