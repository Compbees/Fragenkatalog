lerarten kann man in Mecklenburg-Vorpommern antreffen?", "opts": [{"k": "a", "text": "Seeadler, Fischadler, Schreiadler", "ok": true}, {"k": "b", "text": "Seeadler, Fischadler, Steinadler", "ok": false}, {"k": "c", "text": "Seeadler, Fischadler, Kronenadler", "ok": false}], "label": "294"}, {"num": 295, "type": "mc", "q": "Nennen Sie Greifvögel die man als Grifftöter bezeichnet!", "opts": [{"k": "a", "text": "Seeadler, Turmfalke", "ok": false}, {"k": "b", "text": "Mäusebussard, Wanderfalke", "ok": false}, {"k": "c", "text": "Habicht und Sperber", "ok": true}], "label": "295"}, {"num": 296, "type": "mc", "q": "Wo brütet der Seeadler?", "opts": [{"k": "a", "text": "Auf größeren Bäumen in einem Horst", "ok": true}, {"k": "b", "text": "In einem erhöhten Nest im Schilfgebiet", "ok": false}, {"k": "c", "text": "In einer Felsspalte auf dem nackten Boden", "ok": false}], "label": "296"}, {"num": 297, "type": "mc", "q": "An welchen Orten trifft man auf Nester der Weihenarten?", "opts": [{"k": "a", "text": "In der Feldhecke und auf Kopfweiden", "ok": false}, {"k": "b", "text": "In Felsspalten und in Erdlöchern", "ok": false}, {"k": "c", "text": "Auf dem Boden, im Schilf und in landwirtschaftlich nicht genutzten Flächen", "ok": true}], "label": "297"}, {"num": 298, "type": "mc", "q": "Welche Greifvogelarten sind ausgesprochene Pirsch- und Startflugjäger?", "opts": [{"k": "a", "text": "Habicht und Sperber", "ok": true}, {"k": "b", "text": "Mäusebussard und Wespenbussard", "ok": false}, {"k": "c", "text": "Rohrweihe und Wiesenweihe", "ok": false}], "label": "298"}, {"num": 299, "type": "mc", "q": "Unterscheidet sich das Gewölle von Eulen und Greifvögeln?", "opts": [{"k": "a", "text": "Nein, beides sieht gleich aus", "ok": false}, {"k": "b", "text": "Eulengewölle ist vollständig weiß", "ok": false}, {"k": "c", "text": "Greifvogelgewölle beinhaltet keine Knochen", "ok": true}], "label": "299"}, {"num": 300, "type": "mc", "q": "Welche Aussagen treffen für den Milan zu?", "opts": [{"k": "a", "text": "Abgerundeter Stoß, Bodenbrüter, Singvogeljäger", "ok": false}, {"k": "b", "text": "Gegabelter Stoß, Horst mit eingebautem Unrat, Aasfresser", "ok": true}, {"k": "c", "text": "Brettförmiger Stoß, Nest in Ortschaften, Reptilienjäger", "ok": false}], "label": "300"}, {"num": 301, "type": "mc", "q": "Welcher Greifvogel begrünt seinen Horst?", "opts": [{"k": "a", "text": "Habicht", "ok": true}, {"k": "b", "text": "Roter Milan", "ok": false}, {"k": "c", "text": "Seeadler", "ok": false}], "label": "301"}, {"num": 302, "type": "mc", "q": "Welche ist die größte Eulenart Deutschlands?", "opts": [{"k": "a", "text": "Sperlingskauz", "ok": false}, {"k": "b", "text": "Uhu", "ok": true}, {"k": "c", "text": "Steinkauz", "ok": false}], "label": "302"}, {"num": 303, "type": "mc", "q": "Wie nennt man Tierarten, die über ein sehr breites Nahrungsspektrum verfügen können?", "opts": [{"k": "a", "text": "Spezialisten", "ok": false}, {"k": "b", "text": "Symbionten", "ok": false}, {"k": "c", "text": "Generalisten", "ok": true}], "label": "303"}, {"num": 304, "type": "mc", "q": "Welche Tiere sollen von der Reviergestaltung durch den Jäger profitieren?", "opts": [{"k": "a", "text": "Ausschließlich Tiere, die dem Jagdrecht unterliegen", "ok": false}, {"k": "b", "text": "Alle Arten von Wildtieren, einschließlich solcher, die unter Naturschutz stehen", "ok": true}, {"k": "c", "text": "Ausschließlich Wildarten, die Neubürger sind", "ok": false}], "label": "304"}, {"num": 305, "type": "mc", "q": "Was gehört in M-V nicht zu den wichtigsten Hegemaßnahmen für Schalenwild?", "opts": [{"k": "a", "text": "Biotopverbessernde Maßnahmen, wie Schaffung von Äsung, Deckung und Ruhe", "ok": false}, {"k": "b", "text": "Bau und Unterhaltung künstlicher Winterfütterungen", "ok": true}, {"k": "c", "text": "Schaffung und Erhaltung einer biotopgerechten Wilddichte", "ok": false}], "label": "305"}, {"num": 306, "type": "mc", "q": "Welche Baum- und Straucharten dienen dem Wild im Winter als Nahrungspflanzen?", "opts": [{"k": "a", "text": "Brombeere, Preiselbeere, Weide", "ok": true}, {"k": "b", "text": "Efeu, Ilex, Schwarzdorn", "ok": false}, {"k": "c", "text": "Schachtelhalm, Adlerfarn, Tollkirsche", "ok": false}], "label": "306"}, {"num": 307, "type": "mc", "q": "Welche Reviere sind für die Hasenhege gut geeignet?", "opts": [{"k": "a", "text": "Geschlossene Nadelwaldreviere im Mittelgebirge", "ok": false}, {"k": "b", "text": "Feldreviere mit mildem, sommertrockenem Klima und durchlässigen Böden", "ok": true}, {"k": "c", "text": "Feuchtgebiete auf Niedermoorstandorten", "ok": false}], "label": "307"}, {"num": 308, "type": "mc", "q": "Welche Reviere sind für die Rebhuhnhege nicht geeignet?", "opts": [{"k": "a", "text": "Gemüseanbaugebiete mit kleinstrukturierten Flächen", "ok": false}, {"k": "b", "text": "Kleine Felder mit Hecken, Knicks und hohem Hackfruchtanteil", "ok": false}, {"k": "c", "text": "Nadelwaldgebiete mit Kahlflächen", "ok": true}], "label": "308"}, {"num": 309, "type": "mc", "q": "In welchen Monaten sollen die Pflegemaßnahmen an Feldgehölzen und Hecken erfolgen?", "opts": [{"k": "a", "text": "Von Februar bis Juni", "ok": false}, {"k": "b", "text": "Von Oktober bis Februar", "ok": true}, {"k": "c", "text": "Von August bis Oktober", "ok": false}], "label": "309"}, {"num": 310, "type": "mc", "q": "Wo sollten Wildäsungsflächen nicht angelegt werden?", "opts": [{"k": "a", "text": "In Ruhezonen die durch den Menschen nicht belaufen werden", "ok": false}, {"k": "b", "text": "An Wald- Feldkanten, die das Wild ohne Störung erreichen kann", "ok": false}, {"k": "c", "text": "In der Nähe von öffentlichen Straßen und stark genutzten Wanderwegen", "ok": true}], "label": "310"}, {"num": 311, "type": "mc", "q": "Wo sollten Salzlecken nicht angelegt werden?", "opts": [{"k": "a", "text": "An Wildwechseln", "ok": false}, {"k": "b", "text": "An Äsungsflächen", "ok": false}, {"k": "c", "text": "An Straßenrändern", "ok": true}], "label": "311"}, {"num": 312, "type": "mc", "q": "Welche der genannten Getreidearten haben in der Regel keine Grannen an den Ähren?", "opts": [{"k": "a", "text": "Weizen", "ok": true}, {"k": "b", "text": "Roggen", "ok": false}, {"k": "c", "text": "Gerste", "ok": false}], "label": "312"}, {"num": 313, "type": "mc", "q": "Nennen Sie Feldfrüchte, die dem Wild als Winteräsung zur Verfügung stehen?", "opts": [{"k": "a", "text": "Wintergetreide, Raps, Kohl", "ok": true}, {"k": "b", "text": "Sonnenblumen, Erbsen, Bohnen", "ok": false}, {"k": "c", "text": "Hafer, Lupine, Buchweizen", "ok": false}], "label": "313"}, {"num": 314, "type": "mc", "q": "Was versteht man unter dem Begriff Naturverjüngung?", "opts": [{"k": "a", "text": "Gepflanzte junge Bäume aus einer Forstbaumschule", "ok": false}, {"k": "b", "text": "Aus Samen alter Bäume heranwachsende junge Bäume (Aufschlag oder Anflug)", "ok": true}, {"k": "c", "text": "Austreiben neuer Triebe z.B. bei Weiden durch Rückschnitt", "ok": false}], "label": "314"}, {"num": 315, "type": "mc", "q": "In welchem Alter erntet der Förster in M-V die hiebsreife Eiche, Buche, Fichte?", "opts": [{"k": "a", "text": "Eiche mit ca. 150 Jahren, Buche mit ca. 100 Jahren, Fichte mit ca. 50 Jahren", "ok": false}, {"k": "b", "text": "Eiche mit ca. 250 Jahren, Buche mit ca. 150 Jahren, Fichte mit ca. 100 Jahren", "ok": true}, {"k": "c", "text": "Eiche mit ca. 350 Jahren, Buche mit ca. 200 Jahren, Fichte mit ca. 150 Jahren", "ok": false}], "label": "315"}, {"num": 316, "type": "mc", "q": "Welche der genannten Baumarten können in manchen Jahren durch den Fruchtfall die Äsungsmöglichkeiten im Wald für viele Tierarten entscheidend verbessern?", "opts": [{"k": "a", "text": "Stiel- und Traubeneiche, Rotbuche", "ok": true}, {"k": "b", "text": "Hainbuche, Kiefer", "ok": false}, {"k": "c", "text": "Pappel, Schwarzerle", "ok": false}], "label": "316"}, {"num": 317, "type": "mc", "q": "Auf welche Bodenverhältnisse kann man schließen, sofern vermehrt Brennnessel auftritt?", "opts": [{"k": "a", "text": "Der Boden ist sehr arm an Nährstoffen", "ok": false}, {"k": "b", "text": "Der Boden ist sehr steinig und trocken", "ok": false}, {"k": "c", "text": "Der Boden ist sehr gut mit Stickstoff (Nitrat) versorgt", "ok": true}], "label": "317"}, {"num": 318, "type": "mc", "q": "Welche Schäden werden durch Rehwild nicht verursacht?", "opts": [{"k": "a", "text": "Schälschäden", "ok": true}, {"k": "b", "text": "Fegeschäden", "ok": false}, {"k": "c", "text": "Verbissschäden", "ok": false}], "label": "318"}, {"num": 319, "type": "mc", "q": "Was versteht man unter Flächenschutz?", "opts": [{"k": "a", "text": "Das Einzäunen einzelner Bäume", "ok": false}, {"k": "b", "text": "Das Einzäunen einer Fläche mit wilddichtem Zaun, auf der junge Bäume stehen", "ok": true}, {"k": "c", "text": "Das Aufstellen von Wildscheuchen im Wald", "ok": false}], "label": "319"}, {"num": 320, "type": "mc", "q": "Welche Wildackerpflanze bietet Blatt- und Knollenäsung?", "opts": [{"k": "a", "text": "Kartoffel", "ok": false}, {"k": "b", "text": "Mais", "ok": false}, {"k": "c", "text": "Topinambur", "ok": true}], "label": "320"}, {"num": 321, "type": "mc", "q": "Welche Baumarten werden sehr gern von Rotwild geschält?", "opts": [{"k": "a", "text": "Buche und Eiche", "ok": false}, {"k": "b", "text": "Douglasie und Tanne", "ok": true}, {"k": "c", "text": "Kiefer und Eibe", "ok": false}], "label": "321"}, {"num": 322, "type": "mc", "q": "Welche Wildart trägt zur natürlichen Waldverjüngung bei?", "opts": [{"k": "a", "text": "Schwarzwild", "ok": true}, {"k": "b", "text": "Rotwild", "ok": false}, {"k": "c", "text": "Muffelwild", "ok": false}], "label": "322"}, {"num": 323, "type": "mc", "q": "Welche der nachfolgenden Baumarten ist eine Pionierbaumart?", "opts": [{"k": "a", "text": "Eiche", "ok": false}, {"k": "b", "text": "Kastanie", "ok": false}, {"k": "c", "text": "Birke", "ok": true}], "label": "323"}, {"num": 324, "type": "mc", "q": "Welche Pflanze hat auch im Winter grüne Blätter?", "opts": [{"k": "a", "text": "Brombeere", "ok": true}, {"k": "b", "text": "Himbeere", "ok": false}, {"k": "c", "text": "Buche", "ok": false}], "label": "324"}, {"num": 325, "type": "mc", "q": "Welche Aussage ist richtig?", "opts": [{"k": "a", "text": "Eine Kultur geht aus Samen von Altbäumen hervor", "ok": false}, {"k": "b", "text": "Eine Kultur besteht aus gepflanzten Bäumen einer Baumschule", "ok": true}, {"k": "c", "text": "Eine Kultur entsteht aus auf den Stock gesetzten Stämmen", "ok": false}], "label": "325"}, {"num": 326, "type": "mc", "q": "Welche Pflanze wird auch als Zwischenfrucht genutzt?", "opts": [{"k": "a", "text": "Senf", "ok": true}, {"k": "b", "text": "Mais", "ok": false}, {"k": "c", "text": "Rüben", "ok": false}], "label": "326"}, {"num": 327, "type": "mc", "q": "Welche Art gehört zu den Leguminosen?", "opts": [{"k": "a", "text": "Rotklee", "ok": true}, {"k": "b", "text": "Knaulgras", "ok": false}, {"k": "c", "text": "Rotbuche", "ok": false}], "label": "327"}, {"num": 328, "type": "mc", "q": "Was ist ein Habitat?", "opts": [{"k": "a", "text": "Das Imponiergehabe des Brunfthirsches.", "ok": false}, {"k": "b", "text": "Der spezielle Lebensraum für Pflanzen- und/oder Tierarten.", "ok": true}, {"k": "c", "text": "Eine spezielle Bodenart.", "ok": false}], "label": "328"}, {"num": 329, "type": "mc", "q": "Was ist der Unterschied zwischen einem Nieder- und einem Hochmoor?", "opts": [{"k": "a", "text": "Das Hochmoor ist nährstoffreich, das Niedermoor ist nährstoffarm.", "ok": false}, {"k": "b", "text": "Das Niedermoor hat einen niedrigeren Wasserspiegel als das Hochmoor.", "ok": false}, {"k": "c", "text": "Das Niedermoor ist grundwasserbeeinflusst, das Hochmoor regenwasserbeeinflusst.", "ok": true}], "label": "329"}, {"num": 330, "type": "mc", "q": "Welche drei Hauptgruppen von Lebewesen ermöglichen den Stoffkreislauf in der belebten Natur?", "opts": [{"k": "a", "text": "Pflanzenfresser, Fleischfresser, Allesfresser.", "ok": false}, {"k": "b", "text": "Produzenten (Flora), Konsumenten (Fauna), Destruenten (Zersetzungsorganismen)", "ok": true}, {"k": "c", "text": "Aquakulturen, Kulturfolger, Kulturflüchter.", "ok": false}], "label": "330"}]}, {"id": "2", "kurz": "Jagdbetrieb, Hunde & Brauchtum", "titel": "Jagdbetrieb; Bauart und Funktionsweise von Fanggeräten und deren Einsatz; tierschutzgerechte Haltung, Ausbildung und Führen von Jagdhunden; jagdliches Brauchtum; Unfallverhütung", "items": [{"num": 1, "type": "open", "q": "Was versteht man unter „jagdlichem Brauchtum”?", "a": "Jahrhunderte alte Sitten und Gebräuche bei der Jagdausübung. Der größte Teil unseres Brauchtums sind aber handwerkliche Zunftbräuche.", "label": "1"}, {"num": 2, "type": "open", "q": "Welche alten Bräuche werden bis heute noch angewendet?", "a": "Die unterschiedlichen Jagdhornsignale, die Weidmannssprache, das Strecke legen und Bruchzeichen. Diese Bräuche haben auch einen handwerklichen Sinn.", "label": "2"}, {"num": 3, "type": "open", "q": "Welche Jagdhörner sind heute noch im Einsatz?", "a": "Das Fürst-PIess-Horn, das Taschenhorn, das Parforcehorn, das Ventilhorn und der Sauerländer Halbmond", "label": "3"}, {"num": 4, "type": "open", "q": "Nennen Sie fünf Totsignale!", "a": "Hirsch tot, Damhirsch tot, Reh tot, Sau tot, Fuchs tot, Hase tot, Flugwild tot.", "label": "4"}, {"num": 5, "type": "open", "q": "Nennen Sie drei Jagdleitsignale!", "a": "Anblasen des Treibens, Treiber in den Kessel, Hahn in Ruh,", "label": "5"}, {"num": 6, "type": "open", "q": "Welche Signale werden nach Beendigung der Jagd geblasen und welche Bedeutung haben diese Signale?", "a": "Jagd vorbei, Halali und Zum Essen. Diese Signale erklären die Jagd als beendet und entlassen den Jagdleiter aus seiner weiteren Verantwortung.", "label": "6"}, {"num": 7, "type": "open", "q": "Welche Bedeutung hat das Jagdhorn im heutigen Jagdbetrieb?", "a": "Das Blasen auf dem Jagdhorn hat auch im heutigen Jagdbetrieb eine hohe Bedeutung. Blasen von Signalen zur Leitung einer Jagd, Verständigung der Jäger untereinander, wie verblasen der Strecke gehören dazu.", "label": "7"}, {"num": 8, "type": "open", "q": "Mit welchem Signal wird das Treiben beendet und was hat es für eine Bedeutung?", "a": "Abblasen („Hahn in Ruh”), Waffe entladen.", "label": "8"}, {"num": 9, "type": "open", "q": "Wo liegt der Unterschied zwischen der Weidmannssprache und dem Jägerlatein?", "a": "Die Weidmannssprache ist eine Fach- und Standessprache der Jäger, die sich in einer Vielzahl von Ausdrücken und Begriffen von der normalen Umgangssprache unterscheidet. Jägerlatein sind unwahre Jagdgeschichten rund um Jagd und Jäger. Das Jägerlatein ist uralt.", "label": "9"}, {"num": 10, "type": "open", "q": "Welches Wild gehört zum Hochwild? Nennen Sie 7 Wildarten!", "a": "Rotwild, Damwild, Muffelwild, Steinwild, Gamswild, Schwarzwild und Sikawild sowie Auerwild, See- und Steinadler.", "label": "10"}, {"num": 11, "type": "open", "q": "Welches Wild gehört zum Niederwild? Nennen Sie 7 Wildarten!", "a": "Rehwild, Feldhase, Wildkaninchen, Raubwild, z.B. Fuchs, Dachs, Marderhund, Marder, Hermelin, Mauswiesel sowie das Federwild (Fasan, Rebhuhn, Taube, etc.).", "label": "11"}, {"num": 12, "type": "open", "q": "Woher stammen die Begriffe Hoch- und Niederwild?", "a": "Aus einer Zeit, in der ausschließlich dem Adel die Jagd Vorbehalten war, Hochadel jagte Hochwild, der niedere Adel jagte Niederwild.", "label": "12"}, {"num": 13, "type": "open", "q": "Welche Grundsätze gelten beim Streckelegen?", "a": "Hochwild vor Niederwild (nach Wildarten sortiert), männliches Wild vor weiblichem Wild, starkes Wild vor", "label": "13"}, {"num": 14, "type": "open", "q": "In welcher Reihenfolge wird eine gemischte Strecke gelegt? (Waldtreibjagd)", "a": "Hochwild vor Niederwild und Haarwild vor Federwild.", "label": "14"}, {"num": 15, "type": "open", "q": "Welche Wildart gehört zum Niederwild und wie wird eine Niederwildstrecke gelegt?", "a": "In der Reihenfolge: Rehwild, Raubwild nach Größe, Hase, Kaninchen, Federwild nach Größe.", "label": "15"}, {"num": 16, "type": "open", "q": "Was bezeichnet der Jäger als Brüche? Nennen Sie vier Verständigungsbrüche.", "a": "Abgebrochene grüne Zweige der sog. weidgerechten Holzarten. Haupt-, Leit-, Anschuss-, Fährten-, Standplatz-, Warte- und Warnbruch.", "label": "16"}, {"num": 17, "type": "open", "q": "Welche Baumarten werden für Brüche verwendet? Nennen Sie zwei Streckenbrüche.", "a": "Eiche, Fichte, Erle, Kiefer, Tanne Inbesitznahmebruch, Letzter Bissen und Erlegerbruch", "label": "17"}, {"num": 18, "type": "open", "q": "Welche Bedeutung haben Brüche?", "a": "Sie dienen der gegenseitigen Verständigung und sind Schmuck- und Ehrenzeichen. Die Bruchzeichen sind ein Symbol der gerechten Jagdausübung.", "label": "18"}, {"num": 19, "type": "open", "q": "Wie sieht ein Hauptbruch aus und welche Bedeutung hat er und wie wird er angebracht?", "a": "Es ist ein armlanger, befegter Ast; er bedeutet „Achtung“! Er wird auf den Boden gelegt in unübersichtlichem Gelände kann er auch aufgehängt werden.", "label": "19"}, {"num": 20, "type": "open", "q": "Was versteht man unter einem „befegten” Bruch?", "a": "Ein Ast, an dem die Rinde abgeschabt wurde, sodass das helle Holz zu sehen ist. So fällt er besonders auf.", "label": "20"}, {"num": 21, "type": "open", "q": "Wie sieht ein Leitbruch aus?", "a": "Es ist ein halbarmlanger, befegter Ast, der eine Aufforderung zum Folgen in Richtung der gewachsenen Spitze ist.", "label": "21"}, {"num": 22, "type": "open", "q": "Wie sieht ein Wartebruch aus und wie sieht er aus, wenn das Warten aufgegeben wurde?", "a": "Zwei halbarmlange Brüche, die gekreuzt übereinandergelegt werden, er bedeutet: bitte warten! Warten aufgegeben: Entfernen der Seitenzweige der beiden Brüche und legt sie gekreuzt wieder hin.", "label": "22"}, {"num": 23, "type": "open", "q": "Was ist ein Erlegerbruch, wie wird er überreicht und wie wird er vom Jäger getragen?", "a": "Ein handgroßer Bruch, der dem Schützen für ein mit der Kugel erlegtes Stück Wild, auf Hut, Horn oder Messer überreicht, der Schütze steckt ihn sich an seine rechte Hutseite.", "label": "23"}, {"num": 24, "type": "open", "q": "Welches Wild bekommt den „Letzten Bissen“ und welche Bedeutung hat er?", "a": "Ein Bruch wird männlichem Schalenwild so wie dem Birkhahn und Auerhahn in den Äser/ins Gebräch/ in den Schabel gesteckt. Es bedeutet „Versöhnung mit dem erlegten Tier“.", "label": "24"}, {"num": 25, "type": "open", "q": "Unter welchen Umständen wird „Weidmannsheil!“ gewünscht?", "a": "Zur Begrüßung, dann wird auch mit „Weidmannsheil!“ geantwortet, zum Wünschen von Erfolg beim Aufbruch zur Jagd und als Gratulation zum erlegten Stück, dann antwortet man mit „Weidmannsdank!“", "label": "25"}, {"num": 26, "type": "open", "q": "Nennen Sie vier Organe, die zum kleinen Jägerrecht gehören! Wem steht das kleine Jägerrecht zu?", "a": "Lecker, Lunge, Herz, Leber, Milz, Nieren. Es steht demjenigen zu, der das Stück aufbricht.", "label": "26"}, {"num": 27, "type": "open", "q": "Erläutern Sie die Jagdart Buschieren!", "a": "Buschierjagd findet in offenem aber höher bewachsenem Gelände statt. Der Jagdhund sucht im Schussbereich der Flinte (20-30 m).", "label": "27"}, {"num": 27, "type": "open", "q": "Was ist das große Jägerrecht und hat es heute noch Bedeutung?", "a": "Das ist der Vorschlag bis zur dritten Rippe sowie das Geräusch. Es war Teil der Entlohnung der Berufsjäger in Naturalien. Heute werden Berufsjäger meist nicht mehr mit Naturalien entlohnt.", "label": "27a"}, {"num": 28, "type": "open", "q": "Beschreiben Sie einen Warnbruch in welchen Situationen wird er benötigt?", "a": "Es ist ein Ast, dem Seitenäste und Rinde komplett entfernt werden, bis auf die Spitze und der dann zum Kreis gebogen aufgehängt wird. Er bedeutet Gefahr, z. B. Leitersprosse gebrochen, vor dem Fangbunker.", "label": "28"}, {"num": 29, "type": "open", "q": "Wie müssen Treiber, Schützen und Hunde bei einer Gesellschaftsjagd gekennzeichnet sein?", "a": "Treiber müssen eine rote Warnweste, Schützen ein rotes Hutband und Warnweste sowie Hunde eine leuchtende Signalhalsung oder Signalweste tragen.", "label": "29"}, {"num": 30, "type": "open", "q": "Was ist ein Jagdkönig und wer ernennt ihn?", "a": "Der Schütze, der am Ende einer Gesellschaftsjagd die ranghöchsten oder meisten Stücke gestreckt hat. Wird im Allgemeinen während des Schüsseltreibens durch den Jagdherrn ernannt.", "label": "30"}, {"num": 31, "type": "open", "q": "Was versteht man unter Schüsseltreiben?", "a": "Das gemeinsame Essen während oder nach der Gesellschaftsjagd. Es bildet in der Regel den Abschluss des gemeinsam erlebten Jagdtages in geselliger Runde.", "label": "31"}, {"num": 32, "type": "open", "q": "Nennen Sie sechs verschiedene Jagdarten!", "a": "Pirsch, Ansitz, Suche, Buschieren, Stöbern, Streife, Vorstehtreiben, Kesseltreiben", "label": "32"}, {"num": 33, "type": "open", "q": "Was versteht man unter Pirschen und was muss man dabei beachten werden? Nennen Sie vier Merkmale!", "a": "Das langsame und lautlose Fortbewegen im Revier, um Wild anzuschleichen. Die Windrichtung, genaue\nRevierkenntnisse, geräuschloses Fortbewegen, auf Deckung achten, Schnee im Winter.", "label": "33"}, {"num": 34, "type": "open", "q": "Was versteht man unter Ansitzen und nennen Sie vier Arten von Ansitzeinrichtungen!", "a": "Längere Zeit auf einem Fleck (z.B. Hochsitz, Leiter, Schirm, Stock) zu sitzen und auf Wild zu warten. So anlegen, dass man sie beziehen kann, ohne das Wild zu stören. Gelände, Deckung, Einstände, Wechsel und Hauptwindrichtung beachten.", "label": "34"}, {"num": 35, "type": "open", "q": "Was ist eine Streife und wie wird sie durchgeführt?", "a": "Eine Treibjagd auf Niederwild. Jäger, Treiber und Hundeführer laufen nebeneinander und durchkämmen das Gelände. Die Streife kann nur in übersichtlichem, niedrig bewachsenem Gelände durchgeführt werden.", "label": "35"}, {"num": 36, "type": "open", "q": "Nennen Sie vier Vorteile eines Hochsitzes gegenüber einem Bodensitz!", "a": "Besserer Überblick im Gelände, größere Sicherheit beim Kugelschuss (Geschossfang durch höheren Schusswinkel), man sitzt besser außer Wind, Wild äugt nicht nach oben (Ausnahmen z.B. Rotwild, Fuchs)", "label": "36"}, {"num": 37, "type": "open", "q": "Nennen Sie vier der gebräuchlichsten jagdlichen Einrichtungen.", "a": "Ansitzleiter, offene und geschlossene Kanzel, Schirm, Drückjagdbock", "label": "37"}, {"num": 38, "type": "open", "q": "Welchen Ansprüchen sollte ein guter Ansitzplatz gerecht werden?", "a": "Gutes Sicht- und Schussfeld, aber selbst in Deckung unbemerkt bleiben. Der Platz sollte erreichbar sein, ohne das Wild zu vergrämen. (Pirschsteig), die Hauptwindrichtung muss beachtet werden.", "label": "38"}, {"num": 39, "type": "open", "q": "Welche baulichen Vorteile bietet eine feste Kanzel?", "a": "Langjährig einsetzbar, gut geeignet für längere Ansitze, guter Wetterschutz. Zu beachten sind die Vorschriften für Sicherheit und Gesundheitsschutz, Rücksicht auf Naturschutz und Landschaftspflege sowie das Landschaftsbild, Auf land- und forstwirtschaftlich genutzten Grundstücken ist die Zustimmung des Grundeigentümers notwendig.", "label": "39"}, {"num": 40, "type": "open", "q": "Worauf haben Sie vor Abgabe eines Schusses zu achten?", "a": "Auf eine etwaige Gefährdung des Hintergeländes, sicheres Ansprechen und Standort des Wildes und dessen Entfernung, Kugelfang.", "label": "40"}, {"num": 41, "type": "open", "q": "Beschreiben Sie die Begriffe „Schusszeichen“ und “Kugelschlag“!", "a": "Die Reaktion des Wildtiers auf den angetragenen Schuss, das so genannte Zeichnen des Wildes. Ist das Geräusch, das beim Auftreffen des Geschosses auf den Wildkörper erzeugt wird.", "label": "41"}, {"num": 42, "type": "open", "q": "Nennen Sie vier „Pirschzeichen“!", "a": "Schweiß, Knochensplitter, Riss- oder Schnitthaar, Schaleneingriffe", "label": "42"}, {"num": 43, "type": "open", "q": "Worauf deutet das Klagen eines beschossenen Stückes Schwarzwild hin?", "a": "Schwarzwild klagt häufig nach einem Nieren- oder auch einem Knochentreffer.", "label": "43"}, {"num": 44, "type": "open", "q": "Auf welchen Treffersitz deutet Verdauungsinhalt am Anschuss hin? Was muss beachtet werden?", "a": "Verdauungsinhalt deutet auf einen Weidwundschuss hin. Dieser kann im Bereich des großen Gescheides (Mägen) oder auch des kleinen Gescheides (Därme) sein. Der Weidwundschuss ist nicht sofort tödlich.", "label": "44"}, {"num": 45, "type": "open", "q": "Wie sieht der Schweiß eines Lungenschusses aus?", "a": "Der Schweiß ist hellrot und schaumig. Meist sind auch Lungenstücke zu finden. Das beschossene Stück wird nicht weit vom Anschuss und in der Regel bereits verendet zu finden sein. (Kurze Totsuche)", "label": "45"}, {"num": 46, "type": "open", "q": "Wie zeichnet Wild bei einem Krellschuss und wie verhalten Sie sich?", "a": "Im Schuss bricht es blitzartig zusammen, schlegelt meist und wird nach kurzer Zeit wieder hoch, um zu flüchten. Beim Verdacht auf einen Krellschuss muss der Schütze zum Fangschuss bereit sein.", "label": "46"}, {"num": 47, "type": "open", "q": "Wie verhalten Sie sich, wenn Sie am Anschuss einen Weidwundschuss festgestellt haben?", "a": "Ich gehe nicht hinterher, lasse das Stück krank werden, und verständige einen Schweißhundeführer. Bei der Nachsuche wird das Wild oft noch lebend gefunden und muss gehetzt werden.", "label": "47"}, {"num": 48, "type": "open", "q": "Worauf deuten a.) Röhrenknochen und b.) Zahnteile am Anschuss hin?", "a": "Auf einen a.) Laufschuss und b.) Gebräch-/Äserschuss.", "label": "48"}, {"num": 49, "type": "open", "q": "Wie verhalten Sie sich, wenn ein beschossenes Stück Wild nicht am Anschuss liegt?", "a": "Ich kontrolliere nach ca. 15 Min. vorsichtig den Anschuss auf Pirschzeichen. Dabei wird der Anschuss nicht betreten. Je nach dem Vorhandensein von Pirschzeichen verständige ich einen Schweißhundeführer oder suche bei Lungenschuss mit meinem für die Nachsuche brauchbaren Jagdhund selbst nach.", "label": "49"}, {"num": 50, "type": "open", "q": "Beschreiben Sie ein Vorstehtreiben.", "a": "Ein Gebiet wird von Schützen umstellt, Treiber drücken das Wild heraus, das dann beschossen wird. Die Schützen stehen ruhig auf ihren Ständen bei Waldjagden möglichst mit Deckung und gutem Wind.", "label": "50"}, {"num": 51, "type": "open", "q": "Was ist ein Kesseltreiben?", "a": "Eine Gesellschaftsjagd auf Niederwild (klassisch Hase) im Feld. Schützen und Treiber laufen in gleichmäßigen Abständen nach rechts und links aus, sodass ein weiter Kreis entsteht.", "label": "51"}, {"num": 52, "type": "open", "q": "Beschreiben Sie ein Kesseltreiben.", "a": "Jäger und Treiber bilden einen Kreis von 2-3 km Durchmesser, gehen aufeinander zu, bis der innere Kreis einen Durchmesser von 350 Meter hat; ab da darf nur noch nach außen auf flüchtendes Wild geschossen werden, das die Treiber hinaus drücken.", "label": "52"}, {"num": 53, "type": "open", "q": "Was versteht man unter Lockjagd und was ist eine optische Lockjagd?", "a": "Die Jagd auf Rehbock, Rothirsch, Ente oder Taube, die durch das Nachahmen artgleicher Rufe angelockt werden. Es werden Lockvögel (Artgenossen) in günstiger Schussentfernung an Äsungsflächen aufgestellt.", "label": "53"}, {"num": 54, "type": "open", "q": "Was versteht man unter Reizjagd?", "a": "Die Jagd auf Raubwild (z.B. Fuchs), welches durch das Nachahmen von Beutetieren angelockt wird.", "label": "54"}, {"num": 55, "type": "open", "q": "Was versteht man unter der Jagdart „Frettieren“?", "a": "Die Baujagd mit dem Frettchen (domestizierter Iltis) auf die Wildart Kaninchen.", "label": "55"}, {"num": 56, "type": "open", "q": "Was versteht man unter Beizjagd, darf diese von jedem Jäger ausgeübt werden?", "a": "Die Jagd mit dem Greifvogel (z.B. Wanderfalke, Habicht und Steinadler). Es müssen nötige Kenntnisse in einer eigenen Falknerprüfung (Zusätzlich zur Jägerprüfung) nachgewiesen werden.", "label": "56"}, {"num": 57, "type": "open", "q": "Auf welche Wildarten werden Treibjagden durchgeführt?", "a": "Auf Niederwildarten (außer Rehwild) wie z.B. Hase, Fasan, Kaninchen.", "label": "57"}, {"num": 58, "type": "open", "q": "Was ist kennzeichnend für eine Treibjagd?", "a": "Das laute Hochscheuchen des Wildes (kein Schalenwild), welches dann meist mit Schrot erlegt wird. Ist eine Gesellschaftsjagd, bei der klassisch Hasen, Fuchs, Kaninchen, Fasan, Schnepfen, Tauben bejagt werden.", "label": "58"}, {"num": 59, "type": "open", "q": "Nennen Sie vier Wildarten auf die man bei einer Drückjagd die Jagd ausüben möchte!", "a": "Auf Schalenwild, Bsp.: Rotwild, Damwild, Schwarzwild und Raubwild, Bsp.: Fuchs, Marderhund, Waschbär", "label": "59"}, {"num": 60, "type": "open", "q": "Auf welche Weise wird die Drückjagd durchgeführt?", "a": "Treiber drücken ruhig und langsam die Einstände (Dickungen) des Wildes durch, Schützen stehen an den Wechseln und beschießen das anwechselnde Wild.", "label": "60"}, {"num": 61, "type": "open", "q": "Nennen Sie mindestens zwei traditionelle Verständigungsmittel bei der Jagd.", "a": "Jägersprache, Jagdsignale, Bruchzeichen.", "label": "61"}, {"num": 62, "type": "open", "q": "Welche Voraussetzungen müssen Fallen in M-V besitzen, um ohne Genehmigung eingesetzt werden zu dürfen?", "a": "Sie müssen Wild unversehrt und lebend fangen.", "label": "62"}, {"num": 63, "type": "open", "q": "Nennen Sie vier Fallen, die unversehrt und lebend fangen!", "a": "Kastenfalle, Betonrohrfalle, Wieselwippbrettfalle, Kofferfalle, Jungfuchsfalle, Habichtskorb, Krähenfalle", "label": "63"}, {"num": 64, "type": "open", "q": "Nennen Sie vier Totschlagfallen.", "a": "Eiabzugseisen, Schwanenhals, Rasenfalle, Scherenfalle, Marderschlagbaum", "label": "64"}, {"num": 65, "type": "open", "q": "In welchen vier Fachrichtungen werden Vorstehhunde bei der Verbandsgebrauchsprüfung (VGP) geprüft?", "a": "Waldarbeit, Wasserarbeit, Feldarbeit, Gehorsam.", "label": "65"}, {"num": 66, "type": "open", "q": "Wie tötet man Wild, das in einer Lebendfalle gefangen wurde?", "a": "Durch einen gezielten Kleinkaliberschuss in den Kopf oder im Fangschusskorb mit Schrot.", "label": "66"}, {"num": 67, "type": "open", "q": "Wie dürfen Fangeisen nur noch eingesetzt werden?", "a": "Wenn sie in einem Behältnis (Fangbunker) vor dem Zugriff Dritter gesichert sind, dieses abschließbar, mit einem Hinweisschild und mit einem armlangen Einlauf versehen ist.", "label": "67"}, {"num": 68, "type": "open", "q": "Was ist eine Wieselwippbrettfalle, welche Maßnahme ist beim Einbau zu beachten?", "a": "Eine kleine Holzkiste mit Wippbrett, in die das Hermelin zwar hinein, aber nicht mehr herauskommt. Es sollten 8-10 m lange, glatte Pässe zu den Fallen geharkt werden.", "label": "68"}, {"num": 69, "type": "open", "q": "Wer darf in befriedeten Bezirken in M-V die Fallenjagd ausüben und unter welchen Voraussetzungen?", "a": "Der Grundstückseigentümer oder Nutzungsberechtigte und die von ihm Beauftragten, wenn die Fallen unversehrt und lebend fangen.", "label": "69"}, {"num": 70, "type": "open", "q": "Nennen Sie sechs deutsche Vorstehhunderassen!", "a": "Deutsch Drahthaar, Deutsch Kurzhaar, Deutsch Stichelhaar, Deutsch Langhaar, Pudelpointer, Weimaraner, großer und kleiner Münsterländer.", "label": "70"}, {"num": 71, "type": "open", "q": "Nennen Sie vier englische Vorstehhunderassen und ihr vorwiegendes Einsatzgebiet!", "a": "Englisch Setter, Gordon Setter, Irisch Setter, Pointer. Sie sind Feldspezialisten für die Suchjagd.", "label": "71"}, {"num": 72, "type": "open", "q": "Nennen Sie zwei Stöberhunderassen!", "a": "Deutscher Wachtelhund, Cocker Spaniel.", "label": "72"}, {"num": 73, "type": "open", "q": "Nennen Sie vier Erdhunderassen! Welche drei Teckelformen kennen Sie?", "a": "Rauhaarteckel, Langhaarteckel, Kurzhaarteckel, Deutscher Jagdterrier. Teckel Normalschlag, Zwergteckel und Kaninchenteckel.", "label": "73"}, {"num": 74, "type": "open", "q": "Nennen Sie Apportierhunderassen. Welche Einsatzgebiete haben sie?", "a": "Labrador Retriever, Golden Retriever. Apportierspezialisten von Verlorenbringen von Niederwild im Feld und im Wasser. Sie eignen sich bei entsprechender Abrichtung zum Buschieren und für die Schweißarbeit.", "label": "74"}, {"num": 75, "type": "open", "q": "Wozu braucht man Erdhunde und welche Wildarten werden damit bejagt?", "a": "Zur Baujagd, meist auf den Fuchs, Marderhund und Dachs. In den Wintermonaten, da Raubwild sich überwiegend im Bau aufhält.", "label": "75"}, {"num": 76, "type": "open", "q": "Welche Aufgaben hat ein Vorstehhund in erster Linie?", "a": "Er wird zur Suche eingesetzt (Absuchen von Feldern gegen den Wind, durch eine starre Körperhaltung, das so genannte Vorstehen, zeigt er gefundenes Wild an), aber auch Apportieren, Stöbern und Wasserarbeit gehören zu seinen Aufgaben.", "label": "76"}, {"num": 77, "type": "open", "q": "Unter welchen Voraussetzungen dürfen in M-V Jagdhunde zur Jagd eingesetzt werden?", "a": "Eingesetzt werden dürfen nur Jagdhunde, deren Brauchbarkeit die Landesjägerschaft nach bestandener Prüfung bestätigt hat (Brauchbarkeitspass).", "label": "77"}, {"num": 78, "type": "open", "q": "Nennen Sie sechs bekannte Rassegruppen der Jagdhunde!", "a": "Bracken, Schweißhunde, Stöberhunde, Vorstehhunde, Erdhunde, Apportierhunde", "label": "78"}, {"num": 79, "type": "open", "q": "Was versteht man unter „Stöbern“?", "a": "Der Stöberhund sucht ohne Sichtkontakt zum Führer eine Dickung im Wald nach Wild ab. Er gibt Laut sobald er Wild in der Nase hat.", "label": "79"}, {"num": 80, "type": "open", "q": "Was bedeutet es, wenn der Hund „bogenrein“ ist?", "a": "Der Hund stöbert nur in dem ihm zugewiesenen Bereich (z.B. in der Dickung oder einem bestimmten Revierteil, einem Jagen).", "label": "80"}, {"num": 81, "type": "open", "q": "Was sind Bracken und welche Stellung nehmen sie im Stammbaum aller Jagdhunderassen ein?", "a": "Bracken sind Laufhunde, sie sind die Stammform aller Jagdhunderassen.", "label": "81"}, {"num": 82, "type": "open", "q": "Welche Jagdart betreibt man mit Bracken klassisch und wie läuft diese ab?", "a": "Das Brackieren. Der Hund verfolgt bellend (laut gebend) solange einen Hasen oder Fuchs, bis das Wild vom Jäger geschossen wird.", "label": "82"}, {"num": 83, "type": "open", "q": "Was ist bei der Zwingerhaltung von Hunden zu beachten?", "a": "Der Zwinger muss groß genug sein (Hunde bis 50cm Schulterhöhe: 6 qm, 50-65cm Schulterhöhe: 8 qm, über 65cm Schulterhöhe: 10 qm) wetterfeste Hütte und der Hund muss einmal täglich eine Stunde freien Auslauf bekommen.", "label": "83"}, {"num": 84, "type": "open", "q": "Wie oft und in welcher Jahreszeit wird die Hündin meist läufig und wie lange dauert eine Läufigkeit?", "a": "Zweimal im Jahr, meist im Frühjahr und im Herbst, sie „färbt“, Dauer ca. drei Wochen.", "label": "84"}, {"num": 85, "type": "open", "q": "Welche Zahnstellungen gibt es beim Hund?", "a": "Scherengebiss, Zangengebiss, Vorbeißer, Rückbeißer", "label": "85"}, {"num": 86, "type": "open", "q": "Nennen Sie zwei Schweißhunderassen. Welche Rasse wird als dritte anerkannte Schweißhunderasse bezeichnet?", "a": "Hannoverscher Schweißhund, Bayerischer Gebirgsschweißhund. Als dritte anerkannte Schweißhunderasse wird die Alpenländische Dachsbracke bezeichnet.", "label": "86"}, {"num": 87, "type": "open", "q": "Gegen welche Krankheiten wird der Hund geimpft und wie oft muss das geschehen?", "a": "Einmal jährlich gegen SHLPT (Staupe, Hepatitis, Leptospirose, Parvovirose, Tollwut).", "label": "87"}, {"num": 88, "type": "open", "q": "Wie häufig sollte der Hund entwurmt werden?", "a": "Viermal im Jahr, bei Bedarf auch häufiger.", "label": "88"}, {"num": 89, "type": "open", "q": "Was versteht man unter „Stubendressur“?", "a": "Grundgehorsamsübungen mit einem jungen Hund ohne Ablenkung von außen.", "label": "89"}, {"num": 90, "type": "open", "q": "Was wird einem Jagdgebrauchshund in der Grundabrichtung beigebracht?", "a": "Platz, Sitz, Ablegen, Herankommen, Leinenführigkeit", "label": "90"}, {"num": 91, "type": "open", "q": "Was versteht man unter einem Schweißriemen?", "a": "Eine lange Leine (6 bis 12 Meter) aus Leder oder Kunststoff, mit der der Schweißhund auf der Nachsuche mit dem Führer verbunden ist.", "label": "91"}, {"num": 92, "type": "open", "q": "Was ist das Besondere an einer Schweißhalsung und wie nennt man den traditionell “aufgewickelten“ Schweißriemen?", "a": "Sie ist breiter als die „normale“ Halsung und hat einen drehbaren Wirbel, an dem der Schweißriemen befestigt wird. Er ist „aufgedockt“.", "label": "92"}, {"num": 93, "type": "open", "q": "Nennen Sie die beiden Zuchtprüfungen (Anlagenprüfungen) für DD (und andere rau- bzw. langhaarige Vorstehhunde), sowie die beiden damit vergleichbaren Prüfungen des DK-Verbandes.!", "a": "Die Verbandsjugendprüfung (VJP) und die Herbstzuchtprüfung (HZP) bei DD Derby und Solms für Deutsch Kurzhaar", "label": "93"}, {"num": 94, "type": "open", "q": "Was bezeichnet man als „kupieren“? Erläutern Sie, warum dies als notwendig erachtet wird.", "a": "Kürzen der Rute des Jagdhundes, um Rutenverletzungen bei der Jagdausübung zu verhindern.", "label": "94"}, {"num": 95, "type": "open", "q": "Was bedeutet „den Hund schnallen” und zu welchem Zweck geschieht das?", "a": "Den Hund von der Halsung und Leine befreien, damit er krankes Wild hetzen kann.", "label": "95"}, {"num": 96, "type": "open", "q": "Bei welchen Jagdarten muss ein brauchbarer Jagdhund verwendet werden?", "a": "Bei jeder Such-, Drück- und Treibjagd, bei der Jagd auf Schnepfen und Wasserwild sowie bei der Nachsuche.", "label": "96"}, {"num": 97, "type": "open", "q": "Wie nennt man die Ohren des Jagdhundes und welche Erkrankung der Ohren kennen Sie?", "a": "Behänge, Ohrenzwang", "label": "97"}, {"num": 98, "type": "open", "q": "Nennen Sie sechs Gegenstände, die bei der Ausbildung eines Jagdhundes Verwendung finden!", "a": "Führerleine, Feldleine, Apportierbock, Hundepfeife, Schweißriemen, Schweißhalsung, Schutzweste", "label": "98"}, {"num": 99, "type": "open", "q": "Was ist der Unterschied zwischen Einschliefen und Einfahren?", "a": "Einschliefen: Das Zu-Bau-Lassen eines Erdhundes.\nEinfahren: Das in-den-Bau-Gehen von Fuchs oder Dachs", "label": "99"}, {"num": 100, "type": "open", "q": "Was ist ein „Blinker“ und was ist ein Blender? Erläutern Sie den Unterschied!", "a": "Blinker - Ein Vorstehhund, der nicht vorsteht, obwohl er Wildwitterung bekommt, sondern dem Wild ausweicht. Blender - Ein Vorstehhund, der vorsteht, obwohl er keine Wildwitterung hat.", "label": "100"}, {"num": 101, "type": "open", "q": "Erläutern Sie die Begriffe: Wildschärfe, Raubwildschärfe!", "a": "Wildschärfe: Ein Hund stellt krankes Wild nach kurzer Flucht durch zufassen und halten (Schweißhund).\nRaubwildschärfe: Ein Hund greift nach kurzer Flucht krankes Raubwild und würgt es ab (Vorstehhund).", "label": "101"}, {"num": 102, "type": "open", "q": "Erläutern Sie den Unterschied zwischen einer Verleitfährte und einem Widergang!", "a": "Verleitfährte: Eine Fährte gesunden Wildes, welche eine Wundfährte kreuzt. Widergang: Eine Fährte eines krank geschossenen Wildes, das auf seiner eigenen Fährte zurückzieht und von der Fährte im Winkel abgeht.", "label": "102"}, {"num": 103, "type": "open", "q": "Nennen Sie vier Arten von Schweiß, die am Anschuss von Schalenwild vorkommen können!", "a": "Herz-Schweiß, Lungen-Schweiß (hellrot u. schaumig), Leber-Schweiß (dunkel u. grießig), Weidwund-Schweiß (braunrot u. mit Pansen-u. Scheideeinhalt durchsetzt), Wildbret-Schweiß (hell-bis dunkelrot)", "label": "103"}, {"num": 104, "type": "open", "q": "Was ist eine Feldleine und wie verwendet man sie?", "a": "Eine Nylonleine (ca. 20 Meter) zur Ausbildung vor allem der Vorstehhunde, sie ist der verlängerte Arm des Hundeführers.", "label": "104"}, {"num": 105, "type": "open", "q": "Was ist eine HZP und welche Abrichtefächer werden geprüft?", "a": "Herbstzuchtprüfung. Bringen, Verlorensuchen im Wasser, Gehorsam, Schleppen", "label": "105"}, {"num": 106, "type": "open", "q": "Was ist ein Wundbett und was ein Tropfbett? Erläutern Sie!", "a": "Die Stelle, an der sich krankes Wild hinlegt (=nieder tut). Tropfbett: Die Stelle, an der sich krankes Wild hinstellt und verharrt. Beides kann bei der Nachsuche auftreten.", "label": "106"}, {"num": 107, "type": "open", "q": "Nennen Sie vier Gründe warum die Deutung der Pirschzeichen am Anschuss vor dem Beginn einer Nachsuche wichtig sind!", "a": "Beginn der Nachsuche, Trefferlage, Wahl des Hundes, Fluchtstrecke, Gefahren, Jagdhelfer", "label": "107"}, {"num": 108, "type": "open", "q": "Worauf ist beim Kauf eines Welpen zu achten?", "a": "Dass der Welpe keinen ängstlichen Eindruck macht, auf Gebäudefehler, Zahnstellung, Zuchthündin, anerkannte Papiere, Gesamteindruck der Zuchtstätte", "label": "108"}, {"num": 109, "type": "open", "q": "Nennen Sie Eigenschaften, die einen Schweißhund auszeichnen!", "a": "ruhiges Wesen, ausdauernd, gute Nasenleistung, Fährtenwillen, Wildschärfe, Eigenständigkeit", "label": "109"}, {"num": 110, "type": "open", "q": "Was versteht man unter Ohrenzwang und welche Folgen kann das haben?", "a": "Ohrenzwang (Otitis externa) ist eine Entzündung des äußeren Ohres. Bräunliches, komisch riechendes Sekret.", "label": "110"}, {"num": 111, "type": "open", "q": "Was ist a) ein Anschneider? b) ein Totengräber?", "a": "a) ein Hund, der Wild anfrisst b) ein Hund, der Wild vergräbt", "label": "111"}, {"num": 112, "type": "open", "q": "Was versteht man unter “genossen machen”?", "a": "Nach guter Schweißarbeit bekommt der Hund z.B. die Milz o.ä. vom gefundenen Stück (Belohnung), kein Schwarzwild.", "label": "112"}, {"num": 113, "type": "open", "q": "Was ist ein „Bringsel” und wie muss er vom Hund gehandhabt werden?", "a": "Meist ein kurzes Lederstück, das an der Halsung befestigt ist und welches der frei suchende Hund in den Fang nimmt, sobald er das gesuchte, verendete Stück Schalenwild gefunden hat.", "label": "113"}, {"num": 114, "type": "open", "q": "Wie äußert sich Schussempfindlichkeit und Schussscheue beim Hund?", "a": "Schussempfindlichkeit: Hund kehrt nach dem Knall ängstlich zum Führer zurück und bleibt ganz in seiner Nähe (er “klebt”), Schussscheue: Hund läuft nach dem Schuss davon oder versteckt sich.", "label": "114"}, {"num": 115, "type": "open", "q": "Was soll der Hund beim Trillerpfiff oder Armhochnehmen machen?", "a": "Er soll sofort in Down- Lage gehen (Ablegen, Kopf zwischen die Vorderpfoten) und am Ort verharren.", "label": "115"}, {"num": 116, "type": "open", "q": "Wie heißen die Altersangaben beim Vorstehhund und beim Schweißhund?", "a": "Vorstehhund = Feld, Schweißhund = Behang.", "label": "116"}, {"num": 117, "type": "open", "q": "Wie alt ist ein Hund, der im dritten Feld steht?", "a": "Er ist drei Jahre alt und befindet sich im Moment im vierten Lebensjahr.", "label": "117"}, {"num": 118, "type": "open", "q": "Was bezeichnet man als „Schwimmspur”?", "a": "Die Witterungsbahn der schwimmenden Ente, die der Hund ausarbeiten soll.", "label": "118"}, {"num": 119, "type": "open", "q": "Bei welchen Arbeiten wird dem Hund die Halsung abgenommen?", "a": "Bei der Wasserarbeit, bei der Stöberarbeit in dichter Deckung, wenn der Hund bei der Nachsuche zur Hetze geschnallt wird und bei der Bauarbeit.", "label": "119"}, {"num": 120, "type": "open", "q": "Was bedeutet es, wenn der Hund einen Hasen „sticht”?", "a": "Wenn der Hund den Hasen aus der Sasse jagt.", "label": "120"}, {"num": 121, "type": "open", "q": "Was versteht man unter Kynologie?", "a": "Die Lehre von Rassen, Zucht, Pflege, Verhalten, Erziehung und Krankheiten der Haushunde.", "label": "121"}, {"num": 122, "type": "open", "q": "Welche Jagdart bezeichnet man als Feldsuche und wie läuft diese ab?", "a": "Planvolles Absuchen der Felder mit Vorstehhunden auf Niederwild, diese Suche verläuft gegen den Wind, gefundenem Wild steht der Hund vor.", "label": "122"}, {"num": 123, "type": "open", "q": "Was versteht man unter „sekundieren“?", "a": "Das gleichzeitige Vorstehen eines zweiten Hundes, ohne dass dieser Wind vom Wild bekommt.", "label": "123"}, {"num": 124, "type": "open", "q": "Nennen Sie vier Leistungen die auf der Verbandsjugendprüfung der Vorstehhunde gefordert werden.", "a": "Hauptsächlich die Anlagen des Junghundes, also Nase, Suche, Vorstehen, Hasenspur, Führigkeit sowie Schussfestigkeit.", "label": "124"}, {"num": 125, "type": "open", "q": "Nennen Sie sechs Leistungen die auf der Herbstzuchtprüfung der Vorstehhunde gefordert werden.", "a": "Nase, Suche, Vorstehen, Schussfestigkeit, Gehorsam sowie Haarwildschleppe, Federwildschleppe und Wasserarbeit.", "label": "125"}, {"num": 126, "type": "open", "q": "Was ist eine Schleppe und was hat der Hund dabei zu leisten?", "a": "Man zieht z.B. ein Stück Wild an einem Band hinter sich her und lässt dieses am Ende der geschleppten Strecke liegen, der Hund muss die Schleppspur ausarbeiten und das gefundene Wild apportieren.", "label": "126"}, {"num": 127, "type": "open", "q": "Nennen Sie acht Leistungen die auf der Verbandsgebrauchsprüfung der Vorstehhunde gefordert werden.", "a": "Nase, Suche, Vorstehen, Schussfestigkeit, Gehorsam, Federwildschleppe, Haarwildschleppe, Wasserarbeit, Schweißarbeit, Fuchsschleppe, Fuchs über Hindernis bringen, Buschieren, Stöbern, Verhalten auf dem Stand", "label": "127"}, {"num": 128, "type": "open", "q": "Nennen Sie die Merkmale der Leistungszucht (JGHV) bei Jagdhunden.", "a": "Das Rüde und Hündin vor einer Verpaarung nachgewiesen haben: 1.) Das sie Leistungsprüfungen bestanden haben. 2.) Das sie gesund sind. 3.) Das sie dem Rassestandard entsprechen.", "label": "128"}, {"num": 129, "type": "open", "q": "Welche Hunde werden von der weiteren Prüfung ausgeschlossen?", "a": "Schussscheue Hunde, Knautscher, Anschneider und Totengräber", "label": "129"}, {"num": 130, "type": "open", "q": "Was ist ein handscheuer Hund?", "a": "Ein Hund, der bei Berührung mit der Hand ängstlich reagiert oder sich gar nicht anfassen lässt.", "label": "130"}, {"num": 131, "type": "open", "q": "Was versteht man unter „schusshitzig“?", "a": "Wenn der Hund losspringt, sobald der Jäger die Waffe hebt oder schießt.", "label": "131"}, {"num": 132, "type": "open", "q": "Deuten Sie folgendes Inserat aus einer Jagdzeitung:", "a": "„DK-Hündin, gew. 12.05.05, VJP, HZP, BP, Form- und Haarwert v/sg“\nDK = Deutsch-Kurzhaar, gew. = gewölft, VJP = Verbandsjugendprüfung, HZP = Herbstzuchtprüfung, BP = Brauchbarkeitsprüfung, v/sg = vorzüglich/sehr gut", "label": "132"}, {"num": 133, "type": "open", "q": "Welche Dokumente muss der Hundeführer vor Beginn einer Hundeprüfung vorlegen?", "a": "Jagdschein, Ahnentafel oder Registrierbescheinigung und Impfpass", "label": "133"}, {"num": 134, "type": "open", "q": "Nennen Sie sechs Prüfungsfächer, die bei Brauchbarkeitsprüfung verlangt werden.", "a": "Gehorsam/Schussfestigkeit, dazu die Wahlfächer, die der Hundeführer mit seinem Hund ablegen möchte (z.B.: Schweißarbeit, Stöbern, Bauarbeit, Haarwildschleppe, Federwildschleppe, Bringen von Wild aus dem Wasser)", "label": "134"}, {"num": 135, "type": "open", "q": "Welche Hunde dürfen an einer Brauchbarkeitsprüfung teilnehmen?", "a": "Alle anerkannten Jagdhunderassen mit Ahnentafel oder Registrierbescheinigung, Mindestalter ein Jahr.", "label": "135"}, {"num": 136, "type": "open", "q": "Was ist ein Bringselverweiser?", "a": "Ein Hund, der nach dem Schuss gefundenes Wild, das er nicht apportieren kann (Schalenwild), durch Aufnahme des Bringsels anzeigt.", "label": "136"}, {"num": 137, "type": "open", "q": "Was sind Leistungszeichen und was sagen sie aus?", "a": "Zeichen, die in die Ahnentafel des Hundes eingetragen werden, sie zeigen, welche Prüfungen der Hund mit welchem Ergebnis gemacht hat.", "label": "137"}, {"num": 138, "type": "open", "q": "Was versteht man unter dem Begriff „sichtlaut“ und „fährtenlaut“?", "a": "Ein Hund bellt beim Anblick des verfolgten Wildes. Ein Hund gibt auf der warmen (frischen) Wildfährte laut.", "label": "138"}, {"num": 139, "type": "open", "q": "Was versteht man unter dem Begriff „aufmüden“?", "a": "Ein krankes Stück Wild aus dem Wundbett aufscheuchen.", "label": "139"}, {"num": 140, "type": "open", "q": "Was ist ein „Brand“ bei Jagdhunden?", "a": "Es sind rote Abzeichen auf schwarzem Fell (z.B. am Fang, an den Läufen oder oberhalb der Augen).", "label": "140"}, {"num": 141, "type": "open", "q": "Nennen Sie vier Jagdhunderassen mit Brand!", "a": "Brandlbracke, Gordon Setter, Deutscher Jagdterrier, Kurzhaar-, Langhaar-, Rauhaarteckel", "label": "141"}, {"num": 142, "type": "open", "q": "Aus welcher Richtung soll der Wind bei einer Suche kommen?", "a": "Von vorne oder seitlich, damit der Hund auch Wildwitterung bekommt.", "label": "142"}, {"num": 143, "type": "open", "q": "Durch welche Krankheitserreger wird die Leptospirose hervorgerufen und wie ist der Verlauf der Erkrankung?", "a": "Die Leptospirose (Stuttgarter Hundeseuche) ist eine vom Blut ausgehende fieberhafte Infektionskrankheit des Hundes. Erreger sind Bakterien. Die Krankheitszeichen sind Erbrechen, Fieber, Freßunlust und Durchfall.", "label": "143"}, {"num": 144, "type": "open", "q": "Was ist ein Kirchgang?", "a": "Das Ziehen des Hirsches am Morgen vom Felde in das Holz.", "label": "144"}, {"num": 145, "type": "open", "q": "Was ist eine Fährte?", "a": "Die Abdrücke der Schalen bei allem Schalenwild. Ein einzelner Abdruck heißt Tritt oder Trittsiegel. Eine Reihe von Tritten ergibt eine Fährte.", "label": "145"}, {"num": 146, "type": "open", "q": "Nennen Sie vier Beispiele für den Begriff „Erdmast“.", "a": "Insektenlarven, Engerlinge, Mäuse, Wurzeln und Pilze, nach denen Schwarzwild bricht und der Dachs wurzelt oder sticht - auch Untermast genannt.", "label": "146"}, {"num": 147, "type": "open", "q": "Unterscheiden Sie die Begriffe a.) Luderschacht und b.) Luderplatz!", "a": "a.) Ein Luderschacht ist ein etwa 1 m lange und im Durchmesser 20-30 cm Röhre (Beton oder Kunststoff) die mit der Öffnung nach oben in die Erde eingelassen wird. Die Röhre wird mit Aufbruch bestückt. b.) Platz an dem Kirrbrocken ausgelegt werden (Wildgescheide) durch die Witterung wird das Raubwild angelockt. Als Luder dürfen Reste von Wiederkäuern, Hase, Kaninchen und Federwild verwendet werden.", "label": "147"}, {"num": 148, "type": "open", "q": "Was versteht man unter „Annehmen“?", "a": "- Der Jäger oder Hund wird von Raub-/oder Schwarzwild angegriffen.\n- Das Wild benutzt einen Wechsel.", "label": "148"}, {"num": 149, "type": "open", "q": "Was ist ein „Bart“?", "a": "- Die Borstenhaare an den Lippen des Hasen, des Fuchses, des Hundes usw.\n- Die Rückenhaare des Gamsbockes, des Dachses und des Schwarzwildes.\n- Die Haare am unteren Teil des Trägers bei Hirschen.\n- Der Federbüschel am Kinn des Auerhahns.", "label": "149"}, {"num": 150, "type": "open", "q": "Was versteht man unter „beschlagen“?", "a": "- Auf einem kleinen Stiel stehender Federbüschel am Pürzel der Schnepfe.\n- Das Begatten bei allem Schalenwild.\n- Der Zustand des trächtigen weiblichen Schalenwildes.", "label": "150"}, {"num": 151, "type": "open", "q": "Nennen Sie vier Grundsätze der Weidgerechtigkeit!", "a": "Anständiges Verhalten gegenüber dem Wild und den Mitjägern, kein Jagdneid!\nBeachtung der geschriebenen und ungeschriebenen Gesetze,\nBeachtung des Tierschutzes, dem Wild unnötige Leiden ersparen,\nGrundsätze der Bejagung beachten: „Jung vor Alt bzw. Schwach vor Stark“", "label": "151"}, {"num": 152, "type": "open", "q": "Nennen Sie zwei Maßnahmen, durch welche sich Schwarzwildschäden im Feld verringern lassen.", "a": "Durch stärkere Bejagung (Reduktion)\nDurch Einzäunung / Elektrozäune, Vergrämen (akustisch, Hunde- bzw. Menschenhaare, chemisch)\nDurch Anlage von Wildäckern, Wildruhezonen", "label": "152"}, {"num": 153, "type": "open", "q": "Nennen Sie zwei Maßnahmen, durch welche sich Wiederkäuerschäden im Wald verringern lassen.", "a": "Wildäsungsflächen, Wildruhezonen, Kulturzäune, Einzelschutz, Intervalljagd, Nachtjagdverbot", "label": "153"}, {"num": 154, "type": "open", "q": "Was sind die wichtigsten Maßnahmen für eine erfolgreiche Niederwildhege?", "a": "Biotopgestaltung (Hecken, Wildäcker, Blühwiesen), starke Raubwildbejagung", "label": "154"}, {"num": 155, "type": "open", "q": "Nennen Sie vier Vorschriften der UVV-Jagd zum Thema Nachsuchen!", "a": "Hundeführer ist Jagdleiter. Keine Teilnahme von Kindern und Jugendlichen. Jagdwaffe an der Mündung abkleben. Signalkleidung tragen. Schutzkleidung verwenden Erste Hilfepaket mitführen.", "label": "155"}, {"num": 156, "type": "mc", "q": "Was muss beachtet werden, wenn der Jäger mit seiner Flinte einen Zaun überwindet?", "opts": [{"k": "a", "text": "Die Waffe muss immer geladen sein", "ok": false}, {"k": "b", "text": "Die Waffe muss immer entladen sein", "ok": true}, {"k": "c", "text": "Die Waffe kann geladen sein, muss aber gesichert sein", "ok": false}], "label": "156"}, {"num": 157, "type": "mc", "q": "Auf welches Wild wird frettiert?", "opts": [{"k": "a", "text": "Feldhühner", "ok": false}, {"k": "b", "text": "Marder", "ok": false}, {"k": "c", "text": "Kaninchen", "ok": true}], "label": "157"}, {"num": 158, "type": "mc", "q": "Wie groß ist die weidgerechte Schussentfernung beim Schrotschuss?", "opts": [{"k": "a", "text": "0 bis 20 Meter", "ok": false}, {"k": "b", "text": "10 bis 35 Meter", "ok": true}, {"k": "c", "text": "10 bis 60 Meter", "ok": false}], "label": "158"}, {"num": 159, "type": "mc", "q": "Womit sollte man Hunde während der Ausbildung nicht strafen?", "opts": [{"k": "a", "text": "Mit der Mütze", "ok": false}, {"k": "b", "text": "Mit der Pfeife", "ok": false}, {"k": "c", "text": "Mit der Hand", "ok": true}], "label": "159"}, {"num": 160, "type": "mc", "q": "Was versteht man unter Abfangen?", "opts": [{"k": "a", "text": "Das Töten von krankem Wild mit der blanken Waffe", "ok": true}, {"k": "b", "text": "Das Fangen von Kaninchen am Bau mit Netzen", "ok": false}, {"k": "c", "text": "Das Fangen von Raubwild in Fallen", "ok": false}], "label": "160"}, {"num": 161, "type": "mc", "q": "Was ist bei Flintenlaufgeschossen zu beachten?", "opts": [{"k": "a", "text": "Flintenlaufgeschosse dürfen nur aus speziell dafür zugelassenen Waffen verschossen werden.", "ok": false}, {"k": "b", "text": "Flintenlaufgeschosse müssen laut Unfallverhütungsvorschrift so mitgeführt werden, dass eine Verwechslung mit Schrotpatronen ausgeschlossen ist.", "ok": true}, {"k": "c", "text": "Es kommt leichter zu Abprallern als bei Büchsengeschossen.", "ok": false}], "label": "161"}, {"num": 162, "type": "mc", "q": "Was ist ein Fährtenschuh?", "opts": [{"k": "a", "text": "Ein besonders fester Schuh für Hunde- und Nachsuchenführer", "ok": false}, {"k": "b", "text": "Ein Spezialschuh zum Anlegen von Fährten für die Nachsuche, an dem ein Teil eines Wildlaufs befestigt wird", "ok": true}, {"k": "c", "text": "Spezialschuhe für Schweißhunde bei Harsch-Schnee und Eis", "ok": false}], "label": "162"}, {"num": 163, "type": "mc", "q": "Was versteht man unter dem Begriff „passen“?", "opts": [{"k": "a", "text": "Ansitz am Wechsel von Gams und Steinwild", "ok": false}, {"k": "b", "text": "Ansitz am Pass von Hasen oder Raubwild", "ok": true}, {"k": "c", "text": "den Impfpass von Jagdhunden kontrollieren", "ok": false}], "label": "163"}, {"num": 164, "type": "mc", "q": "Was bezeichnet man als Blattjagd?", "opts": [{"k": "a", "text": "Lockjagd mit dem Mauspfeifchen", "ok": false}, {"k": "b", "text": "Pirschjagd im Laubwaldrevieren", "ok": false}, {"k": "c", "text": "Lockjagd auf den Rehbock", "ok": true}], "label": "164"}, {"num": 165, "type": "mc", "q": "Auf welche Wildart kann man die Reizjagd ausüben?", "opts": [{"k": "a", "text": "Fuchs", "ok": true}, {"k": "b", "text": "Auerhahn", "ok": false}, {"k": "c", "text": "Gams", "ok": false}], "label": "165"}, {"num": 166, "type": "mc", "q": "Worauf muss man in M-V achten, wenn man die Jagd auf Wasserwild an Gewässern und im 400-Meter-Abstand von deren Ufern ausüben möchte?", "opts": [{"k": "a", "text": "Man darf ausschließlich von nichtmotorisierten Booten aus jagen", "ok": false}, {"k": "b", "text": "Es darf kein Bleischrot verwendet werden", "ok": true}, {"k": "c", "text": "Auf Enten und Gänse darf nur sitzend auf das Wasser geschossen werden", "ok": false}], "label": "166"}, {"num": 167, "type": "mc", "q": "Wie zeichnet ein Fasanenhahn, der Schrote in die Lunge bekommen hat?", "opts": [{"k": "a", "text": "Es lässt eine Schwinge hängen und streicht flach zu Boden", "ok": false}, {"k": "b", "text": "Es steigt senkrecht in die Luft, schlägt mit den Schwingen und stürzt ab (er „himmelt“", "ok": true}, {"k": "c", "text": "Der Hahn ruckt zusammen, lässt Federn und fällt zu Boden", "ok": false}], "label": "167"}, {"num": 168, "type": "mc", "q": "Wie zeichnet ein weidwund geschossenes Stück Rehwild?", "opts": [{"k": "a", "text": "Es humpelt in die nächste Deckung", "ok": false}, {"k": "b", "text": "Es fällt nach dem Schuss sofort um", "ok": false}, {"k": "c", "text": "Ausschlagen mit den Hinterläufen, zieht mit leicht gekrümmtem Rücken", "ok": true}], "label": "168"}, {"num": 169, "type": "mc", "q": "Welche Wildart bezieht neben dem Fuchs ebenfalls einen Kunstbau?", "opts": [{"k": "a", "text": "Marderhund", "ok": true}, {"k": "b", "text": "Schellente", "ok": false}, {"k": "c", "text": "Kaninchen", "ok": false}], "label": "169"}, {"num": 170, "type": "mc", "q": "Was versteht der Jäger unter dem Begriff abfangen?", "opts": [{"k": "a", "text": "Das Fangen der Kaninchen mit Hilfe von Netzen bei der Baujagd", "ok": false}, {"k": "b", "text": "Das Fangen und Töten eines Stückes durch den Jagdhund", "ok": false}, {"k": "c", "text": "Das Töten eines Stückes mit der kalten Waffe", "ok": true}], "label": "170"}, {"num": 171, "type": "mc", "q": "Welche Jagdart ist immer eine Gesellschaftsjagd?", "opts": [{"k": "a", "text": "Suche", "ok": false}, {"k": "b", "text": "Kesseltreiben", "ok": true}, {"k": "c", "text": "Pirsch", "ok": false}], "label": "171"}, {"num": 172, "type": "mc", "q": "Welches sind Einzeljagdarten?", "opts": [{"k": "a", "text": "Pirsch, Streife, Suche", "ok": false}, {"k": "b", "text": "Pirsch, Ansitz, Fallenjagd", "ok": true}, {"k": "c", "text": "Böhmische Streife, Vorstehtreiben, Kesseltreiben", "ok": false}], "label": "172"}, {"num": 173, "type": "mc", "q": "Welcher Jäger gilt als Erleger beim Schrotschuss?", "opts": [{"k": "a", "text": "Der Jäger, der das Stück tödlich trifft", "ok": true}, {"k": "b", "text": "Der erste Schütze", "ok": false}, {"k": "c", "text": "Der Jäger, der das Stück schon krank geschossen hat", "ok": false}], "label": "173"}, {"num": 174, "type": "mc", "q": "Welcher Jäger gilt als Erleger beim Kugelschuss?", "opts": [{"k": "a", "text": "Derjenige, der dem Stück den ersten Schuss angetragen hat", "ok": false}, {"k": "b", "text": "Derjenige, der das Stück so getroffen hat, dass es bei einer Nachsuche zur Strecke käme", "ok": true}, {"k": "c", "text": "Immer der letzte Schütze", "ok": false}], "label": "174"}, {"num": 175, "type": "mc", "q": "Wie tötet man noch nicht verendetes Federwild tierschutzgerecht?", "opts": [{"k": "a", "text": "Durch abnicken", "ok": false}, {"k": "b", "text": "Durch abfedern", "ok": false}, {"k": "c", "text": "Durch einen Schlag auf den Kopf", "ok": true}], "label": "175"}, {"num": 176, "type": "mc", "q": "Was findet der Jäger am Anschuss, wenn das Wild getroffen wurde?", "opts": [{"k": "a", "text": "Brandhaar", "ok": false}, {"k": "b", "text": "Risshaar", "ok": false}, {"k": "c", "text": "Schnitthaar", "ok": true}], "label": "176"}, {"num": 177, "type": "mc", "q": "Welche Maßnahme dient insbesondere der Hege von Stockenten?", "opts": [{"k": "a", "text": "Anbringen von Brutkörben im Revier", "ok": true}, {"k": "b", "text": "Anlage von Hecken", "ok": false}, {"k": "c", "text": "Anlage von Wildäckern", "ok": false}], "label": "177"}, {"num": 178, "type": "mc", "q": "Was versteht der Jäger unter Büchsenlicht?", "opts": [{"k": "a", "text": "Das Licht, mit dem Wild angeleuchtet zum Zwecke der Wildzählung", "ok": false}, {"k": "b", "text": "Ausreichendes Restlicht, um Wild anzusprechen und weidgerecht erlegen zu können", "ok": true}, {"k": "c", "text": "Der Sonnenschein, der beim Kugelschuss den Jäger blendet", "ok": false}], "label": "178"}, {"num": 179, "type": "mc", "q": "Welche Wildart fängt man üblicherweise mit der Lebendfangfalle?", "opts": [{"k": "a", "text": "Waschbär", "ok": true}, {"k": "b", "text": "Rehwild", "ok": false}, {"k": "c", "text": "Fasan", "ok": false}], "label": "179"}, {"num": 180, "type": "mc", "q": "Welche Fanggeräte dürfen ohne Genehmigung in M-V verwendet werden?", "opts": [{"k": "a", "text": "Tellereisen", "ok": false}, {"k": "b", "text": "Massenfänge", "ok": false}, {"k": "c", "text": "Fanggeräte, die unversehrt fangen", "ok": true}], "label": "180"}, {"num": 181, "type": "mc", "q": "Welche Jagdart übt man speziell auf den Marder aus?", "opts": [{"k": "a", "text": "Treibjagd", "ok": false}, {"k": "b", "text": "Ansitz", "ok": false}, {"k": "c", "text": "Ausneuen", "ok": true}], "label": "181"}, {"num": 182, "type": "mc", "q": "Was bezeichnet man als Kugelschlag?", "opts": [{"k": "a", "text": "Das Geräusch welches entsteht, wenn das Geschoss die Mündung verlässt", "ok": false}, {"k": "b", "text": "Das Geräusch welches entsteht, wenn das Geschoss auf den Wildkörper trifft", "ok": true}, {"k": "c", "text": "Der Rückstoß der Waffe", "ok": false}], "label": "182"}, {"num": 183, "type": "mc", "q": "Was bezeichnet der Jäger als „Bruch“?", "opts": [{"k": "a", "text": "Das brechen einer Kipplaufwaffe", "ok": false}, {"k": "b", "text": "Ein hirschgerechtes Zeichen", "ok": false}, {"k": "c", "text": "Ein abgebrochener grüner Zweig bestimmter Holzarten", "ok": true}], "label": "183"}, {"num": 184, "type": "mc", "q": "Welche Holzarten werden für Brüche verwendet?", "opts": [{"k": "a", "text": "Eiche, Buche, Tanne, Douglasie, Fichte", "ok": false}, {"k": "b", "text": "Pappel, Linde, Buche, Tanne, Kiefer", "ok": false}, {"k": "c", "text": "Eiche, Fichte, Erle, Kiefer, Tanne", "ok": true}], "label": "184"}, {"num": 185, "type": "mc", "q": "Wie muss ein Leitbruch aussehen?", "opts": [{"k": "a", "text": "Halbarmlang befegt", "ok": true}, {"k": "b", "text": "Armlang befegt", "ok": false}, {"k": "c", "text": "Halbarmlang unbefegt", "ok": false}], "label": "185"}, {"num": 186, "type": "mc", "q": "Wie sieht ein Warnbruch aus?", "opts": [{"k": "a", "text": "Armlang, komplett befegt, nur die Spitze ist noch grün, zum Kreis gebogen, aufgehängt", "ok": true}, {"k": "b", "text": "Halbarmlang, gekreuzt übereinandergelegt", "ok": false}, {"k": "c", "text": "Armlang, befegt, in den Boden gesteckt", "ok": false}], "label": "186"}, {"num": 187, "type": "mc", "q": "Wo wird der Erlegerbruch am Jagdhut getragen?", "opts": [{"k": "a", "text": "Links", "ok": false}, {"k": "b", "text": "Hinten", "ok": false}, {"k": "c", "text": "Rechts", "ok": true}], "label": "187"}, {"num": 188, "type": "mc", "q": "Welches Horn wird heute noch häufig bei Gesellschaftsjagden eingesetzt?", "opts": [{"k": "a", "text": "Waldhorn", "ok": false}, {"k": "b", "text": "Fürst-Pless-Horn", "ok": true}, {"k": "c", "text": "Clairon", "ok": false}], "label": "188"}, {"num": 189, "type": "mc", "q": "Welche Zähne gelten als Trophäe?", "opts": [{"k": "a", "text": "Grandeln des Rotalttieres", "ok": true}, {"k": "b", "text": "Molaren des Bockes", "ok": false}, {"k": "c", "text": "Prämolaren des Schwarzwildes", "ok": false}], "label": "189"}, {"num": 190, "type": "mc", "q": "Wann ist der St. Hubertustag?", "opts": [{"k": "a", "text": "Am 03. November", "ok": true}, {"k": "b", "text": "Am 01. April", "ok": false}, {"k": "c", "text": "Am 24. Dezember", "ok": false}], "label": "190"}, {"num": 191, "type": "mc", "q": "Welcher Jäger ist Jagdkönig?", "opts": [{"k": "a", "text": "Derjenige, der das meiste oder ranghöchste Wild erlegt hat", "ok": true}, {"k": "b", "text": "Derjenige, der das größte Revier besitzt", "ok": false}, {"k": "c", "text": "Derjenige, der den Jagdschein am häufigsten gelöst hat", "ok": false}], "label": "191"}, {"num": 192, "type": "mc", "q": "Was nennt man „Schüsseltreiben“?", "opts": [{"k": "a", "text": "Eine besondere Form der Treibjagd in nassen Revieren", "ok": false}, {"k": "b", "text": "Das gemeinsame Essen während oder nach der Jagd", "ok": true}, {"k": "c", "text": "Eine Form der Drückjagd aus dem Hochgebirge", "ok": false}], "label": "192"}, {"num": 193, "type": "mc", "q": "Welches ist eine Trophäe?", "opts": [{"k": "a", "text": "Taubenbart", "ok": false}, {"k": "b", "text": "Schnepfenbart", "ok": true}, {"k": "c", "text": "Muffelbart", "ok": false}], "label": "193"}, {"num": 194, "type": "mc", "q": "Wem steht das kleine Jägerrecht zu?", "opts": [{"k": "a", "text": "Dem Berufsjäger", "ok": false}, {"k": "b", "text": "Demjenigen, der das Stück aufgebrochen hat", "ok": true}, {"k": "c", "text": "Dem Jäger, der das Stück erlegt hat", "ok": false}], "label": "194"}, {"num": 195, "type": "mc", "q": "Wie wird Wild zur Strecke gelegt?", "opts": [{"k": "a", "text": "Es gibt keine festen Regeln", "ok": false}, {"k": "b", "text": "Weibliches vor männliches Wild, Feder- vor Haarwild, liegt auf linker Körperseite", "ok": false}, {"k": "c", "text": "Männliches vor weibliches Wild, groß vor klein, Haar- vor Federwild, das Wild liegt auf der rechten Körperseite", "ok": true}], "label": "195"}, {"num": 196, "type": "mc", "q": "Welche Reihenfolge der Jagdhornsignale ist bei einem Kesseltreiben richtig?", "opts": [{"k": "a", "text": "Anblasen des Treibens, Treiber in den Kessel, Hahn in Ruh", "ok": true}, {"k": "b", "text": "Anblasen des Treibens, Hase tot, Hahn in Ruh", "ok": false}, {"k": "c", "text": "Treiber in den Kessel, Hase tot, Hund ist weg", "ok": false}], "label": "196"}, {"num": 197, "type": "mc", "q": "Wie oft müssen Lebendfallen kontrolliert werden?", "opts": [{"k": "a", "text": "Stündlich", "ok": false}, {"k": "b", "text": "Mindestens einmal täglich", "ok": true}, {"k": "c", "text": "Wöchentlich einmal", "ok": false}], "label": "197"}, {"num": 198, "type": "mc", "q": "Was ist Weidgerechtigkeit?", "opts": [{"k": "a", "text": "Der respektvolle, anständige und tierschutzgerechte Umgang mit dem Wild", "ok": true}, {"k": "b", "text": "Geschichten rund um Jagd und Jäger", "ok": false}, {"k": "c", "text": "Der nette Umgang unter den Jägern", "ok": false}], "label": "198"}, {"num": 199, "type": "mc", "q": "Wie werden die Ohren von Fuchs, Schwarzwild, Hase und Rotwild in der Weidmannssprache jeweils genannt?", "opts": [{"k": "a", "text": "Ohren, Lauscher, Behänge, Messer", "ok": false}, {"k": "b", "text": "Behänge, Schüsseln, Gabeln, Lauscher", "ok": false}, {"k": "c", "text": "Gehöre, Teller, Löffel, Lauscher", "ok": true}], "label": "199"}, {"num": 200, "type": "mc", "q": "Welche Papiere müssen Schützen unbedingt vor einer Gesellschaftsjagd der Jagdleitung vorlegen?", "opts": [{"k": "a", "text": "Jagdschein", "ok": true}, {"k": "b", "text": "Impfpass des Hundes", "ok": false}, {"k": "c", "text": "Jagderlaubnisschein", "ok": false}], "label": "200"}, {"num": 201, "type": "mc", "q": "Sie fahren mit einem Fahrzeug. In welchem Zustand muss sich Ihre Waffe befinden?", "opts": [{"k": "a", "text": "Immer entladen", "ok": true}, {"k": "b", "text": "Geladen, solange Sie das Revier nicht verlassen", "ok": false}, {"k": "c", "text": "Entladen nur dann, wenn Sie nicht alleine fahren", "ok": false}], "label": "201"}, {"num": 202, "type": "mc", "q": "Welche UVV Jagd muss beim Hochsitzbau beachtet werden?", "opts": [{"k": "a", "text": "Nur gesundes Weichholz verwenden", "ok": false}, {"k": "b", "text": "Ständerwerk direkt in den Boden eingraben", "ok": false}, {"k": "c", "text": "Hochsitzeinrichtungen abstreben", "ok": true}], "label": "202"}, {"num": 203, "type": "mc", "q": "Wann müssen schadhafte Teile an Hochsitzen und Kanzeln erneuert werden?", "opts": [{"k": "a", "text": "Jährlich einmal", "ok": false}, {"k": "b", "text": "Vor dem nächsten Vollmond", "ok": false}, {"k": "c", "text": "Unverzüglich", "ok": true}], "label": "203"}, {"num": 204, "type": "mc", "q": "Was müssen Sie mit der Waffe tun, wenn bei einer Gesellschaftsjagd ein Treiben abgeblasen wird?", "opts": [{"k": "a", "text": "Sofort entladen", "ok": true}, {"k": "b", "text": "Sofort sichern", "ok": false}, {"k": "c", "text": "Bleibt Ihnen überlassen", "ok": false}], "label": "204"}, {"num": 205, "type": "mc", "q": "Wie ist die Waffe beim Besteigen von Hochsitz oder Kanzel zu tragen?", "opts": [{"k": "a", "text": "Immer im Futteral", "ok": false}, {"k": "b", "text": "Gesichert und mit der Mündung nach oben", "ok": false}, {"k": "c", "text": "Entladen und mit umgehängtem Gewehrriemen auf dem Rücken", "ok": true}], "label": "205"}, {"num": 206, "type": "mc", "q": "Muss bei Gesellschaftsjagden ein Jagdleiter bestimmt werden?", "opts": [{"k": "a", "text": "Ja, ohne Ausnahme", "ok": true}, {"k": "b", "text": "Nein, jeder Schütze ist für seinen Schuss selbst verantwortlich", "ok": false}, {"k": "c", "text": "Nur dann, wenn besondere Umstände vorliegen", "ok": false}], "label": "206"}, {"num": 207, "type": "mc", "q": "Wer ist für den sicheren Ablauf einer Gesellschaftsjagd verantwortlich?", "opts": [{"k": "a", "text": "Der Führer der Treiberwehr", "ok": false}, {"k": "b", "text": "Der Jagdleiter", "ok": true}, {"k": "c", "text": "Der Jagdausübungsberechtigte", "ok": false}], "label": "207"}, {"num": 208, "type": "mc", "q": "Bei welchen Jagdarten müssen brauchbare Jagdhunde vorhanden sein?", "opts": [{"k": "a", "text": "Bei jeder Lapp-, Pirsch-, Ansitzjagd", "ok": false}, {"k": "b", "text": "Bei jeder Netz-, Beiz-, Lockjagd", "ok": false}, {"k": "c", "text": "Bei jeder Such-, Drück-, Treibjagd", "ok": true}], "label": "208"}, {"num": 209, "type": "mc", "q": "Welchen ursprünglichen Einsatz hatten unsere Jagdhunde zwischen dem 18. und 20. Jahrhundert?", "opts": [{"k": "a", "text": "Einsatz als Meutehund", "ok": true}, {"k": "b", "text": "Einsatz als Hütehund", "ok": false}, {"k": "c", "text": "Einsatz als Wachhund", "ok": false}], "label": "209"}, {"num": 210, "type": "mc", "q": "Benennen Sie beim Hund folgende Körperteile in der Weidmannssprache: Auge, Nase, Schwanz.", "opts": [{"k": "a", "text": "Seher, Nase, Lunte", "ok": false}, {"k": "b", "text": "Auge, Nase, Rute", "ok": true}, {"k": "c", "text": "Licht, Windfang, Wedel", "ok": false}], "label": "210"}, {"num": 211, "type": "mc", "q": "Welches sind Jagdhunderassen?", "opts": [{"k": "a", "text": "Boxer, Rottweiler, Schäferhund", "ok": false}, {"k": "b", "text": "Dalmatiner, Dobermann, Mopps", "ok": false}, {"k": "c", "text": "Parson Russell Terrier, Epagneul Breton, Tiroler Bracke", "ok": true}], "label": "211"}, {"num": 212, "type": "mc", "q": "Welches sind Jagdhunderassegruppen?", "opts": [{"k": "a", "text": "Hütehunde, Schutzhunde", "ok": false}, {"k": "b", "text": "Vorstehhunde, Schweißhunde", "ok": true}, {"k": "c", "text": "Begleithunde, Blindenhunde", "ok": false}], "label": "212"}, {"num": 213, "type": "mc", "q": "Welche der genannten Jagdhunderassen sollte ein Pächter eines reinen Niederwildreviers mit überwiegend Wasserflächen als allgemeinen Gebrauchshund führen?", "opts": [{"k": "a", "text": "Labrador", "ok": true}, {"k": "b", "text": "Hannoverscher Schweißhund", "ok": false}, {"k": "c", "text": "Rauhaarteckel", "ok": false}], "label": "213"}, {"num": 214, "type": "mc", "q": "Welche nachstehend genannte Hunderasse wird für die Baujagd verwendet?", "opts": [{"k": "a", "text": "Kleiner Münsterländer", "ok": false}, {"k": "b", "text": "Rauhaarteckel", "ok": true}, {"k": "c", "text": "Deutsch-Kurzhaar", "ok": false}], "label": "214"}, {"num": 215, "type": "mc", "q": "Welche Hunderasse ist am besten geeignet für schwierige Nachsuchen auf Schalenwild?", "opts": [{"k": "a", "text": "Deutsch-Drahthaar", "ok": false}, {"k": "b", "text": "Jagdterrier", "ok": false}, {"k": "c", "text": "Hannoverscher Schweißhund", "ok": true}], "label": "215"}, {"num": 216, "type": "mc", "q": "In welchem Alter erhält der Jagdhund die erste Schutzimpfung?",  Bruch", "ok": true}, {"k": "b", "text": "Zwei befegte, gekreuzte Brüche", "ok": false}, {"k": "c", "text": "Ein armlanger, angespitzter Bruch", "ok": false}], "label": "275"}, {"num": 276, "type": "mc", "q": "Wie groß ist die maximale weidgerechte Schussentfernung beim Büchsenschuss?", "opts": [{"k": "a", "text": "Unter 35 m", "ok": false}, {"k": "b", "text": "100- 150 m", "ok": true}, {"k": "c", "text": "220-260 m", "ok": false}], "label": "276"}, {"num": 277, "type": "mc", "q": "Welche der nachgenannten Jagdarten ist eine typische Gesellschaftsjagdart?", "opts": [{"k": "a", "text": "Pirsch", "ok": false}, {"k": "b", "text": "Treibjagd", "ok": true}, {"k": "c", "text": "Nachsuche", "ok": false}], "label": "277"}, {"num": 278, "type": "mc", "q": "Welche der nachgenannten Baumarten zählt nicht zu den weidgerechten Holzarten?", "opts": [{"k": "a", "text": "Eiche", "ok": false}, {"k": "b", "text": "Buche", "ok": true}, {"k": "c", "text": "Tanne", "ok": false}], "label": "278"}, {"num": 279, "type": "mc", "q": "Welche Aussage ist richtig?", "opts": [{"k": "a", "text": "Ein Hund darf im Zwinger nicht angebunden werden", "ok": true}, {"k": "b", "text": "Hunde müssen grundsätzlich zu zweit gehalten werden", "ok": false}, {"k": "c", "text": "Hunde dürfen ausschließlich im Zwinger und nicht im Haus gehalten werden", "ok": false}], "label": "279"}, {"num": 280, "type": "mc", "q": "Auf welche Weise bleicht man Geweihschädel?", "opts": [{"k": "a", "text": "Mit Knochenöl", "ok": false}, {"k": "b", "text": "Durch Einwirkung von UV- Licht", "ok": false}, {"k": "c", "text": "Durch Nutzung von Wasserstoffperoxid", "ok": true}], "label": "280"}, {"num": 281, "type": "mc", "q": "Was gehört zur Grundausbildung des jungen Jagdhundes?", "opts": [{"k": "a", "text": "Die Grundkommandos Sitz und Platz", "ok": true}, {"k": "b", "text": "Die Wasserarbeit in kleinen Schilfgebieten", "ok": false}, {"k": "c", "text": "Das Apportieren eines Marders", "ok": false}], "label": "281"}, {"num": 282,
