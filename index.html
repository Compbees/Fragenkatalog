ung des öffentlichen Rechts", "label": "159"}, {"num": 160, "type": "open", "q": "Wie bemisst sich die Anzahl der Jagdausübungsberechtigten in einem Jagdbezirk?", "a": "Die Zahl der Jagdausübungsberechtigten wird bei Jagdbezirken bis zu 250 Hektar auf zwei beschränkt. In größeren Jagdbezirken erhöht sich die Anzahl je weitere angefangene 150 Hektar um eine weitere Person.", "label": "160"}, {"num": 161, "type": "mc", "q": "Mit welchem Recht ist die Pflicht zur Hege verbunden?", "opts": [{"k": "a", "text": "Mit dem Jagdrecht", "ok": true}, {"k": "b", "text": "Mit dem Jagdausübungsrecht", "ok": false}, {"k": "c", "text": "Mit dem Jagdnutzungrecht", "ok": false}], "label": "161"}, {"num": 162, "type": "mc", "q": "Welche Rechtsform hat eine Jagdgenossenschaft?", "opts": [{"k": "a", "text": "Eingetragener Verein", "ok": false}, {"k": "b", "text": "Körperschaft des öffentlichen Rechts", "ok": true}, {"k": "c", "text": "Gesellschaft mit beschränkter Haftung", "ok": false}], "label": "162"}, {"num": 163, "type": "mc", "q": "Was versteht man unter einem Jagdkataster?", "opts": [{"k": "a", "text": "Genau geführte Bestandsliste für Schalenwild", "ok": false}, {"k": "b", "text": "Mitglieder- und Grundflächenverzeichnis der Jagdgenossenschaft", "ok": true}, {"k": "c", "text": "Liste der innerhalb des Kreises vorhandenen Jagdbezirke", "ok": false}], "label": "163"}, {"num": 164, "type": "mc", "q": "Welches Wild darf zur Nachtzeit bejagt werden?", "opts": [{"k": "a", "text": "Rehwild", "ok": false}, {"k": "b", "text": "Schwarzwild", "ok": true}, {"k": "c", "text": "Fasan", "ok": false}], "label": "164"}, {"num": 165, "type": "mc", "q": "Welche heimischen Wildarten dürfen nach dem Bundesjagdgesetz nicht ausgesetzt werden?", "opts": [{"k": "a", "text": "Rot- und Damwild", "ok": false}, {"k": "b", "text": "Auerwild und Birkwild", "ok": false}, {"k": "c", "text": "Schwarzwild und Wildkaninchen", "ok": true}], "label": "165"}, {"num": 166, "type": "mc", "q": "Wer ist nach dem Bundesjagdgesetz zum Ersatz des Wildschadens innerhalb gemeinschaftlicher Jagdbezirke verpflichtet?", "opts": [{"k": "a", "text": "Die Jagdgenossenschaft", "ok": true}, {"k": "b", "text": "Die Gemeinde", "ok": false}, {"k": "c", "text": "Der Jagdausübungsberechtigte", "ok": false}], "label": "166"}, {"num": 167, "type": "mc", "q": "Darf der Inhaber eines Jugendjagdscheines an Gesellschaftsjagden als Schütze teilnehmen?", "opts": [{"k": "a", "text": "Nein", "ok": true}, {"k": "b", "text": "Ja", "ok": false}, {"k": "c", "text": "Nur in Begleitung des Erziehungsberechtigten", "ok": false}], "label": "167"}, {"num": 168, "type": "mc", "q": "Wann darf die Jagd auf Rothirsche ab dem 2. Kopf in M-V ausgeübt werden?", "opts": [{"k": "a", "text": "Vom 01. Mai bis zum 15. Oktober", "ok": false}, {"k": "b", "text": "Vom 16. Mai bis zum 31. Januar", "ok": false}, {"k": "c", "text": "Vom 1. August bis zum 31. Januar", "ok": true}], "label": "168"}, {"num": 169, "type": "mc", "q": "Welche der aufgeführten Wildarten darf vorbehaltlich des § 22 Abs.4 BJG (Schutz der Elterntiere) ganzjährig bejagt werden?", "opts": [{"k": "a", "text": "Ringel- und Türkentauben", "ok": false}, {"k": "b", "text": "Baum- und Steinmarder", "ok": false}, {"k": "c", "text": "Waschbär und Marderhund", "ok": true}], "label": "169"}, {"num": 170, "type": "mc", "q": "Dürfen Sie als Jagdausübungsberechtigter einen Fuchs mit einer Kurzwaffe töten, der sich in ihrem Revier im Winter in einer Kastenfalle gefangen hat?", "opts": [{"k": "a", "text": "Ja, wenn die Mündungsenergie des Geschosses mindestens 200 Joule beträgt", "ok": false}, {"k": "b", "text": "In jedem Fall", "ok": true}, {"k": "c", "text": "Nur mit besonderer Erlaubnis der Behörde", "ok": false}], "label": "170"}, {"num": 171, "type": "mc", "q": "Ist es ohne besondere Erlaubnis zulässig, ein Wildfreigehege einzurichten?", "opts": [{"k": "a", "text": "Nein", "ok": true}, {"k": "b", "text": "Ja", "ok": false}, {"k": "c", "text": "Ja, aber nicht an jedem Ort.", "ok": false}], "label": "171"}, {"num": 172, "type": "mc", "q": "Welche der aufgeführten Wildarten sind ganzjährig mit der Jagd zu verschonen?", "opts": [{"k": "a", "text": "Dachs und Hermelin", "ok": false}, {"k": "b", "text": "Graureiher und Sperber", "ok": true}, {"k": "c", "text": "Stockente und Graugans", "ok": false}], "label": "172"}, {"num": 173, "type": "mc", "q": "Welcher Mehrheit bedürfen die Beschlüsse der Jagdgenossenschaftsversammlung?", "opts": [{"k": "a", "text": "Der Mehrheit der anwesenden Jagdgenossen", "ok": false}, {"k": "b", "text": "Der Mehrheit der im Jagdkataster eingetragenen Mitglieder", "ok": false}, {"k": "c", "text": "Sowohl der Mehrheit der anwesenden und vertretenen Jagdgenossen, als auch der Mehrheit der vertretenen Grundflächen", "ok": true}], "label": "173"}, {"num": 174, "type": "mc", "q": "Welche gesetzliche Mindestgröße haben Eigenjagdbezirke nach dem Bundesjagdgesetz?", "opts": [{"k": "a", "text": "60 ha", "ok": false}, {"k": "b", "text": "75 ha", "ok": true}, {"k": "c", "text": "100 ha", "ok": false}], "label": "174"}, {"num": 175, "type": "mc", "q": "Welche der folgenden Wildarten gehören nicht zum Hochwild?", "opts": [{"k": "a", "text": "Muffelwild", "ok": false}, {"k": "b", "text": "Auerwild", "ok": false}, {"k": "c", "text": "Rehwild", "ok": true}], "label": "175"}, {"num": 176, "type": "mc", "q": "Sie erlegen in einem Weizenschlag ein Stück Schwarzwild. Bei der Bergung des Stückes entsteht eine unverhältnismäßig breite Schleif- und Fahrspur. Um welchen speziellen Schaden kann es sich handeln?", "opts": [{"k": "a", "text": "Wildschaden", "ok": false}, {"k": "b", "text": "Jagdschaden", "ok": true}, {"k": "c", "text": "Flurschaden", "ok": false}], "label": "176"}, {"num": 177, "type": "mc", "q": "Bei welcher Behörde sind der Abschluss, die Beendigung und jede Änderung eines Jagdpachtvertrages anzuzeigen?", "opts": [{"k": "a", "text": "Untere Jagdbehörde", "ok": true}, {"k": "b", "text": "Oberste Jagdbehörde", "ok": false}, {"k": "c", "text": "Jagdgenossenschaft", "ok": false}], "label": "177"}, {"num": 178, "type": "mc", "q": "Wann darf die Jagd auf Schwarzwild in M-V ausgeübt werden?", "opts": [{"k": "a", "text": "Vom 1. April bis zum 31. März", "ok": true}, {"k": "b", "text": "Vom 1. August bis zum 31. Januar", "ok": false}, {"k": "c", "text": "Vom 1. September bis 31. Januar.", "ok": false}], "label": "178"}, {"num": 179, "type": "mc", "q": "Welche Aufgabe obliegt dem Jagdbeirat?", "opts": [{"k": "a", "text": "Durchführung der Ehrengerichtsverfahren des DJV", "ok": false}, {"k": "b", "text": "Beratung der Landesvereinigung der Jäger", "ok": false}, {"k": "c", "text": "Beratung der Jagdbehörde", "ok": true}], "label": "179"}, {"num": 180, "type": "mc", "q": "In welchem Umkreis um Fütterungen darf nach dem Bundesjagdgesetz Schalenwild in Notzeiten nicht erlegt werden?", "opts": [{"k": "a", "text": "100 m", "ok": false}, {"k": "b", "text": "200 m", "ok": true}, {"k": "c", "text": "400 m", "ok": false}], "label": "180"}, {"num": 181, "type": "mc", "q": "Wer muss bei befugter Jagdausübung einen Jagderlaubnisschein mit sich führen?", "opts": [{"k": "a", "text": "Der unbegleitete Jagdgast", "ok": true}, {"k": "b", "text": "Der Jagdausübungsberechtigte", "ok": false}, {"k": "c", "text": "Der Mitpächter", "ok": false}], "label": "181"}, {"num": 182, "type": "mc", "q": "Wie bezeichnet man die Verteidigung, die erforderlich ist, um einen gegenwärtigen, rechtswidrigen Angriff von sich oder einem anderen abzuwehren?", "opts": [{"k": "a", "text": "Notstand", "ok": false}, {"k": "b", "text": "Notwehr", "ok": true}, {"k": "c", "text": "Selbstverteidigung", "ok": false}], "label": "182"}, {"num": 183, "type": "mc", "q": "Welche Pflicht ist mit dem Jagdrecht verbunden?", "opts": [{"k": "a", "text": "Die Pflicht zur Hege", "ok": true}, {"k": "b", "text": "Die Pflicht zum Abschluss einer Wildfolgevereinbarung", "ok": false}, {"k": "c", "text": "Die Pflicht zur Abschussplanung", "ok": false}], "label": "183"}, {"num": 184, "type": "mc", "q": "Der Begriff „Wild“ umfasst:", "opts": [{"k": "a", "text": "Alle wildlebenden Tiere, die nicht dem Naturschutzrecht unterliegen", "ok": false}, {"k": "b", "text": "Alle wildlebenden Tiere mit Ausnahme der Tiere, die in Gehegen gehalten werden", "ok": false}, {"k": "c", "text": "Wildlebende Tiere, die dem Jagdrecht unterliegen", "ok": true}], "label": "184"}, {"num": 185, "type": "mc", "q": "Wer ist Träger der gesetzlichen Unfallversicherung für Jagden?", "opts": [{"k": "a", "text": "Landwirtschaftliche Krankenkasse", "ok": false}, {"k": "b", "text": "Sozialversicherung für Landwirtschaft, Forsten und Gartenbau", "ok": true}, {"k": "c", "text": "Rentenversicherung", "ok": false}], "label": "185"}, {"num": 186, "type": "mc", "q": "Ein an Grundstücken entstandener Wildschaden ist nach den gesetzlichen Vorschriften ersatzpflichtig, wenn er durch folgende Wildarten angerichtet wurde:", "opts": [{"k": "a", "text": "Hochwild, Wildkaninchen, Fasane", "ok": false}, {"k": "b", "text": "Schalenwild, Wildkaninchen und Fasane", "ok": true}, {"k": "c", "text": "Schalenwild, Feldhase, Fasane", "ok": false}], "label": "186"}, {"num": 187, "type": "mc", "q": "Wem steht überlicherweise das Aneignungsrecht an Abwurfstangen zu?", "opts": [{"k": "a", "text": "Dem Jagdausübungsberechtigten", "ok": true}, {"k": "b", "text": "Dem Jagderlaubsnisscheininhaber", "ok": false}, {"k": "c", "text": "Dem bestellten Jagdaufseher", "ok": false}], "label": "187"}, {"num": 188, "type": "mc", "q": "Was ist nach § 1 des Bundesjagdgesetzes unter Jagdausübung zu verstehen?", "opts": [{"k": "a", "text": "Das Aufsuchen, Fangen, Aneignen von Wild", "ok": false}, {"k": "b", "text": "Das Aufsuchen, Nachstellen, Erlegen, Fangen und Aneignen von Wild", "ok": false}, {"k": "c", "text": "Das Aufsuchen, Nachstellen, Erlegen und Fangen von Wild", "ok": true}], "label": "188"}, {"num": 189, "type": "mc", "q": "Mit welchem der nachstehend aufgeführten Fanggeräte ist das Fangen von Tieren nach § 19 des Bundesjagdgesetzes verboten?", "opts": [{"k": "a", "text": "Tellereisen", "ok": true}, {"k": "b", "text": "Abzugseisen", "ok": false}, {"k": "c", "text": "Kastenfalle", "ok": false}], "label": "189"}, {"num": 190, "type": "mc", "q": "Welches Wild darf in M-V nur auf der Grundlage eines Abschussplanes erlegt werden?", "opts": [{"k": "a", "text": "Rot-, Dam-, Reh-, Muffelwild", "ok": false}, {"k": "b", "text": "Rot-, Dam-, Schwarzwild", "ok": false}, {"k": "c", "text": "Auer-, Birk-, Rackelwild und Seehunde", "ok": true}], "label": "190"}, {"num": 191, "type": "mc", "q": "Ein Autofahrer fährt ein Reh an und nimmt das Stück mit. Welcher Tatbestand liegt vor?", "opts": [{"k": "a", "text": "Jagdwilderei nach § 292 Strafgesetzbuch (StGB)", "ok": true}, {"k": "b", "text": "Straftat nach § 38 Bundesjagdgesetz (BJG)", "ok": false}, {"k": "c", "text": "Ordnungswidrigkeit nach § 39 Bundesjagdgesetz (BJG)", "ok": false}], "label": "191"}, {"num": 192, "type": "mc", "q": "Wie groß muss die Jagdfläche zur Ausübung der Brackenjagd mindestens sein?", "opts": [{"k": "a", "text": "500 ha", "ok": false}, {"k": "b", "text": "1000 ha", "ok": true}, {"k": "c", "text": "2000 ha", "ok": false}], "label": "192"}, {"num": 193, "type": "mc", "q": "Wildschäden auf landwirtschaftlichen Grundstücken müssen vom Ersatzberechtigten innerhalb...", "opts": [{"k": "a", "text": "Einer Woche nach Kenntnis bei der zuständigen Gemeinde angemeldet werden", "ok": true}, {"k": "b", "text": "Einer Woche bei der unteren Jagdbehörde angemeldet werden", "ok": false}, {"k": "c", "text": "Einer Woche bei der Jagdgenossenschaft angemeldet werden", "ok": false}], "label": "193"}, {"num": 194, "type": "mc", "q": "Welche der angeführten Maßnahmen beinhaltet der Jagdschutz?", "opts": [{"k": "a", "text": "Schutz des Wildes vor Wilderern, Futternot, Wildseuchen, wildernden Hunden und Katzen", "ok": true}, {"k": "b", "text": "Schutz der land- und forstwirtschaftlich nutzbaren Flächen vor Wildschäden", "ok": false}, {"k": "c", "text": "Schutz des Wildes vor Jagdschäden, Wildfrevlern, Prädatoren, Beunruhigung", "ok": false}], "label": "194"}, {"num": 195, "type": "mc", "q": "Wann sind in der Regel Wildschäden an forstwirtschaftlich genutzten Grundstücken bei der zuständigen Stelle anzumelden?", "opts": [{"k": "a", "text": "Binnen einer Woche nach Kenntnis des Schadens", "ok": false}, {"k": "b", "text": "Jeweils zum 1. April und zum 1. September", "ok": false}, {"k": "c", "text": "Jeweils zum 1. Mai und zum 1. Oktober", "ok": true}], "label": "195"}, {"num": 196, "type": "mc", "q": "Welche Ziele hat die Hege?", "opts": [{"k": "a", "text": "Erhalt eines für den Lebensraum umfangreichen, artenreichen und gesunden Wildbestandes", "ok": false}, {"k": "b", "text": "Erhalt eines an den Lebensraum angepassten, artenreichen und gesunden Wildbestandes", "ok": true}, {"k": "c", "text": "Erhalt eines angepassten Lebensraumes, Sicherung der Grundlagen für einen umfangreichen Wildbestand", "ok": false}], "label": "196"}, {"num": 197, "type": "mc", "q": "Welche Grundflächen bilden einen gemeinschaftlichen Jagdbezirk?", "opts": [{"k": "a", "text": "Alle Grundflächen einer Gemeinde mit Ausnahme der befriedeten Bezirke, wenn sie im Zusammenhang mindestens 150 ha umfassen.", "ok": false}, {"k": "b", "text": "Alle Grundflächen einer Gemeinde, soweit sie land- oder forstwirtschaftlich nutzbar sind, wenn sie im Zusammenhang mindestens 150 ha umfassen.", "ok": false}, {"k": "c", "text": "Alle Grundflächen einer Gemeinde, die nicht zu einem Eigenjagdbezirk gehören, wenn sie im Zusammenhang mindestens 150 ha umfassen", "ok": true}], "label": "197"}, {"num": 198, "type": "mc", "q": "Eine Jagdgenossenschaft legt in ihrer Satzung fest, dass nur eines ihrer Mitglieder ihren Jagdbezirk pachten kann. Ist das zulässig?", "opts": [{"k": "a", "text": "Ja, das ist zulässig, wenn die Jagdbehörde die Satzung rechtskräftig ist", "ok": true}, {"k": "b", "text": "Nein, das ist nicht zulässig", "ok": false}, {"k": "c", "text": "Das ist nur zulässig, wenn die Verpachtung entsprechend ausgeschrieben wurde", "ok": false}], "label": "198"}, {"num": 199, "type": "mc", "q": "Bei der Benutzung des Jägernotweges darf der Jäger…", "opts": [{"k": "a", "text": "Die Schusswaffe auch unterladen im Futteral mitführen, Jagdhunde nur an der Leine mitführen.", "ok": false}, {"k": "b", "text": "Die Schusswaffe ungeladen im Futteral mitführen, den Jagdhund nur bei Fuß laufen lassen", "ok": false}, {"k": "c", "text": "Schusswaffen nur ungeladen im Futteral, Jagdhunde nur an der Leine mitführen", "ok": true}], "label": "199"}, {"num": 200, "type": "mc", "q": "Der Jagdpachtvertrag…", "opts": [{"k": "a", "text": "ist schriftlich abzuschließen und sodann der Jagdbehörde vorzulegen", "ok": true}, {"k": "b", "text": "ist schriftlich abzuschließen und sodann der Jagdgenossenschaft vorzulegen", "ok": false}, {"k": "c", "text": "ist schriftlich abzuschließen und sodann der Hegegemeinschaft vorzulegen", "ok": false}], "label": "200"}, {"num": 201, "type": "mc", "q": "Welche der folgenden Wildarten unterliegt der Abschussplanung?", "opts": [{"k": "a", "text": "Damwild", "ok": true}, {"k": "b", "text": "Rehwild", "ok": false}, {"k": "c", "text": "Wildgänse", "ok": false}], "label": "201"}, {"num": 202, "type": "mc", "q": "Das Nachtjagdverbot gilt nicht für…", "opts": [{"k": "a", "text": "Schwarz- und Raubwild", "ok": true}, {"k": "b", "text": "Rot-, Dam- und Muffelwild", "ok": false}, {"k": "c", "text": "Rehwild, Muffelwild", "ok": false}], "label": "202"}, {"num": 203, "type": "mc", "q": "Das bundesdeutsche Jagdrecht basiert auf dem…", "opts": [{"k": "a", "text": "Jagdgesellschaftssystem", "ok": false}, {"k": "b", "text": "Reviersystem", "ok": true}, {"k": "c", "text": "Lizenzsystem", "ok": false}], "label": "203"}, {"num": 204, "type": "mc", "q": "Wer kann dem Jagdgast einen entgeltlichen oder unentgeltlichen Jagderlaubnisschein erteilen?", "opts": [{"k": "a", "text": "Die Jagdgenossenschaft", "ok": false}, {"k": "b", "text": "Der Jagdausübungsberechtigte", "ok": true}, {"k": "c", "text": "Die untere Jagdbehörde", "ok": false}], "label": "204"}, {"num": 205, "type": "mc", "q": "Zur Wildschadensabwehr darf der Nutzungsberechtigte eines Maisfeldes (Landwirt)", "opts": [{"k": "a", "text": "einen Elektrozaun errichten und unterhalten.", "ok": true}, {"k": "b", "text": "Fallen stellen, kontrollieren und sich erlegtes Wild aneignen.", "ok": false}, {"k": "c", "text": "jagdliche Einrichtungen errichten und nutzen.", "ok": false}], "label": "205"}, {"num": 206, "type": "mc", "q": "Ein Jagdschein darf nicht an Personen erteilt werden, die…", "opts": [{"k": "a", "text": "Noch nicht 21 Jahre alt sind", "ok": false}, {"k": "b", "text": "keine ausreichende Jagdhaftpflichtversicherung nachweisen", "ok": true}, {"k": "c", "text": "Von der Landesvereinigung der Jäger ausgeschlossen worden sind", "ok": false}], "label": "206"}, {"num": 207, "type": "mc", "q": "Ihr Jagdhund ist wirksam gegen Tollwut geimpft worden. Sie wollen, dass er Sie in einem tollwutgefährdeten Bezirk zur Jagd begleitet.", "opts": [{"k": "a", "text": "Das ist erlaubt", "ok": true}, {"k": "b", "text": "Das ist nicht erlaubt", "ok": false}, {"k": "c", "text": "Das ist mit behördlicher Genehmigung gestattet", "ok": false}], "label": "207"}, {"num": 208, "type": "mc", "q": "In einem Katalog werden Nachtsichtgeräte und Nachtzielgeräte angeboten, die ein eigenes Absehen haben. Von diesen Geräten dürfen Sie:", "opts": [{"k": "a", "text": "Nachtsichtgeräte jagdlich eingeschränkt nutzen.", "ok": true}, {"k": "b", "text": "Nachtzielgeräte jagdlich eingeschränkt nutzen.", "ok": false}, {"k": "c", "text": "beide Geräte jagdlich eingeschränkt nutzen.", "ok": false}], "label": "208"}, {"num": 209, "type": "mc", "q": "Bei welcher Stelle hat ein Geschädigter in M-V seinen Anspruch auf Wildschaden geltend zu machen?", "opts": [{"k": "a", "text": "Bei der unteren Jagdbehörde", "ok": false}, {"k": "b", "text": "Bei der Wildschadensausgleichskasse", "ok": false}, {"k": "c", "text": "Beim örtlichen Gemeindeamt", "ok": true}], "label": "209"}, {"num": 210, "type": "mc", "q": "Das Nachtjagdverbot für Schalenwild ausgenommen Schwarzwild gilt…", "opts": [{"k": "a", "text": "Zwischen 2,5 Stunden nach Sonnenuntergang bis 2,5 Stunden vor Sonnenaufgang", "ok": false}, {"k": "b", "text": "Zwischen 1,5 Stunden nach Sonnenuntergang bis 1,5 Stunden vor Sonnenaufgang", "ok": true}, {"k": "c", "text": "Unmittelbar nach Sonnenuntergang und Sonnenaufgang", "ok": false}], "label": "210"}, {"num": 211, "type": "mc", "q": "Welche der aufgeführten Tierarten unterliegt dem Jagdrecht?", "opts": [{"k": "a", "text": "Zwergschwan", "ok": false}, {"k": "b", "text": "Singschwan", "ok": false}, {"k": "c", "text": "Höckerschwan", "ok": true}], "label": "211"}, {"num": 212, "type": "mc", "q": "Der Jugendjagdschein ist Personen zu versagen, die…", "opts": [{"k": "a", "text": "Noch nicht 18 Jahre alt sind", "ok": false}, {"k": "b", "text": "Noch nicht 16 Jahre alt sind", "ok": true}, {"k": "c", "text": "Noch nicht 21 Jahre alt sind", "ok": false}], "label": "212"}, {"num": 213, "type": "mc", "q": "Ein Jagdausübungsberechtigter will einem Jungjäger, der kurz zuvor seinen ersten Jagdschein gelöst hat, einen entgeltlichen Jagderlaubnisschein ausstellen. Ist das zulässig?", "opts": [{"k": "a", "text": "Ja, denn für eine entgeltliche Jagderlaubnis ist die Jagdpachtfähigkeit nicht erforderlich", "ok": true}, {"k": "b", "text": "Ja, der Jungjäger darf aber nur in Begleitung einer jagderfahrenen Person jagen", "ok": false}, {"k": "c", "text": "Nein, weil der Jungjäger noch nicht jagdpachtfähig ist", "ok": false}], "label": "213"}, {"num": 214, "type": "mc", "q": "Welche der drei genannten Rabenvogelarten zählt in M-V nach den gesetzlichen Bestimmungen zum Wild?", "opts": [{"k": "a", "text": "Saatkrähe", "ok": false}, {"k": "b", "text": "Eichelhäher", "ok": false}, {"k": "c", "text": "Kolkrabe", "ok": true}], "label": "214"}, {"num": 215, "type": "mc", "q": "Wer ist Inhaber des Jagdrechts?", "opts": [{"k": "a", "text": "Der Jagdpächter", "ok": false}, {"k": "b", "text": "Der Grundeigentümer einer bejagbaren Fläche", "ok": true}, {"k": "c", "text": "Der Jagdschutzberechtigte", "ok": false}], "label": "215"}, {"num": 216, "type": "mc", "q": "Wer ist Inhaber des Jagdausübungsrechts?", "opts": [{"k": "a", "text": "Jeder Jäger", "ok": false}, {"k": "b", "text": "Der Jagdpächter", "ok": true}, {"k": "c", "text": "Der Jagdvorsteher", "ok": false}], "label": "216"}, {"num": 217, "type": "mc", "q": "Welches dieser geschützten Landschaftsteile ist die höchste Schutzform?", "opts": [{"k": "a", "text": "Landschaftsschutzgebiet", "ok": false}, {"k": "b", "text": "Nationalpark", "ok": true}, {"k": "c", "text": "Naturschutzgebiet", "ok": false}], "label": "217"}, {"num": 218, "type": "mc", "q": "Welcher Stelle ist der Mindestabschussplan für Schwarzwild vorzulegen?", "opts": [{"k": "a", "text": "Der unteren Jagdbehörde", "ok": true}, {"k": "b", "text": "Der Hegegemeinschaft", "ok": false}, {"k": "c", "text": "Dem Landesjagdverband", "ok": false}], "label": "218"}, {"num": 219, "type": "mc", "q": "Dürfen in M-V Katzen, die sich in einem Jagdrevier mindestens 200 Meter entfernt vom nächsten bewohnten Gebäude in Fallen gefangen haben, getötet werden?", "opts": [{"k": "a", "text": "Nein, das ist generell verboten", "ok": false}, {"k": "b", "text": "Ja, das ist jedem Jäger erlaubt", "ok": false}, {"k": "c", "text": "Das ist nur den Jagdschutzberechtigten erlaubt", "ok": true}], "label": "219"}, {"num": 220, "type": "mc", "q": "Wer darf in M-V in einem befriedeten Bezirk Füchse, Steinmarder, Iltisse, Marderhund, Waschbär, Nutria und Wildkaninchen fangen, töten und sich aneignen?", "opts": [{"k": "a", "text": "Der Grundeigentümer oder der Nutzer des Grundstücks, wenn er die notwendigen Fähigkeiten und Kenntnisse zum Töten eines warmblütigen Wirbeltieres nachweisen kann", "ok": true}, {"k": "b", "text": "Der Jagdausübungsberechtigte", "ok": false}, {"k": "c", "text": "Der bestätigte Jagdaufseher", "ok": false}], "label": "220"}, {"num": 221, "type": "mc", "q": "In welcher Vorschrift ist das Halten von heimischen Greifen und Falken zu falknerischen Zwecken verbindlich geregelt?", "opts": [{"k": "a", "text": "In der Bundesartenschutzverordnung", "ok": false}, {"k": "b", "text": "In der Bundeswildschutzverordnung", "ok": true}, {"k": "c", "text": "Im Bundesnaturschutzgesetz", "ok": false}], "label": "221"}, {"num": 222, "type": "mc", "q": "An welchen Orten darf die Jagd grundsätzlich nicht ausgeübt werden?", "opts": [{"k": "a", "text": "In befriedeten Bezirken", "ok": true}, {"k": "b", "text": "In der Nähe der Jagdgrenze", "ok": false}, {"k": "c", "text": "Auf Gewässern.", "ok": false}], "label": "222"}, {"num": 223, "type": "mc", "q": "Sind Jagdausübungsberechtigte benachbarter Jagdbezirke verpflichtet, die Wildfolge schriftlich zu vereinbaren?", "opts": [{"k": "a", "text": "Nein, eine mündliche Vereinbarung reicht aus", "ok": false}, {"k": "b", "text": "Ja, nach dem Landesjagdgesetz für M-V ist das vorgeschrieben", "ok": false}, {"k": "c", "text": "Nein, denn die Wildfolge ist gesetzlich geregelt", "ok": true}], "label": "223"}, {"num": 224, "type": "mc", "q": "Wer beruft den Kreisjägermeister?", "opts": [{"k": "a", "text": "Jagdscheininhaber, die im Kreis ihren Wohnsitz haben oder ein Jagdrevier gepachtet haben", "ok": false}, {"k": "b", "text": "Die Landesvereinigung der Jäger", "ok": false}, {"k": "c", "text": "Der Landrat des jeweiligen Landkreises auf Vorschlag der Landesjägerschaft", "ok": true}], "label": "224"}, {"num": 225, "type": "mc", "q": "Die Jagdausübung umfasst…", "opts": [{"k": "a", "text": "Das Erlegen, Aneignen und Fangen von Wild", "ok": false}, {"k": "b", "text": "Das Nachstellen, Erlegen, Aneignen und Fangen von Wild", "ok": false}, {"k": "c", "text": "Das Nachstellen, Aufsuchen, Erlegen und Fangen von Wild", "ok": true}], "label": "225"}, {"num": 226, "type": "mc", "q": "Das Aneignungsrecht umfasst die ausschließliche Befugnis, sich…", "opts": [{"k": "a", "text": "Nur krankes und verendetes Wild anzueignen", "ok": false}, {"k": "b", "text": "Krankes oder verendetes Wild, Abwurfstangen und Eier von Federwild anzueignen", "ok": true}, {"k": "c", "text": "Nur erlegtes Wild anzueignen", "ok": false}], "label": "226"}, {"num": 227, "type": "mc", "q": "Welche Tierarten unterliegen dem Jagdrecht?", "opts": [{"k": "a", "text": "Alle freilebenden Tierarten, die dem Bundesjagdgesetz unterliegen", "ok": false}, {"k": "b", "text": "Alle freilebenden Tiere, die eine Jagdzeit haben", "ok": false}, {"k": "c", "text": "Alle Tierarten, die im § 2 Bundesjagdgesetz und in den jeweiligen Länderregelungen aufgeführt sind", "ok": true}], "label": "227"}, {"num": 228, "type": "mc", "q": "Alle Grundeigentümer von bejagten Flächen innerhalb eines gemeinschaftlichen Jagdbezirks sind…", "opts": [{"k": "a", "text": "Automatisch Mitglied im Jagdvorstand", "ok": false}, {"k": "b", "text": "Automatisch Mitglied der Jagdgenossenschaft", "ok": true}, {"k": "c", "text": "Automatisch Mitglied der Hegegemeinschaft", "ok": false}], "label": "228"}, {"num": 229, "type": "mc", "q": "Welche Tierarten unterliegen gemäß § 2 BJG nicht dem Jagdrecht?", "opts": [{"k": "a", "text": "Singschwan, Kranich, Biber", "ok": true}, {"k": "b", "text": "Luchs, Fuchs, Murmeltier", "ok": false}, {"k": "c", "text": "Feldhase, Schneehase, Wildkaninchen", "ok": false}], "label": "229"}, {"num": 230, "type": "mc", "q": "Wie groß ist die Pachtfläche, die ein einzelner Jagdpächter in Deutschland höchstens pachten darf?", "opts": [{"k": "a", "text": "1000 ha", "ok": true}, {"k": "b", "text": "500 ha", "ok": false}, {"k": "c", "text": "150 ha", "ok": false}], "label": "230"}, {"num": 231, "type": "mc", "q": "Welche Wildarten unterliegen (teilweise) dem Mindestabschussplan?", "opts": [{"k": "a", "text": "Rehwild und Rotwild", "ok": false}, {"k": "b", "text": "Rotwild und Schwarzwild", "ok": true}, {"k": "c", "text": "Rehwild und Schwarzwild", "ok": false}], "label": "231"}, {"num": 232, "type": "mc", "q": "Welche der folgenden Federwildarten dürfen ohne weiteres verkauft werden?", "opts": [{"k": "a", "text": "Graugans und Stockente", "ok": true}, {"k": "b", "text": "Lachmöwe und Silbermöwe", "ok": false}, {"k": "c", "text": "Wachtel und Turteltaube", "ok": false}], "label": "232"}, {"num": 233, "type": "mc", "q": "Wem muss der Jagdschein grundsätzlich versagt werden?", "opts": [{"k": "a", "text": "Personen unter 21 Jahren", "ok": false}, {"k": "b", "text": "Personen, die keine ausreichende Haftpflichtversicherung abgeschlossen haben", "ok": true}, {"k": "c", "text": "Personen, die nicht mindestens drei Jahre in Deutschland wohnen", "ok": false}], "label": "233"}, {"num": 234, "type": "mc", "q": "Zu den gesetzlich befriedeten Bezirken gehören…", "opts": [{"k": "a", "text": "Eingezäunte Viehweiden", "ok": false}, {"k": "b", "text": "Forstgatter", "ok": false}, {"k": "c", "text": "Hofräume", "ok": true}], "label": "234"}, {"num": 235, "type": "mc", "q": "Unter die sachlichen Verbote gemäß § 19 BJG fällt…", "opts": [{"k": "a", "text": "Der Schuss auf Schwarzwild mit Flintenlaufgeschossen", "ok": false}, {"k": "b", "text": "Der Schuss auf Rehwild mit Schrot", "ok": true}, {"k": "c", "text": "Der Schuss auf Rehwild mit der 9,3 x 72 R", "ok": false}], "label": "235"}, {"num": 236, "type": "mc", "q": "Muss der Abschussplan für Schalenwild erfüllt werden?", "opts": [{"k": "a", "text": "Ja", "ok": true}, {"k": "b", "text": "Nein", "ok": false}, {"k": "c", "text": "Er kann erfüllt werden", "ok": false}], "label": "236"}, {"num": 237, "type": "mc", "q": "Wie müssen in M-V Fallen das Wild fangen?", "opts": [{"k": "a", "text": "Lebend und unversehrt, sofern keine anderslautende Genehmigung vorliegt.", "ok": true}, {"k": "b", "text": "Entweder lebend und unversehrt oder sofort tötend.", "ok": false}, {"k": "c", "text": "Ausschließlich sofort tötend.", "ok": false}], "label": "237"}, {"num": 238, "type": "mc", "q": "Welche der aufgeführten Tierarten zählt zum Hochwild?", "opts": [{"k": "a", "text": "Schreiadler", "ok": false}, {"k": "b", "text": "Damwild", "ok": true}, {"k": "c", "text": "Wolf", "ok": false}], "label": "238"}, {"num": 239, "type": "mc", "q": "Auf welche Wildart ist die Jagd zur Nachtzeit erlaubt?", "opts": [{"k": "a", "text": "Fasan", "ok": false}, {"k": "b", "text": "Stockente", "ok": false}, {"k": "c", "text": "Schwarzwild", "ok": true}], "label": "239"}, {"num": 240, "type": "mc", "q": "Für die Jagd auf Damwild wählen Sie eine Waffe im Kaliber…", "opts": [{"k": "a", "text": ".308 Win.", "ok": true}, {"k": "b", "text": ".222 Rem.", "ok": false}, {"k": "c", "text": ".22 Hornet", "ok": false}], "label": "240"}, {"num": 241, "type": "mc", "q": "Sie treffen einen Wanderer, der eine Abwurfstange mitgenommen hat.", "opts": [{"k": "a", "text": "Es handelt sich um Diebstahl", "ok": false}, {"k": "b", "text": "Der Wanderer begeht Jagdwilderei", "ok": true}, {"k": "c", "text": "Abwurfstangensammeln ist jedem erlaubt", "ok": false}], "label": "241"}, {"num": 242, "type": "mc", "q": "Als Jagdgast erlegen Sie ein Rotschmaltier. Wem gehört das Wildbret?", "opts": [{"k": "a", "text": "Ihnen als Jagdgast", "ok": false}, {"k": "b", "text": "Dem Jagdausübungsberechtigten", "ok": true}, {"k": "c", "text": "Der Rotwild-Hegegemeinschaft", "ok": false}], "label": "242"}, {"num": 243, "type": "mc", "q": "Als Jagdgast fahren Sie in das Revier eines Freundes, um dort allein auf einen Rehbock zu jagen. Welche Papiere müssen Sie mitführen?", "opts": [{"k": "a", "text": "Nur den gültigen Jagdschein und den Jagderlaubnisschein", "ok": false}, {"k": "b", "text": "Nur den Jagdschein und die Waffenbesitzkarte sowie den Personalausweis", "ok": false}, {"k": "c", "text": "Personalausweis, Jagdschein, Waffenbesitzkarte und Jagderlaubnisschein", "ok": true}], "label": "243"}, {"num": 244, "type": "mc", "q": "Sie beschießen nachts auf einem Kartoffelacker eine Sau mit Hilfe eines Scheinwerfers.", "opts": [{"k": "a", "text": "Scheinwerfer dürfen in M-V allein bei der Schwarzwildjagd eingesetzt werden", "ok": true}, {"k": "b", "text": "Das Anstrahlen von Wild zum Zwecke der Erlegung ist allgemein erlaubt", "ok": false}, {"k": "c", "text": "Die Verwendung von künstlichen Lichtquellen beim Erlegen allen Wildes ist verboten", "ok": false}], "label": "244"}, {"num": 245, "type": "mc", "q": "Bei welcher Jagd schreibt der Gesetzgeber das Mitführen brauchbarer Jagdhunde vor?", "opts": [{"k": "a", "text": "Entenstrich am Morgen", "ok": true}, {"k": "b", "text": "Pirsch auf den Rothirsch", "ok": false}, {"k": "c", "text": "Ansitz auf den Rehbock", "ok": false}], "label": "245"}, {"num": 246, "type": "mc", "q": "Wer haftet für Schäden, die durch ausgebrochenes Gehegewild verursacht werden?", "opts": [{"k": "a", "text": "Der Jagdausübungsberechtigte des angrenzenden Reviers.", "ok": false}, {"k": "b", "text": "Der Besitzer der ausgebrochenen Tiere.", "ok": true}, {"k": "c", "text": "Niemand, denn das Wild ist herrenlos.", "ok": false}], "label": "246"}, {"num": 247, "type": "mc", "q": "Muss ein Revierinhaber dulden, dass ein durch die Landesjägerschaft anerkannter Schweißhundeführer sein Jagdrevier unter Mitführung einer Schusswaffe zur Nachsuche betritt, um krankes oder verletztes Wild zu erlegen?", "opts": [{"k": "a", "text": "Ja", "ok": true}, {"k": "b", "text": "Nein", "ok": false}, {"k": "c", "text": "Nur, wenn der Hundeführer Förster ist", "ok": false}], "label": "247"}, {"num": 248, "type": "mc", "q": "Welche Personengruppen sind Mitglieder der Wildschadensausgleichskasse in M-V?", "opts": [{"k": "a", "text": "Nur Landwirte und Eigenjagdbesitzer", "ok": false}, {"k": "b", "text": "Nur Jagdgenossenschaften und Jagdpächter", "ok": false}, {"k": "c", "text": "Jagdgenossenschaften, Jagdpächter, Eigenjagdbesitzer und Landwirte, die mehr als 75 ha bewirtschaften", "ok": true}], "label": "248"}, {"num": 249, "type": "mc", "q": "Innerhalb welcher Frist müssen Feldwildschäden angemeldet werden?", "opts": [{"k": "a", "text": "Innerhalb einer Woche nach Kenntnisnahme", "ok": true}, {"k": "b", "text": "Innerhalb eines Monats nach Kenntnisnahme", "ok": false}, {"k": "c", "text": "Zum 1. Mai oder zum 1. Oktober", "ok": false}], "label": "249"}, {"num": 250, "type": "mc", "q": "Mit welchen Fanggeräten ist die Jagd, ohne Genehmigung, in M-V verboten?", "opts": [{"k": "a", "text": "Wieselwippbrettfalle", "ok": false}, {"k": "b", "text": "Kastenfalle", "ok": false}, {"k": "c", "text": "Eiabzugseisen", "ok": true}], "label": "250"}, {"num": 251, "type": "mc", "q": "Welche Person ist gesetzlich nicht jagdschutzberechtigt?", "opts": [{"k": "a", "text": "Der Jagdgast", "ok": true}, {"k": "b", "text": "Der Jagdpächter", "ok": false}, {"k": "c", "text": "Der bestätigte Jagdaufseher", "ok": false}], "label": "251"}, {"num": 252, "type": "mc", "q": "Wer ist grundsätzlich zum Ersatz von Jagdschäden im Revier verpflichtet?", "opts": [{"k": "a", "text": "Die Jagdgenossenschaft", "ok": false}, {"k": "b", "text": "Der Jagdgast, der diesen verursacht hat", "ok": false}, {"k": "c", "text": "Der Jagdpächter", "ok": true}], "label": "252"}, {"num": 253, "type": "mc", "q": "Ersatzpflichtige Wildschäden verursachen…", "opts": [{"k": "a", "text": "Kraniche", "ok": false}, {"k": "b", "text": "Fasane", "ok": true}, {"k": "c", "text": "Graugänse", "ok": false}], "label": "253"}, {"num": 254, "type": "mc", "q": "Zu den verbotenen Gegenständen zählen…", "opts": [{"k": "a", "text": "Nachtsichtgeräte", "ok": false}, {"k": "b", "text": "Nachtzielgeräte mit elektronischem Bildwandler", "ok": true}, {"k": "c", "text": "Taschenlampen über 200 Meter Leuchtweite", "ok": false}], "label": "254"}, {"num": 255, "type": "mc", "q": "Jagdwilderei ist…", "opts": [{"k": "a", "text": "Eine Straftat", "ok": true}, {"k": "b", "text": "Eine Ordnungswidrigkeit", "ok": false}, {"k": "c", "text": "Erlaubt", "ok": false}], "label": "255"}, {"num": 256, "type": "mc", "q": "Wann darf die Jagd auf Stockenten in M-V ausgeübt werden?", "opts": [{"k": "a", "text": "Vom 01. September bis zum 20. Februar", "ok": false}, {"k": "b", "text": "Vom 01. August bis zum 15. Januar", "ok": false}, {"k": "c", "text": "Vom 01. September bis zum 15. Januar", "ok": true}], "label": "256"}, {"num": 257, "type": "mc", "q": "Wer vertritt die Jagdgenossenschaft gerichtlich und außergerichtlich?", "opts": [{"k": "a", "text": "Alle Mitglieder gemeinsam", "ok": false}, {"k": "b", "text": "Der Jagdvorstand", "ok": true}, {"k": "c", "text": "Die Jagdbehörde", "ok": false}], "label": "257"}, {"num": 258, "type": "mc", "q": "Ist von Rehwild verursachter Wildschaden grundsätzlich ersatzpflichtig?", "opts": [{"k": "a", "text": "Ja, voll ersatzpflichtig", "ok": true}, {"k": "b", "text": "Nein, nur Wildschäden von Rot,- Dam- und Schwarzwild sind ersatzpflichtig", "ok": false}, {"k": "c", "text": "Nur, wenn der Abschussplan nicht erfüllt wurde", "ok": false}], "label": "258"}, {"num": 259, "type": "mc", "q": "Ist an einer Rübenmiete durch Rotwild verursachter Wildschaden ersatzpflichtig?", "opts": [{"k": "a", "text": "Ja, er ist voll ersatzpflichtig", "ok": false}, {"k": "b", "text": "Nein, die Rüben in der Miete gelten als geerntet", "ok": true}, {"k": "c", "text": "Nur die Hälfte des Schadens ist ersatzpflichtig", "ok": false}], "label": "259"}, {"num": 260, "type": "mc", "q": "Welche Wildart ist in Mecklenburg-Vorpommern ganzjährig geschont?", "opts": [{"k": "a", "text": "Mink", "ok": false}, {"k": "b", "text": "Graugans", "ok": false}, {"k": "c", "text": "Graureiher", "ok": true}], "label": "260"}, {"num": 261, "type": "mc", "q": "Welche Tierart unterliegt dem Jagdrecht?", "opts": [{"k": "a", "text": "Kranich", "ok": false}, {"k": "b", "text": "Biber", "ok": false}, {"k": "c", "text": "Waldschnepfe", "ok": true}], "label": "261"}, {"num": 262, "type": "mc", "q": "Darf ein Jagdgast in M-V wildernde Hunde und Katzen schießen?", "opts": [{"k": "a", "text": "Ja", "ok": false}, {"k": "b", "text": "Nein", "ok": true}, {"k": "c", "text": "Nur mit schriftlicher Erlaubnis des Jagdausübungsberechtigten", "ok": false}], "label": "262"}, {"num": 263, "type": "mc", "q": "Dürfen im Jagdbetrieb Schlingen eingesetzt werden, in denen sich Wild fangen kann?", "opts": [{"k": "a", "text": "Ja", "ok": false}, {"k": "b", "text": "Nur mit Genehmigung des Jagdausübungsberechtigten", "ok": false}, {"k": "c", "text": "Nein, schon deren Herstellung der Erwerb und das Aufstellen ist verboten", "ok": true}], "label": "263"}, {"num": 264, "type": "mc", "q": "Ein Bauer beschwert sich über einen Fuchs, der seine Hühner frisst. Wer hat dem Bauern den Schaden zu ersetzen?", "opts": [{"k": "a", "text": "Der Jagdausübungsberechtigte", "ok": false}, {"k": "b", "text": "Die Jagdgenossenschaft", "ok": false}, {"k": "c", "text": "Niemand", "ok": true}], "label": "264"}, {"num": 265, "type": "mc", "q": "Wem steht das Aneignungsrecht an einem überfahrenen Reh zu?", "opts": [{"k": "a", "text": "Dem Eigenjagdbesitzer", "ok": true}, {"k": "b", "text": "Der Straßenmeisterei", "ok": false}, {"k": "c", "text": "Dem Kraftfahrer, der das Reh überfahren hat", "ok": false}], "label": "265"}, {"num": 266, "type": "mc", "q": "Ein Eigenjagdbesitzer hat selbst keinen Jagdschein. Was darf er nicht tun?", "opts": [{"k": "a", "text": "Seine Eigenjagd verpachten", "ok": false}, {"k": "b", "text": "Als Grundstückseigentümer die Jagd auch ohne Jagdschein ausüben", "ok": true}, {"k": "c", "text": "Auf die Eigenständigkeit seiner Eigenjagd verzichten", "ok": false}], "label": "266"}, {"num": 267, "type": "mc", "q": "Welche Jagdbehörde ist für die Erteilung von Jagdscheinen zuständig?", "opts": [{"k": "a", "text": "Die oberste Jagdbehörde", "ok": false}, {"k": "b", "text": "Die obere Jagdbehörde", "ok": false}, {"k": "c", "text": "Die untere Jagdbehörde", "ok": true}], "label": "267"}, {"num": 268, "type": "mc", "q": "Die Mindestpachtdauer für einen Jagdbezirk in M-V beträgt…", "opts": [{"k": "a", "text": "9 Jahre", "ok": true}, {"k": "b", "text": "12 Jahre", "ok": false}, {"k": "c", "text": "10 Jahre", "ok": false}], "label": "268"}, {"num": 269, "type": "mc", "q": "Wo darf die Jagd grundsätzlich nicht ausgeübt werden?", "opts": [{"k": "a", "text": "Unter 100 Meter um bebaute Grundstücke", "ok": false}, {"k": "b", "text": "Auf unter 5 ha großen Gewässern", "ok": false}, {"k": "c", "text": "An Orten, an denen die Jagd die öffentliche Ruhe, Ordnung oder Sicherheit stören oder das Leben von Menschen gefährden würde", "ok": true}], "label": "269"}, {"num": 270, "type": "mc", "q": "Ein krankes Rotkalb wechselt ins Nachbarrevier und geht in Sichtweite ins Wundbett. Was tun Sie im Rahmen der gesetzlichen Wildfolge?", "opts": [{"k": "a", "text": "Fangschuss antragen, Stück versorgen, Stück fortschaffen, Nachbar benachrichtigen", "ok": false}, {"k": "b", "text": "Fangschuss antragen, Stück versorgen, Nachbar benachrichtigen, Stück nicht fortschaffen", "ok": true}, {"k": "c", "text": "Fangschuss antragen, versorgen, Stück mitnehmen und verwerten", "ok": false}], "label": "270"}, {"num": 271, "type": "mc", "q": "Wer darf einen Täter bei Begehung einer Straftat vorläufig festnehmen?", "opts": [{"k": "a", "text": "Nur die Polizei", "ok": false}, {"k": "b", "text": "Nur der Jagdausübungsberechtige", "ok": false}, {"k": "c", "text": "Jedermann", "ok": true}], "label": "271"}, {"num": 272, "type": "mc", "q": "Darf ein Jagdhund auf eine streunende Katze gehetzt werden?", "opts": [{"k": "a", "text": "Nein", "ok": true}, {"k": "b", "text": "Ja (Härtenachweis)", "ok": false}, {"k": "c", "text": "Nur in einem Jagdrevier", "ok": false}], "label": "272"}, {"num": 273, "type": "mc", "q": "Ein Hausbesitzer fängt auf seinem Dachboden einen Steinmarder. Ist das erlaubt?", "opts": [{"k": "a", "text": "Ja, sofern er ihn tierschutzgerecht fängt", "ok": true}, {"k": "b", "text": "Nein, dies ist nicht tierschutzgerecht", "ok" , "type": "mc", "q": "Ein Hegering ist…", "opts": [{"k": "a", "text": "Die kleinste Struktureinheit des Landesjagdverbandes", "ok": true}, {"k": "b", "text": "Der Zusammenschluss von Revierinhabern zum Zweck der revierübergreifenden Wildbewirtschaftung", "ok": false}, {"k": "c", "text": "Eine Körperschaft des öffentlichen Rechts", "ok": false}], "label": "312"}, {"num": 313, "type": "mc", "q": "Zu den Aufgaben eines Jagdverbandes gehören…", "opts": [{"k": "a", "text": "Die Erteilung von Jagdscheinen", "ok": false}, {"k": "b", "text": "Der Ersatz von Wildschäden", "ok": false}, {"k": "c", "text": "Die Vertretung der Interessen seiner Mitglieder im Rahmen der gültigen Gesetze", "ok": true}], "label": "313"}, {"num": 314, "type": "mc", "q": "Zu den gesetzlich festgelegten Aufgaben anerkannter Naturschutzverbände zählen…", "opts": [{"k": "a", "text": "Betreuung von Naturschutzgebieten", "ok": false}, {"k": "b", "text": "Vollzug feld- und forstpolizeilicher Aufgaben", "ok": false}, {"k": "c", "text": "Erarbeitung gutachterlicher Stellungnahmen bei geplanten Eigriffen in Natur und Landschaft", "ok": true}], "label": "314"}, {"num": 315, "type": "mc", "q": "Aus welchem Grund können die Mitgliedschaft und die Mitarbeit in jagdlichen Organisationen von Bedeutung sein?", "opts": [{"k": "a", "text": "Um jagdliche Interessen zu vertreten, bedarf es einer starken, organsierten Jägerschaft", "ok": true}, {"k": "b", "text": "Jagd gilt als reines Statussymbol", "ok": false}, {"k": "c", "text": "Es gibt keinen Grund, die Jägergemeinschaft zu stärken", "ok": false}], "label": "315"}]}]}</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const F = {}, ITEM = {};
D.faecher.forEach(f => { F[f.id] = f; f.items.forEach(x => { x.ref = f.id + ':' + x.label; x.fach = f.id; ITEM[x.ref] = x; }); });

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem = {};
const store = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return (k in mem) ? mem[k] : def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

/* ============ Einstellungen / Fortschritt ============ */
let settings = Object.assign({filter:'all', hide:false}, store.get('jpv_settings', {}));
let mcAns = store.get('jpv_mc', {});
const saveSettings = () => store.set('jpv_settings', settings);
const saveMc = () => store.set('jpv_mc', mcAns);
let pos = Object.assign({last:'fach-1', f:{}}, store.get('jpv_pos', {}));
let bm = store.get('jpv_bm', {});
const savePos = () => store.set('jpv_pos', pos);
const saveBm = () => store.set('jpv_bm', bm);
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

/* ============ Menü ============ */
let view = {kind:'fach', id:'1'};
function buildNav(){
  const nav = $('#nav');
  let h = '';
  D.faecher.forEach(f => { h += `<button data-nav="fach-${f.id}" title="${esc(f.kurz)}" class="${view.kind==='fach'&&view.id===f.id?'active':''}">Fach ${f.id}</button>`; });
  h += '<span class="sep"></span>';
  h += `<button class="sim ${view.kind==='sim'?'active':''}" data-nav="sim">📝 Prüfungssimulation</button>`;
  h += `<button class="${view.kind==='marks'?'active':''}" data-nav="marks">🔖 Lesezeichen (${Object.keys(bm).length})</button>`;
  nav.innerHTML = h;
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-nav]'); if(!b) return;
  $('#search').value = '';
  location.hash = b.dataset.nav;
});
function route(){
  const h = location.hash.replace('#','');
  const m = h.match(/^fach-(\d)$/);
  if(m && F[m[1]]) view = {kind:'fach', id:m[1]};
  else if(h === 'sim') view = {kind:'sim'};
  else if(h === 'marks') view = {kind:'marks'};
  else {
    const lm = (pos.last || '').match(/^fach-(\d)$/);
    view = {kind:'fach', id:(lm && F[lm[1]]) ? lm[1] : '1'};
  }
  buildNav();
  window.scrollTo(0,0);
  render();
  if(view.kind === 'fach' && $('#search').value.trim().length < 2){
    const cid = pos.f[view.id];
    let el = cid && document.getElementById(cid);
    if(cid && !el && settings.filter !== 'all'){ settings.filter = 'all'; saveSettings(); renderFach(view.id); el = document.getElementById(cid); }
    if(el){ el.scrollIntoView({block:'start'}); toast('Weiter bei ' + el.querySelector('.num').textContent); }
  }
}
window.addEventListener('hashchange', route);

function render(){
  const q = $('#search').value.trim();
  if(q.length >= 2){ renderSearch(q); return; }
  if(view.kind === 'fach') renderFach(view.id);
  else if(view.kind === 'marks') renderMarks();
  else renderSim();
}
function renderMarks(){
  const items = [];
  D.faecher.forEach(f => f.items.forEach(x => { if(bm[x.ref]) items.push(x); }));
  $('#app').innerHTML = `<section class="hero"><h1>🔖 Lesezeichen</h1><p>${items.length} markierte Fragen. Mit dem Stern oben rechts an einer Frage setzt oder entfernst du ein Lesezeichen.</p></section>
  <div id="list">${items.map(x => cardHtml(x,true)).join('') || '<div class="empty">Noch keine Lesezeichen gesetzt.</div>'}</div>`;
  $$('#list .card.mc').forEach(applyMc);
}

/* ============ Katalog ============ */
function cardHtml(x, showFach){
  const badge = showFach ? `<span class="fbadge">Fach ${x.fach}</span>` : '';
  const id = `q-${x.fach}-${x.label}`;
  const star = `<button class="bm ${bm[x.ref]?'on':''}" title="Lesezeichen setzen/entfernen" aria-label="Lesezeichen">${bm[x.ref]?'★':'☆'}</button>`;
  if(x.type === 'mc'){
    const opts = x.opts.map(o => `<button class="opt" data-k="${o.k}"><span class="k">${o.k}</span><span class="t">${esc(o.text)}</span></button>`).join('');
    return `<article class="card mc" id="${id}" data-ref="${x.ref}"><div class="card-h"><span class="num">Frage ${esc(x.label)}</span><span class="tag">Multiple Choice</span>${star}${badge}</div><h3 class="q">${esc(x.q)}</h3><div class="opts">${opts}</div><div class="fb"></div></article>`;
  }
  const ans = settings.hide
    ? `<button class="reveal">Antwort anzeigen</button><div class="ans" hidden><div class="lbl">Antwort</div><div class="txt">${esc(x.a)}</div></div>`
    : `<div class="ans"><div class="lbl">Antwort</div><div class="txt">${esc(x.a)}</div></div>`;
  return `<article class="card" id="${id}" data-ref="${x.ref}"><div class="card-h"><span class="num">Frage ${esc(x.label)}</span><span class="tag">Offene Frage</span>${star}${badge}</div><h3 class="q">${esc(x.q)}</h3>${ans}</article>`;
}
function applyMc(card){
  const x = ITEM[card.dataset.ref]; const ch = mcAns[x.ref];
  const fb = $('.fb', card);
  $$('.opt', card).forEach(b => { b.classList.remove('right','wrong'); b.disabled = false; });
  if(!ch){ fb.innerHTML = ''; return; }
  const right = x.opts.find(o => o.ok);
  $$('.opt', card).forEach(b => {
    b.disabled = true;
    if(b.dataset.k === right.k) b.classList.add('right');
    else if(b.dataset.k === ch) b.classList.add('wrong');
  });
  fb.innerHTML = ch === right.k
    ? '<span class="good">✓ Richtig!</span><button class="again">Zurücksetzen</button>'
    : `<span class="bad">✗ Leider falsch.</span><span>Richtig ist: <b>${right.k})</b> ${esc(right.text)}</span><button class="again">Nochmal versuchen</button>`;
}
function stats(fid){
  const mc = F[fid].items.filter(x => x.type === 'mc');
  let a = 0, r = 0;
  mc.forEach(x => { const c = mcAns[x.ref]; if(c){ a++; if(x.opts.find(o => o.ok).k === c) r++; } });
  return {total:mc.length, a, r};
}
function renderFach(id){
  const f = F[id];
  const nAll = f.items.length, nMc = f.items.filter(x => x.type==='mc').length, nOp = nAll - nMc;
  const items = f.items.filter(x => settings.filter === 'all' || x.type === settings.filter);
  const s = stats(id);
  $('#app').innerHTML = `
  <section class="hero">
    <h1>Fach ${id} · ${esc(f.kurz)}</h1>
    <p>${nAll} Fragen · ${nMc} Multiple Choice · ${nOp} offene Fragen</p>
    <div class="fachtitle">${esc(f.titel)}</div>
    <div class="toolbar">
      <button class="chip ${settings.filter==='all'?'on':''}" data-filter="all">Alle (${nAll})</button>
      <button class="chip ${settings.filter==='mc'?'on':''}" data-filter="mc">Multiple Choice (${nMc})</button>
      <button class="chip ${settings.filter==='open'?'on':''}" data-filter="open">Offene Fragen (${nOp})</button>
      <label><input type="checkbox" id="hide" ${settings.hide?'checked':''}> Lernmodus: Antworten verbergen</label>
      <label>Springe zu Nr. <input type="number" id="jump" min="1" max="999" placeholder="z. B. 120"></label>
      <button class="ghost" id="resetfach">MC-Antworten zurücksetzen</button>
      <span class="stats" id="stats">MC beantwortet: <b>${s.a}</b>/${s.total} · richtig: <b>${s.r}</b></span>
    </div>
  </section>
  <div id="list">${items.map(x => cardHtml(x,false)).join('') || '<div class="empty">Keine Fragen in dieser Auswahl.</div>'}</div>`;
  $$('#list .card.mc').forEach(applyMc);
}
function refreshStats(){
  if(view.kind !== 'fach' || $('#search').value.trim().length >= 2) return;
  const s = stats(view.id); const el = $('#stats');
  if(el) el.innerHTML = `MC beantwortet: <b>${s.a}</b>/${s.total} · richtig: <b>${s.r}</b>`;
}
function renderSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = [];
  D.faecher.forEach(f => f.items.forEach(x => {
    const hay = (x.q + ' ' + (x.a || '') + ' ' + (x.opts ? x.opts.map(o => o.text).join(' ') : '')).toLowerCase();
    if(terms.every(t => hay.includes(t))) hits.push(x);
  }));
  const shown = hits.slice(0, 150);
  $('#app').innerHTML = `<section class="hero"><h1>Suche: „${esc(q)}“</h1><p>${hits.length} Treffer${hits.length>150?' (die ersten 150 werden angezeigt)':''}</p></section>
  <div id="list">${shown.map(x => cardHtml(x,true)).join('') || '<div class="empty">Keine Treffer.</div>'}</div>`;
  $$('#list .card.mc').forEach(applyMc);
}

/* ============ Prüfungssimulation (JägerPVO M-V, §§ 11, 13) ============ */
const NOTE = p => p >= 31 ? 1 : p >= 26 ? 2 : p >= 21 ? 3 : p >= 16 ? 4 : p >= 11 ? 5 : 6;
const N_MC = 15, N_OP = 10, FULL_MIN = 150;
let sim = store.get('jpv_sim', null);
let tick = null;
const fmt = ms => { const s = Math.max(0, Math.round(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h?h+':':'') + String(m).padStart(h?2:1,'0') + ':' + String(x).padStart(2,'0'); };
const saveSim = () => store.set('jpv_sim', sim);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function renderSim(){
  if(!sim) return simIntro();
  if(!sim.done) return simRun();
  return simResult();
}
function simIntro(){
  const hist = store.get('jpv_hist', []);
  const histHtml = hist.length ? `<h3>Deine letzten Versuche</h3><table class="t"><tr><th>Datum</th><th>Umfang</th><th class="r">Ergebnis</th></tr>${hist.slice().reverse().map(h => `<tr><td>${esc(h.date)}</td><td>${esc(h.mode)}</td><td class="r">${esc(h.res)}</td></tr>`).join('')}</table>` : '';
  $('#app').innerHTML = `
  <section class="hero"><h1>Prüfungssimulation</h1><p>Schriftliche Jägerprüfung nach den Vorgaben der Jägerprüfungsverordnung Mecklenburg-Vorpommern (JägerPVO M-V).</p></section>
  <section class="panel">
    <h2>So läuft die schriftliche Prüfung ab</h2>
    <div class="grid2">
      <div>
        <ul>
          <li><b>5 Prüfungsfächer</b> mit jeweils <b>25 Fragen</b>, insgesamt 125 Fragen (§ 11 Abs. 2)</li>
          <li><b>15 Multiple-Choice-Fragen</b> je Fach mit drei Antworten, davon genau eine richtig: 1 Punkt</li>
          <li><b>10 offene Fragen</b> je Fach, selbst zu formulieren: richtig 2 Punkte, teilweise richtig 1 Punkt, falsch 0 Punkte</li>
          <li>Maximal <b>35 Punkte je Fach</b></li>
          <li>Bearbeitungszeit <b>150 Minuten</b>, ohne Hilfsmittel (§ 11 Abs. 3)</li>
        </ul>
      </div>
      <div>
        <table class="t"><tr><th>Punkte je Fach</th><th>Note</th></tr>
          <tr><td>31 – 35</td><td>1</td></tr><tr><td>26 – 30</td><td>2</td></tr><tr><td>21 – 25</td><td>3</td></tr>
          <tr><td>16 – 20</td><td>4</td></tr><tr><td>11 – 15</td><td>5</td></tr><tr><td>unter 11</td><td>6</td></tr></table>
      </div>
    </div>
    <details class="d"><summary>Wann ist der schriftliche Teil nicht bestanden? (§ 13 Abs. 1)</summary>
      <ul>
        <li>Ein Fach wird mit Note 6 bewertet</li>
        <li>Mehr als ein Fach wird mit Note 5 bewertet</li>
        <li>Der Notendurchschnitt aller Fächer liegt über 4,0</li>
        <li>In Fach 3 (Waffen) oder Fach 4 (Wildkrankheiten/Wildbrethygiene) wird nicht mindestens Note 4 erreicht</li>
        <li>Täuschung oder unzulässige Hilfsmittel</li>
      </ul>
      <p>Die Schießprüfung und die mündlich-praktische Prüfung sind hier nicht enthalten.</p>
    </details>
    <div class="note">Die Verordnung nennt die 150 Minuten ohne ausdrückliche Verteilung. Die Simulation behandelt sie als Gesamtzeit für alle 125 Fragen. Für die Einzelfach-Übung rechnet sie anteilig mit 30 Minuten. Die offenen Fragen bewertest du nach der Abgabe selbst anhand der Musterantwort, denn einen Prüfer ersetzt die Seite nicht.</div>
  </section>
  <section class="panel">
    <h2>Simulation starten</h2>
    <div class="opts-row">
      <label>Umfang:
        <select id="simmode">
          <option value="full">Vollständige Prüfung · alle 5 Fächer · 150 Min.</option>
          ${D.faecher.map(f => `<option value="f${f.id}">Nur Fach ${f.id} (${esc(f.kurz)}) · 30 Min.</option>`).join('')}
        </select>
      </label>
      <label><input type="checkbox" id="simshuf" checked> Antwortreihenfolge mischen</label>
    </div>
    <button class="btn gold" id="simstart">Prüfung starten ▶</button>
    ${histHtml}
  </section>`;
}
function startSim(){
  const mode = $('#simmode').value, shuf = $('#simshuf').checked;
  const ids = mode === 'full' ? D.faecher.map(f => f.id) : [mode.slice(1)];
  const parts = {}, order = {};
  ids.forEach(id => {
    const f = F[id];
    const mc = shuffle(f.items.filter(x => x.type==='mc' && !x.dup)).slice(0, N_MC);
    const op = shuffle(f.items.filter(x => x.type==='open' && !x.dup)).slice(0, N_OP);
    parts[id] = {mc: mc.map(x => x.ref), op: op.map(x => x.ref)};
    mc.forEach(x => { order[x.ref] = shuf ? shuffle([0,1,2]) : [0,1,2]; });
  });
  const minutes = mode === 'full' ? FULL_MIN : FULL_MIN/5;
  sim = {v:1, mode: mode === 'full' ? 'full' : 'single', fachIds: ids, start: Date.now(), dur: minutes*60000, done:false, parts, order, ans:{}, grade:{}};
  saveSim(); startTick(); window.scrollTo(0,0); renderSim();
}
function startTick(){
  if(tick) clearInterval(tick);
  tick = setInterval(() => {
    if(!sim || sim.done){ clearInterval(tick); tick = null; return; }
    const left = sim.start + sim.dur - Date.now();
    const el = $('#timer');
    if(el){ el.textContent = fmt(left); el.classList.toggle('low', left < 10*60000); }
    if(left <= 0) submitSim(true);
  }, 1000);
}
function answeredCount(){
  let n = 0, t = 0;
  sim.fachIds.forEach(id => sim.parts[id].mc.concat(sim.parts[id].op).forEach(ref => { t++; const a = sim.ans[ref]; if(a !== undefined && String(a).trim() !== '') n++; }));
  return {n, t};
}
function simRun(){
  const left = sim.start + sim.dur - Date.now();
  let h = `<div class="runbar"><div><div style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#bcd0a8">Restzeit</div><div class="timer ${left<10*60000?'low':''}" id="timer">${fmt(left)}</div></div>
    <div class="grow"><div id="prog" style="font-size:.85rem;margin-bottom:4px"></div><div class="bar"><i id="progbar"></i></div></div>
    <button class="btn red" id="simsubmit">Abgeben</button></div>`;
  sim.fachIds.forEach(id => {
    const f = F[id], p = sim.parts[id];
    h += `<div class="secthead"><h2>Fach ${id} · ${esc(f.kurz)}</h2><p>${p.mc.length} Multiple-Choice-Fragen (je 1 Punkt) und ${p.op.length} offene Fragen (je 0–2 Punkte)</p></div>`;
    h += `<div class="subhead">Teil A · Multiple Choice</div>`;
    p.mc.forEach((ref, i) => {
      const x = ITEM[ref], ord = sim.order[ref], ch = sim.ans[ref];
      const opts = ord.map((oi, pos) => { const o = x.opts[oi]; const L = 'abc'[pos];
        return `<button class="opt ${ch===o.k?'sel':''}" data-ref="${ref}" data-k="${o.k}"><span class="k">${L}</span><span class="t">${esc(o.text)}</span></button>`; }).join('');
      h += `<article class="card mc"><div class="card-h"><span class="num">Aufgabe ${i+1}</span><span class="tag">Multiple Choice</span></div><h3 class="q">${esc(x.q)}</h3><div class="opts">${opts}</div></article>`;
    });
    h += `<div class="subhead">Teil B · Offene Fragen</div>`;
    p.op.forEach((ref, i) => {
      const x = ITEM[ref];
      h += `<article class="card"><div class="card-h"><span class="num">Aufgabe ${p.mc.length+i+1}</span><span class="tag">Offene Frage</span></div><h3 class="q">${esc(x.q)}</h3><textarea class="own" data-ref="${ref}" placeholder="Deine Antwort in eigenen Worten …">${esc(sim.ans[ref] || '')}</textarea></article>`;
    });
  });
  h += `<div class="panel" style="text-align:center"><p>Alles beantwortet? Mit „Abgeben“ wird die Prüfung ausgewertet.</p><button class="btn red" id="simsubmit2">Prüfung abgeben</button> <button class="btn line" id="simabort">Abbrechen und verwerfen</button></div>`;
  $('#app').innerHTML = h;
  updateProg();
  startTick();
}
function updateProg(){
  if(!sim || sim.done) return;
  const {n,t} = answeredCount();
  const p = $('#prog'), b = $('#progbar');
  if(p) p.textContent = `Beantwortet: ${n} von ${t}`;
  if(b) b.style.width = (t ? n/t*100 : 0) + '%';
}
function submitSim(auto){
  if(!sim || sim.done) return;
  sim.done = true; sim.end = Date.now(); sim.auto = !!auto;
  saveSim();
  if(tick){ clearInterval(tick); tick = null; }
  if(view.kind === 'sim'){ window.scrollTo(0,0); renderSim(); }
  const r = calc(); addHist(r);
}
function calc(){
  const per = [];
  sim.fachIds.forEach(id => {
    const p = sim.parts[id];
    let mc = 0, op = 0, ungraded = 0;
    p.mc.forEach(ref => { const x = ITEM[ref]; if(sim.ans[ref] && x.opts.find(o => o.ok).k === sim.ans[ref]) mc++; });
    p.op.forEach(ref => { if(sim.grade[ref] === undefined) ungraded++; else op += sim.grade[ref]; });
    const pts = mc + op;
    per.push({id, mc, op, pts, note: NOTE(pts), ungraded, mcN: p.mc.length, opN: p.op.length});
  });
  const full = sim.mode === 'full';
  const reasons = [];
  per.forEach(r => {
    if(r.note === 6) reasons.push(`Fach ${r.id} wurde mit Note 6 bewertet.`);
    if((r.id === '3' || r.id === '4') && r.note > 4) reasons.push(`In Fach ${r.id} wurde nicht mindestens Note 4 erreicht.`);
  });
  const avg = per.reduce((s, r) => s + r.note, 0) / per.length;
  if(full){
    if(per.filter(r => r.note === 5).length > 1) reasons.push('Mehr als ein Fach wurde mit Note 5 bewertet.');
    if(avg > 4.0) reasons.push(`Der Notendurchschnitt aller Fächer liegt über 4,0 (${avg.toFixed(2).replace('.',',')}).`);
  }
  const ungraded = per.reduce((s, r) => s + r.ungraded, 0);
  return {per, avg, reasons, pass: reasons.length === 0, full, ungraded};
}
function summaryHtml(){
  const r = calc();
  const rows = r.per.map(x => `<tr><td>Fach ${x.id} · ${esc(F[x.id].kurz)}</td><td class="r">${x.mc}/${x.mcN}</td><td class="r">${x.op}/${x.opN*2}</td><td class="r"><b>${x.pts}</b>/35</td><td class="r"><b>${x.note}</b></td></tr>`).join('');
  const verdict = r.full
    ? `<div class="verdict ${r.pass?'pass':'fail'}">${r.pass ? '✓ Schriftlicher Teil bestanden' : '✗ Schriftlicher Teil nicht bestanden'}</div>`
    : `<div class="verdict ${r.pass?'pass':'fail'}">${r.pass ? '✓ Fach ausreichend' : '✗ Fach nicht ausreichend'}</div>`;
  const hint = r.ungraded ? `<div class="note">Noch ${r.ungraded} offene ${r.ungraded===1?'Frage':'Fragen'} ohne eigene Bewertung. Sie zählen vorerst 0 Punkte. Bewerte sie unten anhand der Musterantwort.</div>` : '';
  return `<div class="res-big">${verdict}${r.full?`<div style="font-family:var(--sans)">Notendurchschnitt: <b>${r.avg.toFixed(2).replace('.',',')}</b></div>`:''}</div>
    ${r.reasons.length ? `<ul class="reasons">${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <table class="t" style="margin-top:12px"><tr><th>Fach</th><th class="r">Multiple Choice</th><th class="r">Offene Fragen</th><th class="r">Punkte</th><th class="r">Note</th></tr>${rows}</table>${hint}`;
}
function addHist(r){
  const hist = store.get('jpv_hist', []);
  const d = new Date();
  hist.push({date: d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),
    mode: sim.mode === 'full' ? 'Vollständig (5 Fächer)' : 'Fach ' + sim.fachIds[0],
    res: r.full ? `Ø ${r.avg.toFixed(2).replace('.',',')} (Selbstbewertung offen)` : `Note ${r.per[0].note} (${r.per[0].pts}/35, Selbstbewertung offen)`});
  store.set('jpv_hist', hist.slice(-10));
}
function simResult(){
  let h = `<section class="hero"><h1>Auswertung</h1><p>${sim.auto ? 'Die Zeit ist abgelaufen, die Prüfung wurde automatisch abgegeben.' : 'Prüfung abgegeben.'} Benötigte Zeit: ${fmt(sim.end - sim.start)}</p></section>
    <section class="panel" id="sumpanel">${summaryHtml()}</section>
    <div class="panel" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn gold" id="simnew">Neue Simulation</button></div>`;
  sim.fachIds.forEach(id => {
    const f = F[id], p = sim.parts[id];
    h += `<div class="secthead"><h2>Fach ${id} · ${esc(f.kurz)}</h2><p>Nachbesprechung</p></div><div class="subhead">Teil A · Multiple Choice</div>`;
    p.mc.forEach((ref, i) => {
      const x = ITEM[ref], ord = sim.order[ref], ch = sim.ans[ref], right = x.opts.find(o => o.ok).k;
      const st = !ch ? '<span class="chipst na">nicht beantwortet</span>' : ch === right ? '<span class="chipst ok">richtig · 1 Punkt</span>' : '<span class="chipst no">falsch · 0 Punkte</span>';
      const opts = ord.map((oi, pos) => { const o = x.opts[oi]; const cls = o.k === right ? 'right' : (o.k === ch ? 'wrong' : '');
        return `<button class="opt ${cls}" disabled><span class="k">${'abc'[pos]}</span><span class="t">${esc(o.text)}</span></button>`; }).join('');
      h += `<article class="card mc"><div class="card-h"><span class="num">Aufgabe ${i+1}</span><span class="tag">Katalog Nr. ${esc(x.label)}</span>${st}</div><h3 class="q">${esc(x.q)}</h3><div class="opts">${opts}</div></article>`;
    });
    h += `<div class="subhead">Teil B · Offene Fragen (Selbstbewertung)</div>`;
    p.op.forEach((ref, i) => {
      const x = ITEM[ref], mine = (sim.ans[ref] || '').trim(), g = sim.grade[ref];
      h += `<article class="card" data-ref="${ref}"><div class="card-h"><span class="num">Aufgabe ${p.mc.length+i+1}</span><span class="tag">Katalog Nr. ${esc(x.label)}</span></div><h3 class="q">${esc(x.q)}</h3>
        <div class="mine"><span class="lbl" style="font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700">Deine Antwort</span>${mine ? esc(mine) : '<i>keine Antwort</i>'}</div>
        <div class="ans"><div class="lbl">Musterantwort</div><div class="txt">${esc(x.a)}</div></div>
        <div class="grade"><span>Meine Bewertung:</span>
          <button data-g="0" class="${g===0?'on0':''}">falsch · 0</button>
          <button data-g="1" class="${g===1?'on1':''}">teilweise · 1</button>
          <button data-g="2" class="${g===2?'on2':''}">richtig · 2</button></div></article>`;
    });
  });
  $('#app').innerHTML = h;
}

/* ============ Ereignisse ============ */
document.addEventListener('click', e => {
  const t = e.target;
  // Katalog
  const flt = t.closest('[data-filter]');
  if(flt){ settings.filter = flt.dataset.filter; saveSettings(); renderFach(view.id); return; }
  if(t.closest('#resetfach')){
    if(confirm('Alle gespeicherten Multiple-Choice-Antworten in Fach ' + view.id + ' zurücksetzen?')){
      F[view.id].items.forEach(x => delete mcAns[x.ref]); saveMc(); renderFach(view.id);
    }
    return;
  }
  const rv = t.closest('.reveal');
  if(rv){ rv.hidden = true; rv.nextElementSibling.hidden = false; return; }
  const opt = t.closest('.opt');
  if(opt && !opt.disabled){
    const simCard = opt.dataset.ref;
    if(simCard && sim && !sim.done && view.kind === 'sim'){
      const ref = simCard, k = opt.dataset.k;
      sim.ans[ref] = (sim.ans[ref] === k) ? undefined : k; if(sim.ans[ref] === undefined) delete sim.ans[ref];
      saveSim();
      $$('.opt[data-ref="'+ref+'"]').forEach(b => b.classList.toggle('sel', sim.ans[ref] === b.dataset.k));
      updateProg(); return;
    }
    const card = opt.closest('.card');
    if(card && card.dataset.ref){ mcAns[card.dataset.ref] = opt.dataset.k; saveMc(); applyMc(card); refreshStats(); }
    return;
  }
  const bb = t.closest('.bm');
  if(bb){
    const card = bb.closest('.card'), r = card.dataset.ref;
    if(bm[r]) delete bm[r]; else bm[r] = 1;
    saveBm(); bb.classList.toggle('on', !!bm[r]); bb.textContent = bm[r] ? '★' : '☆';
    if(view.kind === 'marks' && !bm[r]) card.remove();
    buildNav(); return;
  }
  const ag = t.closest('.again');
  if(ag){ const card = ag.closest('.card'); delete mcAns[card.dataset.ref]; saveMc(); applyMc(card); refreshStats(); return; }
  // Simulation
  if(t.closest('#simstart')){ startSim(); return; }
  if(t.closest('#simsubmit') || t.closest('#simsubmit2')){
    const {n,t:tot} = answeredCount();
    if(n < tot && !confirm(`Du hast erst ${n} von ${tot} Aufgaben beantwortet. Trotzdem abgeben?`)) return;
    submitSim(false); return;
  }
  if(t.closest('#simabort')){ if(confirm('Die laufende Prüfung wirklich verwerfen?')){ sim = null; store.del('jpv_sim'); if(tick){clearInterval(tick);tick=null;} renderSim(); window.scrollTo(0,0);} return; }
  if(t.closest('#simnew')){ sim = null; store.del('jpv_sim'); window.scrollTo(0,0); renderSim(); return; }
  const gb = t.closest('.grade button');
  if(gb){
    const card = gb.closest('.card'), ref = card.dataset.ref, g = +gb.dataset.g;
    sim.grade[ref] = g; saveSim();
    $$('.grade button', card).forEach(b => { b.className = (+b.dataset.g === g) ? 'on' + g : ''; });
    $('#sumpanel').innerHTML = summaryHtml(); return;
  }
  if(t.closest('#totop')) window.scrollTo({top:0});
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('textarea.own') && sim && !sim.done){ sim.ans[t.dataset.ref] = t.value; clearTimeout(t._d); t._d = setTimeout(() => { saveSim(); }, 300); updateProg(); }
  if(t.id === 'hide'){ settings.hide = t.checked; saveSettings(); renderFach(view.id); }
  if(t.id === 'search'){ clearTimeout(t._d); t._d = setTimeout(render, 180); }
});
document.addEventListener('keydown', e => {
  if(e.target.id === 'jump' && e.key === 'Enter'){
    const v = e.target.value.trim(); if(!v) return;
    let el = document.getElementById('q-' + view.id + '-' + v);
    if(!el){ settings.filter = 'all'; saveSettings(); renderFach(view.id); el = document.getElementById('q-' + view.id + '-' + v); }
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); el.style.outline = '3px solid var(--gold)'; setTimeout(() => el.style.outline = '', 2200); }
    else alert('Frage ' + v + ' gibt es in Fach ' + view.id + ' nicht.');
  }
});
let posT = null;
function trackPos(){
  posT = null;
  if(view.kind !== 'fach' || $('#search').value.trim().length >= 2) return;
  const cards = $$('#list .card'); if(!cards.length) return;
  if(window.scrollY < 150){ delete pos.f[view.id]; pos.last = 'fach-' + view.id; savePos(); return; }
  const c = cards.find(el => el.getBoundingClientRect().bottom > 100);
  if(c){ pos.f[view.id] = c.id; pos.last = 'fach-' + view.id; savePos(); }
}
window.addEventListener('scroll', () => { $('#totop').classList.toggle('show', window.scrollY > 600); if(!posT) posT = setTimeout(trackPos, 400); }, {passive:true});
window.addEventListener('pagehide', trackPos);

/* Start */
if(sim && !sim.done){ if(sim.start + sim.dur <= Date.now()){ sim.done = true; sim.end = sim.start + sim.dur; sim.auto = true; saveSim(); } else startTick(); }
route();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
