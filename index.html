<script id="data" type="application/json">{"faecher": [{"id": "1", "kurz": "Tierarten, Wildbiologie & Hege", "titel": "Tierarten; Wildbiologie; Wildhege; Biotophege; Wild- und Jagdschadensverhütung; Land- und Waldbau", "items": [{"num": 1, "type": "open", "q": "Welche Zusammensetzung haben die Rotwildrudel im Jahresverlauf?", "a": "Brunftrudel (Platzhirsch mit Kahlwild), Winterrudel (gemischtes Rudel, bestehend aus Kahlwild mit Hirschen in unterschiedlichem Alter), Kahlwildrudel (im Sommer ohne Hirsche), Hirschrudel (während der Feistzeit im Sommer ohne Kahlwild)", "label": "1"}, {"num": 2, "type": "open", "q": "Aus welchen Teilen/Enden besteht ein vollständiges Rothirschgeweih?", "a": "Stange, Rose, Augsprosse, Eissprosse, Mittelsprosse, Gabel oder Krone", "label": "2"}, {"num": 3, "type": "open", "q": "Beschreiben Sie den Brunftverlauf beim Rotwild.", "a": "Die Hirsche ziehen Anfang September zum Kahlwild. Es bilden sich Brunftrudel bestehend aus Platzhirsch mit Kahlwild, Beihirsche halten sich in der Nähe auf. Vor allem der Platzhirsch beschlägt paarungsbereite Alt- und Schmaltiere, Brunftschrei ist zu hören.", "label": "3"}, {"num": 4, "type": "open", "q": "Beschreiben Sie, wie es zum genetischen Austausch zwischen den verschiedenen Rotwildvorkommen kommt!", "a": "Vor und nach der Brunft verlassen Hirsche das Rudel. Hirsche weisen ein natürliches Wanderverhalten auf, wobei Entfernungen bis zu einhundert Kilometern zurückgelegt werden können.", "label": "4"}, {"num": 5, "type": "open", "q": "Benennen Sie mindestens 10 Körperteile beim Rotwild in der Weidmannssprache!", "a": "Haupt, Träger, Lauscher, Lichter, Äser, Mähne (Brunftmähne), Decke, Vorder-, Hinterläufe, Spiegel, Wedel, Kurzwildbret, Brunftrute, Rosenstock", "label": "5"}, {"num": 6, "type": "open", "q": "Beschreiben Sie die möglichen Geweihentwicklungsstufen beim Rothirschgeweih!", "a": "Im ersten Kopf ist der Hirsch ein Spießer oder in seltenen Fällen ein Hochgabler oder Sechser. Im zweiten Kopf ist er ein Sechser, Achter oder Zehner. Ab dem dritten Kopf ist er in der Regel ein Kronenhirsch bis er, beginnend etwa mit dem dreizehnten, vierzehnten Kopf, wieder zurücksetzt.", "label": "6"}, {"num": 7, "type": "open", "q": "Nennen Sie vier Baum- und Straucharten, die vom Rotwild bevorzugt als Schälgehölze genutzt werden!", "a": "Weide, Pappel, Rotbuche, Eberesche, Fichte, Douglasie, Tanne, Kiefer", "label": "7"}, {"num": 8, "type": "open", "q": "Nennen Sie alle vier Teile des Wiederkäuermagens!", "a": "Netzmagen, Pansen, Blättermagen, Labmagen", "label": "8"}, {"num": 9, "type": "open", "q": "Welche Lebensräume bevorzugt Rotwild?", "a": "Rotwild lebt hauptsächlich in größeren, ruhigen Waldgebieten oder verlandeten Schilfflächen mit Waldanschluss. Ein ungehinderter Zugang zur Feldflur ist notwendig. Wenn es ungestört ist, dann kehrt es in seine ursprünglichen Lebensräume (Auwälder, lichte Wälder, offene Heideflächen, Landschaften mit sehr großen, ruhigen Ackerflächen und darin eingestreuten kleineren Waldungen und Feldgehölzen) zurück.", "label": "9"}, {"num": 10, "type": "open", "q": "Wie wird Rotwild nach Alter, Geschlecht und Entwicklungsstufen genannt?", "a": "Die männlichen Tiere sind Hirschkälber, Schmalspießer und Hirsche vom 2., 3., 4…. Kopf. Die weiblichen Tiere sind Wildkälber, Schmaltiere und Alttiere.", "label": "10"}, {"num": 11, "type": "open", "q": "Beschreiben Sie, welche Stücke die unterschiedlichen Rudel beim Rotwild anführen!", "a": "Das Hirschrudel führt meist ein mittelalter Hirsch. Das Kahlwildrudel wird vom Leittier geführt. Das ist immer ein Alttier mit Kalb. Das Brunftrudel wird vom Leittier geführt. Das Winterrudel führt ebenfalls ein Leittier.", "label": "11"}, {"num": 12, "type": "open", "q": "Woran erkennt man die Anwesenheit von Rotwild im Revier? Nennen Sie acht Merkmale.", "a": "Fährten, Abwurfstangen, Suhlen, Losung, Schälstellen, Schlagstellen, Verbiss, Risshaar, Brunftschrei, Betten, Himmelszeichen, Himmelsspur, Beobachtung", "label": "12"}, {"num": 13, "type": "open", "q": "Was versteht man unter dem Begriff Tragzeit und wie lange dauert die Tragzeit beim Rotwild?", "a": "Heranwachsen des Fötus im Wildkörper. Die Tragzeit dauert 8,5 Monate oder 34 Wochen.", "label": "13"}, {"num": 14, "type": "open", "q": "Beschreiben Sie die Geweihentwicklung des Rothirsches im Jahresverlauf.", "a": "Nach dem Abwerfen wird der Rosenstock von Basthaut überwachsen, unter der die Bildung des neuen Geweihs beginnt. Etwa im Juli ist dieses dann fertig geschoben und wird gefegt. Das Längenwachstum der Geweihstangen und Enden erfolgt an den Spitzen und nicht an der Basis.", "label": "14"}, {"num": 15, "type": "open", "q": "Woran erkennt man am Gebiss, ob es sich um ein erlegtes Kalb, Schmaltier oder Alttier handelt?", "a": "Mit wieviel Monaten ist der Zahnwechsel abgeschlossen?\nDas Kalb hat nur den ersten Molar, der dritte Prämolar ist dreiteilig. Das Schmaltier hat den ersten und zweiten Molar und der dritte Prämolar ist noch dreiteilig. Das Alttier hat das vollständige Dauergebiss. Das Dauergebiss ist nach 27-30 Monaten komplett entwickelt.", "label": "15"}, {"num": 16, "type": "open", "q": "Was müssen Sie bei der Bejagung beachten, wenn ein Kahlwildrudel aus dem Bestand austritt?", "a": "Man schießt nicht auf das erste austretende Stück, weil das immer das Leittier ist. Man schießt auch nicht auf dessen Kalb, dass ihm unmittelbar folgt, weil das Leittier ohne Kalb seine Führungsrolle verliert. Jung vor alt, schwach vor stark! Ein führendes Alttier darf ebenfalls nicht erlegt werden, da das dazugehörige Kalb aus dem Rudel verstoßen wird und verwaist.", "label": "16"}, {"num": 17, "type": "open", "q": "Welche Ansprüche stellt das Damwild an seinen Lebensraum?", "a": "Das Damwild bevorzugt reich gegliederte, parkähnliche Landschaften im Flachland und im Hügelland. Es braucht kleine Mischwälder mit viel Buschholz für den Einstand, Felder und Wiesen für die Äsung.", "label": "17"}, {"num": 18, "type": "open", "q": "Benennen Sie die altersmäßige Geweihentwicklung beim Damwild!", "a": "Der Damhirsch vom ersten Kopf ist ein Spießer, vom zweiten ist er ein Knieper und vom dritten Kopf ein Löffler. Mittelalte Damhirsche (4. - 7. Kopf) nennt der Jäger angehende Schaufler oder Halbschaufler, alte Hirsche (ab 8. Kopf) werden Voll- oder Kapitalschaufler genannt.", "label": "18"}, {"num": 19, "type": "open", "q": "Beschreiben Sie die Fortpflanzungsabläufe beim Damwild!", "a": "In der Brunftzeit, im Oktober/November, zieht das Kahlwild zum Hirsch; Schaufler schlagen sich Brunftkuhlen. Sie rufen mit Brunftschreien (Knörren, Rülpsen) das Kahlwild. Das weibliche Stück wird vom Schaufler beschlagen. Nach einer Tragzeit von etwa 32 Wochen setzt das Tier ein Kalb.", "label": "19"}, {"num": 20, "type": "open", "q": "Was wissen Sie über die Farbvarianten beim Damwild?", "a": "Die normale Sommerfärbung ist die rotbraune Oberseite mit weißen Punkten und die helle Unterseite. Rein weiß oder rein schwarz gefärbte Stücke kommen ebenfalls vor.", "label": "20"}, {"num": 21, "type": "open", "q": "Welche Auffälligkeiten gibt es in der Fortbewegung des Damwildes?", "a": "Bei der Flucht vollführt das Damwild gern Prellsprünge, bei denen es mit allen vier Läufen gleichzeitig abspringt und auch so wieder landet.", "label": "21"}, {"num": 22, "type": "open", "q": "Worin unterscheiden sich Gebiss und Kauleisten des Damwildes von dem des Rotwildes?", "a": "Damwild hat im Oberkiefer i.d.R. keine Eckzähne (Grandeln). Damwild hat einen kleineren Schädel als Rotwild im gleichen Alter.", "label": "22"}, {"num": 23, "type": "open", "q": "Wo befinden sich in Deutschland die Hauptvorkommen des Damwildes?", "a": "Die größten Damwildvorkommen in Deutschland liegen in Mecklenburg-Vorpommern, Brandenburg, Niedersachsen und Schleswig-Holstein.", "label": "23"}, {"num": 24, "type": "open", "q": "Woran kann man das männliche Damwild jederzeit relativ sicher ansprechen?", "a": "Beim männlichen Damwild sind Pinsel und Rosenstöcke relativ gut sichtbar.", "label": "24"}, {"num": 25, "type": "open", "q": "An welchen Merkmalen kann man die Damwildfährte von der des Rotwildes unterscheiden?", "a": "Beim Damwild nimmt der Ballen die Hälfte des Trittsiegels ein, beim Rotwild nur etwa ein Drittel.", "label": "25"}, {"num": 26, "type": "open", "q": "Beschreiben Sie die normale Gehörnentwicklung beim Rehwild vom Kitz bis zum reifen Bock!", "a": "Als einzige einheimische Cerviden bilden Kitzböcke bereits ein Gehörn, das verfegt und abgeworfen wird. Der Jährlingsbock trägt also sein zweites Geweih. Der Jährling schiebt Spieße. Bei besonders guten Bedingungen kann er Gabler sein und in Ausnahmefällen auch schon Sechser. Ab dem zweiten Jahr ist der Bock meist ein Sechser. Alte Böcke setzen zurück.", "label": "26"}, {"num": 27, "type": "open", "q": "Beschreiben Sie die Fortpflanzungsabläufe des Rehwildes!", "a": "In der Blattzeit, im Juli/August, wird die Ricke vom Bock beschlagen. Nach einer Tragzeit von neuneinhalb Monaten, mit eingeschobener Eiruhe setzt die Ricke im Mai/Juni in der Regel zwei Kitze.", "label": "27"}, {"num": 28, "type": "open", "q": "Was ist an dem Ausdruck „Rehgehörn“ biologisch falsch?", "a": "Der Bock wirft sein „Gehörn“ jedes Jahr ab und schiebt ein neues. Das ist bei einem echten Horn unmöglich. Dieses bleibt lebenslang erhalten. Das „Rehgehörn“ ist also ein Geweih.", "label": "28"}, {"num": 29, "type": "open", "q": "Welchen Zusammenhang gibt es zwischen dem Alter des Bockes und dem Zeitpunkt des Fegens und Verfärbens?", "a": "Der alte Bock fegt meist früher als der Jährling. Der Jährling verfärbt meist eher als der alte Bock.", "label": "29"}, {"num": 30, "type": "open", "q": "Worauf ist ein Perückengehörn zurückzuführen?", "a": "Eine Perücke entsteht durch Verletzung oder anderweitigen Ausfall der Hoden (Brunftkugeln) bzw. des männlichen Sexualhormons.", "label": "30"}, {"num": 31, "type": "open", "q": "Welche Hauptäsungstypen bei den Wiederkäuern kennen Sie? Nennen Sie zu jeder Gruppe jeweils einen Vertreter!", "a": "Konzentratselektierer/ Nascher= Rehwild\nGras- und Raufutterfresser= Muffelwild\nZwischen- oder Mischtyp= Rotwild, Damwild, Sikawild", "label": "31"}, {"num": 32, "type": "open", "q": "Wodurch bekommt das Rehgehörn seine Farbe?", "a": "Durch das Fegen des Gehörns bzw. des Geweihs wird die Rinde des Gehölzes beschädigt, der dadurch austretende Baumsaft färbt den Knochen des Gehörns bzw. Geweihs dunkel.", "label": "32"}, {"num": 33, "type": "open", "q": "Zur Altersbestimmung am erlegten Stück werden die Unterkiefer herangezogen. Worauf wird hier geachtet?", "a": "Zur Altersbestimmung am erlegten Stück wird der Abschliff der Backenzähne (v.a. M1) und die Vollständigkeit des Gebisses herangezogen.", "label": "33"}, {"num": 34, "type": "open", "q": "Welche Merkmale sind für einen jungen Bock typisch?", "a": "Der junge Bock hat noch einen schmalen Träger, ist schlank und sein Gehörn hat wenig Masse. Er wirkt in seinem Verhalten neugierig und unerfahren.", "label": "34"}, {"num": 35, "type": "open", "q": "Welche Merkmale deuten auf einen älteren Bock hin?", "a": "Der ältere Bock hat einen kräftigeren Träger. Ein weiteres Merkmal können tiefe Rosenstöcke und Dachrosen sein. In seinem Verhalten ist er vorsichtig bis sehr heimlich.", "label": "35"}, {"num": 36, "type": "open", "q": "Was versteht man unter dem Begriff „Verfärben“ und welchen Zusammenhang gibt es zwischen dem Alter des Stückes und dem Zeitpunkt des Verfärbens?", "a": "Als Verfärben wird der Haarwechsel des Schalenwildes bezeichnet. Junge Stücke verfärben in der Regel früher als die älteren.", "label": "36"}, {"num": 37, "type": "open", "q": "Woran erkennt der Jäger die Anwesenheit von Rehwild im Revier? Nennen Sie sechs Merkmale!", "a": "Die Anwesenheit von Rehwild im Revier erkennt man an den Fährten, an Risshaaren, an der Losung, an den Betten, an den Verbissstellen, an den Plätzstellen und an den Fegestellen sowie den Lautäußerungen (Fiepen, Schrecken).", "label": "37"}, {"num": 38, "type": "open", "q": "Welche Ansprüche stellt das Rehwild an seinen Lebensraum?", "a": "Rehwild bevorzugt abwechslungsreiche Lebensräume wie Wald, Feld und Wiesen. Es nimmt aber auch reine Waldlagen an und ist auch in der reinen Feldmark zu finden.", "label": "38"}, {"num": 39, "type": "open", "q": "An welchen Körperstellen sitzen beim Rehwild die Duftdrüsen?", "a": "Rehwild besitzt drei Duftdrüsen: Die Laufbürste an den Hinterläufen, die Zwischenzehendrüse und die Stirndrüse.", "label": "39"}, {"num": 40, "type": "open", "q": "Wie hoch ist der prozentuale Zuwachs beim Rehwild und worauf bezieht er sich?", "a": "Die Wildbewirtschaftungsrichtlinie des Landes M-V geht von folgenden Zuwächsen aus:\nRehwild überwiegend im Wald lebend: 80 bis 100 vom Hundert des am 1. April vorhandenen weiblichen Wildes. Rehwild überwiegend in der offenen Landschaft lebend: 30 bis 80 vom Hundert des am 1. April vorhandenen weiblichen Wildes.", "label": "40"}, {"num": 41, "type": "open", "q": "Nennen Sie acht äußere Körperteile des Rehwildes in der Weidmannssprache?", "a": "Haupt bzw. Kopf (regionale Unterschiede), Lauscher, Gehörn, Äser, Lichter, Träger, Decke, Vorderlauf, Hinterlauf, Spiegel, Schürze, Pinsel", "label": "41"}, {"num": 42, "type": "open", "q": "Wovon ernährt sich Schwarzwild? Nennen Sie sechs Nahrungsquellen.", "a": "Schwarzwild ist ein Allesfresser. Schwerpunkte sind Feldfrüchte wie Mais, Kartoffeln und Getreide. Weiterhin frisst es Eicheln, Bucheckern, Insektenlarven, Aas (Fallwild), Mäuse, Gelege und Jungwild.", "label": "42"}, {"num": 43, "type": "open", "q": "Was versteht man unter den Begriffen Obermast und Untermast und nennen Sie jeweils zwei Beispiele dazu.", "a": "Obermast sind Baumfrüchte wie beispielsweise Eicheln und Bucheckern. Untermast sind Bodenfrüchte, wie beispielsweise Wurzeln und Kartoffeln.", "label": "43"}, {"num": 44, "type": "open", "q": "Warum ist das Schwarzwild im Walde nützlich und bei derselben Lebensweise im Felde schädlich?", "a": "Im Wald lockert das Schwarzwild den Boden und vertilgt die Schädlinge, z.B. Engerlinge, Schmetterlingspuppen und Mäuse. In der Feldflur schädigt es die Kulturpflanzen und deren Früchte, z.B. Mais, Kartoffeln, milchreifes Getreide, Raps. Außerdem bricht es die Grasnarbe im Grünland und frisch bestellte Äcker um.", "label": "44"}, {"num": 45, "type": "open", "q": "Wie bezeichnet der Jäger das Schwarzwild in den jeweiligen Altersstufen?", "a": "AK 0: Frischlingsbache bzw. -keiler, AK 1: Überläuferbache bzw. -keiler, AK 2: Bache, Keiler, (beim Keiler spricht man vom angehenden-, vom hauenden- und vom Hauptschwein, reifer Keiler ab 5 Jahre).", "label": "45"}, {"num": 46, "type": "open", "q": "Nennen Sie acht äußere Körperteile des Schwarzwildes in der Weidmannssprache.", "a": "Haupt bzw. Kopf (regionale Unterschiede), Teller, Lichter, Gebräch, Haderer, Gewehre, Wurf, Pürzel, Pinsel, Vorderlauf, Hinterlauf, Schwarte, Federn", "label": "46"}, {"num": 47, "type": "open", "q": "Wie unterscheidet sich die Schwarzwildfährte von der Fährte anderer Schalenwildarten?", "a": "In den Trittsiegeln der Schwarzwildfährte ist fast immer das Geäfter zu erkennen. Der Abdruck der Afterklauen steht über die Schalenbreite hinaus.", "label": "47"}, {"num": 48, "type": "open", "q": "Woran erkennt der Jäger die Anwesenheit von Schwarzwild im Revier? Nennen Sie vier Merkmale.", "a": "Die Anwesenheit von Schwarzwild im Revier erkennt man an den Fährten, am Gebräch, an der Suhle, am Malbaum, an der Losung und an den Kesseln.", "label": "48"}, {"num": 49, "type": "open", "q": "Wie hoch ist der prozentuale Zuwachs beim Schwarzwild?", "a": "In Mecklenburg-Vorpommern geht man laut Wildbewirtschaftungsrichtlinie von ca. 200 bis 300 % des Gesamtbestandes im Frühjahr aus. Witterungsbedingt gibt es von Jahr zu Jahr große Schwankungen.", "label": "49"}, {"num": 50, "type": "open", "q": "Beschreiben Sie den Lebensraum des Schwarzwildes!", "a": "Schwarzwild besiedelt alle Lebensräume, die ausreichend Fraß und Deckung bieten und bei denen ein Zugang zum Wasser gegeben ist.", "label": "50"}, {"num": 51, "type": "open", "q": "Aus welchen Gründen suhlt Schwarzwild?", "a": "Das Schwarzwild suhlt wegen des Kühleffektes und vor allem zum Schutz vor Außenparasiten.", "label": "51"}, {"num": 52, "type": "open", "q": "Wie verhalten sich führende Bachen bei Gefahr?", "a": "Bachen warnen die Rotte durch Blasen und sie verteidigen ganz energisch ihre Frischlinge.", "label": "52"}, {"num": 53, "type": "open", "q": "Beschreiben Sie die Fortpflanzungsabläufe beim Schwarzwild!", "a": "Die Bachen werden in der Rauschzeit vom Keiler beschlagen. Nach einer Tragzeit von fast vier Monaten (3 Monate, 3 Wochen, 3 Tage) frischen die Bachen im Wurfkessel. Die Leitbache leitet die Rauschzeit ein.", "label": "53"}, {"num": 54, "type": "open", "q": "Beschreiben Sie die Sozialstrukturen in denen Schwarzwild lebt!", "a": "Das Schwarzwild lebt in Rotten, die Keiler sind Einzelgänger. Die Rotte besteht aus miteinander verwandten Stücken, die von einer Leitbache geführt werden. Die Leitbache dominiert die übrigen Rottenmitglieder. Überläuferkeiler bilden nach der Geschlechtsreife Junggesellentrupps.", "label": "54"}, {"num": 55, "type": "open", "q": "Wie unterscheidet man in und an der Suhle, ob diese von Schwarz- oder Rotwild genutzt wird?", "a": "Die Benutzer der Suhle erkennt man an den Trittsiegeln und an der Höhe der Malstelle. Außerdem findet man am Malbaum immer ausgerissene Borsten oder Haare, die in der Borke des Baumes hängen geblieben sind. Auch der Abdruck des Körpers im Schlamm kann helfen.", "label": "55"}, {"num": 56, "type": "open", "q": "Wie nennt man die Stücke verschiedener Altersgruppen des Muffelwildes in beiden Geschlechtern?", "a": "Schaflamm und Widderlamm, Schmalschaf, Schmalwidder, Schaf und Widder.", "label": "56"}, {"num": 57, "type": "open", "q": "Wo ist die ursprüngliche Heimat des Muffelwildes und wann kam es nach Deutschland?", "a": "Das Muffelwild stammt aus Korsika und Sardinien. Es wurde um die Jahrhundertwende (19./20. Jh.) in Deutschland ausgesetzt.", "label": "57"}, {"num": 58, "type": "open", "q": "Beschreiben Sie die Fortpflanzungsabläufe des Muffelwildes!", "a": "Die Brunft ist im Monat November. Während dieser Zeit rivalisieren die Widder durch Rammkämpfe miteinander um die Gunst paarungsbereiter Schafe. Nach einer Tragzeit von 5,5 Monaten setzen die Schafe 1-2 Lämmer. Bei günstigen Lebensbedingungen setzen die Schafe im Herbst ein zweites Mal.", "label": "58"}, {"num": 59, "type": "open", "q": "Welche Merkmale sollten ideale Muffelwildreviere aufweisen?", "a": "Die besten Reviere liegen im bergigen Land auf steinigen oder sandigen Böden.", "label": "59"}, {"num": 60, "type": "open", "q": "Nennen Sie mindestens zwei Begriffe für den hellen Fleck in der Mitte des Rumpfes beim Muffelwidder?", "a": "Schabracke, Sattelfleck oder Schneefleck.", "label": "60"}, {"num": 61, "type": "open", "q": "Tragen beide Geschlechter beim Muffelwild einen Kopfschmuck und wird dieser bezeichnet?", "a": "Ja, die Widder tragen Schnecken, ein Großteil der Schafe bildet kleine Hörner aus, die sog. Stümpfe.", "label": "61"}, {"num": 62, "type": "open", "q": "Welche negativen Wuchsformen der Schnecke kennen Sie beim Muffelwidder?", "a": "Beim Einwachser ist die Schnecke so gedreht, dass Sie in den Träger einwachsen würde. Beim Scheuerer dreht die Schnecke zu dicht am Träger vorbei, so dass Scheuerstellen entstehen. Erkennt der Jäger diese Fehlstellungen der Schnecke, sollte er die Widder erlegen.", "label": "62"}, {"num": 63, "type": "open", "q": "Welche Erkrankung tritt an den Schalen des Muffelwildes auf? Wodurch wird sie verursacht?", "a": "Die Moderhinke, eine bakterielle Schalenerkrankung, die das Herausfaulen der Hohle zur Folge hat.", "label": "63"}, {"num": 64, "type": "open", "q": "Wo kommt Gamswild in Deutschland vor und wie nennt man den Kopfschmuck?", "a": "Die Heimat des Gamswildes ist das Hochgebirge und den Kopfschmuck bezeichnet man als Krucken.", "label": "64"}, {"num": 65, "type": "open", "q": "Nennen Sie vier Körperteile des Hasen in der Weidmannssprache!", "a": "Ohren=Löffel, Augen=Seher, Schwanz=Blume, Fell=Balg, Beine=Läufe, Maul=Äser, Nase=Windfang", "label": "65"}, {"num": 66, "type": "open", "q": "Was wissen Sie über das Sozialverhalten des Hasen?", "a": "Hasen leben als Einzelgänger, sie finden sich aber auf Äsungsplätzen zusammen und nutzen diese gemeinsam.", "label": "66"}, {"num": 67, "type": "open", "q": "Wie sind die Augen des Hasen angeordnet und welche Vorteile ergeben sich daraus?", "a": "Die Lichter (Seher) des Hasen befinden sich seitlich im oberen Bereich des Kopfes, sodass er einen vollen Sehbereich von 360° hat.", "label": "67"}, {"num": 68, "type": "open", "q": "Welche Besonderheiten weist das Hasengebiss auf?", "a": "Das Hasengebiss hat im Oberkiefer zwei Stiftzähne, die hinter den Schneidezähnen sitzen.", "label": "68"}, {"num": 69, "type": "open", "q": "Welche Lebensräume bevorzugt der Hase?", "a": "Der Hase bevorzugt Lebensräume mit geringem Waldanteil, mit trockenen, warmen Böden, relativ kleinen Ackerschlägen und gut bewachsenen Feldrainen.", "label": "69"}, {"num": 70, "type": "open", "q": "Beschreiben Sie die Fortpflanzungsabläufe des Hasen!", "a": "Der Rammler beschlägt die Häsin während der Rammelzeit (Januar bis August). Nach einer Tragzeit von etwa eineinhalb Monaten setzt die Häsin zwei- bis dreimal jährlich, von März bis Oktober, im Mittel drei Junghasen.", "label": "70"}, {"num": 71, "type": "open", "q": "Welche Faktoren haben einen negativen Einfluss auf den Hasenbesatz? Nennen Sie vier Faktoren.", "a": "Intensive Landwirtschaft, Einsatz chemischer Pflanzenschutzmittel im großen Stil, große Felder, viele Beutegreifer, hoher Mechanisierungsgrad bei der Feldbearbeitung sowie ein ungünstiger Witterungsverlauf (feuchtes Frühjahr)", "label": "71"}, {"num": 72, "type": "open", "q": "Wie kommt das Spurbild des Hasen zustande?", "a": "Der Hase setzt zuerst mit den Vorderläufen auf. Die Hinterläufe (Sprünge) werden danach vor den Vorderläufen aufgesetzt.", "label": "72"}, {"num": 73, "type": "open", "q": "Wie kann man das Kaninchen vom Feldhasen unterscheiden?", "a": "Das Wildkaninchen ist kleiner als der Feldhase, Kaninchen haben im Gegensatz zum Hasen dunkle Seher, die Balgfärbung ist grau, die Löffel sind kürzer und haben keine schwarzen Spitzen.", "label": "73"}, {"num": 74, "type": "open", "q": "Welche Ansprüche stellt das Kaninchen an seinen Lebensraum?", "a": "Das Wildkaninchen braucht mildes Klima und durchlässige, eher sandige trockene Böden. Es bevorzugt dichte Hecken, lichte kleine Wälder mit guter Deckung. Immer muss ein guter Zugang zu den Äsungsflächen gegeben sein.", "label": "74"}, {"num": 75, "type": "open", "q": "Welches Sozialverhalten kennen Sie vom Kaninchen?", "a": "Das Kaninchen lebt gesellig in Kolonien, in denen eine Sozialstruktur mit Rangordnung besteht.", "label": "75"}, {"num": 76, "type": "open", "q": "Beschreiben Sie die Fortpflanzungsabläufe der Wildkaninchen!", "a": "Während der Rammelzeit wird die Kaninchenhäsin vom Rammler beschlagen. Nach einer Tragzeit von einem Monat setzt die Kaninchenhäsin meist fünfmal jährlich ca. fünf Junge.", "label": "76"}, {"num": 77, "type": "open", "q": "Welche natürlichen Feinde hat das Wildkaninchen? Nennen Sie vier!", "a": "Die Hauptfeinde des Kaninchens sind Iltis, Marder und Hermelin, ferner auch Fuchs, Habicht, Kolkrabe, Krähen und Waldkauz.", "label": "77"}, {"num": 78, "type": "open", "q": "Beschreiben Sie die äußere und innere Anlage eines Kaninchenbaues!", "a": "Im Umfeld des Kaninchenbaues wird immer an denselben Stellen Losung abgesetzt. Das dient zur Reviermarkierung einer Sippe. In diesem Revier legen die Sippenmitglieder Einzelbaue oder einen Mutterbau an. Die Jungen werden immer in einer abseits angelegten Setzröhre gesetzt.", "label": "78"}, {"num": 79, "type": "open", "q": "Beschreiben Sie den Unterschied zwischen Hasen- und Kaninchenschädel!", "a": "Der Hasenschädel ist größer als der des Kaninchens. Das Hauptunterscheidungsmerkmal ist die Gaumenlücke. Beim Hasen ist sie lang und breit (apfelförmig), beim Kaninchen ist sie ebenfalls lang, aber viel schmaler (birnenförmig).", "label": "79"}, {"num": 80, "type": "open", "q": "Welche Lebensräume beansprucht der Biber?", "a": "Der Biber braucht stehende oder relativ langsam fließende Gewässer mit reicher Ufervegetation. Größere oder kleinere Auwälder oder Weichholzbestände müssen in unmittelbarer Nähe sein.", "label": "80"}, {"num": 81, "type": "open", "q": "An welchen Anzeichen erkennt man die Besiedlung des Revieres durch Biber?", "a": "Die Besiedlung des Revieres durch Biber merkt man sehr schnell an den typischen Kegelschnitten gefällter Bäume, später auch am Entstehen einer Biberburg oder eines Dammes im Wasser.", "label": "81"}, {"num": 82, "type": "open", "q": "Wovon ernährt sich der Biber?", "a": "Der Biber ist reiner Pflanzenfresser. Er braucht Gräser und Kräuter, sowie Zweige und Rinde von weichen Laubhölzern.", "label": "82"}, {"num": 83, "type": "open", "q": "Beschreiben Sie das Sozialverhalten des Wolfes!", "a": "Wölfe leben in Rudeln, in denen eine Alpha-Wölfin und ein Alpha-Rüde die Hierarchie führen. Die Alpha-Wölfin ist die Rudelführerin.", "label": "83"}, {"num": 84, "type": "open", "q": "Beschreiben Sie das Jagdverhalten des Wolfes!", "a": "Wölfe jagen meist im Rudel. Sie sind Verfolgungsjäger. Sie folgen ihrer ausgespähten Beute oft über sehr weite Strecken bis sich eine Gelegenheit zum Angriff bietet.", "label": "84"}, {"num": 85, "type": "open", "q": "Nennen Sie mindestens vier Bundesländer in denen Wölfe gelegentlich oder regelmäßig in Deutschland vorkommen?", "a": "Mecklenburg- Vorpommern, Brandenburg, Sachsen, Sachsen- Anhalt, Niedersachsen", "label": "85"}, {"num": 86, "type": "open", "q": "Wovon ernährt sich der Wolf? Nennen Sie vier Beispiele!", "a": "Zur Nahrung des Wolfes gehört Schalenwild bis zur Elchgröße, Haustiere (besonders Schafe), Aas und Kleinsäuger. Gelegentlich nimmt er auch Früchte und Beeren.", "label": "86"}, {"num": 87, "type": "open", "q": "Woher stammt der Marderhund und wie ist er nach Deutschland gekommen?", "a": "Der Marderhund stammt aus Ostasien. Er wurde zu Beginn des 20. Jh. als Pelztier in der Ukraine ausgesetzt und hat sich von dort immer weiter nach Westen ausgebreitet.", "label": "87"}, {"num": 88, "type": "open", "q": "Welche Lebensräume bevorzugt der Marderhund?", "a": "Der Marderhund bevorzugt Schilfgebiete, Auwälder und Brüche.", "label": "88"}, {"num": 89, "type": "open", "q": "Wovon ernährt sich der Marderhund? Nennen Sie vier Beispiele!", "a": "Der Marderhund ist ein Allesfresser. Der tierische Anteil besteht aus Insekten, Lurchen, Reptilien, Kleinsäugern, Eiern, Jungvögeln und Aas. Die pflanzliche Nahrung besteht aus Beeren und Früchten.", "label": "89"}, {"num": 90, "type": "open", "q": "Welche Besonderheiten begünstigen die relativ schnelle Ausbreitung des Marderhundes?", "a": "Der Marderhund ist sehr anpassungsfähig, hat ganz erhebliche Wurfgrößen von vier bis acht Jungen und beide Eltern kümmern sich intensiv um den Nachwuchs.", "label": "90"}, {"num": 91, "type": "open", "q": "An welchem Körpermerkmal kann man den Marderhund vom Waschbären unterscheiden?", "a": "Der Marderhund hat eine kurze einfarbige Rute, die des Waschbären ist lang und geringelt.", "label": "91"}, {"num": 92, "type": "open", "q": "Woher stammt der Waschbär und wie ist er nach Deutschland gekommen?", "a": "Der Waschbär stammt aus Nordamerika. In den dreißiger Jahren des 20. Jh. wurde er in wenigen Exemplaren ausgesetzt. Der Rest entkam aus Pelztierfarmen oder Tiergärten. Inzwischen ist er fast flächendeckend in Deutschland verbreitet.", "label": "92"}, {"num": 93, "type": "open", "q": "Welche Lebensräume bevorzugt der Waschbär?", "a": "Der Waschbär lebt in feuchten Waldgebieten. Inzwischen besiedelt er aber auch Gebiete mit größeren Feldgehölzen. Er ist Kulturfolger, der auch in den Städten seinen Lebensraum gefunden hat.", "label": "93"}, {"num": 94, "type": "open", "q": "Wovon ernährt sich der Waschbär? Nennen Sie vier Beispiele!", "a": "Der Waschbär ist Allesfresser. Pflanzliche und tierische Anteile halten sich etwa die Waage. Er nimmt kleine Wirbeltiere bis etwa Kaninchengröße, Vögel und Gelege, Insekten, Würmer, Luder, Obst, Mais, Getreide, Eicheln, Bucheckern, Nüsse, Abfälle.", "label": "94"}, {"num": 95, "type": "open", "q": "Welche Ansprüche stellt der Fuchs an seinen Lebensraum?", "a": "Der Fuchs hat keine besonderen Ansprüche an seinen Lebensraum. Er ist Kulturfolger, der auch in Städten immer häufiger anzutreffen ist.", "label": "95"}, {"num": 96, "type": "open", "q": "Wovon ernährt sich der Fuchs? Nennen Sie vier Beispiele!", "a": "Die Hauptnahrung des Fuchses sind Säugetiere bis Rehkitzgröße. Er ist Nahrungsgeneralist. Er nimmt auch pflanzliche Nahrung auf z.B. Beeren und Obst. Im besiedelten Bereich nimmt er auch Nahrungsabfälle des Menschen.", "label": "96"}, {"num": 97, "type": "open", "q": "Benennen Sie sechs Körperteile des Fuchses in der Weidmannssprache!", "a": "Gehöre, Seher, Fang, Vorderlauf, Hinterlauf, Branten, Balg, Viole, Lunte, Blume", "label": "97"}, {"num": 98, "type": "open", "q": "Welche vier Farbvarianten des Fuchsbalges kennen Sie? Welche Namen gebraucht der Jäger hierfür?", "a": "Eine sehr helle Variante wird Birkfuchs genannt. Der Brandfuchs hat einen rotbraunen Balg und der Kohlfuchs hat einen schwarzbraunen Balg. Der Kreuzfuchs hat einen gekreuzten Rücken- und Schulterstreifen.", "label": "98"}, {"num": 99, "type": "open", "q": "Beschreiben Sie die Fortpflanzung des Fuchses!", "a": "Die Fähe wird in der Ranzzeit, Januar/Februar, vom Rüden gedeckt. Nach einer Tragzeit von fast zwei Monaten, März/April, wölft die Fähe im Mittel fünf Welpen.", "label": "99"}, {"num": 100, "type": "open", "q": "Über welche Sinnesleistungen verfügt der Fuchs?", "a": "Beim Fuchs sind der Geruchssinn, das Gehör und der Sehsinn hervorragend ausgeprägt.", "label": "100"}, {"num": 101, "type": "open", "q": "Nennen Sie Merkmale die den Dachsschädel kennzeichnen.", "a": "Der Dachsschädel hat in der Mitte auf dem Scheitel einen hohen Knochenkamm (Dachshelm) und 38 Zähne. Der Unterkiefer fällt beim Anheben des Schädels nicht aus dem Oberkiefer.", "label": "101"}, {"num": 102, "type": "open", "q": "Nennen Sie mindestens zwei Lebensräume, die der Dachs besiedelt.", "a": "Der Dachs bevorzugt Waldränder, Feldhecken und Feldgehölze.", "label": "102"}, {"num": 103, "type": "open", "q": "Wovon ernährt sich der Dachs? Nennen Sie vier Beispiele!", "a": "Der Dachs ist ein Allesfresser. Seine Hauptnahrung sind Regenwürmer, Insekten, Kleinsäuger, Schnecken, reifes Obst, Feldfrüchte (Mais), Beeren, auch Nahrungsabfälle werden genommen.", "label": "103"}, {"num": 104, "type": "open", "q": "Wie verhält sich der Dachs im Winter?", "a": "Der Dachs hält in der Regel eine Winterruhe im Bau. Bei warmer Witterung ist er auch außerhalb vom Bau auf Nahrungssuche anzutreffen.", "label": "104"}, {"num": 105, "type": "open", "q": "Woran erkennt man einen befahrenen Dachsbau?", "a": "An der Dachsrinne („Geschleif“) erkennt man den befahrenen Dachsbau. Das ist eine lange, rinnenförmige Vertiefung, die zum Röhreneingang führt. In unmittelbarer Baunähe findet man auch immer neue Aborte (Dachsgruben) mit frischer Losung.", "label": "105"}, {"num": 106, "type": "open", "q": "Woran erkennt man die Spur (Trittsiegel) des Dachses?", "a": "Die Trittsiegel des Dachses sehen aus wie ganz kleine Bärentatzen. Ballen- und Zehenabdrücke sind gut zu erkennen. Sehr deutlich sieht man auch die Abdrücke der Krallen, er „nagelt“.", "label": "106"}, {"num": 107, "type": "open", "q": "Wovon ernährt sich ein Fischotter? Nennen Sie vier Beispiele!", "a": "Die Hauptnahrung des Otters sind Fische und Amphibien. Zu seinem Nahrungsspektrum gehören auch am Wasser lebende Nager, kleinere Wasservögel und Krebse.", "label": "107"}, {"num": 108, "type": "open", "q": "Wo hat der Fischotter seinen Bau und wie sieht dieser aus?", "a": "Der Bau befindet sich in der Uferböschung. Der Haupteingang des Otterbaues liegt unter dem Wasserspiegel. Diese Röhre mündet in einem höher gelegenen, gepolsterten Kessel, der nach oben zur Erdoberfläche hin einen Notausgang hat.", "label": "108"}, {"num": 109, "type": "open", "q": "Woran erkennt man die Otterspur?", "a": "Die Otterspur erkennt man an den Abdrücken der Schwimmhäute zwischen den Zehen und der nachschleifenden Rute.", "label": "109"}, {"num": 110, "type": "open", "q": "Welche Anforderungen stellt der Fischotter an seinen Lebensraum?", "a": "Der Otter braucht Gewässer mit hoher Wasserqualität und mit Gras und Gehölz bewachsene Ufer.", "label": "110"}, {"num": 111, "type": "open", "q": "Beschreiben Sie den Lebensraum des Minks!", "a": "Der Mink ist Bewohner der Uferzonen an Gewässern aller Art.", "label": "111"}, {"num": 112, "type": "open", "q": "Wovon ernährt sich der Mink? Nennen Sie vier Beispiele dazu!", "a": "Zum Nahrungsspektrum des Mink gehören Kleinnager bis Bisamgröße, Fische, Krebse, Wasserinsekten, Amphibien, Reptilien, Vögel und deren Gelege.", "label": "112"}, {"num": 113, "type": "open", "q": "Zählen Sie Lebensräume auf, die der Baummarder besiedelt!", "a": "Größere Waldgebiete, aber auch Feldholzinseln, Parkanlagen, Feldhecken.", "label": "113"}, {"num": 114, "type": "open", "q": "Zählen Sie Lebensräume auf, die der Steinmarder besiedelt!", "a": "Der Steinmarder lebt in Siedlungsnähe bis in die Großstädte hinein (Hausmarder, Kulturfolger).\nWeiterhin trifft man ihn in Feldhecken, Parkanlagen, Waldrändern und Feldholzinseln an.", "label": "114"}, {"num": 115, "type": "open", "q": "Welches typische Merkmal gibt es sowohl bei der Spur des Baum- als auch des Steinmarders, und wie lassen sich die Spuren der beiden Wildarten unter günstigen Bedingungen unterscheiden?", "a": "Das Spurbild des Baum- und des Steinmarders erkennt man am charakteristischen Paartritt.\nDie Ballen der Steinmarderspur sind gut erkennbar (unbehaart), die Ballen des Baummarders sind behaart und damit nicht so deutlich umrissen.", "label": "115"}, {"num": 116, "type": "open", "q": "Wovon ernährt sich der Steinmarder? Nennen Sie vier Beispiele dazu!", "a": "Die Nahrung des Steinmarders besteht hauptsächlich aus Kleinnagern, Kaninchen, Junghasen, Eiern und Vögeln bis zur Fasanengröße. Obst und Beeren werden auch genommen.", "label": "116"}, {"num": 117, "type": "open", "q": "Welche Lebensräume bevorzugt der Iltis?", "a": "Der Iltis bevorzugt feuchte Wald-Feld-Randlagen, Hecken, Feldgehölze und bewachsene Gräben und Teichränder.", "label": "117"}, {"num": 118, "type": "open", "q": "Welche Nahrung bevorzugt der Iltis? Nennen Sie vier Beispiele dazu!", "a": "Zum Nahrungsspektrum des Iltis gehören Mäuse, Ratten, Amphibien, Kaninchen, Gelege und Bruten, Aas, Regenwürmer und Schnecken.", "label": "118"}, {"num": 119, "type": "open", "q": "Welche Raubwildarten weisen eine \"Verkehrtfärbung\" auf?", "a": "Beim Iltis und beim Dachs spricht man von einer Verkehrtfärbung.", "label": "119"}, {"num": 120, "type": "open", "q": "An welchen Merkmalen erkennt man das Hermelin?", "a": "Hauptmerkmal ist die ganzjährige schwarze Rutenspitze. Das Hermelin ist im Sommerbalg oberseits braun und im Winterbalg weiß gefärbt.", "label": "120"}, {"num": 121, "type": "open", "q": "Was gehört zum Nahrungsspektrum des Hermelins? Nennen Sie vier Beispiele dazu!", "a": "Zur Nahrung des Hermelins gehören Kleinsäuger bis Kaninchengröße, Eier, Vögel, Amphibien, Reptilien und Insekten.", "label": "121"}, {"num": 122, "type": "open", "q": "Ist das Hermelin Tag- oder Nachtaktiv?", "a": "Das Hermelin ist im Frühjahr und Sommer tagaktiv, im Herbst und Winter eher nachtaktiv.", "label": "122"}, {"num": 123, "type": "open", "q": "Welche Federwildarten gehören zu den Raufußhühnern?", "a": "Auerwild, Birkwild, Haselwild und Schneehühner.", "label": "123"}, {"num": 124, "type": "open", "q": "Beschreiben Sie den für das Rebhuhn günstigen Lebensraum!", "a": "Das Rebhuhn braucht eine kleinparzellierte Felder- und Wiesenlandschaft mit Hecken, ohne Bäume.", "label": "124"}, {"num": 125, "type": "open", "q": "Welche Gründe gibt es für den drastischen Rückgang unserer Rebhuhnbesätze?", "a": "Unsere Rebhuhnbesätze haben abgenommen, weil die kleinstrukturierten Lebensräume immer seltener werden, die Artenvielfalt der Nahrungspflanzen abnimmt und Beutegreifer nicht mehr intensiv genug bejagt werden.", "label": "125"}, {"num": 126, "type": "open", "q": "Wovon ernährt sich das Rebhuhn? Nennen Sie vier Beispiele dazu!", "a": "Das Rebhuhn braucht zur Nahrung Sämereien von vielen verschiedenen Wildkräutern und Getreide, sowie deren frische grüne Pflanzenspitzen. Auch Insekten und Würmer dürfen nicht fehlen. Besonders die Küken brauchen in den ersten zwei Wochen nur tierisches Eiweiß (Insekten).", "label": "126"}, {"num": 127, "type": "open", "q": "Welches Sozialverhalten ist vom Rebhuhn bekannt und gibt es Veränderungen im Jahresverlauf?", "a": "Rebhühner sind gesellige Tiere. Sie leben ab Herbst und im Winter in Gruppen (Ketten). Im Frühjahr bilden sich Paarhühner (Jahresehe), sie verteidigen ihr Revier vehement.", "label": "127"}, {"num": 128, "type": "open", "q": "Woran kann man das Vorkommen von Rebhühnern feststellen? Nennen Sie vier Merkmale!", "a": "Das Vorkommen von Rebhühnern im Revier erkennt man durch Sichtbeobachtungen, an den Huderstellen, Federn, Rissen, am Gestüber, am Geläuf und auch an den charakteristischen Lautäußerungen vor der Balz.", "label": "128"}, {"num": 129, "type": "open", "q": "Welche Lebensräume bevorzugt der Fasan?", "a": "Der Fasan braucht die bekannten „fünf W“, die für Wald, Wasser, Weizen, Wiese und Wärme stehen. Der Fasan ist allerdings kein Waldbewohner. Er bevorzugt eher Waldränder zum Aufbaumen.", "label": "129"}, {"num": 130, "type": "open", "q": "Auf welche Nahrung sind Fasanenküken besonders angewiesen?", "a": "Die Fasanenküken brauchen anfangs rein tierische Nahrung, vorrangig Insekten.", "label": "130"}, {"num": 131, "type": "open", "q": "Nennen Sie Länder, aus denen der Fasan ursprünglich stammt.", "a": "Die ursprüngliche Heimat des Fasans ist Asien. Herkunftsländer sind Japan, China, Mongolei, Iran, Kasachstan, Usbekistan, Turkmenistan, Kirgisien, Armenien, Aserbaidschan.", "label": "131"}, {"num": 132, "type": "open", "q": "Welche Schwanenart ist in Mecklenburg- Vorpommern häufiger Brutvogel und welche Arten sind Wintergäste?", "a": "Der Höckerschwan ist häufiger Brutvogel in Mecklenburg-Vorpommern. Wintergäste sind Singschwäne und selten auch Zwergschwäne.", "label": "132"}, {"num": 133, "type": "open", "q": "Nennen Sie Merkmale, an welchen sich Schwanenarten unterscheiden lassen.", "a": "Die Schwanenarten lassen sich am besten am Schnabel unterscheiden. Der Höckerschwan hat den gut sichtbaren Höcker auf der Oberseite des orangefarbenen bis rötlichen Schnabels. Der Singschwan und der Zwergschwan haben zitronengelbe dreieckige Flächen an den Seiten des Oberschnabels. Beim Zwergschwan sind sie kleiner als beim Singschwan.", "label": "133"}, {"num": 134, "type": "open", "q": "Welche Lebensräume bevorzugt der Höckerschwan?", "a": "Der Höckerschwan lebt auf Seen und Teichen mit Flachwasserzonen und Unterwasserpflanzen. Er lebt auf entlegenen Waldseen ebenso wie im besiedelten Bereich.", "label": "134"}, {"num": 135, "type": "open", "q": "Nennen Sie vier Gänsearten die in Mecklenburg-Vorpommern anzutreffen sind.", "a": "Graugans, Saatgans, Blässgans, Ringelgans, Nonnengans, Kanadagans, Nilgans", "label": "135"}, {"num": 136, "type": "open", "q": "Welche Gänsearten sind Brutvögel in Mecklenburg-Vorpommern, welche sind Wintergäste bzw. Durchzügler? Nennen Sie jeweils zwei Arten!", "a": "Graugänse sind Brutvögel in Mecklenburg-Vorpommern, im Küstenbereich vereinzelt auch die Kanadagans. Saatgans, Blässgans, Nonnengans und selten auch die Ringelgans sind Wintergäste. Als hier brütender Neubürger etabliert sich zunehmend die Nilgans.", "label": "136"}, {"num": 137, "type": "open", "q": "Welche Lebensräume bevorzugen die Graugänse?", "a": "Graugänse brauchen Seen mit ausgedehntem Schilfgürtel und Flachwasserbereichen, die guten Zugang zu Uferwiesen und Saatflächen haben.", "label": "137"}, {"num": 138, "type": "open", "q": "Wovon ernähren sich Graugänse? Nennen Sie vier Beispiele dazu!", "a": "Die Nahrung der Graugänse besteht vorwiegend aus Wasserpflanzen, Getreide, Saat, Raps und Gras.", "label": "138"}, {"num": 139, "type": "open", "q": "Welche Lebensräume bevorzugt der Kormoran?", "a": "Der Kormoran braucht eine seenreiche Landschaft mit Altbäumen, in denen er seine Nester baut.", "label": "139"}, {"num": 140, "type": "open", "q": "Beschreiben Sie den Neststandort des Kormorans und schildern Sie die Folgen auf das Umfeld durch Koteinträge!", "a": "Der Kormoran brütet in Kolonien auf großen alten Bäumen, gern auf Eichen. Der ätzende Kot, der aus den Nestern in großen Mengen auf die Blätter des Baumes fällt, bringt ihn in wenigen Jahren zum Absterben.", "label": "140"}, {"num": 141, "type": "open", "q": "Wovon ernährt sich der Kormoran und warum ergeben sich Probleme durch seine „Spezialisierung“?", "a": "Der Kormoran frisst fast ausschließlich Fische, die er als guter Taucher unter Wasser fängt. Durch seine hohe Besiedlungsdichte wird das zum Problem für die Binnenfischer.", "label": "141"}, {"num": 142, "type": "open", "q": "Nennen Sie sechs Entenarten, die regelmäßig in Mecklenburg-Vorpommern anzutreffen sind!", "a": "Stockente, Schnatterente, Löffelente, Krickente, Reiherente, Tafelente, Schellente, Pfeifente, Eiderente.", "label": "142"}, {"num": 143, "type": "open", "q": "Wie heißen die beiden Gruppen, in die man Entenarten unterteilt? Nennen Sie zu jeder Gruppe wenigstens zwei Arten!", "a": "Schwimmenten: Stockente, Schnatterente, Krickente, Löffelente, Spießente\nTauchenten: Reiherente, Tafelente, Schellente, Kolbenente, Moorente", "label": "143"}, {"num": 144, "type": "open", "q": "Wie kann man auf dem Wasser schwimmende Tauchenten von Schwimmenten unterscheiden?", "a": "Bei den Schwimmenten ragt der Stoß halbschräg aus dem Wasser nach oben, bei den Tauchenten liegt er flach auf dem Wasser auf und ist als solcher nicht direkt zu erkennen.", "label": "144"}, {"num": 145, "type": "open", "q": "Wie verhalten sich Schwimmenten und Tauchenten bei der Nahrungssuche?", "a": "Die Schwimmenten gründeln nach dem Futter, die Tauchenten tauchen unter.", "label": "145"}, {"num": 146, "type": "open", "q": "Wie unterscheiden sich Schwimmenten und Tauchenten, wenn sie aus dem Wasser aufstehen?", "a": "Die Schwimmenten fliegen fast senkrecht nach oben ab (sie „stehen auf“), die Tauchenten fliegen flach ab (sie „laufen an“).", "label": "146"}, {"num": 147, "type": "open", "q": "Welche Lebensräume bevorzugt die Stockente?", "a": "Stockenten brauchen vorwiegend flache Binnengewässer mit deckungsreichen Ufern.", "label": "147"}, {"num": 148, "type": "open", "q": "An welchen Orten brütet die Stockente?", "a": "Stockenten brüten im Schilfgürtel der Gewässer. Sie nehmen aber auch gern alte Kopfweiden oder Entenbrutkörbe an.", "label": "148"}, {"num": 149, "type": "open", "q": "Wie verhalten sich Entenküken nach dem Schlupf?", "a": "Entenküken sind Nestflüchter. Wenn die Daunen getrocknet sind, gehen sie mit den Eltern sofort ins Wasser und können von Anfang an sehr gut schwimmen.", "label": "149"}, {"num": 150, "type": "open", "q": "Wie verläuft die Mauser bei den Enten?", "a": "Die Enten mausern das Großgefieder auf einmal. Deshalb sind sie längere Zeit eingeschränkt flugfähig.", "label": "150"}, {"num": 151, "type": "open", "q": "Nennen Sie vier Wildtaubenarten die in Mecklenburg-Vorpommern vorkommen.", "a": "Die Ringeltaube, die Hohltaube, die Türkentaube und seltener auch die Turteltaube.", "label": "151"}, {"num": 152, "type": "open", "q": "Nennen Sie vier Lebensräume die von der Ringeltaube besiedelt werden.", "a": "Die Ringeltaube siedelt sich überall an, z.B. in Wäldern, Feldgehölzen, Parks, auf Friedhöfen, in Gärten oder in Alleen.", "label": "152"}, {"num": 153, "type": "open", "q": "Wie ist das Nest der Ringeltaube beschaffen?", "a": "Das Ringeltaubennest ist ein einfaches Geflecht aus dünnen Zweigen, ohne Nestmulde und ohne jede Polsterung.", "label": "153"}, {"num": 154, "type": "open", "q": "Wovon ernährt sich die Ringeltaube? Nennen Sie vier Beispiele dazu!", "a": "Die Nahrung der Ringeltaube ist fast rein vegetarisch. Sie besteht aus frischen grünen Blättern, weiterhin auch Sämereien, Eicheln und Bucheckern, Getreide, Raps, Erbsen usw.", "label": "154"}, {"num": 155, "type": "open", "q": "Welche Folgen können bei einer überhöhten Wilddichte auftreten?", "a": "Die Folgen einer überhöhten Wilddichte einer Wildart sind vermehrte Wildschäden, Wildseuchen und schlechte körperliche Verfassung des Wildes.", "label": "155"}, {"num": 156, "type": "open", "q": "Mit welchen Arbeiten kann der Jäger den Rehen und Hasen im Winter besonders helfen?", "a": "Durch das Schneiden von Prossholz, Anlegen von Wildäckern oder Wildwiesen und dem Ausbringen von artgerechtem Futter in Notzeiten.", "label": "156"}, {"num": 157, "type": "open", "q": "Welche Strauch- und Gehölzarten wählen Sie zur Anlage einer Hecke? Nennen Sie sechs Arten.", "a": "Schwarzdorn, Weißdorn, Heckenrose, Haselnuss, Brombeere, Holunder, Sanddorn, Himbeere, Pfaffenhütchen, roter Hartriegel", "label": "157"}, {"num": 158, "type": "open", "q": "Was sind Benjeshecken und wie sollten sie beschaffen sein?", "a": "Benjeshecken sind locker aufgeschichtete Reihen aus Ästen von Laubbäumen, in deren Schutz Sträucher und Bäume heranwachsen, deren Samen durch Anflug und Vogelkot eingetragen worden sind.", "label": "158"}, {"num": 159, "type": "open", "q": "Was ist Prossholz?", "a": "Prossholz ist der Sammelbegriff für frische Zweige von Weichhölzern, die sich als Winteräsung für Hasenartige und Wiederkäuer eignen.", "label": "159"}, {"num": 160, "type": "open", "q": "Welche Wildschäden sind im Wald durch Rotwild zu erwarten?", "a": "Es können Verbiss-, Schlag-, Fege- und Schälschäden entstehen.", "label": "160"}, {"num": 161, "type": "open", "q": "Wie entstehen Fege- und Schlagschäden?", "a": "Fegeschäden entstehen durch das Abscheuern der Basthaut des Geweihes an jungen Bäumen, Schlagschäden entstehen bei der Reviermarkierung durch die männlichen Geweihträger.", "label": "161"}, {"num": 162, "type": "open", "q": "Woran unterscheidet man Verbissschäden, die von Rehwild verursacht wurden von Verbissschäden, die durch Hasen verursacht wurden?", "a": "Der Feldhase schneidet den Zweig mit seinen Nagezähnen messerscharf ab. Das Rehwild rupft den Zweig ab und das ergibt zerfaserte Schnittstellen.", "label": "162"}, {"num": 163, "type": "open", "q": "Welche Hauptnährstoffe brauchen Pflanzen? Nennen Sie mindestens vier.", "a": "Die Hauptnährstoffe der Pflanzen sind Stickstoff, Phosphor, Kalium, Magnesium, Schwefel, Calcium.", "label": "163"}, {"num": 164, "type": "open", "q": "Welche Geräte werden zur Bodenbearbeitung auf einer landwirtschaftlichen Fläche eingesetzt? Nennen Sie mindestens vier.", "a": "Bei der Bodenbearbeitung werden Pflug, Grubber, Egge, Fräse, Schleppe und Walze eingesetzt.", "label": "164"}, {"num": 165, "type": "open", "q": "Welche Schutzfunktionen des Waldes kennen Sie? Nennen Sie mindestens vier!", "a": "Der Wald schützt die Landschaft vor Austrocknung, er schützt vor Erosionsschäden, er schützt die Tiere vor extremen Witterungseinwirkungen. Der Wald schützt vor Lawinen, vor Lärm und vor Luftschadstoffen, die er in begrenzter Menge abbauen kann.", "label": "165"}, {"num": 166, "type": "open", "q": "Was verstehen Sie unter Pionierholzarten, welche Baumarten gehören dazu und wie verbreiten sie sich? Nennen Sie mindestens vier Beispiele!", "a": "Pionierhölzer sind anspruchslose Baumarten, die als Erstbesiedler an einem Standort erscheinen, z.B. die Birke, Weide, Erle, Pappel, Eberesche, Kiefer. Verbreitung durch Anflug oder Vogelkot.", "label": "166"}, {"num": 167, "type": "open", "q": "Was bedeuten die forstlichen Begriffe Anflug und Aufschlag?", "a": "Anflug ist der Baumaufwuchs aus Samen, die vom Wind herangetragen worden sind, z.B. Birke. Aufschlag sind Jungbäume, die aus herabgefallen Baumsamen entstanden sind, z.B. Eiche.", "label": "167"}, {"num": 168, "type": "open", "q": "Nennen Sie vier Hackfruchtarten die sich auf dem Wildacker als Äsung für Schalenwild eignen!", "a": "Alle Rübenarten, Kartoffeln, Topinambur, Möhren und Kohl", "label": "168"}, {"num": 169, "type": "open", "q": "Nennen Sie vier nichtheimische Baumarten mit forstwirtschaftlicher Bedeutung!", "a": "Sitkafichte, Douglasie, Weymouthskiefer (Strobe), Robinie, Roteiche, Schwarzkiefer, Küstentanne, Esskastanie", "label": "169"}, {"num": 170, "type": "open", "q": "Nennen Sie Ausweisungsgründe mit jeweils einem Beispiel für ein Naturschutzgebiet!", "a": "Ausweisungsgründe sind das Vorkommen einer seltenen Pflanze, Bsp. Sonnentau, Wollgras, Frauenschuh, Knabenkraut oder das Vorkommen von einem seltenen Tier, Bsp. Uhu, Schwarzstorch, Sumpfschildkröte, Moorfrosch", "label": "170"}, {"num": 171, "type": "open", "q": "Nennen Sie vier Arten von Schutzgebieten, die das Bundesnaturschutzgesetz benennt.", "a": "Naturschutzgebiet, Nationalpark, Landschaftsschutzgebiet, Naturpark, Biosphärenreservat", "label": "171"}, {"num": 172, "type": "open", "q": "Was versteht man unter Ökologie?", "a": "Die Wissenschaft von allen Beziehungen der Lebewesen zu ihrer unbelebten und lebenden Umwelt.", "label": "172"}, {"num": 173, "type": "open", "q": "Welche nicht jagdbaren einheimischen Säuger halten einen Winterschlaf? Nennen Sie vier Arten!", "a": "Igel, Hamster, Bilche (Siebenschläfer, Haselmaus, Gartenschläfer, Baumschläfer), Fledermäuse", "label": "173"}, {"num": 174, "type": "mc", "q": "Welche der folgenden Arten gehören zur Ordnung der Nagetiere?", "opts": [{"k": "a", "text": "Feldhase, Igel", "ok": false}, {"k": "b", "text": "Bisam, Biber", "ok": true}, {"k": "c", "text": "Wildkaninchen, Reh", "ok": false}], "label": "174"}, {"num": 175, "type": "mc", "q": "Zu welcher Familie gehört der Dachs?", "opts": [{"k": "a", "text": "Kleinbären", "ok": false}, {"k": "b", "text": "Hundeartige", "ok": false}, {"k": "c", "text": "Marderartige", "ok": true}], "label": "175"}, {"num": 176, "type": "mc", "q": "Welche der aufgeführten Wildarten gehören zu den Cerviden?", "opts": [{"k": "a", "text": "Rehwild, Rotwild", "ok": true}, {"k": "b", "text": "Damwild, Steinwild", "ok": false}, {"k": "c", "text": "Sikawild, Muffelwild", "ok": false}], "label": "176"}, {"num": 177, "type": "mc", "q": "Welche der genannten Teile gehören zum Wiederkäuermagen?", "opts": [{"k": "a", "text": "Muskelmagen, Weidsack", "ok": false}, {"k": "b", "text": "Kropf, Netzmagen", "ok": false}, {"k": "c", "text": "Blättermagen, Pansen", "ok": true}], "label": "177"}, {"num": 178, "type": "mc", "q": "Welche Tierarten haben einen Pansen?", "opts": [{"k": "a", "text": "Rotwild und Muffelwild", "ok": true}, {"k": "b", "text": "Rehwild und Hase", "ok": false}, {"k": "c", "text": "Damwild und Enten", "ok": false}], "label": "178"}, {"num": 179, "type": "mc", "q": "Was sind Grandeln?", "opts": [{"k": "a", "text": "Die Eckzähne im Oberkiefer des Rotwildes", "ok": true}, {"k": "b", "text": "Die Schneidezähne im Oberkiefer des Rotwildes", "ok": false}, {"k": "c", "text": "Die Eckzähne im Unterkiefer des Rotwildes", "ok": false}], "label": "179"}, {"num": 180, "type": "mc", "q": "Wie viele Schneidezähne hat das Rotwild im Oberkiefer?", "opts": [{"k": "a", "text": "Zwei", "ok": false}, {"k": "b", "text": "Vier", "ok": false}, {"k": "c", "text": "Keine", "ok": true}], "label": "180"}, {"num": 181, "type": "mc", "q": "In welchen Monaten werfen Rothirsche i.d.R. ihr Geweih ab?", "opts": [{"k": "a", "text": "Februar bis April", "ok": true}, {"k": "b", "text": "September bis November", "ok": false}, {"k": "c", "text": "April bis Juni", "ok": false}], "label": "181"}, {"num": 182, "type": "mc", "q": "Was versteht man unter den Begriffen Boviden und Cerviden?", "opts": [{"k": "a", "text": "Allesfresser und Wiederkäuer", "ok": false}, {"k": "b", "text": "Hornträger und Geweihträger", "ok": true}, {"k": "c", "text": "Geweihträger und Nascher", "ok": false}], "label": "182"}, {"num": 183, "type": "mc", "q": "Welchen Schmalspießer sollte der Jäger vorrangig erlegen?", "opts": [{"k": "a", "text": "Schmalspießer mit geringem Körpergewicht", "ok": true}, {"k": "b", "text": "Schmalspießer mit Endenbildung", "ok": false}, {"k": "c", "text": "Schmalspießer mit Spießlängen über Lauscherhöhe", "ok": false}], "label": "183"}, {"num": 184, "type": "mc", "q": "Welchen mittelalten Rothirsch sollte der Jäger nicht erlegen?", "opts": [{"k": "a", "text": "Schwache Rothirsche mit beidseitiger Gabel im Geweih", "ok": false}, {"k": "b", "text": "Schwache Rothirsche mit beidseitigem Spieß", "ok": false}, {"k": "c", "text": "Körperlich starke Rothirsche mit beidseitiger Krone im Geweih", "ok": true}], "label": "184"}, {"num": 185, "type": "mc", "q": "In welchen Monaten befindet sich der Rothirsch in der Feistzeit?", "opts": [{"k": "a", "text": "Im Mai/Juni", "ok": false}, {"k": "b", "text": "Im Juli/August", "ok": true}, {"k": "c", "text": "Im September/Oktober", "ok": false}], "label": "185"}, {"num": 186, "type": "mc", "q": "Wer führt in der Regel ein Rotwildrudel, bestehend aus Alttieren, Schmaltieren, Kälbern und geringen Hirschen an?", "opts": [{"k": "a", "text": "Ein Gelttier", "ok": false}, {"k": "b", "text": "Ein Alttier mit Kalb", "ok": true}, {"k": "c", "text": "Ein geringer Hirsch", "ok": false}], "label": "186"}, {"num": 187, "type": "mc", "q": "Wie viele Kälber setzt ein Rotalttier in der Regel jährlich?", "opts": [{"k": "a", "text": "Eins", "ok": true}, {"k": "b", "text": "Zwei", "ok": false}, {"k": "c", "text": "Drei", "ok": false}], "label": "187"}, {"num": 188, "type": "mc", "q": "Wie nennt man einen Rothirsch mit Aug-, Eis-, Mittelspross und Gabel?", "opts": [{"k": "a", "text": "Eissprossenzehner", "ok": true}, {"k": "b", "text": "Kronenzehner", "ok": false}, {"k": "c", "text": "Mittelsprossenzehner", "ok": false}], "label": "188"}, {"num": 189, "type": "mc", "q": "Wann ist im Normalfall Brunftzeit beim Rotwild?", "opts": [{"k": "a", "text": "Juli/August", "ok": false}, {"k": "b", "text": "September/Oktober", "ok": true}, {"k": "c", "text": "Oktober/November", "ok": false}], "label": "189"}, {"num": 190, "type": "mc", "q": "Wann ist im Normalfall Brunftzeit beim Damwild?", "opts": [{"k": "a", "text": "Juli/August", "ok": false}, {"k": "b", "text": "Oktober/November", "ok": true}, {"k": "c", "text": "Februar/März", "ok": false}], "label": "190"}, {"num": 191, "type": "mc", "q": "Wann wirft der Damhirsch sein Geweih ab?", "opts": [{"k": "a", "text": "Im Februar", "ok": false}, {"k": "b", "text": "Im April", "ok": true}, {"k": "c", "text": "Im September", "ok": false}], "label": "191"}, {"num": 192, "type": "mc", "q": "Woran erkennt man die Trittsiegel des Damwildes?", "opts": [{"k": "a", "text": "Das Geäfter ist immer zu erkennen", "ok": false}, {"k": "b", "text": "Die Ballenlänge nimmt gut die Hälfte des Trittsiegels ein", "ok": true}, {"k": "c", "text": "Die Trittsiegel sind von denen des Rotwildes fast gar nicht zu unterscheiden", "ok": false}], "label": "192"}, {"num": 193, "type": "mc", "q": "Welches Geweih trägt in der Regel ein Damhirsch vom 2. Kopf?", "opts": [{"k": "a", "text": "Längere Spieße als die vom 1. Kopf", "ok": false}, {"k": "b", "text": "Stangen mit Aug- und Mittelsprosse und leicht angedeutetem Schaufelansatz", "ok": true}, {"k": "c", "text": "Ein starkes Geweih mit großer Schaufel", "ok": false}], "label": "193"}, {"num": 194, "type": "mc", "q": "Welche Geweihformen sind beim Damwild unerwünscht?", "opts": [{"k": "a", "text": "Geweihe ohne Schaufelbildung oder mit O-förmigen oder V-förmigen Schlitzen", "ok": true}, {"k": "b", "text": "Geweihe mit geschlossener Schaufel", "ok": false}, {"k": "c", "text": "Geweihe mit Aug- und Mittelsprosse", "ok": false}], "label": "194"}, {"num": 195, "type": "mc", "q": "Suhlt das Damwild ebenso im Schlamm wie Rot- und Schwarzwild?", "opts": [{"k": "a", "text": "Ja, regelmäßig", "ok": false}, {"k": "b", "text": "Nein, nie", "ok": true}, {"k": "c", "text": "Ja, nur in der Brunft", "ok": false}], "label": "195"}, {"num": 196, "type": "mc", "q": "Wie nennt man den Brunftschrei des Damwildes?", "opts": [{"k": "a", "text": "Schnorcheln", "ok": true}, {"k": "b", "text": "Mahnen", "ok": false}, {"k": "c", "text": "Schrecken", "ok": false}], "label": "196"}, {"num": 197, "type": "mc", "q": "Wie unterscheidet sich Damwild und Rotwild in der Färbung voneinander?", "opts": [{"k": "a", "text": "Damwild hat einen schwarz/weißen Wedel, Rotwild einen braunen Wedel", "ok": true}, {"k": "b", "text": "Rotwild hat immer weiße Flecken auf der Decke, Damwild nicht", "ok": false}, {"k": "c", "text": "Damwild hat einen schwarzen Spiegel, Rotwild einen schneeweißen", "ok": false}], "label": "197"}, {"num": 198, "type": "mc", "q": "Bei welcher Wildart gibt es bereits im ersten Lebensjahr bei den männlichen Stücken eine Geweihbildung?", "opts": [{"k": "a", "text": "Beim Rotwild", "ok": false}, {"k": "b", "text": "Beim Rehwild", "ok": true}, {"k": "c", "text": "Beim Damwild", "ok": false}], "label": "198"}, {"num": 199, "type": "mc", "q": "Wann wirft der Rehbock das Gehörn ab?", "opts": [{"k": "a", "text": "Februar bis März", "ok": false}, {"k": "b", "text": "Juni bis August", "ok": false}, {"k": "c", "text": "Oktober bis Dezember", "ok": true}], "label": "199"}, {"num": 200, "type": "mc", "q": "Ein Zahn im Milchgebiss des Rehwildes ist dreiteilig. Im Dauergebiss ist er zweiteilig. Welcher Zahn ist das?", "opts": [{"k": "a", "text": "Der 1. Schneidezahn", "ok": false}, {"k": "b", "text": "Der 2. Molar", "ok": false}, {"k": "c", "text": "Der 3. Prämolar", "ok": true}], "label": "200"}, {"num": 201, "type": "mc", "q": "Was versteht man unter der Blattzeit beim Rehwild?", "opts": [{"k": "a", "text": "Jagdzeit auf Rehwild im Herbst, in der die Laubbäume ihre Blätter verlieren", "ok": false}, {"k": "b", "text": "Paarungszeit des Rehwildes", "ok": true}, {"k": "c", "text": "Jagdzeit auf Rehwild im Frühjahr, in der die Laubbäume neue Blätter bekommen", "ok": false}], "label": "201"}, {"num": 202, "type": "mc", "q": "Sie haben im November einen Sprung Rehwild vor sich. Woran erkennen Sie die weiblichen Stücke am sichersten?", "opts": [{"k": "a", "text": "An der Art der Bewegung", "ok": false}, {"k": "b", "text": "An der Färbung", "ok": false}, {"k": "c", "text": "Am Spiegel mit Schürze", "ok": true}], "label": "202"}, {"num": 203, "type": "mc", "q": "Welche Aussage über die Färbung des Rehwildes ist richtig?", "opts": [{"k": "a", "text": "Das ganze Jahr rotbraun", "ok": false}, {"k": "b", "text": "Im Sommer rotbraun, im Winter graubraun", "ok": true}, {"k": "c", "text": "Das ganze Jahr graubraun", "ok": false}], "label": "203"}, {"num": 204, "type": "mc", "q": "Welche Farbe hat beim gesunden Rehwild der Spiegel in der Winterdecke?", "opts": [{"k": "a", "text": "Weiß", "ok": true}, {"k": "b", "text": "Braun", "ok": false}, {"k": "c", "text": "Grau", "ok": false}], "label": "204"}, {"num": 205, "type": "mc", "q": "Welche Aufgabe hat der Bast?", "opts": [{"k": "a", "text": "Versorgung des wachsenden Geweihs mit Nährstoffen", "ok": true}, {"k": "b", "text": "Schutz des darunterliegenden Geweihs vor Verletzungen", "ok": false}, {"k": "c", "text": "Verstärkung der optischen Wirkung des Geweihs", "ok": false}], "label": "205"}, {"num": 206, "type": "mc", "q": "Welche Schäden an jungen Bäumen verursacht der Rehbock?", "opts": [{"k": "a", "text": "Fegeschäden", "ok": true}, {"k": "b", "text": "Schlagschäden", "ok": false}, {"k": "c", "text": "Schälschäden", "ok": false}], "label": "206"}, {"num": 207, "type": "mc", "q": "Ein Korkenziehergehörn beim Rehbock wird verursacht durch…", "opts": [{"k": "a", "text": "Starken Befall mit Innenparasiten", "ok": true}, {"k": "b", "text": "Einen Kampf mit einem anderen Rehbock", "ok": false}, {"k": "c", "text": "Vererbung", "ok": false}], "label": "207"}, {"num": 208, "type": "mc", "q": "In welchem Zeitraum findet die Blattzeit des Rehwildes statt?", "opts": [{"k": "a", "text": "April/Mai", "ok": false}, {"k": "b", "text": "Juli/August", "ok": true}, {"k": "c", "text": "November/Dezember", "ok": false}], "label": "208"}, {"num": 209, "type": "mc", "q": "Folgende Aussage über Rehwild ist richtig:", "opts": [{"k": "a", "text": "Rehwild ist ein Kulturfolger", "ok": true}, {"k": "b", "text": "Rehwild hat grundsätzlich zwei Grandeln", "ok": false}, {"k": "c", "text": "Rehwild hat die besten Sinne aller Schalenwildarten", "ok": false}], "label": "209"}, {"num": 210, "type": "mc", "q": "Welche Lebensweise bevorzugt Rehwild im Winter?", "opts": [{"k": "a", "text": "Im Winter lebt das Rehwild in Notgemeinschaften mit mehreren Rehen (Wintersprung)", "ok": true}, {"k": "b", "text": "Im Winter lebt das Reh einzeln", "ok": false}, {"k": "c", "text": "Im Winter lebt das Reh ausschließlich im Wald", "ok": false}], "label": "210"}, {"num": 211, "type": "mc", "q": "Welche Merkmale spielen bei der Altersschätzung des Rot-, Dam- und Rehwildes am vollständig ausgezahnten Unterkiefer eine Rolle?", "opts": [{"k": "a", "text": "Die Anzahl der Zahnwurzeln.", "ok": false}, {"k": "b", "text": "Die Beschaffenheit der Grandeln.", "ok": false}, {"k": "c", "text": "Der Abschliff der Backenzähne", "ok": true}], "label": "211"}, {"num": 212, "type": "mc", "q": "Welche Wildart hat eine „Schabracke“?", "opts": [{"k": "a", "text": "Muffelwild", "ok": true}, {"k": "b", "text": "Rehwild", "ok": false}, {"k": "c", "text": "Damwild", "ok": false}], "label": "212"}, {"num": 213, "type": "mc", "q": "Wie kann man beim Muffelwild das Alter bestimmen?", "opts": [{"k": "a", "text": "Durch Auszählen der Jahresringe", "ok": true}, {"k": "b", "text": "Durch die Farbe der Decke", "ok": false}, {"k": "c", "text": "Durch das Auszählen der Wülste an den Schalen", "ok": false}], "label": "213"}, {"num": 214, "type": "mc", "q": "Wie werden die Jungen des Muffelwildes genannt?", "opts": [{"k": "a", "text": "Kälber", "ok": false}, {"k": "b", "text": "Kitze", "ok": false}, {"k": "c", "text": "Lämmer", "ok": true}], "label": "214"}, {"num": 215, "type": "mc", "q": "In welchen Monat fällt die Brunft des Muffelwildes?", "opts": [{"k": "a", "text": "Januar", "ok": false}, {"k": "b", "text": "November", "ok": true}, {"k": "c", "text": "März", "ok": false}], "label": "215"}, {"num": 216, "type": "mc", "q": "In welchem Zeitraum liegt klassisch die Rauschzeit des Schwarzwildes?", "opts": [{"k": "a", "text": "März/April", "ok": false}, {"k": "b", "text": "Juni/Juli", "ok": false}, {"k": "c", "text": "November/Dezember", "ok": true}], "label": "216"}, {"num": 217, "type": "mc", "q": "An welcher Körperstelle kann man beim Schwarzwild den Saubart rupfen?", "opts": [{"k": "a", "text": "Am Unterkiefer", "ok": false}, {"k": "b", "text": "Am vorderen Rückenbereich (Kamm)", "ok": true}, {"k": "c", "text": "Am hinteren Rückenbereich", "ok": false}], "label": "217"}, {"num": 218, "type": "mc", "q": "Zu welcher Ernährungsgruppe gehört das Schwarzwild?", "opts": [{"k": "a", "text": "Pflanzenfresser", "ok": false}, {"k": "b", "text": "Fleischfresser", "ok": false}, {"k": "c", "text": "Allesfresser", "ok": true}], "label": "218"}, {"num": 219, "type": "mc", "q": "Wie nennt man die männlichen, weiblichen und die Jungen beim Schwarzwild?", "opts": [{"k": "a", "text": "Eber, Sau, Frischling", "ok": false}, {"k": "b", "text": "Schwein, Tier, Ferkel", "ok": false}, {"k": "c", "text": "Keiler, Bache, Frischling", "ok": true}], "label": "219"}, {"num": 220, "type": "mc", "q": "Wie viele Zähne hat das Schwarzwild im Dauergebiss?", "opts": [{"k": "a", "text": "42 Zähne", "ok": false}, {"k": "b", "text": "44 Zähne", "ok": true}, {"k": "c", "text": "38 Zähne", "ok": false}], "label": "220"}, {"num": 221, "type": "mc", "q": "Wie nennt man die Eckzähne des Keilers im Ober- und Unterkiefer?", "opts": [{"k": "a", "text": "Haderer und Gewehre", "ok": true}, {"k": "b", "text": "Haken und Gewehre", "ok": false}, {"k": "c", "text": "Grandeln und Haken", "ok": false}], "label": "221"}, {"num": 222, "type": "mc", "q": "Welches Stück Schwarzwild sollte der Jäger aus einer Rotte nie erlegen?", "opts": [{"k": "a", "text": "Den letzten Frischling", "ok": false}, {"k": "b", "text": "Den Keiler", "ok": false}, {"k": "c", "text": "Die Leitbache", "ok": true}], "label": "222"}, {"num": 223, "type": "mc", "q": "Wie werden das Fell, die Ohren und die Hoden des Schwarzwildes in der Weidmannssprache genannt?", "opts": [{"k": "a", "text": "Schwarte, Teller, Klötze/Steine", "ok": true}, {"k": "b", "text": "Decke, Ohr, Hoden", "ok": false}, {"k": "c", "text": "Schwarte, Lauscher, Gekröse", "ok": false}], "label": "223"}, {"num": 224, "type": "mc", "q": "An welchem Merkmal ist eine Schwarzwildfährte von einer Rotwildfährte zu unterscheiden?", "opts": [{"k": "a", "text": "Das Geäfter ist bei einer Schwarzwildfährte deutlich zu erkennen", "ok": true}, {"k": "b", "text": "Das Geäfter ist bei einer Schwarzwildfährte nie mit abgedrückt", "ok": false}, {"k": "c", "text": "Die beiden Schalen sind beim Schwarzwild weit auseinander gespreizt", "ok": false}], "label": "224"}, {"num": 225, "type": "mc", "q": "Welcher Sinn ist beim Schwarzwild nicht gut entwickelt?", "opts": [{"k": "a", "text": "Der Geruchssinn", "ok": false}, {"k": "b", "text": "Der Gehörssinn", "ok": false}, {"k": "c", "text": "Der Gesichtssinn", "ok": true}], "label": "225"}, {"num": 226, "type": "mc", "q": "Wann frischen klassisch die meisten Bachen?", "opts": [{"k": "a", "text": "Februar bis Mai", "ok": true}, {"k": "b", "text": "Juni bis August", "ok": false}, {"k": "c", "text": "September bis November", "ok": false}], "label": "226"}, {"num": 227, "type": "mc", "q": "Wann verlieren Frischlinge ihre Streifen?", "opts": [{"k": "a", "text": "Wenn sie 1 Jahr alt sind", "ok": false}, {"k": "b", "text": "Wenn sie zu viel bejagt werden", "ok": false}, {"k": "c", "text": "Wenn sie nicht mehr gesäugt werden", "ok": true}], "label": "227"}, {"num": 228, "type": "mc", "q": "Wie oft setzt die Häsin im Jahr?", "opts": [{"k": "a", "text": "Einmal", "ok": false}, {"k": "b", "text": "Zwei bis dreimal", "ok": true}, {"k": "c", "text": "Fünf bis sechsmal", "ok": false}], "label": "228"}, {"num": 229, "type": "mc", "q": "Wie nennt der Jäger den Schwanz des Hasen?", "opts": [{"k": "a", "text": "Rute", "ok": false}, {"k": "b", "text": "Blume", "ok": true}, {"k": "c", "text": "Bürzel", "ok": false}], "label": "229"}, {"num": 230, "type": "mc", "q": "Wo werden in der Regel die jungen Hasen gesetzt?", "opts": [{"k": "a", "text": "Im Bau", "ok": false}, {"k": "b", "text": "Im Kessel", "ok": false}, {"k": "c", "text": "In der Sasse", "ok": true}], "label": "230"}, {"num": 231, "type": "mc", "q": "Wo werden in der Regel die jungen Wildkaninchen gesetzt?", "opts": [{"k": "a", "text": "In der Sasse", "ok": false}, {"k": "b", "text": "Im großen Mutterbau", "ok": false}, {"k": "c", "text": "In einer Setzröhre", "ok": true}], "label": "231"}, {"num": 232, "type": "mc", "q": "Wie sehen die Löffel des Hasen im Gegensatz zu den Löffeln des Kaninchens aus?", "opts": [{"k": "a", "text": "Kurz und grau", "ok": false}, {"k": "b", "text": "Braun mit schwarzer Löffelspitze", "ok": true}, {"k": "c", "text": "Lang und rotbraun", "ok": false}], "label": "232"}, {"num": 233, "type": "mc", "q": "Welches Raubwild folgt den Wildkaninchen in ihren Bau?", "opts": [{"k": "a", "text": "Hermelin, Iltis", "ok": true}, {"k": "b", "text": "Fuchs, Dachs", "ok": false}, {"k": "c", "text": "Marderhund, Waschbär", "ok": false}], "label": "233"}, {"num": 234, "type": "mc", "q": "Wie werden die jungen Wildkaninchen geboren?", "opts": [{"k": "a", "text": "Behaart und sehend", "ok": false}, {"k": "b", "text": "Nackt und sehend", "ok": false}, {"k": "c", "text": "Nackt und blind", "ok": true}], "label": "234"}, {"num": 235, "type": "mc", "q": "Wie oft setzt die Kaninchenhäsin jährlich?", "opts": [{"k": "a", "text": "Ein- bis zweimal", "ok": false}, {"k": "b", "text": "Vier- bis sechsmal", "ok": true}, {"k": "c", "text": "Sechs- bis neunmal", "ok": false}], "label": "235"}, {"num": 236, "type": "mc", "q": "Welche Zähne werden beim Fuchs auch \"Haken\" genannt?", "opts": [{"k": "a", "text": "Die vier Eckzähne", "ok": true}, {"k": "b", "text": "Die vierten Prämolaren im Unter- und Oberkiefer", "ok": false}, {"k": "c", "text": "Die vier Schneidezähne im Unterkiefer", "ok": false}], "label": "236"}, {"num": 237, "type": "mc", "q": "Mit welcher Haarwildart teilt der Fuchs manchmal seinen Bau?", "opts": [{"k": "a", "text": "Dachs", "ok": true}, {"k": "b", "text": "Feldhase", "ok": false}, {"k": "c", "text": "Baummarder", "ok": false}], "label": "237"}, {"num": 238, "type": "mc", "q": "Welche Aussage über den Fuchs ist richtig?", "opts": [{"k": "a", "text": "Der Fuchs hat nur im Winter einen verwertbaren Balg", "ok": true}, {"k": "b", "text": "Der Fuchs ernährt sich überwiegend vegetarisch", "ok": false}, {"k": "c", "text": "Der Fuchs ist ein Kulturflüchter", "ok": false}], "label": "238"}, {"num": 239, "type": "mc", "q": "Welche Federwildart brütet manchmal auch im Fuchsbau?", "opts": [{"k": "a", "text": "Graugans", "ok": false}, {"k": "b", "text": "Stockente", "ok": false}, {"k": "c", "text": "Brandgans (Brandente)", "ok": true}], "label": "239"}, {"num": 240, "type": "mc", "q": "Was ist eine Viole und bei welcher Wildart ist sie zu finden?", "opts": [{"k": "a", "text": "Eine Duftdrüse an der Lunte des Fuchses", "ok": true}, {"k": "b", "text": "Eine Speicheldrüse unter der Zunge der Taube", "ok": false}, {"k": "c", "text": "Eine Tränendrüse im Augenwinkel des Gamsbockes", "ok": false}], "label": "240"}, {"num": 241, "type": "mc", "q": "Wie unterscheidet sich das Trittsiegel/die Spur von Dachs und Fuchs?", "opts": [{"k": "a", "text": "Dachse schnüren, Füchse haben vier Zehen", "ok": false}, {"k": "b", "text": "Füchse nageln, Dachse haben eine Springspur", "ok": false}, {"k": "c", "text": "Dachse nageln, Füchse schnüren", "ok": true}], "label": "241"}, {"num": 242, "type": "mc", "q": "An welcher Körperstelle befindet sich der Dachsbart?", "opts": [{"k": "a", "text": "Am Hals männlicher Dachse", "ok": false}, {"k": "b", "text": "Am Unterkiefer", "ok": false}, {"k": "c", "text": "Im Rückenbereich", "ok": true}], "label": "242"}, {"num": 243, "type": "mc", "q": "Wie nennt man das Fell des Dachses?", "opts": [{"k": "a", "text": "Schwarte", "ok": true}, {"k": "b", "text": "Balg", "ok": false}, {"k": "c", "text": "Decke", "ok": false}], "label": "243"}, {"num": 244, "type": "mc", "q": "Welche Aussage über den Marderhund ist richtig?", "opts": [{"k": "a", "text": "Er ist ein anpassungsfähiges, hundeartiges Raubwild mit 42 Zähnen", "ok": true}, {"k": "b", "text": "Er ist ein Kulturflüchter, gehört zu den echten Mardern und hat 38 Zähne", "ok": false}, {"k": "c", "text": "Er ist ein Kulturfolger, gehört zu den Stinkmardern und hat 36 Zähne", "ok": false}], "label": "244"}, {"num": 245, "type": "mc", "q": "Welche Aussage ist richtig?", "opts": [{"k": "a", "text": "Der Waschbär ist ein Raubwild aus der Familie der Hunde", "ok": false}, {"k": "b", "text": "Der Waschbär klettert auf Bäume", "ok": true}, {"k": "c", "text": "Der Waschbär lebt im Bau", "ok": false}], "label": "245"}, {"num": 246, "type": "mc", "q": "Welche Raubwildart hält eine lebenslange Einehe?", "opts": [{"k": "a", "text": "Marderhund", "ok": true}, {"k": "b", "text": "Iltis", "ok": false}, {"k": "c", "text": "Fuchs", "ok": false}], "label": "246"}, {"num": 247, "type": "mc", "q": "Welches Raubwild hält eine Winterruhe?", "opts": [{"k": "a", "text": "Baum- und Steinmarder", "ok": false}, {"k": "b", "text": "Iltis und Wiesel", "ok": false}, {"k": "c", "text": "Dachs und Marderhund", "ok": true}], "label": "247"}, {"num": 248, "type": "mc", "q": "Der Dachs lebt…", "opts": [{"k": "a", "text": "Im Bau", "ok": true}, {"k": "b", "text": "In Baumhöhlen", "ok": false}, {"k": "c", "text": "In der Sasse", "ok": false}], "label": "248"}, {"num": 249, "type": "mc", "q": "In welchem der folgenden Verstecke ist der Baummarder häufig zu finden?", "opts": [{"k": "a", "text": "In Eichhörnchenkobeln oder in Baumhöhlen", "ok": true}, {"k": "b", "text": "In Steinhaufen oder in Kaninchenbauen", "ok": false}, {"k": "c", "text": "Auf ungestörten Dachböden von Häusern", "ok": false}], "label": "249"}, {"num": 250, "type": "mc", "q": "Wie unterscheiden sich Baum- und Steinmarder voneinander?", "opts": [{"k": "a", "text": "Baummarder sind schwarz gefärbt, Steinmarder grau", "ok": false}, {"k": "b", "text": "Baummarder haben einen gelben Kehlfleck, Steinmarder einen", "ok": true}, {"k": "c", "text": "Baummarder haben eine Gesichtsmaske, Steinmarder nicht", "ok": false}], "label": "250"}, {"num": 251, "type": "mc", "q": "Welches Beutetier wird vom Baummarder bevorzugt bejagt?", "opts": [{"k": "a", "text": "Kolkraben", "ok": false}, {"k": "b", "text": "Junghasen", "ok": false}, {"k": "c", "text": "Eichhörnchen", "ok": true}], "label": "251"}, {"num": 252, "type": "mc", "q": "Welches Tier lebt gerne in menschlichen Siedlungen?", "opts": [{"k": "a", "text": "Steinmarder", "ok": true}, {"k": "b", "text": "Dachs", "ok": false}, {"k": "c", "text": "Baummarder", "ok": false}], "label": "252"}, {"num": 253, "type": "mc", "q": "Der Iltis gehört zu den sogenannten…", "opts": [{"k": "a", "text": "Stinkmardern", "ok": true}, {"k": "b", "text": "Echten Mardern", "ok": false}, {"k": "c", "text": "Hundeartigen", "ok": false}], "label": "253"}, {"num": 254, "type": "mc", "q": "An welchem Merkmal kann man das Hermelin gut vom Mauswiesel unterscheiden?", "opts": [{"k": "a", "text": "Am weißen Rücken.", "ok": false}, {"k": "b", "text": "An der schwarzen Unterseite", "ok": false}, {"k": "c", "text": "An der schwarzen Schwanzspitze", "ok": true}], "label": "254"}, {"num": 255, "type": "mc", "q": "Wo leben und jagen Wiesel überwiegend?", "opts": [{"k": "a", "text": "Nur im geschlossenen Wald", "ok": false}, {"k": "b", "text": "Nur im freien Feld", "ok": false}, {"k": "c", "text": "An Feld-Wald-Rändern, in Hecken, Rainen und in Steinhaufen", "ok": true}], "label": "255"}, {"num": 256, "type": "mc", "q": "Wodurch wurde der Otterrückgang in den vergangenen Jahren hauptsächlich verursacht?", "opts": [{"k": "a", "text": "Der Otter ist ein ausgesprochener Kulturflüchter", "ok": false}, {"k": "b", "text": "Durch die fortschreitenden Klimaveränderungen", "ok": false}, {"k": "c", "text": "Seine Lebensräume wurden durch Wasserbaumaßnahmen weitgehend zerstört", "ok": true}], "label": "256"}, {"num": 257, "type": "mc", "q": "Welche Aussage über die Bürzeldrüse der Enten ist richtig?", "opts": [{"k": "a", "text": "Sie produziert ein fettreiches Sekret zum Einfetten des Gefieders", "ok": true}, {"k": "b", "text": "Ihr produziertes Sekret ist ein Duftstoff, der zur Reviermarkierung verwendet wird", "ok": false}, {"k": "c", "text": "Es ist eine Drüse, die sexuelle Lockstoffe erzeugt", "ok": false}], "label": "257"}, {"num": 258, "type": "mc", "q": "Wie nennt man Vogelarten, die nur unregelmäßig und über kürzere Entfernungen ungünstigen Witterungen ausweichen?", "opts": [{"k": "a", "text": "Zugvögel", "ok": false}, {"k": "b", "text": "Strichvögel", "ok": true}, {"k": "c", "text": "Standvögel", "ok": false}], "label": "258"}, {"num": 259, "type": "mc", "q": "Was versteht man unter dem Begriff Nestflüchter?", "opts": [{"k": "a", "text": "Jungvögel, die gleich nach dem Schlüpfen das Nest verlassen", "ok": true}, {"k": "b", "text": "Jungvögel, die mit Beginn der Flugfähigkeit das Nest verlassen", "ok": false}, {"k": "c", "text": "Vogelarten, die kein eigenes Nest bauen", "ok": false}], "label": "259"}, {"num": 260, "type": "mc", "q": "Welc pts": [{"k": "a", "text": "Ja, bei allen Arten", "ok": false}, {"k": "b", "text": "Nein, bei keiner Art", "ok": true}, {"k": "c", "text": "Ja, nur im Sommer", "ok": false}], "label": "267"}, {"num": 268, "type": "mc", "q": "Welche Wildtaubenart zeigt einen auffälligen weißen Fleck am Hals?", "opts": [{"k": "a", "text": "Turteltaube", "ok": false}, {"k": "b", "text": "Hohltaube", "ok": false}, {"k": "c", "text": "Ringeltaube", "ok": true}], "label": "268"}, {"num": 269, "type": "mc", "q": "Welche der genannten Beutegreifer sind natürliche Feinde der Ringeltaube?", "opts": [{"k": "a", "text": "Habicht und Wanderfalke", "ok": true}, {"k": "b", "text": "Mäusebussard und Turmfalke", "ok": false}, {"k": "c", "text": "Milan und Baumfalke", "ok": false}], "label": "269"}, {"num": 270, "type": "mc", "q": "Wo brüten die Ringeltauben in der Regel?", "opts": [{"k": "a", "text": "In Baumhöhlen.", "ok": false}, {"k": "b", "text": "In alten Krähennestern", "ok": false}, {"k": "c", "text": "In selbstgebauten Reisignestern ohne Polsterung", "ok": true}], "label": "270"}, {"num": 271, "type": "mc", "q": "Welche Taubenart brütet in Höhlen?", "opts": [{"k": "a", "text": "Turteltauben", "ok": false}, {"k": "b", "text": "Hohltaube", "ok": true}, {"k": "c", "text": "Ringeltauben", "ok": false}], "label": "271"}, {"num": 272, "type": "mc", "q": "Welche Schnepfenarten gibt es in Mecklenburg-Vorpommern?", "opts": [{"k": "a", "text": "Waldschnepfe, Bekassine, Großer Brachvogel", "ok": true}, {"k": "b", "text": "Waldschnepfe, Bekassine, Borstenbrachvogel", "ok": false}, {"k": "c", "text": "Waldschnepfe, Kolbenschnepfe, Großer Brachvogel", "ok": false}], "label": "272"}, {"num": 273, "type": "mc", "q": "Bejagt man Schnepfen in Deutschland?", "opts": [{"k": "a", "text": "Nein, da die Schnepfenarten nicht im Jagdrecht aufgeführt sind", "ok": false}, {"k": "b", "text": "Ja, die Waldschnepfe", "ok": true}, {"k": "c", "text": "Ja, den Großen Brachvogel", "ok": false}], "label": "273"}, {"num": 274, "type": "mc", "q": "In welchem Lebensraum ist die Waldschnepfe häufig anzutreffen?", "opts": [{"k": "a", "text": "In trockenen Kiefernwäldern und an Sanddünen", "ok": false}, {"k": "b", "text": "Im Gebirge über 1500 Metern", "ok": false}, {"k": "c", "text": "In feuchten Laubwäldern entlang von Bächen oder an Brüchen", "ok": true}], "label": "274"}, {"num": 275, "type": "mc", "q": "Wo brütet die Waldschnepfe?", "opts": [{"k": "a", "text": "Auf dem Baum", "ok": false}, {"k": "b", "text": "In Felsspalten", "ok": false}, {"k": "c", "text": "Auf dem Boden", "ok": true}], "label": "275"}, {"num": 276, "type": "mc", "q": "Wann und in welcher Form bejagt man die Waldschnepfe?", "opts": [{"k": "a", "text": "Im Frühjahr während des Balzfluges der Schnepfen vom Ansitz aus", "ok": false}, {"k": "b", "text": "Im Herbst während der Such- und Treibjagd", "ok": true}, {"k": "c", "text": "Im Winter durch Ausneuen des Schnepfers", "ok": false}], "label": "276"}, {"num": 277, "type": "mc", "q": "Welche Trophäen nutzt der Jäger von der Waldschnepfe?", "opts": [{"k": "a", "text": "Stecher, Ständer und Schnepfenlocke", "ok": false}, {"k": "b", "text": "Stecher, Latschen und Gestüber", "ok": false}, {"k": "c", "text": "Schnepfenbart, Malerfeder", "ok": true}], "label": "277"}, {"num": 278, "type": "mc", "q": "Welche Entenarten sind Höhlenbrüter?", "opts": [{"k": "a", "text": "Schellente und Brandente (Brandgans)", "ok": true}, {"k": "b", "text": "Reiherente und Tafelente", "ok": false}, {"k": "c", "text": "Krickente und Knäckente", "ok": false}], "label": "278"}, {"num": 279, "type": "mc", "q": "Welche Tierart ist ein gefährlicher Räuber für Enteneier und Jungenten?", "opts": [{"k": "a", "text": "Bisam", "ok": false}, {"k": "b", "text": "Nutria", "ok": false}, {"k": "c", "text": "Wanderratte", "ok": true}], "label": "279"}, {"num": 280, "type": "mc", "q": "Wie werden die Schwimmenten wegen der Art ihrer Nahrungssuche noch bezeichnet?", "opts": [{"k": "a", "text": "Gründelenten", "ok": tru
